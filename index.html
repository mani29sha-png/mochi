etter choice for Salim is","o":["the bank loan because the interest is lower","the moneylender because it is faster","the moneylender because there are no terms","both are the same"],"a":0,"e":"Formal sources have lower interest and cheaper credit.","ch":"ec3","t":1,"id":"n811"},{"ty":"short","mk":3,"q":"What is meant by double coincidence of wants? How is it overcome by money?","m":"In the barter system, a person must find someone who has what he wants and also wants what he has. Money acts as a medium of exchange, so a person with money can buy any item without such a coincidence.","p":["Explanation of barter","Problem","Role of money"],"ch":"ec3","t":0,"id":"n812"},{"ty":"short","mk":5,"q":"Why are formal sources of credit better than informal sources? Explain.","m":"Formal sources like banks and cooperatives are supervised by the RBI; interest rates are lower; borrowers get loans with fair terms and documentation; they promote economic growth by funding small producers. Informal lenders charge high interest, have no supervision, and can trap borrowers in debt. Hence more people should get formal credit.","p":["RBI supervision","Lower interest","Informal lenders' high interest","Conclusion"],"ch":"ec3","t":2,"id":"n813"},{"ty":"mcq","mk":1,"q":"A company that owns or controls production in more than one country is called","o":["a multinational corporation (MNC)","public company","cooperative","self-help group"],"a":0,"e":"MNCs set up offices and factories where production is cheap.","ch":"ec4","t":0,"id":"n814"},{"ty":"mcq","mk":1,"q":"Globalisation is the process of","o":["rapid integration or interconnection between countries","isolation","nationalisation","closing trade"],"a":0,"e":"It occurs through foreign trade and investment.","ch":"ec4","t":0,"id":"n815"},{"ty":"mcq","mk":1,"q":"Foreign investment is investment made by","o":["MNCs","local firms","farmers","the RBI"],"a":0,"e":"It involves buying assets in another country.","ch":"ec4","t":0,"id":"n816"},{"ty":"mcq","mk":1,"q":"Which of the following helped the spread of globalisation?","o":["technology, especially information technology","tariffs","quotas","higher taxes"],"a":0,"e":"Technology makes it easier to produce and trade across countries.","ch":"ec4","t":1,"id":"n817"},{"ty":"mcq","mk":1,"q":"The tax on imports is a","o":["trade barrier","subsidy","tariff on exports","loan"],"a":0,"e":"It makes imports costly.","ch":"ec4","t":1,"id":"n818"},{"ty":"mcq","mk":1,"q":"Liberalisation means","o":["removal of barriers or restrictions set by the government","more controls","more tax","ban on imports"],"a":0,"e":"It was started in India in 1991.","ch":"ec4","t":1,"id":"n819"},{"ty":"mcq","mk":1,"q":"Special Economic Zones are","o":["areas with world-class facilities and tax exemptions for producers","slums","farm lands","forests"],"a":0,"e":"They attract foreign companies.","ch":"ec4","t":1,"id":"n820"},{"ty":"mcq","mk":1,"q":"The organisation which aims to liberalise international trade is the","o":["WTO","UNO","IMF","NATO"],"a":0,"e":"It has 160+ member countries.","ch":"ec4","t":2,"id":"n821"},{"ty":"mcq","mk":1,"q":"Fair globalisation means","o":["equal opportunities for all and benefits shared","only rich benefit","no trade","only exports"],"a":0,"e":"The WTO rules are criticised for favouring developed nations.","ch":"ec4","t":2,"id":"n822"},{"ty":"mcq","mk":1,"q":"Which one of the following is an advantage of globalisation to the Indian consumers?","o":["wider choice of goods at lower prices","fewer goods","higher prices","no quality"],"a":0,"e":"More goods are available.","ch":"ec4","t":2,"id":"n823"},{"ty":"ar","mk":1,"q":"Assertion (A): Globalisation has led to a rise in competition among producers.\nReason (R): Imports of cheaper goods bring competition for local producers.","a":0,"e":"R explains A.","ar":1,"ch":"ec4","t":1,"id":"n824"},{"ty":"short","mk":3,"q":"What is globalisation? How have MNCs spread production across countries?","m":"Globalisation is the rapid integration of countries through trade and investment. MNCs set up production where costs are low, outsource parts of production and buy local companies to expand.","p":["Definition","MNCs setting up units","Low-cost locations"],"ch":"ec4","t":0,"id":"n825"},{"ty":"short","mk":3,"q":"Explain any three factors that have enabled globalisation.","m":"Rapid improvement in technology (transport, IT), liberalisation of trade and investment policies by governments, and pressure from international organisations like WTO and IMF to remove trade barriers.","p":["Technology","Liberalisation","International organisations"],"ch":"ec4","t":1,"id":"n826"},{"ty":"mcq","mk":1,"q":"The right which entitles consumers to be protected against products that are hazardous to life is","o":["the right to safety","the right to be informed","the right to choose","the right to be heard"],"a":0,"e":"Safety is a basic consumer right.","ch":"ec5","t":0,"id":"n827"},{"ty":"mcq","mk":1,"q":"The Consumer Protection Act (COPRA) was enacted in","o":["1986","1950","2005","2019"],"a":0,"e":"It was enacted to protect consumers' interests; revised in 2019.","ch":"ec5","t":0,"id":"n828"},{"ty":"mcq","mk":1,"q":"The ISI mark is for","o":["industrial goods","food only","gold","medicines"],"a":0,"e":"It certifies the quality of industrial goods.","ch":"ec5","t":0,"id":"n829"},{"ty":"mcq","mk":1,"q":"Agmark is used for","o":["agricultural products","electrical goods","clothes","toys"],"a":0,"e":"It certifies quality of farm products.","ch":"ec5","t":0,"id":"n830"},{"ty":"mcq","mk":1,"q":"The hallmark certifies","o":["purity of gold jewellery","electrical safety","food quality","toy safety"],"a":0,"e":"It is issued by BIS.","ch":"ec5","t":0,"id":"n831"},{"ty":"mcq","mk":1,"q":"The three-tier quasi-judicial machinery for consumer disputes consists of","o":["district, state and national commissions","village, block, district","high court, supreme court","local, regional"],"a":0,"e":"Consumers can approach these for redressal.","ch":"ec5","t":0,"id":"n832"},{"ty":"mcq","mk":1,"q":"National Consumer Day in India is celebrated on","o":["24 December","15 August","26 January","2 October"],"a":0,"e":"COPRA was enacted on that day.","ch":"ec5","t":0,"id":"n833"},{"ty":"mcq","mk":1,"q":"Which of these is a right of the consumer?","o":["right to seek redressal","right to cheat","right to pay less","right to hoard"],"a":0,"e":"Consumers can seek redressal against unfair practices.","ch":"ec5","t":0,"id":"n834"},{"ty":"short","mk":3,"q":"Explain any three consumer rights.","m":"Right to safety: protection against hazardous goods. Right to be informed: details of ingredients, price, date of manufacture. Right to choose: access to a variety of goods. Right to seek redressal against unfair practices, and the right to consumer education.","p":["Right to safety","Right to information","Right to choose or redressal"],"ch":"ec5","t":0,"id":"n835"},{"ty":"short","mk":5,"q":"How can consumers get justice under COPRA? Describe the three-tier machinery.","m":"A consumer may file a case at the District Consumer Commission for claims up to a specified limit; if not satisfied, appeal to the State Commission and then the National Commission. COPRA provides for this quasi-judicial redressal, which is cheaper and quicker than courts.","p":["District level","State level","National level","Purpose of COPRA"],"ch":"ec5","t":0,"id":"n836"},{"ty":"mcq","mk":1,"q":"Lencho's field was destroyed by","o":["hailstorm","flood","fire","locusts"],"a":0,"e":"A hailstorm followed the rain and destroyed the corn crop that was ripe.","ch":"ep1","t":0,"id":"n837"},{"ty":"mcq","mk":1,"q":"Lencho wrote a letter to God asking for","o":["one hundred pesos","new seeds","a house","a lawyer"],"a":0,"e":"He said he needed a hundred pesos to sow his field again and live until the next harvest.","ch":"ep1","t":0,"id":"n838"},{"ty":"mcq","mk":1,"q":"The postmaster decided to answer Lencho's letter because","o":["he wanted to keep alive the faith that had shaped the farmer's life","he was ordered to do so","he wanted money","he was bored"],"a":0,"e":"He was moved by Lencho's complete faith in God.","ch":"ep1","t":0,"id":"n839"},{"ty":"mcq","mk":1,"q":"The employees of the post office collected only seventy pesos because","o":["they could not give a hundred; they gave money out of their salaries","they had no money","they were mean","the postmaster asked for 70"],"a":0,"e":"They gave part of their salaries and the postmaster contributed too.","ch":"ep1","t":1,"id":"n840"},{"ty":"mcq","mk":1,"q":"After reading the postmaster's money, Lencho said the post office employees were","o":["a bunch of crooks","good men","honest and kind","angels"],"a":0,"e":"He believed that God would not make a mistake, so someone had taken thirty pesos.","ch":"ep1","t":1,"id":"n841"},{"ty":"mcq","mk":1,"q":"The story 'A Letter to God' brings out the","o":["irony of faith and human suspicion","friendship","hard work","importance of money"],"a":0,"e":"Lencho's faith was so strong that he suspected the kind postal staff.","ch":"ep1","t":1,"id":"n842"},{"ty":"ar","mk":1,"q":"Assertion (A): Lencho refused to believe that the money was sent by people.\nReason (R): He believed that God never makes a mistake and he had asked for a hundred pesos.","a":0,"e":"His unshakeable faith made him suspect the employees; R explains A.","ar":1,"ch":"ep1","t":1,"id":"n843"},{"ty":"short","mk":3,"q":"Why did Lencho call the post office employees a bunch of crooks? What does this show about him?","m":"Lencho received only seventy pesos instead of the hundred he had asked for. As he believed God would not make a mistake or refuse his request, he concluded that the post office employees had stolen thirty pesos. This shows his blind, unquestioning faith in God and his lack of gratitude and understanding of human kindness.","p":["Seventy instead of a hundred","Belief that God does not err","Blind faith and suspicion"],"ch":"ep1","t":1,"id":"n844"},{"ty":"mcq","mk":1,"q":"Nelson Mandela's inauguration as President took place in","o":["Pretoria","Cape Town","Johannesburg","Durban"],"a":0,"e":"The ceremony was held in the amphitheatre formed by the Union Buildings.","ch":"ep2","t":0,"id":"n845"},{"ty":"mcq","mk":1,"q":"Mandela became the first democratically elected President of South Africa in","o":["May 1994","1948","1963","2000"],"a":0,"e":"It was the first non-racial government.","ch":"ep2","t":0,"id":"n846"},{"ty":"mcq","mk":1,"q":"According to Mandela, courage is","o":["not the absence of fear, but the triumph over it","having no fear","being rich","being strong"],"a":0,"e":"A brave man is not one who does not feel afraid, but one who conquers that fear.","ch":"ep2","t":0,"id":"n847"},{"ty":"mcq","mk":1,"q":"The two national anthems sung at the ceremony were","o":["Nkosi Sikelel' iAfrika and Die Stem","Jana Gana Mana and Die Stem","God Save the King","Vande Mataram"],"a":0,"e":"They symbolise the new multiracial nation.","ch":"ep2","t":0,"id":"n848"},{"ty":"mcq","mk":1,"q":"Mandela said that the oppression of one section by another","o":["will never again be experienced in that beautiful land","will continue","is natural","is good"],"a":0,"e":"He said \"never, never and never again shall it be that this beautiful land will again experience the oppression of one by another\".","ch":"ep2","t":1,"id":"n849"},{"ty":"mcq","mk":1,"q":"At the inauguration, the country's military generals","o":["saluted and pledged loyalty to the new democratic government","refused to attend","fought the ceremony","left the country"],"a":0,"e":"Generals who once opposed such a change now showed their loyalty to the new government.","ch":"ep2","t":1,"id":"n850"},{"ty":"mcq","mk":1,"q":"Mandela says that he drew his strength from","o":["the courage of ordinary people who showed it every day","money","power","his army"],"a":0,"e":"He said he came to know that courage was not the absence of fear.","ch":"ep2","t":1,"id":"n851"},{"ty":"mcq","mk":1,"q":"Mandela got the Nobel Peace Prize along with","o":["F. W. de Klerk","Desmond Tutu","Oliver Tambo","Walter Sisulu"],"a":0,"e":"It was awarded in 1993.","ch":"ep2","t":1,"id":"n852"},{"ty":"short","mk":3,"q":"What does Mandela say about courage and fear? Why does he say that the 'brave man' conquers fear?","m":"Mandela says courage is not the absence of fear but the triumph over it. A brave man is not one who does not feel afraid but one who overcomes fear. He learned this during imprisonment, where fear could make a person give up hope; the brave keep going despite it.","p":["Courage defined","Fear conquered","Reason from experience"],"ch":"ep2","t":1,"id":"n853"},{"ty":"mcq","mk":1,"q":"In 'His First Flight', the young seagull was afraid to","o":["fly","swim","eat","sing"],"a":0,"e":"His brothers and sisters had flown but he refused to dive.","ch":"ep3","t":0,"id":"n854"},{"ty":"mcq","mk":1,"q":"The mother seagull finally made him fly by","o":["tempting him with a piece of fish","pushing him","singing","calling the father"],"a":0,"e":"She held the fish a little away from the ledge, and hunger made him dive.","ch":"ep3","t":0,"id":"n855"},{"ty":"mcq","mk":1,"q":"The young seagull was left on the ledge because","o":["he was afraid to fly while his siblings flew","he was injured","he was lost","he was the oldest"],"a":0,"e":"He felt lonely and hungry on the ledge.","ch":"ep3","t":0,"id":"n856"},{"ty":"mcq","mk":1,"q":"In 'The Black Aeroplane', the pilot was flying from","o":["France to England","England to France","India to England","Paris to Rome"],"a":0,"e":"He flew an old Dakota plane at night.","ch":"ep3","t":1,"id":"n857"},{"ty":"mcq","mk":1,"q":"The pilot's problem during the flight was","o":["bad weather and thick clouds","engine failure at the start","an enemy","no fuel from the beginning"],"a":0,"e":"He was caught in a storm with thick clouds.","ch":"ep3","t":1,"id":"n858"},{"ty":"mcq","mk":1,"q":"The mysterious black aeroplane","o":["guided the pilot through the storm","crashed","attacked him","never appeared"],"a":0,"e":"The pilot followed it and landed safely.","ch":"ep3","t":1,"id":"n859"},{"ty":"mcq","mk":1,"q":"The controller said that the pilot was","o":["the only plane in the sky","accompanied by another","late","lost"],"a":0,"e":"He was puzzled by the pilot's tale of a black aeroplane.","ch":"ep3","t":1,"id":"n860"},{"ty":"mcq","mk":1,"q":"The story 'The Black Aeroplane' is an example of","o":["a mystery/suspense story","humour","a biography","a poem"],"a":0,"e":"The plane that disappeared adds mystery.","ch":"ep3","t":1,"id":"n861"},{"ty":"short","mk":3,"q":"Why was the young seagull afraid to fly? How did he overcome his fear?","m":"He was afraid that his wings would not support him and could not take the dive into the sea. He overcame it when his mother held a piece of fish to tempt him and, driven by hunger, he dived and found that he could fly.","p":["Fear of falling","Mother's fish","He flew"],"ch":"ep3","t":0,"id":"n862"},{"ty":"short","mk":3,"q":"How did the black aeroplane help the pilot? Why is the story mysterious?","m":"The pilot was caught in a storm and thick clouds and followed the black aeroplane through them to land safely. The mystery is that the controller had seen no other plane, so who guided him remains unexplained.","p":["Black aeroplane guided him","Safe landing","Mystery of no other plane"],"ch":"ep3","t":1,"id":"n863"},{"ty":"mcq","mk":1,"q":"Anne Frank received a diary on her","o":["thirteenth birthday","tenth birthday","sixteenth birthday","wedding"],"a":0,"e":"She named the diary 'Kitty'.","ch":"ep4","t":0,"id":"n864"},{"ty":"mcq","mk":1,"q":"Anne Frank wrote her diary to","o":["Kitty, an imaginary friend","her father","her mother","a teacher"],"a":0,"e":"She decided that the diary would be her friend.","ch":"ep4","t":0,"id":"n865"},{"ty":"mcq","mk":1,"q":"Anne Frank's family went into hiding in","o":["Amsterdam","London","Berlin","Paris"],"a":0,"e":"They hid in the 'Secret Annexe' of a building.","ch":"ep4","t":0,"id":"n866"},{"ty":"mcq","mk":1,"q":"Anne says 'paper has more patience than people' because","o":["she could share her feelings freely with her diary","people were patient","paper was cheap","people were kind"],"a":0,"e":"She had no real friend to confide in.","ch":"ep4","t":1,"id":"n867"},{"ty":"mcq","mk":1,"q":"The Jews in Anne's time were not allowed to","o":["ride trams or use bicycles","study","speak","eat"],"a":0,"e":"They had to wear a yellow star and give up bicycles.","ch":"ep4","t":1,"id":"n868"},{"ty":"mcq","mk":1,"q":"Anne's father was","o":["Mr Otto Frank","Mr Peter","Mr Dussel","Mr Keesing"],"a":0,"e":"He was the only member of the family to survive.","ch":"ep4","t":1,"id":"n869"},{"ty":"mcq","mk":1,"q":"The diary of Anne Frank was written during","o":["the Second World War","the First World War","the cold war","the Vietnam war"],"a":0,"e":"It was written during Nazi occupation.","ch":"ep4","t":1,"id":"n870"},{"ty":"ar","mk":1,"q":"Assertion (A): Anne decided to write a diary.\nReason (R): She did not have a real friend to confide in.","a":0,"e":"Her loneliness led her to treat the diary as a friend.","ar":1,"ch":"ep4","t":1,"id":"n871"},{"ty":"short","mk":3,"q":"Why did Anne decide to keep a diary? What does she mean by 'paper has more patience than people'?","m":"Anne felt lonely and had no real friend with whom to share her deepest thoughts, so she treated the diary as a friend. She says paper has more patience than people because paper listens without interrupting or judging, while people do not always have time or understanding.","p":["Reason for the diary","Loneliness","Paper never judges"],"ch":"ep4","t":1,"id":"n872"},{"ty":"mcq","mk":1,"q":"The baker in 'A Baker from Goa' is called","o":["a pader","a mochi","a maali","a jhaang"],"a":0,"e":"Paders were bakers who made loaves in Goa.","ch":"ep5","t":0,"id":"n873"},{"ty":"mcq","mk":1,"q":"In Goa, the baker came to the house","o":["every morning, announced by the jingle of his bamboo staff","every evening","every week","rarely"],"a":0,"e":"The bread-seller's jingling stick announced the baker.","ch":"ep5","t":0,"id":"n874"},{"ty":"mcq","mk":1,"q":"The Portuguese left Goa but the","o":["baker's tradition remains","bakery closed","bread vanished","language remained only"],"a":0,"e":"The paders are still in the village.","ch":"ep5","t":0,"id":"n875"},{"ty":"mcq","mk":1,"q":"Coorg is situated in","o":["Karnataka","Kerala","Tamil Nadu","Goa"],"a":0,"e":"It lies between Mysore and the coast.","ch":"ep5","t":0,"id":"n876"},{"ty":"mcq","mk":1,"q":"The people of Coorg, the Kodavus, are known for","o":["bravery and hospitality","trade","fishing","poor farming"],"a":0,"e":"They are said to be descended from Arabs or Greeks.","ch":"ep5","t":1,"id":"n877"},{"ty":"mcq","mk":1,"q":"Coorg is famous for","o":["coffee plantations","tea gardens","cotton","rubber"],"a":0,"e":"Coffee grows in the hills.","ch":"ep5","t":1,"id":"n878"},{"ty":"mcq","mk":1,"q":"The tea plant is said to be discovered by a legend in","o":["China","India","Japan","Sri Lanka"],"a":0,"e":"The legend of Bodhidharma says that tea plants grew from his eyelids.","ch":"ep5","t":1,"id":"n879"},{"ty":"mcq","mk":1,"q":"Pranjol and Rajvir travel to","o":["Assam tea gardens","Coorg","Goa","Kerala"],"a":0,"e":"They talk about tea on the train.","ch":"ep5","t":1,"id":"n880"},{"ty":"short","mk":3,"q":"Describe the baker's visit and why the baker was an important part of Goan life.","m":"The baker would announce himself by the jingling sound of his bamboo staff. He sold bread, 'bol' and other bakery goods for celebrations and feasts. Bread was an essential part of daily meals and weddings, so the baker's visit was part of the village's daily routine and traditions.","p":["Jingle announced the baker","Items sold","Important to daily life and festivals"],"ch":"ep5","t":0,"id":"n881"},{"ty":"short","mk":3,"q":"Write three things you learn about Coorg from the lesson.","m":"Coorg is a hilly region in Karnataka, with beautiful coffee plantations, mist-covered hills and rivers like the Kaveri. The Kodavus are brave, hospitable and martial people. The region is also known for its wildlife, honey and many tourist spots.","p":["Hilly and coffee","Kodavus are brave and hospitable","Rich in nature"],"ch":"ep5","t":1,"id":"n882"},{"ty":"mcq","mk":1,"q":"Gavin Maxwell was given the otter in","o":["Basra, Iraq","Scotland","London","Delhi"],"a":0,"e":"He got the otter on a trip to the Tigris marshes.","ch":"ep6","t":0,"id":"n883"},{"ty":"mcq","mk":1,"q":"The otter's name was","o":["Mijbil","Custard","Tricki","Max"],"a":0,"e":"It was nicknamed Mij.","ch":"ep6","t":0,"id":"n884"},{"ty":"mcq","mk":1,"q":"Maxwell carried the otter to London by","o":["aeroplane","ship only","train","car"],"a":0,"e":"He had to carry it in a box.","ch":"ep6","t":0,"id":"n885"},{"ty":"mcq","mk":1,"q":"Mij was fascinated by","o":["water","football","paper","gloves"],"a":0,"e":"He loved to play with water and rolled around in it.","ch":"ep6","t":1,"id":"n886"},{"ty":"mcq","mk":1,"q":"The otter calmed down when Maxwell gave it","o":["a rubber ball to play with","food","sleeping pills","a teddy"],"a":0,"e":"Mij played with a ball and became docile.","ch":"ep6","t":1,"id":"n887"},{"ty":"mcq","mk":1,"q":"In the aeroplane, Mij","o":["escaped from the box and caused chaos","slept all the time","ate food","sat quietly"],"a":0,"e":"He crawled out and climbed onto the passengers.","ch":"ep6","t":1,"id":"n888"},{"ty":"mcq","mk":1,"q":"Maxwell wanted to take the otter in a box because","o":["the airline had rules to travel with pets","he was afraid","it was a bag","he was poor"],"a":0,"e":"He found a way to make the journey safe.","ch":"ep6","t":1,"id":"n889"},{"ty":"short","mk":3,"q":"Why was Mijbil in a hurry to get to the bathtub? What did Maxwell learn about him?","m":"Mijbil was an otter who loves water. At home he rushed to the bathroom, turned on the taps and played in the water for hours. Maxwell learnt that Mij could not be happy without water and that he needed a big supply of it in his new home.","p":["Love for water","Bathtub play","Maxwell's understanding"],"ch":"ep6","t":0,"id":"n890"},{"ty":"mcq","mk":1,"q":"The main character of 'Madam Rides the Bus' is","o":["Valli","Shanti","Kamala","Meena"],"a":0,"e":"She was a girl of about eight.","ch":"ep7","t":0,"id":"n891"},{"ty":"mcq","mk":1,"q":"Valli took the bus ride to","o":["the neighbouring town","Delhi","a fair","school"],"a":0,"e":"She wanted to see the world beyond her village.","ch":"ep7","t":0,"id":"n892"},{"ty":"mcq","mk":1,"q":"Valli saved money for the bus ride by","o":["collecting coins","stealing","asking the neighbour","selling her bangles"],"a":0,"e":"She saved pennies by never spending them.","ch":"ep7","t":0,"id":"n893"},{"ty":"mcq","mk":1,"q":"The conductor in the bus","o":["made fun of Valli but was kind","was rude","beat her","threw her out"],"a":0,"e":"He treated her as a passenger but also teased her.","ch":"ep7","t":1,"id":"n894"},{"ty":"mcq","mk":1,"q":"The title 'Madam Rides the Bus' suggests","o":["Valli's pride in being independent","an old woman","a bus conductor","a teacher"],"a":0,"e":"She behaved like a grown-up.","ch":"ep7","t":1,"id":"n895"},{"ty":"short","mk":3,"q":"What was Valli's attitude when she first saw the bus? What did it show about her?","m":"Valli was thrilled and wanted to ride the bus, sensing the freedom and adventure it offered. She was curious, brave and determined to see the world outside her village despite being a child.","p":["Excitement","Curiosity","Determination"],"ch":"ep7","t":1,"id":"n896"},{"ty":"mcq","mk":1,"q":"Kisa Gotami went to the Buddha seeking","o":["medicine for her dead son","money","food","a house"],"a":0,"e":"She was heartbroken after her only son died.","ch":"ep8","t":0,"id":"n897"},{"ty":"mcq","mk":1,"q":"The Buddha asked Kisa Gotami to bring","o":["a handful of mustard seeds from a house where no one had died","rice","honey","a flower"],"a":0,"e":"He knew death comes to every family.","ch":"ep8","t":0,"id":"n898"},{"ty":"mcq","mk":1,"q":"Kisa Gotami could not find mustard seeds from a house where no one had died because","o":["death comes to every house","everyone was away","nobody had them","the villagers were rude"],"a":0,"e":"Everyone had lost a loved one.","ch":"ep8","t":0,"id":"n899"},{"ty":"mcq","mk":1,"q":"The Buddha taught that","o":["sorrow is universal and attachment causes it","money brings peace","only the rich suffer","prayer solves all"],"a":0,"e":"He taught that the death of dear ones is a part of life.","ch":"ep8","t":1,"id":"n900"},{"ty":"mcq","mk":1,"q":"The Buddha's message to Kisa Gotami was to","o":["accept the reality of death","forget her son","find another child","leave her village"],"a":0,"e":"It consoled her and she buried her son.","ch":"ep8","t":1,"id":"n901"},{"ty":"mcq","mk":1,"q":"Kisa Gotami finally","o":["buried her son and followed the Buddha","stayed at home","left the village","died"],"a":0,"e":"She realised the truth and sought the Buddha's path.","ch":"ep8","t":1,"id":"n902"},{"ty":"mcq","mk":1,"q":"The Buddha is called 'Enlightened One' because he","o":["found the truth about life and suffering","was a king","won battles","was rich"],"a":0,"e":"The word Buddha means the awakened one.","ch":"ep8","t":1,"id":"n903"},{"ty":"short","mk":3,"q":"Why did the Buddha ask Kisa Gotami to bring mustard seeds from a house where nobody had died? What did she learn?","m":"The Buddha wanted her to understand that death is universal and no home is untouched by it. By going from house to house she saw that everyone had lost someone. She learnt that grief is common and that she must accept death and let go of the dead child.","p":["Purpose of the test","Her search","The lesson of acceptance"],"ch":"ep8","t":1,"id":"n904"},{"ty":"mcq","mk":1,"q":"The play 'The Proposal' was written by","o":["Anton Chekhov","William Shakespeare","G. B. Shaw","J. M. Barrie"],"a":0,"e":"It is a one-act comedy.","ch":"ep9","t":0,"id":"n905"},{"ty":"mcq","mk":1,"q":"Lomov came to Chubukov's house to","o":["propose to Natalya","buy land","sell dogs","borrow money"],"a":0,"e":"He was dressed formally to ask for Natalya's hand.","ch":"ep9","t":0,"id":"n906"},{"ty":"mcq","mk":1,"q":"The first quarrel between Lomov and Natalya was about","o":["Oxen Meadows","a dog","a house","a horse"],"a":0,"e":"Each claimed the land belonged to their own family.","ch":"ep9","t":0,"id":"n907"},{"ty":"mcq","mk":1,"q":"The dispute between Lomov and Chubukov about their dogs involved","o":["Squeezer and Guess","Max and Tuck","Rex and Bruno","Jack"],"a":0,"e":"Each claimed their dog was better.","ch":"ep9","t":1,"id":"n908"},{"ty":"mcq","mk":1,"q":"Lomov suffered from","o":["palpitations and nervous problems","a fever","a leg injury","bad eyesight"],"a":0,"e":"He complained about 'palpitations' and a twitch.","ch":"ep9","t":1,"id":"n909"},{"ty":"mcq","mk":1,"q":"At the end of the play","o":["Natalya and Lomov decide to marry, and quarrel again","the proposal is rejected","Lomov leaves","they remain friends"],"a":0,"e":"The father pushes them together and they quarrel again.","ch":"ep9","t":1,"id":"n910"},{"ty":"mcq","mk":1,"q":"When Natalya learnt that Lomov had come to propose, she","o":["asked her father to bring him back and wept at her mistake","asked him to leave forever","laughed at him","left the house"],"a":0,"e":"She realised she had sent away the man who wanted to marry her.","ch":"ep9","t":1,"id":"n911"},{"ty":"ar","mk":1,"q":"Assertion (A): 'The Proposal' is a comedy.\nReason (R): It shows how petty quarrels over land and dogs delay a marriage proposal.","a":0,"e":"The silly quarrels create humour; R explains A.","ar":1,"ch":"ep9","t":1,"id":"n912"},{"ty":"short","mk":3,"q":"How does Chekhov bring out the comic element in the play 'The Proposal'?","m":"Instead of proposing, Lomov and Natalya argue over trivial matters: Oxen Meadows and the quality of their dogs. Lomov's nervousness and fainting, Chubukov's pushiness and sudden joy produce comic situations. The ending, in which they quarrel again right after being engaged, adds humour.","p":["Trivial quarrels","Lomov's nervousness","Ending"],"ch":"ep9","t":1,"id":"n913"},{"ty":"mcq","mk":1,"q":"In 'Dust of Snow', the poet's mood was changed by","o":["a crow shaking snow from a hemlock tree","a snowfall","a friend","a song"],"a":0,"e":"The unexpected fall of snow changed his mood from regret to cheer.","ch":"eq1","t":0,"id":"n914"},{"ty":"mcq","mk":1,"q":"The poet says the incident 'saved some part of a day I had rued'. 'Rued' means","o":["regretted","enjoyed","forgot","planned"],"a":0,"e":"He was feeling sad about the day until the snow fell.","ch":"eq1","t":0,"id":"n915"},{"ty":"mcq","mk":1,"q":"The central message of the poem is that","o":["nature can lift our mood through small unexpected events","crows are lucky","snow is bad","winter is boring"],"a":0,"e":"A tiny incident can change our mood.","ch":"eq1","t":0,"id":"n916"},{"ty":"mcq","mk":1,"q":"The crow and the hemlock tree traditionally suggest","o":["sorrow and death, yet here they bring cheer","joy and wealth","friendship","happiness"],"a":0,"e":"The poet turns the symbols of sadness into something positive.","ch":"eq1","t":1,"id":"n917"},{"ty":"mcq","mk":1,"q":"The rhyme scheme of 'Dust of Snow' in each stanza is","o":["abab","aabb","abba","abcd"],"a":0,"e":"Crow/snow and me/tree rhyme alternately.","ch":"eq1","t":1,"id":"n918"},{"ty":"ar","mk":1,"q":"Assertion (A): In 'Dust of Snow', the poet's mood changes after the crow shakes snow on him.\nReason (R): Nature has a healing effect on human moods.","a":0,"e":"The poem shows that even a small touch of nature can change a mood.","ar":1,"ch":"eq1","t":1,"id":"n919"},{"ty":"short","mk":3,"q":"How did the dust of snow change the poet's mood?","m":"The poet was in a sad, regretful mood. When a crow shook some dust of snow from a hemlock tree on him, it was an unexpected event that startled him and made him cheerful. It saved part of the day that he had been regretting.","p":["Poet's earlier sad mood","Crow and snow","Mood lifted"],"ch":"eq1","t":0,"id":"n920"},{"ty":"mcq","mk":1,"q":"In 'Fire and Ice', fire stands for","o":["desire","hatred","fear","love of nature"],"a":0,"e":"Frost says that the world may end in fire, which stands for desire.","ch":"eq2","t":0,"id":"n921"},{"ty":"mcq","mk":1,"q":"In 'Fire and Ice', ice stands for","o":["hatred","desire","peace","kindness"],"a":0,"e":"The poet's experience of desire and hate suggests that either could destroy.","ch":"eq2","t":0,"id":"n922"},{"ty":"mcq","mk":1,"q":"The poet 'holds with those who favour fire' because","o":["he has tasted desire","he likes heat","he hates the cold","fire is useful"],"a":0,"e":"His experience of desire supports the view.","ch":"eq2","t":0,"id":"n923"},{"ty":"mcq","mk":1,"q":"The poem 'Fire and Ice' was written by","o":["Robert Frost","Carl Sandburg","W. B. Yeats","Ogden Nash"],"a":0,"e":"It is one of his most famous short poems.","ch":"eq2","t":1,"id":"n924"},{"ty":"mcq","mk":1,"q":"The poet says that for destruction ice 'would suffice' which means","o":["it is also great and enough","it is weak","it is not needed","it is cold"],"a":0,"e":"He considers hatred as destructive as desire.","ch":"eq2","t":1,"id":"n925"},{"ty":"mcq","mk":1,"q":"The line 'Some say the world will end in fire' is an example of","o":["a metaphorical statement","a rhetorical question","alliteration only","a simile"],"a":0,"e":"Fire is used as a symbol of human desire.","ch":"eq2","t":1,"id":"n926"},{"ty":"ar","mk":1,"q":"Assertion (A): In 'Fire and Ice', the poet compares fire to desire and ice to hatred.\nReason (R): Both desire and hatred can destroy the world.","a":0,"e":"Both are powerful negative emotions that can end the world.","ar":1,"ch":"eq2","t":1,"id":"n927"},{"ty":"short","mk":3,"q":"What does the poet suggest about human emotions through the symbols of fire and ice?","m":"Fire symbolises desire or greed, and ice symbolises hatred or indifference. The poet says both are equally destructive and can end the world, warning that unchecked emotions can destroy humanity.","p":["Fire stands for desire","Ice stands for hatred","Both destructive"],"ch":"eq2","t":1,"id":"n928"},{"ty":"mcq","mk":1,"q":"In 'A Tiger in the Zoo', the tiger is shown as","o":["restless in a cage","playful","sleeping","friendly"],"a":0,"e":"It stalks the cage and is full of silent rage.","ch":"eq3","t":0,"id":"n929"},{"ty":"mcq","mk":1,"q":"The poet contrasts the tiger in the cage with","o":["the tiger in the jungle","a lion","a bird","a bear"],"a":0,"e":"He imagines the tiger stalking in the forest.","ch":"eq3","t":0,"id":"n930"},{"ty":"mcq","mk":1,"q":"The tiger in the cage stares at","o":["the brilliant stars","the keeper","the visitors","the grass"],"a":0,"e":"Its vision is of the open freedom it has lost.","ch":"eq3","t":0,"id":"n931"},{"ty":"mcq","mk":1,"q":"The line 'stalks in his vivid stripes' is an example of","o":["imagery","simile","oxymoron","alliteration only"],"a":0,"e":"It paints a picture of the tiger's stripes.","ch":"eq3","t":1,"id":"n932"},{"ty":"mcq","mk":1,"q":"The poet says that the tiger 'should be lurking in shadow' and","o":["ready to hunt in the jungle","waiting for visitors","searching for water","playing"],"a":0,"e":"He compares the real life with the tiger in the cage.","ch":"eq3","t":1,"id":"n933"},{"ty":"mcq","mk":1,"q":"The poem expresses the poet's","o":["sympathy for caged animals","fear of tigers","love for zoos","hate for animals"],"a":0,"e":"It emphasises the cruelty of captivity.","ch":"eq3","t":1,"id":"n934"},{"ty":"short","mk":3,"q":"What contrast does the poet draw in 'A Tiger in the Zoo'?","m":"The poet contrasts the tiger's caged life in the zoo, where it restlessly paces in a small area and stares, with its natural life in the forest where it should be stalking and hunting freely. The contrast brings out the cruelty of captivity.","p":["Caged versus free life","Restless pacing","Poet's sympathy"],"ch":"eq3","t":0,"id":"n935"},{"ty":"mcq","mk":1,"q":"'How to Tell Wild Animals' is a","o":["humorous poem","sad poem","tragic poem","religious poem"],"a":0,"e":"It uses humour and exaggeration.","ch":"eq4","t":0,"id":"n936"},{"ty":"mcq","mk":1,"q":"In the poem, if a beast 'roars at you as you're dying', you will know it is","o":["the Asian lion","the Bengal tiger","the leopard","the crocodile"],"a":0,"e":"The poem says the roar of the Asian lion is a sure sign.","ch":"eq4","t":0,"id":"n937"},{"ty":"mcq","mk":1,"q":"The poem was written by","o":["Carolyn Wells","Robert Frost","Leslie Norris","Ogden Nash"],"a":0,"e":"She wrote this humorous poem.","ch":"eq4","t":0,"id":"n938"},{"ty":"mcq","mk":1,"q":"The poet's tone in the poem is","o":["humorous and ironic","serious","angry","sad"],"a":0,"e":"The tips would be useless as one would be dead by the time one used them.","ch":"eq4","t":1,"id":"n939"},{"ty":"mcq","mk":1,"q":"The poem uses the device of","o":["irony and exaggeration","metaphor","personification","alliteration only"],"a":0,"e":"It humorously warns of danger.","ch":"eq4","t":1,"id":"n940"},{"ty":"mcq","mk":1,"q":"The poem has the rhyme scheme of","o":["couplets (aabb)","abab","abba","none"],"a":0,"e":"Each pair of lines rhymes.","ch":"eq4","t":1,"id":"n941"},{"ty":"short","mk":3,"q":"Why is the poem 'How to Tell Wild Animals' humorous?","m":"The poem gives ridiculous tips to identify wild animals, such as recognising the tiger when it attacks and mauls you, which would be useless for survival. The ironic suggestions are exaggerated, and so the poem amuses us.","p":["Impractical advice","Irony and exaggeration","Humorous tone"],"ch":"eq4","t":0,"id":"n942"},{"ty":"mcq","mk":1,"q":"In 'The Ball Poem', the boy has lost","o":["his ball","his books","his father","his friend"],"a":0,"e":"The ball bounced down the steps and into the water.","ch":"eq5","t":0,"id":"n943"},{"ty":"mcq","mk":1,"q":"The poet decides not to buy the boy a new ball because","o":["the boy must learn to cope with loss","he is poor","he is angry","the boy refuses"],"a":0,"e":"Money cannot replace the experience of loss.","ch":"eq5","t":0,"id":"n944"},{"ty":"mcq","mk":1,"q":"The ball in the poem is a symbol of","o":["the loss that every person experiences","a game","money","school"],"a":0,"e":"It stands for the things one loses in life.","ch":"eq5","t":0,"id":"n945"},{"ty":"mcq","mk":1,"q":"The line 'He is learning... how to stand up' suggests","o":["growing up by accepting loss","learning football","falling","standing in a line"],"a":0,"e":"The boy learns to face loss with courage.","ch":"eq5","t":1,"id":"n946"},{"ty":"mcq","mk":1,"q":"The poet says that money is","o":["external","useless","everything","a gift"],"a":0,"e":"He says a new ball cannot make up for the sense of loss the boy is learning to bear.","ch":"eq5","t":1,"id":"n947"},{"ty":"mcq","mk":1,"q":"'The Ball Poem' was written by","o":["John Berryman","Robert Frost","W. B. Yeats","Carl Sandburg"],"a":0,"e":"It reflects on childhood and loss.","ch":"eq5","t":1,"id":"n948"},{"ty":"short","mk":3,"q":"What does the boy learn from the loss of his ball?","m":"The boy learns that loss is a part of life and that one must face it and move on. He is beginning to understand responsibility and the first lessons of growing up, instead of depending on money to replace what is lost.","p":["Loss is part of life","Responsibility","Growing up"],"ch":"eq5","t":1,"id":"n949"},{"ty":"mcq","mk":1,"q":"Amanda is a child who is repeatedly told to","o":["sit straight and not bite her nails","play outside","eat more","speak loudly"],"a":0,"e":"Her mother keeps giving commands.","ch":"eq6","t":0,"id":"n950"},{"ty":"mcq","mk":1,"q":"In her daydream, Amanda imagines herself as","o":["a mermaid and an orphan","a queen","a doctor","a teacher"],"a":0,"e":"She also imagines being Rapunzel.","ch":"eq6","t":0,"id":"n951"},{"ty":"mcq","mk":1,"q":"Amanda wishes to be","o":["free of commands","rich","a princess","a teacher"],"a":0,"e":"She wants freedom and no one to nag her.","ch":"eq6","t":0,"id":"n952"},{"ty":"mcq","mk":1,"q":"In 'Amanda!', the thoughts and replies of Amanda appear","o":["in brackets","in capital letters","in italics only","as a footnote"],"a":0,"e":"The mother's commands are in plain text and Amanda's replies are in brackets.","ch":"eq6","t":1,"id":"n953"},{"ty":"mcq","mk":1,"q":"The poem shows the conflict between","o":["a child's freedom and adult control","friends","teacher and student","rich and poor"],"a":0,"e":"The mother's constant instructions restrict the child.","ch":"eq6","t":1,"id":"n954"},{"ty":"mcq","mk":1,"q":"Amanda's daydreaming as a mermaid shows her desire for","o":["peace and freedom","food","a fish","a swim"],"a":0,"e":"She wants to be free from the restrictions.","ch":"eq6","t":1,"id":"n955"},{"ty":"short","mk":3,"q":"What does the poem 'Amanda!' tell us about children and parental nagging?","m":"The poem shows that constant commands from parents irritate children and suppress their imagination. Amanda wants to be free, to daydream and to be herself, and she escapes through her fantasies as a mermaid, an orphan and Rapunzel.","p":["Constant commands","Child's desire for freedom","Escape through daydreaming"],"ch":"eq6","t":0,"id":"n956"},{"ty":"mcq","mk":1,"q":"In Adrienne Rich's poem 'The Trees', the trees want to","o":["move out of the house into the forest","stay inside","fall","fly"],"a":0,"e":"They are tired of being in the room and long for their natural place.","ch":"eq7","t":0,"id":"n957"},{"ty":"mcq","mk":1,"q":"The 'room' in the poem symbolises","o":["a restricted life","a school","a garden","a farm"],"a":0,"e":"It represents confinement.","ch":"eq7","t":0,"id":"n958"},{"ty":"mcq","mk":1,"q":"The poem 'The Trees' is mainly about","o":["the contrast between the freedom of nature and confinement","a forest fire","a ship","a river"],"a":0,"e":"It shows that nature longs for freedom.","ch":"eq7","t":1,"id":"n959"},{"ty":"mcq","mk":1,"q":"The moon in the poem is described as","o":["broken like a mirror","bright","small","golden"],"a":0,"e":"It is used to create the sense of confusion.","ch":"eq7","t":1,"id":"n960"},{"ty":"mcq","mk":1,"q":"The poet uses","o":["personification","onomatopoeia","hyperbole only","simile only"],"a":0,"e":"Trees are given human feelings.","ch":"eq7","t":1,"id":"n961"},{"ty":"short","mk":3,"q":"What does the poet suggest by saying that the trees are 'inside the room' and want to go back to the forest?","m":"The trees are pot plants that have been kept in a house. By describing them as trying to move out, the poet suggests nature's longing for freedom and its need to be in its natural surroundings, and criticises confining it in artificial spaces.","p":["Trees kept indoors","Longing for the forest","Nature and freedom"],"ch":"eq7","t":0,"id":"n962"},{"ty":"mcq","mk":1,"q":"In 'Fog', the fog comes on","o":["little cat feet","big feet","wings","wheels"],"a":0,"e":"It moves silently like a cat.","ch":"eq8","t":0,"id":"n963"},{"ty":"mcq","mk":1,"q":"The poem 'Fog' was written by","o":["Carl Sandburg","Robert Frost","Ogden Nash","W. B. Yeats"],"a":0,"e":"He compares fog to a cat.","ch":"eq8","t":0,"id":"n964"},{"ty":"mcq","mk":1,"q":"In the poem the fog looks over","o":["the harbour and the city","the forest","a river","a mountain"],"a":0,"e":"It sits on silent haunches over them.","ch":"eq8","t":0,"id":"n965"},{"ty":"mcq","mk":1,"q":"The main poetic device in 'Fog' is","o":["metaphor","simile","onomatopoeia","hyperbole"],"a":0,"e":"Fog is directly compared to a cat without using 'like' or 'as'.","ch":"eq8","t":1,"id":"n966"},{"ty":"mcq","mk":1,"q":"The poem 'Fog' has","o":["a few lines in free verse","many stanzas","rhyming couplets","no imagery"],"a":0,"e":"It is a short poem with no regular rhyme.","ch":"eq8","t":1,"id":"n967"},{"ty":"mcq","mk":1,"q":"The line 'then moves on' suggests that fog","o":["is temporary","stays forever","is angry","is powerful"],"a":0,"e":"It arrives silently and soon leaves.","ch":"eq8","t":1,"id":"n968"},{"ty":"short","mk":3,"q":"How is fog compared to a cat in the poem 'Fog'?","m":"The fog is compared to a cat because it arrives silently like a cat on tiny feet, sits quietly over the harbour and city on its haunches, and then moves away. It is a metaphor, with the quiet and gentle movement common to both.","p":["Silent arrival","Sits and watches","Moves on"],"ch":"eq8","t":0,"id":"n969"},{"ty":"mcq","mk":1,"q":"In 'The Tale of Custard the Dragon', the girl's name is","o":["Belinda","Amanda","Anne","Kisa"],"a":0,"e":"She lived in a little white house.","ch":"eq9","t":0,"id":"n970"},{"ty":"mcq","mk":1,"q":"The pet dragon was named","o":["Custard","Mustard","Ink","Blink"],"a":0,"e":"He cried for a nice safe cage.","ch":"eq9","t":0,"id":"n971"},{"ty":"mcq","mk":1,"q":"The mouse in Belinda's house was named","o":["Blink","Ink","Mustard","Custard"],"a":0,"e":"Ink was the kitten, Blink the mouse and Mustard the dog.","ch":"eq9","t":0,"id":"n972"},{"ty":"mcq","mk":1,"q":"The pirate came to Belinda's house and","o":["Custard ate him up","Belinda killed him","he escaped","he took the dragon"],"a":0,"e":"The cowardly dragon proved brave and gobbled him up.","ch":"eq9","t":0,"id":"n973"},{"ty":"mcq","mk":1,"q":"The poem is an example of","o":["a ballad","a sonnet","a free verse","an ode"],"a":0,"e":"It narrates a story in rhyming verses.","ch":"eq9","t":1,"id":"n974"},{"ty":"mcq","mk":1,"q":"The poet uses humour by saying that Custard was","o":["a coward who turned out to be the bravest","brave from the start","a pirate","a dog"],"a":0,"e":"The cowardly dragon defeats the pirate.","ch":"eq9","t":1,"id":"n975"},{"ty":"mcq","mk":1,"q":"Everyone else in the house, except Custard, was","o":["brave","afraid","asleep","missing"],"a":0,"e":"They said they were brave as lions, tigers and bears.","ch":"eq9","t":1,"id":"n976"},{"ty":"short","mk":3,"q":"How did Custard prove his bravery in the poem?","m":"Though Custard was a coward who cried for a nice safe cage, when a pirate attacked the house and the others fled, he bravely fought and gobbled up the pirate. He thus proved to be braver than everyone.","p":["Custard was a coward","Pirate attack","He ate the pirate"],"ch":"eq9","t":0,"id":"n977"},{"ty":"mcq","mk":1,"q":"The poet of 'For Anne Gregory' is","o":["W. B. Yeats","Frost","Berryman","Sandburg"],"a":0,"e":"It is a poem by the Irish poet.","ch":"eq10","t":0,"id":"n978"},{"ty":"mcq","mk":1,"q":"Anne Gregory's 'yellow hair' stands for","o":["physical beauty","wealth","age","intelligence"],"a":0,"e":"Young men love her for her hair, not for herself.","ch":"eq10","t":0,"id":"n979"},{"ty":"mcq","mk":1,"q":"According to the 'old religious man', only God can love you","o":["for yourself alone","for your hair","for your money","for your beauty"],"a":0,"e":"The poem says love for what one truly is comes only from God.","ch":"eq10","t":0,"id":"n980"},{"ty":"mcq","mk":1,"q":"The poet says the young man cannot love Anne for herself alone because","o":["he is attracted by her yellow hair","she is poor","she is old","she is far"],"a":0,"e":"He loves the hair and not the person.","ch":"eq10","t":1,"id":"n981"},{"ty":"mcq","mk":1,"q":"Anne's reply that she can dye her hair brown, black or carrot implies","o":["she wants to be loved for her true self","she is poor","she hates her hair","she wants a job"],"a":0,"e":"She wants to test whether people love her for herself.","ch":"eq10","t":1,"id":"n982"},{"ty":"mcq","mk":1,"q":"The theme of the poem is","o":["true love goes beyond physical appearance","hair","dyeing","religion"],"a":0,"e":"The poem says that inner qualities matter more.","ch":"eq10","t":1,"id":"n983"},{"ty":"short","mk":3,"q":"What is the message of the poem 'For Anne Gregory'?","m":"The poem says that people are often attracted by outward beauty, like Anne's yellow hair, but real love is for the inner self. Only God can love a person for herself alone, so one should value inner qualities over looks.","p":["Outward beauty is superficial","Love for inner self","Only God loves unconditionally"],"ch":"eq10","t":1,"id":"n984"},{"ty":"mcq","mk":1,"q":"The narrator of 'A Triumph of Surgery' is a","o":["veterinary surgeon","doctor","teacher","farmer"],"a":0,"e":"He is Mr Herriot, who treated Mrs Pumphrey's dog.","ch":"ef1","t":0,"id":"n985"},{"ty":"mcq","mk":1,"q":"Mrs Pumphrey's dog was a","o":["Pekingese named Tricki","bulldog named Max","dachshund","poodle"],"a":0,"e":"Tricki Woo was overfed and pampered.","ch":"ef1","t":0,"id":"n986"},{"ty":"mcq","mk":1,"q":"Tricki fell ill because he","o":["was overfed and given no exercise","was starved","had an accident","was cold"],"a":0,"e":"Mrs Pumphrey gave him too much rich food.","ch":"ef1","t":0,"id":"n987"},{"ty":"mcq","mk":1,"q":"Herriot cured Tricki by","o":["putting him on a starvation diet and keeping him with other dogs","performing a surgery","giving him many tablets","sending him abroad"],"a":0,"e":"He used no surgery; the dog recovered with simple care and exercise.","ch":"ef1","t":1,"id":"n988"},{"ty":"mcq","mk":1,"q":"The story is called 'A Triumph of Surgery' because","o":["Mrs Pumphrey thought Herriot had performed a wonderful surgery","a big surgery was done","the dog died","Herriot was a surgeon"],"a":0,"e":"The title is ironic, as no surgery was done.","ch":"ef1","t":1,"id":"n989"},{"ty":"mcq","mk":1,"q":"Mrs Pumphrey is described as","o":["a rich, kind-hearted but foolish woman","a cruel woman","a poor woman","a doctor"],"a":0,"e":"She loved Tricki but over-indulged him.","ch":"ef1","t":1,"id":"n990"},{"ty":"ar","mk":1,"q":"Assertion (A): Tricki was ill because of too much food.\nReason (R): Mrs Pumphrey pampered him instead of caring for him properly.","a":0,"e":"Her excessive love and indulgence made the dog unhealthy.","ar":1,"ch":"ef1","t":1,"id":"n991"},{"ty":"short","mk":3,"q":"How did Mr Herriot cure Tricki? Why is the title ironic?","m":"Herriot kept Tricki at his surgery, put him on a starvation diet and let him mix and play with other dogs, so he regained his health. Mrs Pumphrey believed Herriot had done a great surgery and praised him, though he had only corrected her overfeeding. Hence the title is ironic.","p":["Starvation diet and exercise","No surgery","Irony of the title"],"ch":"ef1","t":1,"id":"n992"},{"ty":"mcq","mk":1,"q":"In 'The Thief's Story', the thief's age was","o":["fifteen","twenty-five","forty","ten"],"a":0,"e":"Hari Singh was only fifteen but experienced.","ch":"ef2","t":0,"id":"n993"},{"ty":"mcq","mk":1,"q":"The thief first met Anil","o":["at a wrestling match","in a market","at a railway station","at a school"],"a":0,"e":"He flattered Anil by saying he looked like a wrestler.","ch":"ef2","t":0,"id":"n994"},{"ty":"mcq","mk":1,"q":"Anil agreed to teach Hari to","o":["cook, write and add numbers","drive","steal","sing"],"a":0,"e":"He promised to teach him to write his name and then sentences.","ch":"ef2","t":0,"id":"n995"},{"ty":"mcq","mk":1,"q":"Hari Singh stole the money","o":["from under Anil's mattress","from a locker","from a bank","from a shop"],"a":0,"e":"Anil had tucked the bundle of notes under it after selling a book.","ch":"ef2","t":1,"id":"n996"},{"ty":"mcq","mk":1,"q":"Hari Singh did not leave town because","o":["he missed the train and later decided to go back","the police caught him","Anil called him","he lost the money"],"a":0,"e":"He was filled with guilt and also wanted to learn to read and write.","ch":"ef2","t":1,"id":"n997"},{"ty":"mcq","mk":1,"q":"The next morning Anil gave Hari","o":["a fifty rupee note, saying he would now be paid regularly","a letter","a lecture","nothing"],"a":0,"e":"Hari realised that Anil knew about the theft and had chosen to trust him.","ch":"ef2","t":1,"id":"n998"},{"ty":"mcq","mk":1,"q":"The main message of the story is that","o":["trust and kindness can reform a person","crime pays","writers are poor","trains are late"],"a":0,"e":"Anil's trust made Hari want to become a better person.","ch":"ef2","t":1,"id":"n999"},{"ty":"ar","mk":1,"q":"Assertion (A): Hari Singh returned the stolen money.\nReason (R): He felt guilty and valued Anil's trust and teaching.","a":0,"e":"His conscience and desire to learn made him return it.","ar":1,"ch":"ef2","t":1,"id":"n1000"},{"ty":"short","mk":3,"q":"Why did Hari Singh return the money he had stolen? What did Anil do the next morning?","m":"Hari missed his train, and while wandering in the rain he thought of Anil's trust and the chance to become educated, so he felt guilty and put the damp notes back under the mattress. Next morning, Anil gave him a fifty-rupee note as his pay, which showed that he knew but did not blame him.","p":["Guilt and trust","Returned the notes","Anil's kind gesture"],"ch":"ef2","t":1,"id":"n1001"},{"ty":"mcq","mk":1,"q":"Fowler in 'The Midnight Visitor' is","o":["a young writer","a secret agent","a thief","a waiter"],"a":0,"e":"He wished to meet Ausable because he was a writer who loved adventure.","ch":"ef3","t":0,"id":"n1002"},{"ty":"mcq","mk":1,"q":"Ausable was different from usual secret agents as he was","o":["fat, with an American accent","thin and tall","young","French"],"a":0,"e":"He did not fit the romantic picture Fowler had.","ch":"ef3","t":0,"id":"n1003"},{"ty":"mcq","mk":1,"q":"Max entered Ausable's room using","o":["a passkey","a window","a balcony","a ladder"],"a":0,"e":"He used a passkey and held a pistol.","ch":"ef3","t":0,"id":"n1004"},{"ty":"mcq","mk":1,"q":"Ausable told Max that","o":["the room has a balcony of the next apartment where police might come","the police would not come","the report was not important","the room was empty"],"a":0,"e":"He invented the balcony story to frighten Max.","ch":"ef3","t":1,"id":"n1005"},{"ty":"mcq","mk":1,"q":"Max jumped out of the window because","o":["he believed the police were coming and there was a balcony","he wanted to run","he was pushed","Fowler shouted"],"a":0,"e":"Ausable had made him think he could escape on the balcony.","ch":"ef3","t":1,"id":"n1006"},{"ty":"mcq","mk":1,"q":"The knock on the door was by","o":["Henry, the waiter, bringing wine","a policeman","a thief","a neighbour"],"a":0,"e":"Ausable had planned for the knock.","ch":"ef3","t":1,"id":"n1007"},{"ty":"mcq","mk":1,"q":"The story is an example of","o":["presence of mind and cleverness","luck","a murder mystery","courage in war"],"a":0,"e":"Ausable outwitted Max by bluff.","ch":"ef3","t":1,"id":"n1008"},{"ty":"short","mk":3,"q":"How did Ausable outwit Max? What does this tell us about him?","m":"Ausable told Max that the room had a balcony shared with the next apartment and that police were coming to protect him. Max, frightened of the police, jumped out of the window to the supposed balcony and fell, as there was no balcony. It shows that Ausable was clever, calm and had presence of mind.","p":["The balcony story","Max jumped","Ausable's cleverness"],"ch":"ef3","t":1,"id":"n1009"},{"ty":"mcq","mk":1,"q":"Horace Danby in 'A Question of Trust' was by profession a","o":["lock-maker","doctor","teacher","policeman"],"a":0,"e":"He made locks and had two helpers.","ch":"ef4","t":0,"id":"n1010"},{"ty":"mcq","mk":1,"q":"Horace Danby stole once a year to","o":["buy rare and expensive books","buy a house","help the poor","pay debts"],"a":0,"e":"He loved rare books.","ch":"ef4","t":0,"id":"n1011"},{"ty":"mcq","mk":1,"q":"The house that Horace planned to rob was","o":["Shotover Grange","Pemberley","Downton","Windsor"],"a":0,"e":"He had studied it for two weeks.","ch":"ef4","t":0,"id":"n1012"},{"ty":"mcq","mk":1,"q":"The woman in red told Horace that","o":["she had forgotten the combination of the safe","she would help him","she was the cook","the safe was empty"],"a":0,"e":"She tricked him by pretending to be the lady of the house.","ch":"ef4","t":1,"id":"n1013"},{"ty":"mcq","mk":1,"q":"Horace took off his gloves while opening the safe, so","o":["his fingerprints were left all over","the police were fooled","he got more jewels","the woman was caught"],"a":0,"e":"The police traced him because of his fingerprints.","ch":"ef4","t":1,"id":"n1014"},{"ty":"mcq","mk":1,"q":"The real owner of the house was","o":["an elderly lady who said she never asked him","the young woman in red","the housekeeper","a doctor"],"a":0,"e":"The woman in red was another thief.","ch":"ef4","t":1,"id":"n1015"},{"ty":"mcq","mk":1,"q":"Horace's sneezing was caused by","o":["hay fever from flowers","a cold","dust","pepper"],"a":0,"e":"He sneezed because of the bowl of flowers.","ch":"ef4","t":1,"id":"n1016"},{"ty":"short","mk":3,"q":"How did Horace Danby fall into the trap of a trickster?","m":"Horace trusted the young woman in red who pretended to be the lady of the house and said she had forgotten the combination of the safe. He opened the safe without gloves and handed over the jewels. She vanished, and the police arrested him by his fingerprints, as she was another thief.","p":["Woman pretends to be owner","Opened safe without gloves","He was arrested"],"ch":"ef4","t":1,"id":"n1017"},{"ty":"mcq","mk":1,"q":"'Footprints Without Feet' is based on a novel by","o":["H. G. Wells","Ruskin Bond","Guy de Maupassant","Anton Chekhov"],"a":0,"e":"The novel is 'The Invisible Man'.","ch":"ef5","t":0,"id":"n1018"},{"ty":"mcq","mk":1,"q":"The scientist Griffin made himself invisible by","o":["swallowing certain rare drugs","wearing a cloak","using a mirror","a magic trick"],"a":0,"e":"His body became transparent like glass.","ch":"ef5","t":0,"id":"n1019"},{"ty":"mcq","mk":1,"q":"Griffin set fire to his landlord's house because","o":["his landlord tried to eject him","he was bored","he wanted to travel","he was hungry"],"a":0,"e":"He took revenge on the man who disliked him.","ch":"ef5","t":0,"id":"n1020"},{"ty":"mcq","mk":1,"q":"Griffin went into a big London store at night to","o":["stay warm and get clothes and food","rob a bank","sleep in a bed","meet friends"],"a":0,"e":"It was mid-winter and he was naked.","ch":"ef5","t":1,"id":"n1021"},{"ty":"mcq","mk":1,"q":"Griffin went to Drury Lane in London to","o":["get a disguise from a theatrical shop","watch a play","meet friends","steal food"],"a":0,"e":"He found bandages, glasses, a false nose and whiskers.","ch":"ef5","t":1,"id":"n1022"},{"ty":"mcq","mk":1,"q":"Griffin stayed at the inn in","o":["Iping","Reading","London","Drury Lane"],"a":0,"e":"He booked two rooms at the local inn.","ch":"ef5","t":1,"id":"n1023"},{"ty":"mcq","mk":1,"q":"At the inn, people got suspicious of him when","o":["furniture appeared to move on its own","he danced","he sang","he paid too much"],"a":0,"e":"The inn-keeper Mrs Hall discovered he was invisible.","ch":"ef5","t":1,"id":"n1024"},{"ty":"short","mk":3,"q":"How does Griffin misuse his discovery of invisibility in the story?","m":"Griffin, a brilliant scientist, was also lawless. He set fire to his landlord's house, broke into shops to steal clothes and food, attacked a shopkeeper and robbed him, and stole money at the inn. This shows that he used his discovery to commit crimes.","p":["Arson","Theft and robbery","Attacks"],"ch":"ef5","t":1,"id":"n1025"},{"ty":"mcq","mk":1,"q":"In 'The Making of a Scientist', Richard Ebright's first hobby was","o":["collecting butterflies","collecting stamps","playing football","reading comics"],"a":0,"e":"He collected butterflies, rocks, fossils and coins.","ch":"ef6","t":0,"id":"n1026"},{"ty":"mcq","mk":1,"q":"The book that opened the world of science to Ebright was","o":["The Travels of Monarch X","Treasure Island","Alice in Wonderland","The Invisible Man"],"a":0,"e":"It told how monarch butterflies migrate.","ch":"ef6","t":0,"id":"n1027"},{"ty":"mcq","mk":1,"q":"By second grade, Ebright had collected","o":["all twenty-five butterfly species of his area","a hundred butterflies","rocks only","no butterflies"],"a":0,"e":"He needed a new challenge.","ch":"ef6","t":0,"id":"n1028"},{"ty":"mcq","mk":1,"q":"Ebright lost the county science fair in seventh grade because","o":["his entry was a display and not a real experiment","his project was lost","he was late","he did not take part"],"a":0,"e":"He realised that real science needs experiments.","ch":"ef6","t":1,"id":"n1029"},{"ty":"mcq","mk":1,"q":"Ebright's high school research on the monarch pupa was about","o":["the purpose of the twelve gold spots","its colour","its wings","its food"],"a":0,"e":"He found they produce a hormone needed for development.","ch":"ef6","t":1,"id":"n1030"},{"ty":"mcq","mk":1,"q":"Ebright's mother helped him by","o":["encouraging him and buying equipment","doing his projects","shouting at him","stopping him"],"a":0,"e":"She bought telescopes and microscopes and wrote to Dr Urquhart.","ch":"ef6","t":1,"id":"n1031"},{"ty":"mcq","mk":1,"q":"Dr Frederick Urquhart was a","o":["scientist at the University of Toronto","doctor","teacher","writer"],"a":0,"e":"He studied the migration of monarchs.","ch":"ef6","t":1,"id":"n1032"},{"ty":"short","mk":3,"q":"What lessons does the life of Richard Ebright teach us about becoming a scientist?","m":"Ebright shows that curiosity, hard work, support from family, learning from failure and asking real questions are the keys to becoming a scientist. After losing a science fair, he did real experiments and later made discoveries about a hormone and cells.","p":["Curiosity","Learning from failure","Hard work and support"],"ch":"ef6","t":1,"id":"n1033"},{"ty":"mcq","mk":1,"q":"Mathilde Loisel's husband was a","o":["clerk in the Ministry of Education","doctor","soldier","banker"],"a":0,"e":"He worked in the Ministry of Public Instruction.","ch":"ef7","t":0,"id":"n1034"},{"ty":"mcq","mk":1,"q":"Mathilde borrowed a necklace from","o":["Madame Forestier","Madame Loisel's sister","a shop","a bank"],"a":0,"e":"Madame Forestier was her wealthy friend.","ch":"ef7","t":0,"id":"n1035"},{"ty":"mcq","mk":1,"q":"Mathilde lost the necklace","o":["after the ball","at the ball door","in a shop","at home"],"a":0,"e":"She discovered it was missing on returning home.","ch":"ef7","t":0,"id":"n1036"},{"ty":"mcq","mk":1,"q":"The Loisels replaced the necklace for","o":["thirty-six thousand francs","five hundred francs","a hundred francs","ten thousand francs"],"a":0,"e":"They borrowed heavily to buy a similar necklace.","ch":"ef7","t":1,"id":"n1037"},{"ty":"mcq","mk":1,"q":"The Loisels worked hard for","o":["ten years","two years","one year","twenty years"],"a":0,"e":"They lived in poverty to repay the debt.","ch":"ef7","t":1,"id":"n1038"},{"ty":"mcq","mk":1,"q":"Madame Forestier finally said that the original necklace was","o":["made of paste worth only five hundred francs","made of diamonds","priceless","gold"],"a":0,"e":"The Loisels had wasted ten years of life.","ch":"ef7","t":1,"id":"n1039"},{"ty":"mcq","mk":1,"q":"The main theme of 'The Necklace' is","o":["vanity and the consequences of pride","friendship","travel","marriage"],"a":0,"e":"Mathilde's desire to appear rich cost her dearly.","ch":"ef7","t":1,"id":"n1040"},{"ty":"ar","mk":1,"q":"Assertion (A): Mathilde Loisel's life was ruined by the loss of a necklace.\nReason (R): She was a vain and dissatisfied woman who did not tell the truth.","a":0,"e":"Her vanity and her lie to her friend led to the disaster.","ar":1,"ch":"ef7","t":1,"id":"n1041"},{"ty":"short","mk":3,"q":"Why did the Loisels suffer for ten years? What irony ends the story?","m":"The Loisels lost the borrowed necklace and instead of telling Madame Forestier, replaced it with an expensive one for thirty-six thousand francs, borrowing money. They suffered ten years of hard work to repay it. The irony is that the original necklace was a cheap imitation worth only five hundred francs.","p":["Lost necklace and replacement","Ten years of poverty","The original was paste"],"ch":"ef7","t":1,"id":"n1042"},{"ty":"mcq","mk":1,"q":"Bholi's real name was","o":["Sulekha","Kamala","Radha","Meena"],"a":0,"e":"She was called Bholi, the simpleton.","ch":"ef8","t":0,"id":"n1043"},{"ty":"mcq","mk":1,"q":"Bholi was nicknamed so because","o":["she was a simpleton","she was pretty","she was brave","she was rich"],"a":0,"e":"She was also a stammerer and pock-marked.","ch":"ef8","t":0,"id":"n1044"},{"ty":"mcq","mk":1,"q":"Bholi's father was","o":["Ramlal, the Numberdar","a teacher","a doctor","a shopkeeper"],"a":0,"e":"He was the village headman.","ch":"ef8","t":0,"id":"n1045"},{"ty":"mcq","mk":1,"q":"Bholi's teacher","o":["encouraged her and gave her confidence","beat her","ignored her","was rude"],"a":0,"e":"She was kind and understanding.","ch":"ef8","t":1,"id":"n1046"},{"ty":"mcq","mk":1,"q":"Bholi's marriage was finally arranged to","o":["Bishamber Nath, an old lame shopkeeper","a young man","a doctor","a soldier"],"a":0,"e":"Her parents chose him as he did not ask for dowry.","ch":"ef8","t":1,"id":"n1047"},{"ty":"mcq","mk":1,"q":"Bholi refused to marry Bishamber when","o":["he demanded five thousand rupees as dowry","he arrived late","he was lame","he laughed"],"a":0,"e":"She was proud and refused the greedy man.","ch":"ef8","t":1,"id":"n1048"},{"ty":"mcq","mk":1,"q":"Bholi decided to","o":["teach in the school and look after her parents","marry another man","leave the village","go abroad"],"a":0,"e":"She became self-reliant and independent.","ch":"ef8","t":1,"id":"n1049"},{"ty":"short","mk":3,"q":"How did education change Bholi?","m":"Education gave Bholi confidence. Her kind teacher helped her to overcome her stammering and fear, and she became strong enough to refuse a greedy groom's demand for dowry, and decide to teach in the village school and care for her parents.","p":["Gained confidence","Rejected dowry","Became independent"],"ch":"ef8","t":1,"id":"n1050"},{"ty":"mcq","mk":1,"q":"In 'The Book That Saved the Earth', the invaders were","o":["Martians","Venusians","Jupiter people","Mercury people"],"a":0,"e":"They planned to invade Earth.","ch":"ef9","t":0,"id":"n1051"},{"ty":"mcq","mk":1,"q":"The leader of the Martians was","o":["Think-Tank","Oop","Noodle","Iota"],"a":0,"e":"He was a big headed arrogant leader.","ch":"ef9","t":0,"id":"n1052"},{"ty":"mcq","mk":1,"q":"The book that saved the Earth was a","o":["book of Mother Goose rhymes","science book","history book","cook book"],"a":0,"e":"The Martians misread the nursery rhymes.","ch":"ef9","t":0,"id":"n1053"},{"ty":"mcq","mk":1,"q":"The Martians' misunderstanding of 'Humpty Dumpty' was that","o":["it described a mighty weapon of Earthlings","it was a joke","it was a food","it was a song"],"a":0,"e":"Think-Tank thought Earth people could capture him.","ch":"ef9","t":1,"id":"n1054"},{"ty":"mcq","mk":1,"q":"The Martians decided to","o":["retreat to Alpha Centauri","attack Earth","make friends","stay"],"a":0,"e":"They believed Earthlings were too powerful.","ch":"ef9","t":1,"id":"n1055"},{"ty":"mcq","mk":1,"q":"Oop is a","o":["Martian who read the book and was nervous","Earth boy","a historian","a robot"],"a":0,"e":"He read 'Humpty Dumpty' aloud.","ch":"ef9","t":1,"id":"n1056"},{"ty":"mcq","mk":1,"q":"The story is set in the","o":["twenty-fifth century","twentieth century","stone age","fifteenth century"],"a":0,"e":"A Historian narrates the event.","ch":"ef9","t":1,"id":"n1057"},{"ty":"short","mk":3,"q":"How did a nursery rhyme book save the Earth?","m":"The Martians went to a library, read Mother Goose rhymes and misread them as technology. Think-Tank decided from Humpty Dumpty that Earth people had weapons to capture him and Mars, and called off the invasion. So the book saved Earth.","p":["Martians read nursery rhymes","Misunderstood Humpty Dumpty","Invasion called off"],"ch":"ef9","t":1,"id":"n1058"},{"ty":"mcq","mk":1,"q":"In an unseen passage, the best first step is to","o":["read the questions and skim the passage for the main idea","memorise every line","ignore the questions","guess the answers"],"a":0,"e":"Skimming for the gist and knowing what is asked saves time.","ch":"ew1","t":0,"id":"n1059"},{"ty":"mcq","mk":1,"q":"To find the meaning of a difficult word in a passage, you should","o":["use the context of the sentence","skip it","look up a dictionary in the exam","guess randomly"],"a":0,"e":"Clues in the surrounding words help to infer meaning.","ch":"ew1","t":0,"id":"n1060"},{"ty":"mcq","mk":1,"q":"The 'tone' of a passage means","o":["the writer's attitude to the subject","its length","its title","its date"],"a":0,"e":"Tone could be humorous, serious, critical, etc.","ch":"ew1","t":0,"id":"n1061"},{"ty":"mcq","mk":1,"q":"A synonym of 'meagre' is","o":["scanty","plentiful","rich","heavy"],"a":0,"e":"Meagre means small in quantity.","ch":"ew1","t":0,"id":"n1062"},{"ty":"mcq","mk":1,"q":"The central idea of a passage is best described as","o":["its main message in one line","its first sentence","its last word","a detail"],"a":0,"e":"It is the point the writer wants to make.","ch":"ew1","t":1,"id":"n1063"},{"ty":"mcq","mk":1,"q":"While writing answers to comprehension questions, you should","o":["use your own words and stick to the passage","copy the whole passage","add personal opinion","write long answers"],"a":0,"e":"Answers must be accurate and to the point.","ch":"ew1","t":1,"id":"n1064"},{"ty":"case","mk":1,"cs":"Read: \"Sleep is not a luxury. Studies show that teenagers who sleep eight to nine hours remember more of what they study and are less likely to fall ill. Yet many students stay up late with mobile phones, believing they are saving time. In fact they lose the very energy that helps them learn.\"","q":"According to the passage, a teenager who sleeps enough is likely to","o":["remember more and fall ill less","study less","stay awake","dislike studying"],"a":0,"e":"The passage says sleep helps memory and health.","ch":"ew1","t":0,"id":"n1065"},{"ty":"case","mk":1,"cs":"Read: \"Sleep is not a luxury. Studies show that teenagers who sleep eight to nine hours remember more of what they study and are less likely to fall ill. Yet many students stay up late with mobile phones, believing they are saving time. In fact they lose the very energy that helps them learn.\"","q":"The word 'luxury' in the passage is closest in meaning to","o":["something unnecessary","something harmful","something common","something cheap"],"a":0,"e":"The writer says sleep is a necessity, not an optional extra.","ch":"ew1","t":0,"id":"n1066"},{"ty":"case","mk":1,"cs":"Read: \"Rivers are the lifelines of civilisations. Cities grew along their banks because water was available for drinking and farming. Today, however, many rivers are choked with plastic and chemical waste, which not only kills aquatic life but also endangers the people who depend on them.\"","q":"The writer's attitude towards the present condition of rivers is","o":["concerned","indifferent","joyful","amused"],"a":0,"e":"He points to pollution and its dangers.","ch":"ew1","t":1,"id":"n1067"},{"ty":"case","mk":1,"cs":"Read: \"Rivers are the lifelines of civilisations. Cities grew along their banks because water was available for drinking and farming. Today, however, many rivers are choked with plastic and chemical waste, which not only kills aquatic life but also endangers the people who depend on them.\"","q":"Which of the following is NOT stated in the passage?","o":["Rivers should be crossed by bridges","Cities grew near rivers","Rivers are polluted","Pollution harms aquatic life"],"a":0,"e":"The passage does not talk of bridges.","ch":"ew1","t":1,"id":"n1068"},{"ty":"short","mk":3,"q":"What strategies would you use to answer an unseen passage in the exam? Give three.","m":"First read the passage quickly to get the gist, then read the questions carefully and locate the answers in the text. Use context to guess meanings of difficult words and answer in your own words, briefly and accurately. Keep a check on time and revise your answers.","p":["Skim and read questions","Use context","Answer concisely in own words"],"ch":"ew1","t":1,"id":"n1069"},{"ty":"mcq","mk":1,"q":"In a formal letter, the correct closing for a letter beginning 'Dear Sir' is","o":["Yours faithfully","Yours lovingly","Your friend","Best wishes"],"a":0,"e":"'Yours faithfully' goes with Sir/Madam; 'Yours sincerely' with a named person.","ch":"ew2","t":0,"id":"n1070"},{"ty":"mcq","mk":1,"q":"The subject line of a formal letter should be","o":["brief and written below the salutation","long","skipped","written after the signature"],"a":0,"e":"It states the purpose of the letter in a few words.","ch":"ew2","t":0,"id":"n1071"},{"ty":"mcq","mk":1,"q":"A formal letter to an editor is written in","o":["a polite and formal tone","a slang tone","a casual tone","a jokey tone"],"a":0,"e":"Formal letters need respectful language.","ch":"ew2","t":0,"id":"n1072"},{"ty":"mcq","mk":1,"q":"The sender's address in a formal letter is written at the","o":["top left (or right)","bottom","middle","end"],"a":0,"e":"It comes first followed by the date.","ch":"ew2","t":0,"id":"n1073"},{"ty":"mcq","mk":1,"q":"An analytical paragraph is written on the basis of","o":["a given chart or graph","a story","a poem","a letter"],"a":0,"e":"One interprets and reports the data given.","ch":"ew2","t":1,"id":"n1074"},{"ty":"mcq","mk":1,"q":"While writing an analytical paragraph, one should","o":["give an introduction, key figures and a conclusion","copy the data","write opinions only","avoid figures"],"a":0,"e":"The paragraph must be based on facts.","ch":"ew2","t":1,"id":"n1075"},{"ty":"mcq","mk":1,"q":"The word limit for an analytical paragraph in the CBSE paper is generally","o":["100-120 words","20 words","300 words","50 words"],"a":0,"e":"Check the latest sample paper for exact limits.","ch":"ew2","t":1,"id":"n1076"},{"ty":"mcq","mk":1,"q":"Which linking expression suits an analytical paragraph?","o":["In comparison","Dear Sir","Yours faithfully","Once upon a time"],"a":0,"e":"It helps compare data.","ch":"ew2","t":1,"id":"n1077"},{"ty":"short","mk":5,"q":"Write the format of a formal letter and the points to remember.","m":"Write the sender's address and date at the top, then the receiver's designation and address. Add a salutation (Sir/Madam), a subject line, the body in clear paragraphs, a complimentary close (Yours faithfully) and the signature with name. Keep the language polite, concise and to the point.","p":["Sender's address and date","Receiver's address","Subject and salutation","Body and closing","Formal tone"],"ch":"ew2","t":0,"id":"n1078"},{"ty":"short","mk":5,"q":"How will you write an analytical paragraph on a given graph? List the steps.","m":"Read the title and data carefully, note the highest, lowest and trend. Begin with a topic sentence stating what the data shows, then give the key figures and comparisons, and finally end with a conclusion or inference. Keep the language formal and use only information given.","p":["Read the chart carefully","Topic sentence","Key figures and comparisons","Conclusion","Formal language"],"ch":"ew2","t":1,"id":"n1079"},{"ty":"mcq","mk":1,"q":"Choose the correct form: She ___ to school every day.","o":["goes","go","going","gone"],"a":0,"e":"The subject 'she' takes a singular verb 'goes' in the simple present.","ch":"ew3","t":0,"id":"n1080"},{"ty":"mcq","mk":1,"q":"Choose the correct form: By the time we reached, the film ___.","o":["had started","has started","starts","is starting"],"a":0,"e":"Past perfect is used for the earlier action.","ch":"ew3","t":0,"id":"n1081"},{"ty":"mcq","mk":1,"q":"Choose the correct form: Neither of the boys ___ present.","o":["was","were","are","have"],"a":0,"e":"'Neither' takes a singular verb.","ch":"ew3","t":0,"id":"n1082"},{"ty":"mcq","mk":1,"q":"Choose the correct form: The committee ___ divided in its opinion.","o":["is","are","were","have been"],"a":0,"e":"A committee as a single unit takes 'is'.","ch":"ew3","t":0,"id":"n1083"},{"ty":"mcq","mk":1,"q":"Choose the correct form: He ___ for two hours when I called.","o":["had been studying","has studying","studied","studies"],"a":0,"e":"Past perfect continuous shows duration before a past moment.","ch":"ew3","t":0,"id":"n1084"},{"ty":"mcq","mk":1,"q":"You ___ obey traffic rules. (obligation)","o":["must","may","can","might"],"a":0,"e":"'Must' expresses strong obligation.","ch":"ew3","t":1,"id":"n1085"},{"ty":"mcq","mk":1,"q":"___ you help me with this sum? (request)","o":["Could","Should","Must","Shall"],"a":0,"e":"'Could' is polite for requests.","ch":"ew3","t":1,"id":"n1086"},{"ty":"mcq","mk":1,"q":"He gave me ___ useful advice.","o":["some","a","an","many"],"a":0,"e":"'Advice' is uncountable, so 'some' is used.","ch":"ew3","t":1,"id":"n1087"},{"ty":"mcq","mk":1,"q":"I have ___ umbrella.","o":["an","a","the","some"],"a":0,"e":"'Umbrella' begins with a vowel sound.","ch":"ew3","t":1,"id":"n1088"},{"ty":"mcq","mk":1,"q":"___ of the students has passed. (singular)","o":["Each","Many","Few","Several"],"a":0,"e":"'Each' takes a singular verb.","ch":"ew3","t":1,"id":"n1089"},{"ty":"mcq","mk":1,"q":"Change into indirect: He said, 'I am tired.'","o":["He said that he was tired.","He said that he is tired.","He said that I was tired.","He said he was tired me."],"a":0,"e":"Present tense shifts to past in reported speech.","ch":"ew3","t":2,"id":"n1090"},{"ty":"mcq","mk":1,"q":"Change into indirect: She said to me, 'Where do you live?'","o":["She asked me where I lived.","She said me where I live.","She asked me where do I live.","She told me where I lived."],"a":0,"e":"Questions are reported with 'asked' and statement word order.","ch":"ew3","t":2,"id":"n1091"},{"ty":"mcq","mk":1,"q":"Change into indirect: He said, 'Please help me.'","o":["He requested me to help him.","He said help me.","He asked that please help him.","He told me that help him."],"a":0,"e":"Requests use 'requested'.","ch":"ew3","t":2,"id":"n1092"},{"ty":"mcq","mk":1,"q":"Change into indirect: The teacher said, 'The earth moves round the sun.'","o":["The teacher said that the earth moves round the sun.","The teacher said that the earth moved round the sun.","The teacher said the earth was moving.","The teacher told the earth moves."],"a":0,"e":"A universal truth keeps the present tense.","ch":"ew3","t":2,"id":"n1093"},{"ty":"mcq","mk":1,"q":"Change into indirect: He said, 'Alas! I have failed.'","o":["He exclaimed sadly that he had failed.","He said alas he has failed.","He asked that he had failed.","He told that alas failed."],"a":0,"e":"An exclamation is reported with 'exclaimed'.","ch":"ew3","t":2,"id":"n1094"},{"ty":"mcq","mk":1,"q":"Spot the error: He is senior than me.","o":["senior to me","senior from me","senior at me","senior over me"],"a":0,"e":"'Senior' is followed by 'to', not 'than'.","ch":"ew3","t":3,"id":"n1095"},{"ty":"mcq","mk":1,"q":"Fill in: She is good ___ music.","o":["at","in","on","for"],"a":0,"e":"'Good at' is the correct preposition.","ch":"ew3","t":3,"id":"n1096"},{"ty":"mcq","mk":1,"q":"Edit: 'He do not know the answer.' The error is in","o":["do","know","the","answer"],"a":0,"e":"It should be 'does not know'.","ch":"ew3","t":3,"id":"n1097"},{"ty":"mcq","mk":1,"q":"Edit: 'I am looking forward to meet you.' The correct form is","o":["to meeting you","to meet to you","for meeting you","in meeting you"],"a":0,"e":"'Look forward to' takes a gerund.","ch":"ew3","t":3,"id":"n1098"},{"ty":"mcq","mk":1,"q":"Fill in the blank with a suitable word: He insisted ___ paying the bill.","o":["on","at","to","for"],"a":0,"e":"'Insist on' is the correct phrase.","ch":"ew3","t":3,"id":"n1099"},{"ty":"ar","mk":1,"q":"Assertion (A): The sentence 'Each of the girls is present' is grammatically correct.\nReason (R): 'Each' is a singular subject and takes a singular verb.","a":0,"e":"Since 'each' is singular, 'is' is correct; R explains A.","ar":1,"ch":"ew3","t":0,"id":"n1100"},{"ty":"short","mk":3,"q":"Convert to indirect speech: 'I will meet you tomorrow,' said Ravi to me. Explain the changes.","m":"Ravi told me that he would meet me the next day. 'Will' changes to 'would' (backshift), 'I' becomes 'he' (subject), 'you' becomes 'me' (object), and 'tomorrow' changes to 'the next day'.","p":["Said to changed to told","Tense backshift","Pronoun change","Time word change"],"ch":"ew3","t":2,"id":"n1101"},{"ty":"short","mk":3,"q":"Write the rules for using 'a' and 'an'. Give one example of each.","m":"Use 'an' before a word beginning with a vowel sound, such as 'an hour', and 'a' before a consonant sound, such as 'a university'. The rule depends on the sound and not the letter.","p":["Vowel sound takes an","Consonant sound takes a","Examples"],"ch":"ew3","t":3,"id":"n1102"},{"ty":"mcq","mk":1,"q":"Which word is a synonym of 'abundant'?","o":["plentiful","rare","scarce","tiny"],"a":0,"e":"Abundant means existing in large quantities.","ch":"ew4","t":0,"id":"n1103"},{"ty":"mcq","mk":1,"q":"Which word means the opposite of 'generous'?","o":["miserly","kind","giving","gentle"],"a":0,"e":"A miserly person is unwilling to spend.","ch":"ew4","t":0,"id":"n1104"},{"ty":"mcq","mk":1,"q":"The idiom 'a piece of cake' means","o":["something very easy","something sweet","something costly","something rare"],"a":0,"e":"It describes an easy task.","ch":"ew4","t":0,"id":"n1105"},{"ty":"mcq","mk":1,"q":"The idiom 'to burn the midnight oil' means","o":["to work late into the night","to waste oil","to cook late","to sleep early"],"a":0,"e":"It refers to studying or working very late.","ch":"ew4","t":0,"id":"n1106"},{"ty":"mcq","mk":1,"q":"The correct spelling is","o":["necessary","neccessary","necesary","necessery"],"a":0,"e":"It has one 'c' and two 's'.","ch":"ew4","t":1,"id":"n1107"},{"ty":"mcq","mk":1,"q":"A word that means 'one who writes poems' is","o":["poet","painter","potter","pilot"],"a":0,"e":"A poet writes poems.","ch":"ew4","t":1,"id":"n1108"},{"ty":"mcq","mk":1,"q":"Complete the proverb: A stitch in time saves","o":["nine","ten","one","five"],"a":0,"e":"It tells us to fix a problem quickly.","ch":"ew4","t":1,"id":"n110
