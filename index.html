.big{width:100%;min-height:68px;font-size:1.25rem;border-radius:20px}
.full{width:100%}

label{display:block;margin:8px 0 4px;font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--chip);border-radius:16px;padding:10px 12px}.stat b{font-size:1.35rem;display:block}
.bar{height:12px;background:var(--chip);border-radius:8px;overflow:hidden;position:relative;border:1px solid var(--line)}

.bar i.a{background:var(--pri2)}.bar i.b{background:var(--ok)}

.mochi{display:flex;gap:10px;align-items:flex-end;margin:8px 0}

.bubble{position:relative;background:var(--card);border:2px solid var(--pri2);border-radius:18px;padding:10px 14px;flex:1;font-weight:500}
.bubble:before{content:"";position:absolute;left:-10px;bottom:16px;border:8px solid transparent;border-right-color:var(--pri2);border-left:0}
.task{display:flex;gap:10px;align-items:center;border-left:8px solid var(--c,#999);padding:10px 10px 10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c,#999);margin:8px 0}

.task button{min-width:84px}

.topic{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:60px;padding:10px 12px;border-radius:16px;border:2px solid var(--line);background:var(--card);margin:6px 0}

.topic.s2{background:var(--okbg);border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}.topic.s2 .bx{background:var(--ok);border-color:var(--ok);color:#06210f}

.topic .tn{flex:1;font-weight:600}

.tick{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);margin:4px 4px 4px 0}
.vid{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);margin:0 0 6px 46px;font-size:.9rem}
.vid.on{background:#3a1430;border-color:var(--pri);color:#ffc2e0}
.tick.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.acc{width:100%;text-align:left;display:block;min-height:64px;padding:12px;border-radius:16px;margin:8px 0;background:var(--card)}
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.ov .in{max-width:720px;margin:0 auto;padding-bottom:40px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{background:var(--card);border:2px solid var(--pri);border-radius:20px;padding:18px;max-width:420px;width:100%}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;min-height:56px;align-items:flex-start;border-radius:14px;padding:12px}
.opt .l{flex:0 0 28px;height:28px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{border-radius:14px;padding:10px 12px;margin:10px 0}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.case{background:var(--chip);border-radius:12px;padding:10px;margin:8px 0;font-size:.95rem}
.q{white-space:pre-wrap;font-size:1.08rem;font-weight:600;margin:8px 0}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#2b1824;border:2px solid var(--pri);color:var(--ink);padding:12px 18px;border-radius:14px;z-index:99;max-width:90%;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:.75rem;color:var(--mute)}

/* Mochi animation */
.mo{overflow:visible}.mo *{transform-box:fill-box}
.mo-all{transform-origin:50% 100%}
.mo-body{animation:moBob 3.4s ease-in-out infinite;transform-origin:50% 100%}
.mo-eye{animation:moBlink 5s infinite;transform-origin:50% 50%}
.mo-ear{transform-origin:50% 95%}.mo-ear.l{animation:moEarL 6s ease-in-out infinite}.mo-ear.r{animation:moEarR 6s ease-in-out 1.2s infinite}
.mo-arm{transform-origin:20% 25%}
.mo-sp{opacity:0}.mo-sp path{transform-origin:50% 50%}
.m-s{display:none}
@keyframes moBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.015,.985)}}
@keyframes moBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes moEarL{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-9deg)}90%{transform:rotate(5deg)}95%{transform:rotate(-4deg)}}
@keyframes moEarR{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(9deg)}90%{transform:rotate(-5deg)}95%{transform:rotate(4deg)}}
@keyframes moJump{0%{transform:translateY(0) scale(1.08,.9)}25%{transform:translateY(-22px) scale(.95,1.08)}50%{transform:translateY(0) scale(1.08,.92)}70%{transform:translateY(-10px)}100%{transform:translateY(0) scale(1,1)}}
@keyframes moWave{0%,100%{transform:rotate(0)}20%{transform:rotate(-35deg)}40%{transform:rotate(15deg)}60%{transform:rotate(-35deg)}80%{transform:rotate(10deg)}}
@keyframes moSp{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
@keyframes moSpin{0%{transform:scale(.2) rotate(0)}50%{transform:scale(1.25) rotate(60deg)}100%{transform:scale(.6) rotate(120deg)}}
@keyframes moSad{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-6deg) translateY(2px)}40%{transform:rotate(5deg) translateY(2px)}60%{transform:rotate(-4deg) translateY(2px)}80%{transform:rotate(2deg)}}
@keyframes moDrop{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(18deg)}}
@keyframes moEnc{0%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
.mo.cheer .mo-all{animation:moJump 1.1s ease-in-out 1}.mo.cheer .mo-body{animation:none}.mo.cheer .mo-arm{animation:moWave 1.1s ease-in-out .3s 1}
.mo.cheer .mo-sp{animation:moSp 1.6s ease-out 1}.mo.cheer .mo-sp path{animation:moSpin 1.6s ease-out 1}
.mo.sad .mo-all{animation:moSad 1.3s ease-in-out 1}.mo.sad .mo-body{animation:none}.mo.sad .m-h{display:none}.mo.sad .m-s{display:inline}.mo.sad .mo-ear{animation:moDrop 1.3s ease-in-out 1}
.mo.enc .mo-all{animation:moEnc .9s ease-in-out 2}.mo.enc .mo-arm{animation:moWave 1s ease-in-out 1}.mo.enc .mo-body{animation:none}
@media (prefers-reduced-motion:reduce){.mo *,.mo{animation:none!important}.mo.cheer .mo-sp{opacity:1}.mo.sad .m-h{display:none}.mo.sad .m-s{display:inline}}

// Quiz bank part 1: Maths + Science. Constructors:
// M(ch,t,q,opts,ans,exp)   1-mark MCQ        AR(ch,t,A,R,code,exp) assertion-reason (0:both true,R explains 1:both true,R doesn't explain 2:A true,R false 3:A false,R true)
// CB(ch,t,case,q,opts,ans,exp) case-based    S(ch,t,marks,q,model,points) short/long answer self-check
// O* = official CBSE Sample Question Paper 2025-26 (src 'sqp2526'), text taken from CBSE SQP + marking scheme.
var QB = [];
var ARO = ['Both A and R are true, and R is the correct explanation of A','Both A and R are true, but R is not the correct explanation of A','A is true but R is false','A is false but R is true'];
function _p(o){QB.push(o);}
function M(ch,t,q,o,a,e){_p({ch:ch,t:t,ty:'mcq',mk:1,q:q,o:o,a:a,e:e,src:'own'});}
function AR(ch,t,A,R,c,e){_p({ch:ch,t:t,ty:'ar',mk:1,q:'Assertion (A): '+A+'\nReason (R): '+R,o:ARO,a:c,e:e,src:'own'});}
function CB(ch,t,cs,q,o,a,e){_p({ch:ch,t:t,ty:'case',mk:1,cs:cs,q:q,o:o,a:a,e:e,src:'own'});}
function S(ch,t,mk,q,m,p){_p({ch:ch,t:t,ty:'short',mk:mk,q:q,m:m,p:p,src:'own'});}
function OM(id,ch,t,q,o,a,e){_p({id:id,ch:ch,t:t,ty:'mcq',mk:1,q:q,o:o,a:a,e:e,src:'sqp2526'});}
function OAR(id,ch,t,A,R,c,e){_p({id:id,ch:ch,t:t,ty:'ar',mk:1,q:'Assertion (A): '+A+'\nReason (R): '+R,o:ARO,a:c,e:e,src:'sqp2526'});}
var U='Unit'; // placeholder

/* ===== MATHS (own practice questions) ===== */
M('m1',1,'The HCF of 96 and 404 is',['2','4','8','12'],1,'96 = 2⁵×3 and 404 = 2²×101, so HCF = 2² = 4.');
M('m1',1,'If HCF(26, 91) = 13, then LCM(26, 91) is',['182','91','26','1183'],0,'HCF × LCM = product of numbers, so LCM = 26×91/13 = 182.');
M('m1',0,'Which of these numbers can never end with the digit 0 (n a natural number)?',['6ⁿ','10ⁿ','20ⁿ','50ⁿ'],0,'To end in 0 a number needs both 2 and 5 as prime factors. 6ⁿ = 2ⁿ·3ⁿ has no factor 5.');
AR('m1',3,'3 + 2√5 is an irrational number.','The sum of a rational number and an irrational number is irrational.',0,'3 is rational and 2√5 is irrational, so their sum is irrational. R is exactly the reason.');
S('m1',2,3,'Prove that √3 is an irrational number.','Assume √3 is rational: √3 = p/q with p, q co-prime, q ≠ 0. Squaring, 3q² = p², so 3 divides p² and hence p. Let p = 3k, then 3q² = 9k², so q² = 3k², hence 3 divides q. Then p and q have a common factor 3, which contradicts co-primality. So √3 is irrational.',['Assume √3 = p/q with p, q co-prime','Get p² = 3q², so 3 | p','Put p = 3k, get 3 | q','Contradiction with co-prime → √3 irrational']);
M('m2',0,'The zeroes of the polynomial x² − 5x + 6 are',['2 and 3','−2 and −3','1 and 6','−1 and 6'],0,'x² − 5x + 6 = (x−2)(x−3), so the zeroes are 2 and 3.');
M('m2',2,'The sum and product of the zeroes of 2x² − 8x + 6 are',['4 and 3','−4 and 3','8 and 6','4 and −3'],0,'Sum = −b/a = 8/2 = 4; product = c/a = 6/2 = 3.');
M('m2',3,'A quadratic polynomial whose zeroes are 3 and −2 is',['x² − x − 6','x² + x − 6','x² − x + 6','x² − 5x − 6'],0,'Sum = 1, product = −6, so the polynomial is x² − (sum)x + product = x² − x − 6.');
M('m2',1,'The graph of a quadratic polynomial can NOT cut the x-axis at',['0 points','1 point','2 points','3 points'],3,'A quadratic has at most 2 zeroes, so its parabola cuts the x-axis at most twice.');
AR('m2',1,'x² + 1 has no real zeroes.','The graph of y = x² + 1 does not meet the x-axis.',0,'x² + 1 ≥ 1 for all x, so the parabola stays above the x-axis; no intersection means no real zeroes.');
S('m2',4,3,'If α and β are the zeroes of 2x² − 7x + 3, find α² + β².','α + β = 7/2 and αβ = 3/2. α² + β² = (α+β)² − 2αβ = 49/4 − 3 = 37/4.',['Sum = 7/2, product = 3/2','Use (α+β)² − 2αβ','Answer 37/4']);
M('m3',1,'The pair x + 2y = 3 and 2x + 4y = 7 has',['a unique solution','no solution','infinitely many solutions','exactly two solutions'],1,'a₁/a₂ = b₁/b₂ = 1/2 but c₁/c₂ = 3/7, so the lines are parallel: no solution.');
M('m3',3,'Solution of x + y = 5 and x − y = 1 is',['(3, 2)','(2, 3)','(4, 1)','(5, 0)'],0,'Adding: 2x = 6, x = 3, so y = 2.');
M('m3',1,'For what value of k does 2x + 3y = 7 and (k−1)x + (k+2)y = 3k have infinitely many solutions?',['5','6','7','8'],2,'Need (k−1)/2 = (k+2)/3 = 3k/7. From the first two, 3k − 3 = 2k + 4, so k = 7; and 3k/7 = 3 matches.');
AR('m3',1,'The system 2x + 3y = 5 and 4x + 6y = 10 has infinitely many solutions.','For a₁x+b₁y+c₁=0 and a₂x+b₂y+c₂=0, a₁/a₂ = b₁/b₂ = c₁/c₂ gives infinitely many solutions.',0,'Here 2/4 = 3/6 = 5/10, so the lines coincide.');
S('m3',4,3,'The sum of the digits of a two-digit number is 9. The number obtained by reversing the digits is 27 more than the original number. Find the number.','Let the digits be x (tens) and y (units). x + y = 9 and (10y + x) − (10x + y) = 27 ⇒ y − x = 3. Solving: y = 6, x = 3. The number is 36.',['Form x + y = 9','Form y − x = 3','Solve: x = 3, y = 6','Number = 36']);
M('m4',1,'The roots of x² − 3x − 10 = 0 are',['5 and −2','−5 and 2','5 and 2','−5 and −2'],0,'x² − 3x − 10 = (x − 5)(x + 2).');
M('m4',3,'The discriminant of 2x² − 4x + 3 = 0 is',['−8','8','16','−16'],0,'D = b² − 4ac = 16 − 24 = −8 < 0, so no real roots.');
M('m4',3,'The value(s) of k for which x² + kx + 9 = 0 has equal roots:',['±6','6 only','±3','−6 only'],0,'Equal roots need D = 0: k² − 36 = 0, so k = ±6.');
M('m4',0,'Which of these is NOT a quadratic equation?',['(x+1)² = 2(x−3)','x(x+1) + 8 = (x+2)(x−2)','x² + 3x + 1 = (x−2)²','(x−2)² + 1 = 2x − 3'],1,'x² + x + 8 = x² − 4 simplifies to x + 12 = 0, which is linear.');
AR('m4',3,'3x² − 6x + 3 = 0 has equal roots.','A quadratic has equal real roots when its discriminant is zero.',0,'D = 36 − 36 = 0, so the roots are equal, which is exactly what R says.');
S('m4',4,3,'The product of two consecutive positive integers is 306. Find the integers.','Let the integers be x and x+1. x(x+1) = 306 ⇒ x² + x − 306 = 0 ⇒ (x + 18)(x − 17) = 0. Since x > 0, x = 17. The integers are 17 and 18.',['Form x² + x − 306 = 0','Factorise (x+18)(x−17)','Reject negative root','17 and 18']);
M('m5',1,'The 10th term of the AP 2, 7, 12, … is',['47','52','42','50'],0,'a = 2, d = 5: a₁₀ = 2 + 9×5 = 47.');
M('m5',2,'The sum of the first 10 terms of the AP 3, 7, 11, … is',['210','200','220','190'],0,'Sₙ = n/2 [2a + (n−1)d] = 5[6 + 36] = 210.');
M('m5',1,'Which term of the AP 3, 8, 13, … is 78?',['15th','16th','17th','14th'],1,'3 + 5(n−1) = 78 ⇒ n − 1 = 15 ⇒ n = 16.');
AR('m5',0,'The sequence 5, 5, 5, 5, … is an AP.','In an AP the common difference can be zero.',0,'Each term differs from the previous by 0, so it is an AP with d = 0.');
CB('m5',3,'Seema saves ₹10 in the 1st week, ₹15 in the 2nd week, ₹20 in the 3rd week, and so on (each week ₹5 more).','How much does she save in the 10th week?',['₹50','₹55','₹60','₹45'],1,'AP with a = 10, d = 5: a₁₀ = 10 + 9×5 = 55.');
S('m5',2,3,'Find the sum of all two-digit numbers that are divisible by 3.','The numbers are 12, 15, …, 99: AP with a = 12, d = 3, l = 99. n = (99−12)/3 + 1 = 30. S = n/2 (a + l) = 15 × 111 = 1665.',['Identify AP: 12 to 99, d = 3','Find n = 30','Use S = n/2 (a + l)','1665']);
M('m6',1,'The distance of the point (−5, 12) from the origin is',['13','17','7','12'],0,'√(25 + 144) = 13.');
M('m6',2,'The point dividing (1, 2) and (4, 8) internally in the ratio 1 : 2 is',['(2, 4)','(3, 6)','(2, 5)','(5/2, 5)'],0,'x = (1×4 + 2×1)/3 = 2, y = (1×8 + 2×2)/3 = 4.');
M('m6',1,'The values of x for which the distance between (x, 0) and (0, 4) is 5:',['±3','3 only','±4','±5'],0,'x² + 16 = 25 ⇒ x² = 9 ⇒ x = ±3.');
AR('m6',0,'The point (−3, 0) lies on the x-axis.','Every point on the x-axis has y-coordinate 0.',0,'Its y-coordinate is 0, so it lies on the x-axis; R states exactly this.');
S('m6',2,3,'Find the ratio in which the point (−4, 6) divides the line segment joining A(−6, 10) and B(3, −8).','Let ratio be m : n. x: (3m − 6n)/(m + n) = −4 ⇒ 7m = 2n ⇒ m : n = 2 : 7. Check with y: (−8×2 + 10×7)/9 = 6 ✓.',['Use section formula for x','Get 7m = 2n','Ratio 2 : 7','Verify with y']);
M('m7',3,'In △ABC, DE ∥ BC with D on AB, E on AC. If AD = 2 cm, DB = 3 cm, AE = 4 cm, then EC =',['6 cm','8 cm','3 cm','5 cm'],0,'By BPT, AD/DB = AE/EC ⇒ 2/3 = 4/EC ⇒ EC = 6 cm.');
M('m7',3,'If △ABC ~ △DEF with AB : DE = 2 : 3, the ratio of their perimeters is',['2 : 3','4 : 9','3 : 2','2 : 9'],0,'Perimeters of similar triangles are in the same ratio as corresponding sides.');
M('m7',3,'Which criterion shows two triangles are similar if two angles of one equal two angles of the other?',['AA','SSS (congruence)','RHS','ASA only'],0,'AA similarity: two equal angles force the third to be equal as well.');
AR('m7',0,'All equilateral triangles are similar.','All angles of an equilateral triangle are 60°, so any two are equiangular.',0,'Equiangular triangles are similar by the AA criterion.');
S('m7',1,5,'State and prove the Basic Proportionality Theorem (Thales).','If a line is drawn parallel to one side of a triangle to intersect the other two sides in distinct points, the other two sides are divided in the same ratio. Proof: in △ABC, DE ∥ BC. Join BE and CD, draw EN ⊥ AB and DM ⊥ AC. ar(ADE)/ar(BDE) = AD/DB, and ar(ADE)/ar(CED) = AE/EC. △BDE and △CED are on the same base DE and between the same parallels DE and BC, so they have equal area. Hence AD/DB = AE/EC.',['Statement of BPT','Figure and construction (join BE, CD; draw perpendiculars)','Area ratios with ½ × base × height','ar(BDE) = ar(CED) (same base, same parallels)','Conclude AD/DB = AE/EC']);
M('m8',2,'The length of the tangent from a point 13 cm from the centre of a circle of radius 5 cm is',['12 cm','18 cm','√194 cm','8 cm'],0,'Tangent ⟂ radius, so length = √(13² − 5²) = 12 cm.');
M('m8',3,'From an external point P, tangents PA and PB are drawn. If ∠APB = 60°, then ∠AOB (O = centre) =',['120°','60°','90°','30°'],0,'Quadrilateral OAPB has two right angles at A and B, so ∠AOB = 360° − 90° − 90° − 60° = 120°.');
M('m8',0,'The number of tangents that can be drawn to a circle from a point lying ON the circle is',['1','2','0','infinite'],0,'Only one tangent touches the circle at a point on it.');
S('m8',3,3,'Prove that the lengths of tangents drawn from an external point to a circle are equal.','Let PA and PB be tangents from P to the circle with centre O. Join OA, OB, OP. OA ⟂ PA and OB ⟂ PB. In right △OAP and △OBP: OA = OB (radii), OP is common, ∠OAP = ∠OBP = 90°. So △OAP ≅ △OBP (RHS), hence PA = PB.',['Figure with OA, OB, OP','Use tangent ⟂ radius','Congruence by RHS','Hence PA = PB']);
M('m9',1,'The value of sin 30° + cos 60° is',['1','1/2','√3/2','0'],0,'1/2 + 1/2 = 1.');
M('m9',2,'If sin θ = 3/5, then cos θ =',['4/5','3/4','5/4','2/5'],0,'cos θ = √(1 − 9/25) = 4/5.');
M('m9',5,'The value of sin 60° cos 30° + sin 30° cos 60° is',['1','3/4','1/4','√3/2'],0,'(√3/2)(√3/2) + (1/2)(1/2) = 3/4 + 1/4 = 1.');
M('m9',3,'(1 + tan²θ) equals',['sec²θ','cosec²θ','cot²θ','sin²θ'],0,'Dividing sin²θ + cos²θ = 1 by cos²θ gives tan²θ + 1 = sec²θ.');
AR('m9',2,'The value of sin θ can never be greater than 1.','In a right triangle the hypotenuse is the longest side.',0,'sin θ = opposite/hypotenuse, and the hypotenuse ≥ opposite side, so sin θ ≤ 1.');
S('m9',4,3,'Prove that (1 − cos²θ)(1 + cot²θ) = 1.','LHS = sin²θ × cosec²θ (since 1 − cos²θ = sin²θ and 1 + cot²θ = cosec²θ) = sin²θ × (1/sin²θ) = 1 = RHS.',['1 − cos²θ = sin²θ','1 + cot²θ = cosec²θ','Multiply to get 1']);
M('m10',1,'The angle of elevation of the top of a 30 m tower from a point on the ground is 45°. The distance of the point from the tower base is',['30 m','30√3 m','10√3 m','15 m'],0,'tan 45° = 30/d = 1, so d = 30 m.');

function pad(n){return n<10?'0'+n:''+n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2],12,0,0)}
function today(){return ds(new Date())}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function diff(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function wkStart(s){var d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)}

function simulate(pace){

 if(exam<=from){res.tooShort=true;return res;}

 SUBJECTS.forEach(function(s){s.chapters.forEach(function(c){if(c.bonus)return;var n=0;c.t.forEach(function(x,i){if(tstat(c.id,i)<1)n++;});rem[c.id]=n;});});

 var weak=[];SUBJECTS.forEach(function(s){s.chapters.forEach(function(c){if(c.bonus)return;c.t.forEach(function(x,i){var tp=S.topics[c.id+':'+i];if(tp&&tp.f&&tp.s>=1&&!(tp.fx&&diff(tp.fx,t)<3))weak.push([c.id,i]);});});});
 var wp=0,cycle=null,cp=0,fcnt=0,left=0;

 function pickQ(avoid){var b=null;Q.forEach(function(x){if(!x.q.length)return;var p=x.pass+(x.sub.id===avoid?1e5:0);if(!b||p<b.p)b={x:x,p:p};});return b&&b.x}

 function chapterCycle(){var arr=[];SUBJECTS.forEach(function(s){s.chapters.forEach(function(c){if(c.bonus)return;var f=chProg(c.id).f,cs=CS(c.id);arr.push({ch:c.id,w:s.w,pri:-f*10+(cs.r1?1:0)+(cs.r2?1:0)});});});

 function sortHard(l){return l.slice().sort(function(a,b){var o={rev:0,weak:1,learn:2,cyc:2,mock:3,pyq:3};var oa=o[a.kind]===undefined?2:o[a.kind],ob=o[b.kind]===undefined?2:o[b.kind];if(oa!==ob)return oa-ob;return (HARD[a.sub]||0)-(HARD[b.sub]||0)})}
 var d,i;
 for(d=from;d<exam;d=addD(d,1)){
  var dow=pd(d).getDay(),sun=dow===0,dte=diff(d,exam),list=[],ph;
  if(d===t&&sn){list=sn.tasks.slice();ph=sn.ph||'learn';res.days[d]={ph:ph,tasks:list};if(!left)res.learnEnd=res.learnEnd||d;continue;}
  var B=budget(sun),used=0;
  if(dte<=1){res.days[d]={ph:'eve',tasks:[{k:'E:'+d,kind:'eve',sub:'maths',m:20,title:'Light skim of formulas & key points — then relax and sleep early',desc:'No new topics today. Pack your bag, keep calm, trust your preparation.'}]};continue;}
  var inFinal=d>=finalStart;
  if(!left&&!res.learnEnd)res.learnEnd=d;
  ph=inFinal?'final':(left?'learn':'revision');
  // due revisions
  if(!inFinal){var cap=sun||!left?B:Math.floor(B*0.4);var j=0;
   while(j<revq.length&&used+REVC<=cap+0){if(revq[j].due<=d){var r=revq.splice(j,1)[0];list.push(revTask(r.ch,r.r));used+=REVC;}else j++;}}
  if(inFinal){var due=revq.filter(function(r){return r.due<=d});}

  // fill

    if(kind==='mock')list.push({k:'M:'+d+':'+i,kind:'mock',sub:sb,m:45,title:'Timed mock: '+SUB[sb].name+' (practice paper, 45 min)',desc:'Set a timer, attempt a mix of MCQ, case-based and 3/5-mark answers from the Quiz section (Official sample-paper filter). Then log your marks in Me → Mocks.'});
    else if(kind==='pyq')list.push({k:'Y:'+d+':'+i,kind:'pyq',sub:sb,m:45,title:'Sample-paper practice: '+SUB[sb].name,desc:'Quiz section → filter “Official sample paper” for this subject and do 10 questions. Check marking-scheme points.'});
    else{var wk=null;if(weak.length){wk=weak.shift();}
     if(wk)list.push(weakTask(wk[0],wk[1]));else list.push({k:'F:'+d+':'+i,kind:'weak',sub:sb,m:30,title:'Weak-topic fix: '+SUB[sb].name+' — revisit your weakest chapter',desc:'Pick the chapter with your lowest quiz score, re-read, redo mistakes.'});}}

   else if(sun){var g=0;while(used+CYC<=B||(!list.length&&g===0)){var rc=recentChapter(d,g);g++;if(!rc)break;list.push({k:'V:'+rc+':'+d,kind:'cyc',sub:CH[rc].s.id,ch:rc,m:CYC,title:'Sunday light revision: '+CH[rc].c.n,desc:'Easy recap of this week’s chapter — then rest, sing, act, enjoy! 🎶'});used+=CYC;if(g>3)break;}
    if(!list.length)list.push({k:'S:'+d,kind:'rest',sub:'eng',m:20,title:'Rest day — optional 10-min quiz, then singing / acting practice 🎤',desc:'Sunday is your light day.'});}}
  res.days[d]={ph:ph,tasks:sortHard(list)};
 }
 res.learnLeft=left;

 function pickFinalSub(kind,n){var order=['maths','sci','sst','eng','maths','sci','hin','sst','maths','sci','eng'];return order[(n-1)%order.length]}

function logDone(key,title,sub,min){var t=today(),r=D(t);if(r.d.some(function(x){return x.k===key}))return null;var first=r.d.length===0,ev={first:first};
