"n233"},{"ty":"mcq","mk":1,"q":"Decomposition of vegetable matter into compost is","o":["exothermic","endothermic","neither","photochemical"],"a":0,"e":"Decomposition releases heat.","ch":"s1","t":4,"id":"n234"},{"ty":"mcq","mk":1,"q":"In CuO + H₂ → Cu + H₂O, the substance which is oxidised is","o":["H₂","CuO","Cu","H₂O"],"a":0,"e":"H₂ gains oxygen to form H₂O, so it is oxidised and CuO is reduced.","ch":"s1","t":5,"id":"n235"},{"ty":"mcq","mk":1,"q":"Rancidity of fats and oils can be prevented by","o":["adding antioxidants","exposing to air","heating in air","adding water"],"a":0,"e":"Antioxidants and nitrogen flushing slow down oxidation of fats.","ch":"s1","t":5,"id":"n236"},{"ty":"mcq","mk":1,"q":"The black coating on copper heated in air is","o":["CuO","Cu₂S","Cu(OH)₂","CuCO₃"],"a":0,"e":"2Cu + O₂ → 2CuO.","ch":"s1","t":5,"id":"n237"},{"ty":"short","mk":3,"q":"Write the balanced chemical equation for the reaction of aluminium with dilute sulphuric acid and state the type of reaction.","m":"2Al + 3H₂SO₄ → Al₂(SO₄)₃ + 3H₂. It is a displacement reaction because aluminium displaces hydrogen from the acid.","p":["Correct formulae","Balanced equation","Type = displacement"],"ch":"s1","t":0,"id":"n238"},{"ty":"short","mk":3,"q":"What is a precipitation reaction? Give one example with a balanced equation.","m":"A reaction in which an insoluble solid (precipitate) is formed when two solutions are mixed. Example: Na₂SO₄ + BaCl₂ → BaSO₄↓ + 2NaCl (white precipitate of barium sulphate).","p":["Definition","Example with correct formulae","Balanced with the precipitate marked"],"ch":"s1","t":3,"id":"n239"},{"ty":"short","mk":3,"q":"Define oxidation and reduction in terms of oxygen/hydrogen. Identify the oxidising agent in 2Cu + O₂ → 2CuO.","m":"Oxidation is gain of oxygen or loss of hydrogen; reduction is loss of oxygen or gain of hydrogen. In 2Cu + O₂ → 2CuO copper is oxidised and oxygen is the oxidising agent (it is reduced).","p":["Oxidation definition","Reduction definition","Oxygen is the oxidising agent"],"ch":"s1","t":5,"id":"n240"},{"ty":"mcq","mk":1,"q":"Phenolphthalein turns pink in","o":["a basic solution","an acidic solution","a neutral solution","any dilute solution"],"a":0,"e":"Phenolphthalein is colourless in acids and pink in bases.","ch":"s2","t":0,"id":"n241"},{"ty":"mcq","mk":1,"q":"Which of these is an olfactory indicator?","o":["onion","litmus","methyl orange","turmeric"],"a":0,"e":"Onion, vanilla and clove oil change smell in acids or bases.","ch":"s2","t":0,"id":"n242"},{"ty":"mcq","mk":1,"q":"Blue litmus paper turns red in","o":["HCl","NaOH","NaCl","soap solution"],"a":0,"e":"Acids turn blue litmus red.","ch":"s2","t":0,"id":"n243"},{"ty":"mcq","mk":1,"q":"When an acid reacts with a metal carbonate, the gas evolved is","o":["carbon dioxide","hydrogen","oxygen","chlorine"],"a":0,"e":"Acid + metal carbonate → salt + CO₂ + H₂O. CO₂ turns lime water milky.","ch":"s2","t":1,"id":"n244"},{"ty":"mcq","mk":1,"q":"The gas evolved when zinc granules react with dilute sulphuric acid burns with a","o":["pop sound","blue flame with smell","green flame","no sound"],"a":0,"e":"Hydrogen burns with a pop sound.","ch":"s2","t":1,"id":"n245"},{"ty":"mcq","mk":1,"q":"The reaction between an acid and a base to form salt and water is called","o":["neutralisation","hydrolysis","displacement","combustion"],"a":0,"e":"By definition.","ch":"s2","t":1,"id":"n246"},{"ty":"ar","mk":1,"q":"Assertion (A): Dry HCl gas does not change the colour of dry blue litmus paper.\nReason (R): HCl ionises in water to produce H⁺ ions.","a":0,"e":"H⁺ ions are required to show acidic behaviour, and these are produced only in the presence of water.","ar":1,"ch":"s2","t":1,"id":"n247"},{"ty":"mcq","mk":1,"q":"The pH of a solution is 3. This solution is","o":["acidic","basic","neutral","cannot say"],"a":0,"e":"pH below 7 means acidic.","ch":"s2","t":2,"id":"n248"},{"ty":"mcq","mk":1,"q":"Tooth decay starts when the pH of the mouth falls below","o":["5.5","7","8.4","2"],"a":0,"e":"Tooth enamel corrodes below pH 5.5.","ch":"s2","t":2,"id":"n249"},{"ty":"mcq","mk":1,"q":"Acid rain has a pH less than","o":["5.6","7","6.5","8"],"a":0,"e":"Rain water with pH below 5.6 is called acid rain.","ch":"s2","t":2,"id":"n250"},{"ty":"mcq","mk":1,"q":"A person suffering from acidity (indigestion) can get relief by taking","o":["milk of magnesia","vinegar","lemon juice","curd"],"a":0,"e":"Mg(OH)₂ is a mild base that neutralises excess acid in the stomach.","ch":"s2","t":2,"id":"n251"},{"ty":"case","mk":1,"cs":"Four solutions P, Q, R and S have pH values 2, 7, 9 and 13 respectively.","q":"The solution that is most acidic is","o":["P","Q","R","S"],"a":0,"e":"The lower the pH, the more acidic the solution.","ch":"s2","t":2,"id":"n252"},{"ty":"mcq","mk":1,"q":"The electrolysis of brine gives sodium hydroxide along with","o":["chlorine and hydrogen","oxygen and hydrogen","chlorine and oxygen","sodium and chlorine"],"a":0,"e":"2NaCl + 2H₂O → 2NaOH + Cl₂ + H₂ (chlor-alkali process).","ch":"s2","t":3,"id":"n253"},{"ty":"mcq","mk":1,"q":"Bleaching powder is produced by the action of chlorine on","o":["dry slaked lime","quicklime","limestone","sodium hydroxide"],"a":0,"e":"Ca(OH)₂ + Cl₂ → CaOCl₂ + H₂O.","ch":"s2","t":3,"id":"n254"},{"ty":"mcq","mk":1,"q":"Bleaching powder is used for","o":["disinfecting drinking water","making glass","softening hard water","setting fractured bones"],"a":0,"e":"It is a common disinfectant for water, and used for bleaching cotton and paper.","ch":"s2","t":3,"id":"n255"},{"ty":"mcq","mk":1,"q":"Baking soda is chemically","o":["sodium hydrogencarbonate","sodium carbonate","calcium carbonate","sodium chloride"],"a":0,"e":"NaHCO₃.","ch":"s2","t":4,"id":"n256"},{"ty":"mcq","mk":1,"q":"On heating, baking soda gives","o":["Na₂CO₃, H₂O and CO₂","NaOH and CO₂","NaCl and CO₂","Na₂O and CO₂"],"a":0,"e":"2NaHCO₃ → Na₂CO₃ + H₂O + CO₂.","ch":"s2","t":4,"id":"n257"},{"ty":"mcq","mk":1,"q":"The number of water molecules of crystallisation in washing soda is","o":["10","5","2","½"],"a":0,"e":"Na₂CO₃·10H₂O.","ch":"s2","t":4,"id":"n258"},{"ty":"mcq","mk":1,"q":"Baking powder is a mixture of baking soda and","o":["tartaric acid","washing soda","common salt","bleaching powder"],"a":0,"e":"On heating or adding water, the acid reacts with baking soda to release CO₂.","ch":"s2","t":4,"id":"n259"},{"ty":"mcq","mk":1,"q":"Plaster of Paris is prepared by heating","o":["gypsum at 373 K","limestone","baking soda","washing soda"],"a":0,"e":"CaSO₄·2H₂O → CaSO₄·½H₂O + 1½H₂O.","ch":"s2","t":5,"id":"n260"},{"ty":"mcq","mk":1,"q":"The chemical formula of plaster of Paris is","o":["CaSO₄·½H₂O","CaSO₄·2H₂O","CaSO₄","CaCO₃"],"a":0,"e":"It has half a molecule of water of crystallisation.","ch":"s2","t":5,"id":"n261"},{"ty":"mcq","mk":1,"q":"In the pH paper experiment, a few drops of dilute NaOH make the pH paper turn","o":["blue/violet showing pH above 7","red","green showing pH 7","colourless"],"a":0,"e":"NaOH is a strong base with high pH.","ch":"s2","t":6,"id":"n262"},{"ty":"short","mk":3,"q":"Why does an aqueous solution of an acid conduct electricity? Why does acid show acidic behaviour only in water?","m":"Acids produce hydrogen ions (H⁺ or H₃O⁺) in aqueous solution; these ions are mobile charge carriers so the solution conducts. Acidic behaviour needs H⁺ ions, and these are released only when the acid dissolves in water.","p":["Acids give H⁺ ions in water","Ions are the charge carriers","Dry acids show no acidic behaviour"],"ch":"s2","t":2,"id":"n263"},{"ty":"short","mk":3,"q":"What happens when plaster of Paris is mixed with water? Write the equation. Give one use.","m":"It sets into a hard solid mass, gypsum. CaSO₄·½H₂O + 1½H₂O → CaSO₄·2H₂O. It is used to make toys and to set fractured bones.","p":["Sets to gypsum","Correct equation","One use"],"ch":"s2","t":4,"id":"n264"},{"ty":"short","mk":5,"q":"What is the chlor-alkali process? Write the equation and give two uses of each product.","m":"Electrolysis of aqueous sodium chloride (brine): 2NaCl + 2H₂O → 2NaOH + Cl₂ + H₂. NaOH is used in soaps/detergents and paper; Cl₂ is used to make bleaching powder and to disinfect water; H₂ is used as fuel and to make margarine.","p":["Name of process: electrolysis of brine","Balanced equation","Products NaOH, Cl₂ and H₂","Uses"],"ch":"s2","t":3,"id":"n265"},{"ty":"mcq","mk":1,"q":"The metal which is liquid at room temperature is","o":["mercury","sodium","zinc","lead"],"a":0,"e":"Mercury is the only liquid metal.","ch":"s3","t":0,"id":"n266"},{"ty":"mcq","mk":1,"q":"The most ductile metal is","o":["gold","silver","copper","aluminium"],"a":0,"e":"Gold can be drawn into very thin wires.","ch":"s3","t":0,"id":"n267"},{"ty":"mcq","mk":1,"q":"A non-metal that is lustrous is","o":["iodine","sulphur","carbon (coal)","phosphorus"],"a":0,"e":"Iodine is a lustrous non-metal; diamond and graphite are also shiny.","ch":"s3","t":0,"id":"n268"},{"ty":"mcq","mk":1,"q":"Metals form oxides which are generally","o":["basic in nature","acidic in nature","neutral","always amphoteric"],"a":0,"e":"Most metal oxides are basic. Al₂O₃ and ZnO are amphoteric.","ch":"s3","t":1,"id":"n269"},{"ty":"mcq","mk":1,"q":"Sodium and potassium are stored under kerosene because they","o":["react vigorously with air and water","are poisonous","are liquid","evaporate"],"a":0,"e":"They catch fire on exposure to air.","ch":"s3","t":1,"id":"n270"},{"ty":"mcq","mk":1,"q":"Aluminium oxide is called amphoteric because it reacts with","o":["both acids and bases","only acids","only water","only metals"],"a":0,"e":"Al₂O₃ shows both acidic and basic behaviour.","ch":"s3","t":1,"id":"n271"},{"ty":"mcq","mk":1,"q":"Iron reacts with steam to form","o":["Fe₃O₄ and hydrogen","Fe₂O₃ and hydrogen","FeO and oxygen","Fe(OH)₃"],"a":0,"e":"3Fe + 4H₂O(steam) → Fe₃O₄ + 4H₂.","ch":"s3","t":1,"id":"n272"},{"ty":"mcq","mk":1,"q":"The most reactive metal among these is","o":["potassium","iron","copper","zinc"],"a":0,"e":"Potassium is at the top of the reactivity series.","ch":"s3","t":2,"id":"n273"},{"ty":"mcq","mk":1,"q":"Which metal does NOT displace hydrogen from dilute HCl?","o":["copper","zinc","magnesium","iron"],"a":0,"e":"Copper lies below hydrogen in the reactivity series.","ch":"s3","t":2,"id":"n274"},{"ty":"mcq","mk":1,"q":"Which of the following metals will displace copper from copper sulphate solution?","o":["zinc","silver","gold","mercury"],"a":0,"e":"Zinc is more reactive than copper.","ch":"s3","t":2,"id":"n275"},{"ty":"mcq","mk":1,"q":"An ionic compound like NaCl has","o":["a high melting point","a low melting point","no ions","poor solubility in water"],"a":0,"e":"Strong electrostatic forces make the melting point high.","ch":"s3","t":3,"id":"n276"},{"ty":"mcq","mk":1,"q":"Ionic compounds conduct electricity","o":["in the molten state","in the solid state","never","only as gases"],"a":0,"e":"Ions become free to move on melting or dissolving.","ch":"s3","t":3,"id":"n277"},{"ty":"mcq","mk":1,"q":"In the formation of MgCl₂, magnesium","o":["loses two electrons","gains two electrons","shares two electrons","loses one electron"],"a":0,"e":"Mg (2,8,2) loses 2 electrons to become Mg²⁺; each Cl gains one electron.","ch":"s3","t":3,"id":"n278"},{"ty":"mcq","mk":1,"q":"Heating a sulphide ore strongly in excess of air is called","o":["roasting","calcination","smelting","refining"],"a":0,"e":"Roasting converts sulphide ores into oxides.","ch":"s3","t":4,"id":"n279"},{"ty":"mcq","mk":1,"q":"Aluminium is obtained from its oxide by","o":["electrolysis of the molten oxide","reduction with carbon","roasting","calcination"],"a":0,"e":"Aluminium is high in the reactivity series so it is extracted by electrolytic reduction.","ch":"s3","t":4,"id":"n280"},{"ty":"mcq","mk":1,"q":"In the electrolytic refining of copper, the anode is made of","o":["impure copper","pure copper","zinc","graphite"],"a":0,"e":"Impure copper dissolves from the anode; pure copper deposits on the cathode.","ch":"s3","t":4,"id":"n281"},{"ty":"mcq","mk":1,"q":"Rusting of iron needs","o":["air and moisture","only air","only water","only light"],"a":0,"e":"Both oxygen and water are necessary for rusting.","ch":"s3","t":5,"id":"n282"},{"ty":"mcq","mk":1,"q":"Zinc coating on iron to prevent rusting is called","o":["galvanisation","anodising","alloying","roasting"],"a":0,"e":"Zinc protects iron even if the coating is scratched.","ch":"s3","t":5,"id":"n283"},{"ty":"mcq","mk":1,"q":"Brass is an alloy of","o":["copper and zinc","copper and tin","iron and carbon","lead and tin"],"a":0,"e":"Brass = Cu + Zn.","ch":"s3","t":5,"id":"n284"},{"ty":"ar","mk":1,"q":"Assertion (A): Carbonate ores are converted into oxides by calcination.\nReason (R): Calcination is heating the ore in the absence or limited supply of air.","a":0,"e":"ZnCO₃ → ZnO + CO₂ on strong heating in limited air; R describes what calcination is.","ar":1,"ch":"s3","t":4,"id":"n285"},{"ty":"short","mk":3,"q":"Write the reactions of sodium with oxygen and of aluminium with oxygen. Name the nature of the oxide formed in each case.","m":"4Na + O₂ → 2Na₂O (basic oxide). 4Al + 3O₂ → 2Al₂O₃ (amphoteric oxide, reacts with both acids and bases).","p":["Equation for sodium","Equation for aluminium","Nature of oxides"],"ch":"s3","t":1,"id":"n286"},{"ty":"short","mk":3,"q":"How is zinc obtained from zinc sulphide ore? Write the equations involved.","m":"Roasting: 2ZnS + 3O₂ → 2ZnO + 2SO₂. Reduction of the oxide with carbon: ZnO + C → Zn + CO.","p":["Roast the sulphide to oxide","Correct equation","Reduce with carbon"],"ch":"s3","t":4,"id":"n287"},{"ty":"short","mk":3,"q":"Explain the formation of sodium chloride in terms of electron transfer. State two properties of ionic compounds.","m":"Na (2,8,1) loses one electron to form Na⁺ (2,8); Cl (2,8,7) gains the electron to form Cl⁻ (2,8,8); electrostatic attraction forms NaCl. Ionic compounds have high melting points and conduct electricity in molten or aqueous state.","p":["Electron transfer shown","Ions formed","Two properties"],"ch":"s3","t":3,"id":"n288"},{"ty":"mcq","mk":1,"q":"The number of covalent bonds in a molecule of ethane (C₂H₆) is","o":["7","6","8","4"],"a":0,"e":"There are six C–H bonds and one C–C bond.","ch":"s4","t":0,"id":"n289"},{"ty":"mcq","mk":1,"q":"In a molecule of nitrogen (N₂) the atoms are joined by","o":["a triple bond","a single bond","a double bond","an ionic bond"],"a":0,"e":"Each nitrogen atom needs 3 more electrons and shares 3 pairs.","ch":"s4","t":0,"id":"n290"},{"ty":"mcq","mk":1,"q":"Covalent compounds generally have","o":["low melting and boiling points","high melting points","good electrical conductivity","ionic bonds"],"a":0,"e":"Intermolecular forces are weak, so melting and boiling points are low and they are poor conductors.","ch":"s4","t":0,"id":"n291"},{"ty":"mcq","mk":1,"q":"The property of carbon to form long chains of its own atoms is called","o":["catenation","isomerism","allotropy","polymerisation"],"a":0,"e":"Catenation arises from the strong C–C bond.","ch":"s4","t":1,"id":"n292"},{"ty":"mcq","mk":1,"q":"Diamond and graphite are","o":["allotropes of carbon","isomers","isotopes","compounds of carbon"],"a":0,"e":"They are different forms of the same element carbon.","ch":"s4","t":1,"id":"n293"},{"ty":"mcq","mk":1,"q":"Carbon forms a large number of compounds because of","o":["catenation and tetravalency","metallic nature","ionic bonding","small atomic mass"],"a":0,"e":"Both properties allow bonding with many atoms.","ch":"s4","t":1,"id":"n294"},{"ty":"mcq","mk":1,"q":"The general formula of alkenes is","o":["CₙH₂ₙ","CₙH₂ₙ₊₂","CₙH₂ₙ₋₂","CₙHₙ"],"a":0,"e":"Alkenes contain a C=C bond.","ch":"s4","t":2,"id":"n295"},{"ty":"mcq","mk":1,"q":"The next homologue of C₃H₈ is","o":["C₄H₁₀","C₃H₆","C₄H₈","C₂H₆"],"a":0,"e":"Homologues differ by CH₂.","ch":"s4","t":2,"id":"n296"},{"ty":"mcq","mk":1,"q":"The number of structural isomers of butane is","o":["2","1","3","4"],"a":0,"e":"n-butane and isobutane (2-methylpropane).","ch":"s4","t":2,"id":"n297"},{"ty":"mcq","mk":1,"q":"Which of the following is an unsaturated hydrocarbon?","o":["C₃H₆","C₃H₈","CH₄","C₂H₆"],"a":0,"e":"C₃H₆ (propene) has a double bond.","ch":"s4","t":2,"id":"n298"},{"ty":"mcq","mk":1,"q":"The IUPAC name of CH₃CH₂CH₂OH is","o":["propan-1-ol","propanal","propanone","propanoic acid"],"a":0,"e":"The –OH group is on carbon 1 of a three-carbon chain.","ch":"s4","t":3,"id":"n299"},{"ty":"mcq","mk":1,"q":"The functional group –COOH is called","o":["carboxylic acid","aldehyde","ketone","alcohol"],"a":0,"e":"By definition.","ch":"s4","t":3,"id":"n300"},{"ty":"mcq","mk":1,"q":"The name of CH₃CHO is","o":["ethanal","ethanol","ethanoic acid","ethane"],"a":0,"e":"CHO is the aldehyde group; two carbons give ethanal.","ch":"s4","t":3,"id":"n301"},{"ty":"mcq","mk":1,"q":"The IUPAC name of CH₃–CO–CH₃ is","o":["propanone","propanal","propanol","propene"],"a":0,"e":"The C=O group within the chain is a ketone.","ch":"s4","t":3,"id":"n302"},{"ty":"mcq","mk":1,"q":"Unsaturated hydrocarbons burn with","o":["a yellow sooty flame","a clean blue flame","no flame","a green flame"],"a":0,"e":"Incomplete combustion of unsaturated compounds produces soot.","ch":"s4","t":4,"id":"n303"},{"ty":"mcq","mk":1,"q":"Vegetable oils are hydrogenated using","o":["nickel as a catalyst","iron as a catalyst","platinum with acid","zinc"],"a":0,"e":"Unsaturated oils are converted to saturated fats (ghee).","ch":"s4","t":4,"id":"n304"},{"ty":"mcq","mk":1,"q":"Methane reacts with chlorine in sunlight to give","o":["CH₃Cl and HCl","CCl₄ and H₂","C and HCl","CH₂ = CH₂"],"a":0,"e":"CH₄ + Cl₂ → CH₃Cl + HCl is a substitution reaction.","ch":"s4","t":4,"id":"n305"},{"ty":"mcq","mk":1,"q":"Oxidation of ethanol with alkaline potassium permanganate gives","o":["ethanoic acid","ethene","ethanal only","methane"],"a":0,"e":"KMnO₄ is an oxidising agent that converts ethanol to ethanoic acid.","ch":"s4","t":4,"id":"n306"},{"ty":"mcq","mk":1,"q":"Ethanol reacts with sodium to liberate","o":["hydrogen gas","oxygen gas","carbon dioxide","chlorine"],"a":0,"e":"2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂.","ch":"s4","t":5,"id":"n307"},{"ty":"mcq","mk":1,"q":"The reaction between ethanol and ethanoic acid in the presence of conc. H₂SO₄ gives a sweet-smelling","o":["ester","alcohol","aldehyde","ketone"],"a":0,"e":"CH₃COOH + C₂H₅OH → CH₃COOC₂H₅ + H₂O (esterification).","ch":"s4","t":5,"id":"n308"},{"ty":"mcq","mk":1,"q":"Ethanoic acid reacts with sodium hydrogencarbonate to produce","o":["carbon dioxide","hydrogen","oxygen","chlorine"],"a":0,"e":"It gives brisk effervescence of CO₂.","ch":"s4","t":5,"id":"n309"},{"ty":"mcq","mk":1,"q":"On heating ethanol with excess conc. H₂SO₄ at 443 K, the product is","o":["ethene","ethane","ethanal","ethyl ethanoate"],"a":0,"e":"The acid acts as a dehydrating agent.","ch":"s4","t":5,"id":"n310"},{"ty":"mcq","mk":1,"q":"Soap molecules have","o":["a hydrophilic head and hydrophobic tail","two hydrophilic ends","only hydrophobic ends","no ionic part"],"a":0,"e":"The ionic head is water-loving and the carbon chain is water-hating.","ch":"s4","t":6,"id":"n311"},{"ty":"mcq","mk":1,"q":"Soaps do not lather well with hard water because of","o":["calcium and magnesium salts forming scum","sodium","chlorine","iron"],"a":0,"e":"Ca²⁺ and Mg²⁺ form insoluble scum with soap.","ch":"s4","t":6,"id":"n312"},{"ty":"ar","mk":1,"q":"Assertion (A): Detergents are more effective than soaps in hard water.\nReason (R): Detergents are ammonium or sulphonate salts that do not form insoluble precipitates with calcium and magnesium ions.","a":0,"e":"No scum is formed with detergents, so they work in hard water; R is the explanation.","ar":1,"ch":"s4","t":6,"id":"n313"},{"ty":"short","mk":3,"q":"Draw the electron-dot structure of methane and explain why it is a poor conductor of electricity.","m":"Carbon (4 valence electrons) shares one electron pair with each of 4 hydrogen atoms (8 electrons around C, 2 around each H). Methane has no free ions or electrons because its bonds are covalent, so it does not conduct.","p":["Correct dot structure","Shared pairs shown","Reason: no ions"],"ch":"s4","t":0,"id":"n314"},{"ty":"short","mk":3,"q":"Write the IUPAC names and structural formulae of the following: (a) CH₃CH₂CH₂Cl (b) CH₃CH₂COOH.","m":"(a) 1-chloropropane, CH₃–CH₂–CH₂–Cl. (b) Propanoic acid, CH₃–CH₂–COOH.","p":["Correct name (a)","Correct name (b)","Structures"],"ch":"s4","t":3,"id":"n315"},{"ty":"short","mk":3,"q":"Write the chemical equation for esterification. State one use of esters.","m":"CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O (in presence of conc. H₂SO₄). Esters are used as perfumes and flavouring agents.","p":["Reactants and catalyst","Product ester + water","One use"],"ch":"s4","t":5,"id":"n316"},{"ty":"short","mk":5,"q":"What is a micelle? Explain how soap removes grease from a dirty cloth.","m":"A micelle is a spherical cluster of soap molecules in water in which hydrophobic tails point inwards and ionic heads point outwards. Greasy dirt is trapped by the tails in the centre while the heads interact with water. The micelle remains suspended as an emulsion and the dirt is rinsed away.","p":["Definition of micelle","Tail inwards, head outwards","Grease in the centre","Rinsed away"],"ch":"s4","t":6,"id":"n317"},{"ty":"mcq","mk":1,"q":"The equation 6CO₂ + 12H₂O → C₆H₁₂O₆ + 6O₂ + 6H₂O represents","o":["photosynthesis","respiration","digestion","fermentation"],"a":0,"e":"Plants make glucose using sunlight and chlorophyll.","ch":"s5","t":0,"id":"n318"},{"ty":"mcq","mk":1,"q":"Raw materials needed for photosynthesis are","o":["carbon dioxide and water","oxygen and water","glucose and oxygen","nitrogen and water"],"a":0,"e":"CO₂ from air through stomata and water from roots.","ch":"s5","t":0,"id":"n319"},{"ty":"mcq","mk":1,"q":"Stomata open and close due to the","o":["guard cells","root hairs","xylem","cuticle"],"a":0,"e":"Guard cells change shape with water movement.","ch":"s5","t":0,"id":"n320"},{"ty":"mcq","mk":1,"q":"The test used to show that starch is produced in photosynthesis is the","o":["iodine test","Benedict's test","litmus test","lime water test"],"a":0,"e":"Starch gives a blue-black colour with iodine solution.","ch":"s5","t":0,"id":"n321"},{"ty":"mcq","mk":1,"q":"Amoeba takes in food by","o":["pseudopodia","mouth","villi","tentacles"],"a":0,"e":"It engulfs food with finger-like pseudopodia.","ch":"s5","t":1,"id":"n322"},{"ty":"mcq","mk":1,"q":"The enzyme in saliva that digests starch is","o":["salivary amylase","pepsin","trypsin","lipase"],"a":0,"e":"Starch is broken into maltose.","ch":"s5","t":1,"id":"n323"},{"ty":"mcq","mk":1,"q":"The role of hydrochloric acid in the stomach is to","o":["activate pepsin and kill bacteria","digest fats","absorb water","produce bile"],"a":0,"e":"It creates an acidic medium for pepsin.","ch":"s5","t":1,"id":"n324"},{"ty":"mcq","mk":1,"q":"Bile juice is secreted by the","o":["liver","pancreas","stomach","gall bladder wall"],"a":0,"e":"It is made in the liver and stored in the gall bladder; it emulsifies fats.","ch":"s5","t":1,"id":"n325"},{"ty":"mcq","mk":1,"q":"The inner lining of the small intestine has finger-like projections called","o":["villi","alveoli","nephrons","cilia"],"a":0,"e":"Villi increase surface area for absorption.","ch":"s5","t":1,"id":"n326"},{"ty":"mcq","mk":1,"q":"The end products of anaerobic respiration in yeast are","o":["ethanol and carbon dioxide","lactic acid","water and CO₂","glucose"],"a":0,"e":"Fermentation by yeast.","ch":"s5","t":2,"id":"n327"},{"ty":"mcq","mk":1,"q":"Cramps in muscles after vigorous exercise are due to","o":["lactic acid","ethanol","carbon dioxide","glucose"],"a":0,"e":"Pyruvate is converted to lactic acid when oxygen is short.","ch":"s5","t":2,"id":"n328"},{"ty":"mcq","mk":1,"q":"The respiratory pigment in humans is","o":["haemoglobin","chlorophyll","melanin","keratin"],"a":0,"e":"Haemoglobin carries oxygen.","ch":"s5","t":2,"id":"n329"},{"ty":"mcq","mk":1,"q":"Aerobic respiration takes place in the","o":["mitochondria","nucleus","ribosomes","Golgi body"],"a":0,"e":"Most energy release occurs in mitochondria.","ch":"s5","t":2,"id":"n330"},{"ty":"mcq","mk":1,"q":"The vessel that brings oxygenated blood from lungs to the heart is","o":["pulmonary vein","pulmonary artery","vena cava","aorta"],"a":0,"e":"The pulmonary vein carries oxygen-rich blood to the left atrium.","ch":"s5","t":3,"id":"n331"},{"ty":"mcq","mk":1,"q":"Blood flows from the left ventricle to the body through the","o":["aorta","vena cava","pulmonary vein","pulmonary artery"],"a":0,"e":"Aorta carries oxygenated blood.","ch":"s5","t":3,"id":"n332"},{"ty":"mcq","mk":1,"q":"In human heart, the chamber with the thickest wall is the","o":["left ventricle","right atrium","left atrium","right ventricle"],"a":0,"e":"It pumps blood to the whole body.","ch":"s5","t":3,"id":"n333"},{"ty":"mcq","mk":1,"q":"Platelets in blood help in","o":["clotting","carrying oxygen","fighting germs","transporting hormones"],"a":0,"e":"Platelets cause blood to clot at wounds.","ch":"s5","t":3,"id":"n334"},{"ty":"mcq","mk":1,"q":"Water is transported in plants by","o":["xylem","phloem","cambium","stomata"],"a":0,"e":"Xylem conducts water and minerals.","ch":"s5","t":4,"id":"n335"},{"ty":"mcq","mk":1,"q":"Translocation of food in plants takes place through","o":["phloem","xylem","cortex","epidermis"],"a":0,"e":"It uses energy in the form of ATP.","ch":"s5","t":4,"id":"n336"},{"ty":"mcq","mk":1,"q":"The loss of water vapour from leaves is called","o":["transpiration","translocation","respiration","excretion"],"a":0,"e":"It creates a suction pull for water.","ch":"s5","t":4,"id":"n337"},{"ty":"mcq","mk":1,"q":"The functional unit of the kidney is the","o":["nephron","neuron","alveolus","villus"],"a":0,"e":"Each kidney has about a million nephrons.","ch":"s5","t":5,"id":"n338"},{"ty":"mcq","mk":1,"q":"The urine flows from the kidney to the bladder through","o":["ureter","urethra","nephron","artery"],"a":0,"e":"Urethra carries urine out of the body.","ch":"s5","t":5,"id":"n339"},{"ty":"ar","mk":1,"q":"Assertion (A): Arteries have thick, elastic walls.\nReason (R): They carry blood at high pressure from the heart.","a":0,"e":"Thick walls withstand high pressure, so R explains A.","ar":1,"ch":"s5","t":3,"id":"n340"},{"ty":"short","mk":3,"q":"Name the three types of enzymes in the digestion of a meal in the small intestine, and name what each acts on.","m":"Amylase (pancreatic) digests starch; trypsin digests proteins into peptides/amino acids; lipase digests emulsified fats into fatty acids and glycerol.","p":["Amylase on starch","Trypsin on protein","Lipase on fats"],"ch":"s5","t":1,"id":"n341"},{"ty":"short","mk":3,"q":"Differentiate between aerobic and anaerobic respiration with respect to oxygen, site and products.","m":"Aerobic respiration needs oxygen, takes place in mitochondria after glycolysis in cytoplasm and gives CO₂, H₂O and much energy. Anaerobic respiration takes place without oxygen in cytoplasm and gives ethanol + CO₂ (yeast) or lactic acid (muscle) with less energy.","p":["Oxygen requirement","Site","Products and energy"],"ch":"s5","t":2,"id":"n342"},{"ty":"short","mk":5,"q":"Describe the double circulation of blood in humans. Why is it necessary?","m":"Deoxygenated blood from the body enters the right atrium, then right ventricle, and goes to the lungs via the pulmonary artery. Oxygenated blood returns by the pulmonary vein to the left atrium, then left ventricle, and is pumped to the body through the aorta. Blood passes through the heart twice in one cycle. This keeps oxygenated and deoxygenated blood separate and maintains a high supply of oxygen for the high energy needs of warm-blooded animals.","p":["Right side to lungs","Left side to body","Two passes through the heart","Reason for separation"],"ch":"s5","t":3,"id":"n343"},{"ty":"mcq","mk":1,"q":"The part of a neuron that carries impulses away from the cell body is the","o":["axon","dendrite","nucleus","synapse"],"a":0,"e":"The axon conducts impulses to the next neuron.","ch":"s6","t":0,"id":"n344"},{"ty":"mcq","mk":1,"q":"The correct pathway of a reflex arc is","o":["receptor → sensory neuron → spinal cord → motor neuron → effector","receptor → motor neuron → brain → effector","effector → receptor → brain","brain → spinal cord → muscle"],"a":0,"e":"Reflex actions do not involve conscious thought.","ch":"s6","t":0,"id":"n345"},{"ty":"mcq","mk":1,"q":"The junction between two neurons is called","o":["synapse","axon","node","ganglion"],"a":0,"e":"The impulse crosses it chemically.","ch":"s6","t":0,"id":"n346"},{"ty":"mcq","mk":1,"q":"The part of the brain that controls posture and balance is","o":["cerebellum","cerebrum","medulla","pituitary"],"a":0,"e":"Cerebellum coordinates voluntary movements.","ch":"s6","t":1,"id":"n347"},{"ty":"mcq","mk":1,"q":"The involuntary actions like vomiting and blood pressure are controlled by","o":["medulla oblongata","cerebrum","cerebellum","hypothalamus"],"a":0,"e":"Medulla is in the hind-brain.","ch":"s6","t":1,"id":"n348"},{"ty":"mcq","mk":1,"q":"The brain is protected by","o":["the skull and cerebrospinal fluid","only the skull","only the skin","the spine"],"a":0,"e":"Meninges and CSF also act as shock absorbers.","ch":"s6","t":1,"id":"n349"},{"ty":"mcq","mk":1,"q":"The plant hormone that promotes cell elongation is","o":["auxin","abscisic acid","cytokinin","ethylene"],"a":0,"e":"Auxin is made at the shoot tip.","ch":"s6","t":2,"id":"n350"},{"ty":"mcq","mk":1,"q":"The plant hormone responsible for wilting of leaves is","o":["abscisic acid","auxin","gibberellin","cytokinin"],"a":0,"e":"ABA inhibits growth.","ch":"s6","t":2,"id":"n351"},{"ty":"mcq","mk":1,"q":"Movement of a shoot towards light is","o":["phototropism","geotropism","hydrotropism","chemotropism"],"a":0,"e":"Auxin accumulates on the shady side.","ch":"s6","t":2,"id":"n352"},{"ty":"mcq","mk":1,"q":"Cell division in plants is promoted by","o":["cytokinins","auxin","abscisic acid","ethylene"],"a":0,"e":"They are present in fruits and seeds.","ch":"s6","t":2,"id":"n353"},{"ty":"mcq","mk":1,"q":"The hormone that regulates blood sugar is","o":["insulin","thyroxine","adrenaline","growth hormone"],"a":0,"e":"Insulin is produced by the pancreas.","ch":"s6","t":3,"id":"n354"},{"ty":"mcq","mk":1,"q":"Iodised salt is recommended to prevent","o":["goitre","diabetes","dwarfism","night blindness"],"a":0,"e":"Iodine is needed for thyroxine.","ch":"s6","t":3,"id":"n355"},{"ty":"mcq","mk":1,"q":"The hormone secreted in emergency situations ('fight or flight') is","o":["adrenaline","insulin","oestrogen","thyroxine"],"a":0,"e":"It is released from adrenal glands.","ch":"s6","t":3,"id":"n356"},{"ty":"mcq","mk":1,"q":"Deficiency of growth hormone in childhood causes","o":["dwarfism","goitre","diabetes","cretinism only"],"a":0,"e":"Growth hormone is secreted by the pituitary.","ch":"s6","t":3,"id":"n357"},{"ty":"case","mk":1,"cs":"When Anu touched a hot vessel by mistake, she pulled her hand away immediately before feeling the pain.","q":"The quick action is an example of","o":["reflex action","voluntary action","hormonal action","growth movement"],"a":0,"e":"The impulse is processed in the spinal cord.","ch":"s6","t":0,"id":"n358"},{"ty":"short","mk":3,"q":"What is a reflex action? Trace the path of the reflex arc when a person touches a hot object.","m":"A reflex action is a sudden, involuntary response to a stimulus. Path: receptors in the skin → sensory neuron → spinal cord (relay neuron) → motor neuron → effector muscle (hand pulls away).","p":["Definition","Sequence of the arc","Spinal cord is the processing centre"],"ch":"s6","t":0,"id":"n359"},{"ty":"short","mk":3,"q":"Name the endocrine gland that secretes thyroxine. Why is iodine required? What happens if it is deficient?","m":"The thyroid gland secretes thyroxine. Iodine is needed to make thyroxine, which regulates carbohydrate, fat and protein metabolism. Deficiency causes goitre (swollen neck).","p":["Thyroid gland","Iodine needed for thyroxine","Goitre"],"ch":"s6","t":3,"id":"n360"},{"ty":"mcq","mk":1,"q":"Binary fission occurs in","o":["Amoeba","Hydra","Rhizopus","Yeast"],"a":0,"e":"Amoeba splits into two daughter cells.","ch":"s7","t":0,"id":"n361"},{"ty":"mcq","mk":1,"q":"Multiple fission is seen in","o":["Plasmodium","Amoeba","Hydra","Planaria"],"a":0,"e":"Plasmodium divides into many daughter cells.","ch":"s7","t":0,"id":"n362"},{"ty":"mcq","mk":1,"q":"Budding is a method of asexual reproduction in","o":["Hydra","Leishmania","Spirogyra","Rhizopus"],"a":0,"e":"A bud develops as an outgrowth on the parent.","ch":"s7","t":0,"id":"n363"},{"ty":"mcq","mk":1,"q":"Spirogyra reproduces by","o":["fragmentation","binary fission","budding","spores only"],"a":0,"e":"Filaments break into pieces which grow into new filaments.","ch":"s7","t":0,"id":"n364"},{"ty":"mcq","mk":1,"q":"The leaf of which plant develops buds along its margin for vegetative propagation?","o":["Bryophyllum","Rose","Mango","Banana"],"a":0,"e":"Bryophyllum leaf buds grow into new plants.","ch":"s7","t":0,"id":"n365"},{"ty":"mcq","mk":1,"q":"The male reproductive organ of a flower is the","o":["stamen","pistil","ovary","sepal"],"a":0,"e":"The anther of a stamen contains pollen.","ch":"s7","t":1,"id":"n366"},{"ty":"mcq","mk":1,"q":"The transfer of pollen from anther to stigma is called","o":["pollination","fertilisation","germination","transpiration"],"a":0,"e":"It may be self or cross-pollination.","ch":"s7","t":1,"id":"n367"},{"ty":"mcq","mk":1,"q":"After fertilisation the ovary develops into the","o":["fruit","seed","embryo","flower"],"a":0,"e":"The ovule becomes the seed.","ch":"s7","t":1,"id":"n368"},{"ty":"mcq","mk":1,"q":"A flower which has either stamens or pistil is","o":["unisexual","bisexual","incomplete","sterile"],"a":0,"e":"Papaya and watermelon are unisexual.","ch":"s7","t":1,"id":"n369"},{"ty":"mcq","mk":1,"q":"Testes are located outside the abdominal cavity because","o":["sperm formation needs a lower temperature","they are large","they secrete hormones","space is less"],"a":0,"e":"The scrotum keeps testes at about 2–3°C below body temperature.","ch":"s7","t":2,"id":"n370"},{"ty":"mcq","mk":1,"q":"Fertilisation in humans occurs in the","o":["fallopian tube (oviduct)","uterus","vagina","ovary"],"a":0,"e":"The zygote then moves to the uterus.","ch":"s7","t":2,"id":"n371"},{"ty":"mcq","mk":1,"q":"The structure that provides nutrition to the embryo in the uterus is the","o":["placenta","ovary","oviduct","cervix"],"a":0,"e":"It exchanges nutrients and wastes between mother and embryo.","ch":"s7","t":2,"id":"n372"},{"ty":"mcq","mk":1,"q":"If the egg is not fertilised, the lining of the uterus","o":["breaks down and is shed as menstruation","thickens","forms a placenta","forms a zygote"],"a":0,"e":"This takes place roughly every 28 days.","ch":"s7","t":2,"id":"n373"},{"ty":"mcq","mk":1,"q":"Which of the following is a barrier method of contraception?","o":["condom","oral pill","copper-T","vasectomy"],"a":0,"e":"A condom also protects against STIs.","ch":"s7","t":3,"id":"n374"},{"ty":"mcq","mk":1,"q":"Copper-T is placed in the","o":["uterus","oviduct","vas deferens","ovary"],"a":0,"e":"It is an intrauterine device that prevents implantation.","ch":"s7","t":3,"id":"n375"},{"ty":"mcq","mk":1,"q":"AIDS is caused by","o":["HIV","bacterium","fungus","protozoan"],"a":0,"e":"HIV attacks the immune system.","ch":"s7","t":3,"id":"n376"},{"ty":"mcq","mk":1,"q":"A sexually transmitted disease caused by a bacterium is","o":["syphilis","AIDS","warts","none"],"a":0,"e":"Syphilis and gonorrhoea are bacterial; AIDS and warts are viral.","ch":"s7","t":3,"id":"n377"},{"ty":"mcq","mk":1,"q":"The average gestation period in humans is about","o":["9 months","6 months","12 months","3 months"],"a":0,"e":"The development of the embryo takes about nine months.","ch":"s7","t":4,"id":"n378"},{"ty":"ar","mk":1,"q":"Assertion (A): Sex determination of the unborn child should not be done by tests during pregnancy.\nReason (R): Such tests may lead to female foeticide, affecting the sex ratio.","a":0,"e":"Prenatal sex determination is illegal for this reason; R explains A.","ar":1,"ch":"s7","t":4,"id":"n379"},{"ty":"short","mk":3,"q":"How does binary fission differ from multiple fission? Give one example of each.","m":"In binary fission a cell divides into two equal daughter cells (Amoeba). In multiple fission the nucleus divides many times and the cell breaks up into many daughter cells (Plasmodium).","p":["Binary fission described","Multiple fission described","Examples"],"ch":"s7","t":0,"id":"n380"},{"ty":"short","mk":3,"q":"Draw/describe the process of fertilisation in a flower from pollination to the formation of zygote.","m":"Pollen lands on the stigma (pollination). A pollen tube grows through the style to the ovary and carries the male gametes to the ovule. One male gamete fuses with the egg cell to form the zygote, which develops into the embryo.","p":["Pollination on stigma","Pollen tube growth","Fusion of gametes"],"ch":"s7","t":1,"id":"n381"},{"ty":"short","mk":5,"q":"Describe the human male reproductive system. State the function of the prostate, seminal vesicle and testes.","m":"Testes produce sperms and testosterone. Sperms pass through the vas deferens, joined by secretions of the seminal vesicle and prostate gland which provide fluid, nutrition and ease of movement, and are expelled via the urethra through the penis.","p":["Testes make sperm and hormone","Vas deferens path","Seminal vesicle and prostate secretions","Urethra"],"ch":"s7","t":2,"id":"n382"},{"ty":"mcq","mk":1,"q":"Variations in sexually reproducing organisms are caused by","o":["errors in DNA copying and recombination","only environment","nothing","temperature only"],"a":0,"e":"Both DNA copying inaccuracies and sexual reproduction give variation.","ch":"s8","t":0,"id":"n383"},{"ty":"mcq","mk":1,"q":"A trait which is expressed in a heterozygous condition is called","o":["dominant","recessive","autosomal","hybrid"],"a":0,"e":"The dominant allele shows its effect even in one copy.","ch":"s8","t":0,"id":"n384"},{"ty":"mcq","mk":1,"q":"Traits acquired during the lifetime of an individual","o":["are not inherited","are always inherited","are inherited sometimes by the DNA","are genes"],"a":0,"e":"Changes in non-reproductive tissues do not alter DNA in germ cells.","ch":"s8","t":0,"id":"n385"},{"ty":"mcq","mk":1,"q":"In Mendel's monohybrid cross of tall and dwarf pea plants, all F₁ plants were","o":["tall","dwarf","medium","half tall half dwarf"],"a":0,"e":"Tallness is dominant.","ch":"s8","t":1,"id":"n386"},{"ty":"mcq","mk":1,"q":"The phenotypic ratio in F₂ of a monohybrid cross is","o":["3 : 1","1 : 2 : 1","9 : 3 : 3 : 1","1 : 1"],"a":0,"e":"Three tall to one dwarf.","ch":"s8","t":1,"id":"n387"},{"ty":"mcq","mk":1,"q":"The genotypic ratio in the F₂ of a monohybrid cross is","o":["1 : 2 : 1","3 : 1","9 : 3 : 3 : 1","1 : 1"],"a":0,"e":"TT : Tt : tt = 1 : 2 : 1.","ch":"s8","t":1,"id":"n388"},{"ty":"mcq","mk":1,"q":"The dihybrid ratio in F₂ is","o":["9 : 3 : 3 : 1","3 : 1","1 : 2 : 1","1 : 1 : 1 : 1"],"a":0,"e":"Round yellow : round green : wrinkled yellow : wrinkled green.","ch":"s8","t":2,"id":"n389"},{"ty":"mcq","mk":1,"q":"When round yellow seeds (RRYY) are crossed with wrinkled green (rryy), all F₁ seeds are","o":["round yellow","wrinkled green","round green","wrinkled yellow"],"a":0,"e":"Round and yellow are dominant.","ch":"s8","t":2,"id":"n390"},{"ty":"mcq","mk":1,"q":"In the F₂ of Mendel's dihybrid cross, the new combinations of traits are","o":["round green and wrinkled yellow","round yellow and wrinkled green","only round yellow","only wrinkled green"],"a":0,"e":"These did not appear in the parents; they show independent inheritance of traits.","ch":"s8","t":2,"id":"n391"},{"ty":"mcq","mk":1,"q":"The sex of a child is determined by the","o":["father's chromosome","mother's chromosome","both equally","neither"],"a":0,"e":"Sperms carry X or Y; eggs always carry X.","ch":"s8","t":3,"id":"n392"},{"ty":"mcq","mk":1,"q":"The probability that a child born will be a boy is","o":["50%","25%","75%","100%"],"a":0,"e":"Half the sperms carry Y.","ch":"s8","t":3,"id":"n393"},{"ty":"mcq","mk":1,"q":"Human beings have a total of how many pairs of chromosomes?","o":["23","22","46","21"],"a":0,"e":"22 pairs of autosomes and one pair of sex chromosomes.","ch":"s8","t":3,"id":"n394"},{"ty":"mcq","mk":1,"q":"In humans, females have the sex chromosomes","o":["XX","XY","YY","XO"],"a":0,"e":"Males have XY.","ch":"s8","t":3,"id":"n395"},{"ty":"ar","mk":1,"q":"Assertion (A): A cross between a tall plant (Tt) and a dwarf plant (tt) gives tall and dwarf plants in the ratio 1 : 1.\nReason (R): Tt produces two types of gametes (T and t) and tt produces one type (t).","a":0,"e":"Offspring are Tt : tt = 1 : 1; R explains.","ar":1,"ch":"s8","t":1,"id":"n396"},{"ty":"short","mk":3,"q":"A pea plant with round seeds (RR) is crossed with a plant with wrinkled seeds (rr). Show the F₁ and F₂ generations with ratios.","m":"F₁: all Rr (round). On selfing Rr × Rr, F₂ = RR : Rr : rr = 1 : 2 : 1 genotypic ratio and 3 round : 1 wrinkled phenotypic ratio.","p":["F₁ all Rr round","Punnett square for F₂","Both ratios"],"ch":"s8","t":1,"id":"n397"},{"ty":"short","mk":3,"q":"Explain how sex is determined in humans. Who decides the sex of the child?","m":"Humans have 22 pairs of autosomes and 1 pair of sex chromosomes: XX in females and XY in males. Female gametes carry X. Male gametes carry X or Y. If an X sperm fertilises the egg the child is a girl (XX); if a Y sperm fertilises it the child is a boy (XY). So the father's sperm decides the sex.","p":["Chromosomes of male and female","Gametes","Father decides"],"ch":"s8","t":3,"id":"n398"},{"ty":"mcq","mk":1,"q":"The focal length of a spherical mirror of radius of curvature 30 cm is","o":["15 cm","30 cm","60 cm","10 cm"],"a":0,"e":"f = R/2 = 15 cm.","ch":"s9","t":0,"id":"n399"},{"ty":"mcq","mk":1,"q":"A mirror used in the headlights of a car is","o":["concave","convex","plane","cylindrical"],"a":0,"e":"A concave mirror makes a parallel beam from a bulb at its focus.","ch":"s9","t":0,"id":"n400"},{"ty":"mcq","mk":1,"q":"A mirror that always forms a virtual, erect and diminished image is","o":["convex","concave","plane","none"],"a":0,"e":"Convex mirrors give a wide field of view, hence they are used as rear-view mirrors.","ch":"s9","t":0,"id":"n401"},{"ty":"mcq","mk":1,"q":"When an object is placed at infinity in front of a concave mirror, the image is formed at","o":["the focus, real and highly diminished","the centre of curvature","behind the mirror","infinity"],"a":0,"e":"Parallel rays converge at the principal focus.","ch":"s9","t":1,"id":"n402"},{"ty":"mcq","mk":1,"q":"An object is placed between the pole and the focus of a concave mirror. The image is","o":["virtual, erect and enlarged","real, inverted and enlarged","real and diminished","virtual and diminished"],"a":0,"e":"This is how a shaving mirror works.","ch":"s9","t":1,"id":"n403"},{"ty":"mcq","mk":1,"q":"An object is at the centre of curvature of a concave mirror. The image is formed","o":["at the centre of curvature, real, inverted, same size","at focus","beyond C","behind the mirror"],"a":0,"e":"At C the image is the same size as the object.","ch":"s9","t":1,"id":"n404"},{"ty":"mcq","mk":1,"q":"An object is 10 cm in front of a concave mirror of focal length 15 cm. The image is","o":["30 cm behind the mirror","30 cm in front of the mirror","6 cm in front","6 cm behind"],"a":0,"e":"u = −10, f = −15: 1/v = 1/f − 1/u = −1/15 + 1/10 = 1/30, so v = +30 cm (virtual, behind the mirror).","ch":"s9","t":2,"id":"n405"},{"ty":"mcq","mk":1,"q":"The magnification produced by a mirror is m = −v/u. For a real, inverted image m is","o":["negative","positive","zero","always 1"],"a":0,"e":"Real images are inverted and have negative magnification.","ch":"s9","t":2,"id":"n406"},{"ty":"mcq","mk":1,"q":"A concave mirror of focal length 20 cm forms an image of an object placed 30 cm away. The image distance is","o":["60 cm in front of the mirror","60 cm behind","12 cm in front","12 cm behind"],"a":0,"e":"1/v = −1/20 + 1/30 = −1/60, so v = −60 cm.","ch":"s9","t":2,"id":"n407"},{"ty":"mcq","mk":1,"q":"The refractive index of glass is 1.5. The speed of light in glass is (c = 3 × 10⁸ m/s)","o":["2 × 10⁸ m/s","4.5 × 10⁸ m/s","1.5 × 10⁸ m/s","3 × 10⁸ m/s"],"a":0,"e":"v = c/n = 2 × 10⁸ m/s.","ch":"s9","t":3,"id":"n408"},{"ty":"mcq","mk":1,"q":"When a ray of light goes from air into glass, it bends","o":["towards the normal","away from the normal","does not bend","along the surface"],"a":0,"e":"Glass is optically denser than air.","ch":"s9","t":3,"id":"n409"},{"ty":"mcq","mk":1,"q":"Snell's law states that for two given media","o":["sin i / sin r is constant","i / r is constant","sin i × sin r is constant","i + r is constant"],"a":0,"e":"The constant is the refractive index.","ch":"s9","t":3,"id":"n410"},{"ty":"mcq","mk":1,"q":"A ray of light passing through the optical centre of a lens","o":["goes undeviated","bends to the focus","becomes parallel to the axis","reflects"],"a":0,"e":"It passes straight through.","ch":"s9","t":4,"id":"n411"},{"ty":"mcq","mk":1,"q":"A concave lens always forms an image which is","o":["virtual, erect and diminished","real and inverted","enlarged","real and erect"],"a":0,"e":"This is true for any position of the object.","ch":"s9","t":4,"id":"n412"},{"ty":"mcq","mk":1,"q":"An object is placed at 2F of a convex lens. The image is formed at","o":["2F on the other side, real and inverted, same size","F","between F and 2F","infinity"],"a":0,"e":"At 2F the image is the same size.","ch":"s9","t":4,"id":"n413"},{"ty":"mcq","mk":1,"q":"A convex lens has a focal length of 50 cm. Its power is","o":["+2 D","−2 D","+0.5 D","+50 D"],"a":0,"e":"P = 1/f(in m) = 1/0.5 = +2 D.","ch":"s9","t":5,"id":"n414"},{"ty":"mcq","mk":1,"q":"The power of a concave lens of focal length 25 cm is","o":["−4 D","+4 D","−0.25 D","+0.25 D"],"a":0,"e":"P = 1/(−0.25) = −4 D.","ch":"s9","t":5,"id":"n415"},{"ty":"mcq","mk":1,"q":"An object 4 cm tall is 30 cm from a convex lens of focal length 10 cm. The image distance is","o":["15 cm","30 cm","7.5 cm","10 cm"],"a":0,"e":"1/v = 1/10 − 1/30 = 1/15, so v = 15 cm.","ch":"s9","t":5,"id":"n416"},{"ty":"ar","mk":1,"q":"Assertion (A): The image formed by a plane mirror is virtual and laterally inverted.\nReason (R): A plane mirror forms an image behind it at the same distance as the object.","a":1,"e":"Both statements are true, but the distance property does not explain lateral inversion.","ar":1,"ch":"s9","t":1,"id":"n417"},{"ty":"case","mk":1,"cs":"A doctor prescribes a lens of power +2.5 D to a patient.","q":"The focal length of the lens is","o":["40 cm","2.5 cm","25 cm","0.4 cm"],"a":0,"e":"f = 1/P = 1/2.5 = 0.4 m = 40 cm (convex).","ch":"s9","t":5,"id":"n418"},{"ty":"short","mk":3,"q":"An object 5 cm in height is placed 30 cm in front of a concave mirror of focal length 20 cm. Find the position and size of the image.","m":"u = −30, f = −20. 1/v = 1/f − 1/u = −1/20 + 1/30 = −1/60 so v = −60 cm. m = −v/u = −(−60)/(−30) = −2, so the image is real, inverted and 10 cm tall, 60 cm in front of the mirror.","p":["Mirror formula applied","v = −60 cm","m = −2 and image size 10 cm"],"ch":"s9","t":2,"id":"n419"},{"ty":"short","mk":5,"q":"State the laws of refraction. Draw a ray diagram for an object between F and 2F of a convex lens and state the nature of the image.","m":"1) The incident ray, refracted ray and normal lie in the same plane. 2) sin i/sin r = constant (Snell's law). For an object between F and 2F of a convex lens, the image forms beyond 2F, is real, inverted and enlarged.","p":["Law 1","Law 2","Correct ray diagram","Nature of the image"],"ch":"s9","t":4,"id":"n420"},{"ty":"short","mk":3,"q":"A ray of light enters a glass slab of refractive index 1.5. Define refractive index and find the speed of light in glass.","m":"Refractive index = speed of light in vacuum / speed of light in the medium. v = 3 × 10⁸/1.5 = 2 × 10⁸ m/s.","p":["Definition","Formula","Speed 2 × 10⁸ m/s"],"ch":"s9","t":3,"id":"n421"},{"ty":"mcq","mk":1,"q":"The change in the focal length of the eye lens to see objects at different distances is called","o":["accommodation","dispersion","refraction","scattering"],"a":0,"e":"It is done by ciliary muscles.","ch":"s10","t":0,"id":"n422"},{"ty":"mcq","mk":1,"q":"The least distance of distinct vision for a normal human eye is about","o":["25 cm","10 cm","1 m","infinity"],"a":0,"e":"It is the near point.","ch":"s10","t":0,"id":"n423"},{"ty":"mcq","mk":1,"q":"The structure that controls the amount of light entering the eye is the","o":["iris","retina","cornea","lens"],"a":0,"e":"The iris adjusts the size of the pupil.","ch":"s10","t":0,"id":"n424"},{"ty":"mcq","mk":1,"q":"Most of the refraction of light entering the eye takes place at the","o":["outer surface of the cornea","retina","iris","eye lens"],"a":0,"e":"The cornea provides most of the bending.","ch":"s10","t":0,"id":"n425"},{"ty":"mcq","mk":1,"q":"A person with myopia can see","o":["near objects clearly but not distant ones","far objects clearly but not near ones","nothing clearly","only colours"],"a":0,"e":"The image forms in front of the retina.","ch":"s10","t":1,"id":"n426"},{"ty":"mcq","mk":1,"q":"Myopia is corrected using a","o":["concave lens","convex lens","bifocal lens only","cylindrical lens"],"a":0,"e":"It diverges rays so the image falls on the retina.","ch":"s10","t":1,"id":"n427"},{"ty":"mcq","mk":1,"q":"The far point of a myopic eye is 80 cm. The power of the lens needed to see distant objects is","o":["−1.25 D","+1.25 D","−0.8 D","+0.8 D"],"a":0,"e":"f = −80 cm = −0.8 m, so P = −1.25 D.","ch":"s10","t":1,"id":"n428"},{"ty":"mcq","mk":1,"q":"Hypermetropia is corrected by using a","o":["convex lens","concave lens","plane mirror","prism"],"a":0,"e":"It converges rays so that the image falls on the retina.","ch":"s10","t":1,"id":"n429"},{"ty":"mcq","mk":1,"q":"Splitting of white light into its seven colours when passing through a prism is called","o":["dispersion","reflection","scattering","diffraction"],"a":0,"e":"Different colours bend by different angles.","ch":"s10","t":2,"id":"n430"},{"ty":"mcq","mk":1,"q":"Which colour of light bends the least on passing through a prism?","o":["red","violet","green","blue"],"a":0,"e":"Red has the longest wavelength.","ch":"s10","t":2,"id":"n431"},{"ty":"mcq","mk":1,"q":"A rainbow is formed due to","o":["dispersion, refraction and internal reflection of sunlight in water droplets","only reflection","only diffraction","scattering by dust"],"a":0,"e":"Droplets act as tiny prisms.","ch":"s10","t":2,"id":"n432"},{"ty":"mcq","mk":1,"q":"The twinkling of stars is due to","o":["atmospheric refraction of starlight","reflection by the moon","scattering of light","dispersion"],"a":0,"e":"The refractive index of air changes with temperature and height.","ch":"s10","t":3,"id":"n433"},{"ty":"mcq","mk":1,"q":"The sky appears blue because","o":["blue light is scattered the most","red is absorbed","blue is reflected by the ground","there is water"],"a":0,"e":"Shorter wavelengths scatter more.","ch":"s10","t":3,"id":"n434"},{"ty":"mcq","mk":1,"q":"The Sun appears reddish at sunrise and sunset because","o":["red light is scattered the least and reaches the eyes","blue light is absorbed","red light is scattered the most","the Sun is closer"],"a":0,"e":"At the horizon, light travels a longer path through the atmosphere.","ch":"s10","t":3,"id":"n435"},{"ty":"mcq","mk":1,"q":"The Sun is visible about 2 minutes before actual sunrise due to","o":["atmospheric refraction","scattering","dispersion","reflection"],"a":0,"e":"Refraction makes the Sun appear above the horizon before it is.","ch":"s10","t":3,"id":"n436"},{"ty":"ar","mk":1,"q":"Assertion (A): Danger signal lights are red in colour.\nReason (R): Red light is scattered the least by fog and smoke.","a":0,"e":"Red can be seen from a distance, so R explains A.","ar":1,"ch":"s10","t":3,"id":"n437"},{"ty":"short","mk":3,"q":"What is hypermetropia? State two causes and how it is corrected.","m":"Hypermetropia (farsightedness) is the defect in which a person can see distant objects clearly but not nearby ones, as the image forms behind the retina. Causes: eyeball too short or focal length of the eye lens too long. It is corrected by using a convex lens.","p":["Definition","Two causes","Convex lens"],"ch":"s10","t":1,"id":"n438"},{"ty":"short","mk":3,"q":"What is dispersion of light? Why does a glass slab not show it, but a prism does?","m":"Dispersion is the splitting of white light into its constituent colours. Colours bend by different amounts in a prism and, since its faces are inclined, they emerge in different directions. In a slab the opposite faces are parallel, so the colours recombine and emerge parallel to each other and white.","p":["Definition","Prism separates the colours","Slab recombines them"],"ch":"s10","t":2,"id":"n439"},{"ty":"short","mk":3,"q":"Why do stars twinkle but planets do not?","m":"Starlight passes through layers of the atmosphere of changing refractive index, so its apparent position and brightness keep fluctuating. Stars are point sources, so the effect is noticeable. Planets are extended sources, a collection of many points, so the variations average out.","p":["Atmospheric refraction","Stars are point sources","Planets are extended sources"],"ch":"s10","t":3,"id":"n440"},{"ty":"mcq","mk":1,"q":"The SI unit of electric current is","o":["ampere","volt","ohm","coulomb"],"a":0,"e":"1 A = 1 C/s.","ch":"s11","t":0,"id":"n441"},{"ty":"mcq","mk":1,"q":"The potential difference between two points is 1 V if","o":["1 J of work moves 1 C of charge","1 C moves in 1 s","1 W is used","1 A flows"],"a":0,"e":"V = W/Q.","ch":"s11","t":0,"id":"n442"},{"ty":"mcq","mk":1,"q":"An ammeter is connected in","o":["series","parallel","either way","across the cell"],"a":0,"e":"It has low resistance.","ch":"s11","t":0,"id":"n443"},{"ty":"mcq","mk":1,"q":"If a current of 2 A flows for 5 minutes, the charge that flows is","o":["600 C","10 C","300 C","120 C"],"a":0,"e":"Q = It = 2 × 300 = 600 C.","ch":"s11","t":0,"id":"n444"},{"ty":"mcq","mk":1,"q":"Ohm's law gives the relation V = IR, valid at","o":["constant temperature","any temperature","constant current only","high temperature"],"a":0,"e":"Resistance changes with temperature.","ch":"s11","t":1,"id":"n445"},{"ty":"mcq","mk":1,"q":"The V–I graph for an ohmic conductor is","o":["a straight line through the origin","a parabola","a hyperbola","a circle"],"a":0,"e":"The slope gives the resistance.","ch":"s11","t":1,"id":"n446"},{"ty":"mcq","mk":1,"q":"When the length of a wire is doubled, its resistance becomes","o":["double","half","four times","same"],"a":0,"e":"R ∝ l.","ch":"s11","t":2,"id":"n447"},{"ty":"mcq","mk":1,"q":"When the diameter of a wire is doubled, its resistance becomes","o":["one-fourth","half","double","four times"],"a":0,"e":"R ∝ 1/A ∝ 1/d².","ch":"s11","t":2,"id":"n448"},{"ty":"mcq","mk":1,"q":"The SI unit of resistivity is","o":["ohm metre","ohm","ohm per metre","siemens"],"a":0,"e":"ρ = RA/l.","ch":"s11","t":2,"id":"n449"},{"ty":"mcq","mk":1,"q":"The material used for the filament of an electric bulb is","o":["tungsten","copper","nichrome","aluminium"],"a":0,"e":"Tungsten has a high melting point.","ch":"s11","t":2,"id":"n450"},{"ty":"mcq","mk":1,"q":"Three resistors of 2 Ω, 3 Ω and 5 Ω are in series. The total resistance is","o":["10 Ω","30 Ω","0.97 Ω","5 Ω"],"a":0,"e":"Rs = R₁ + R₂ + R₃.","ch":"s11","t":3,"id":"n451"},{"ty":"mcq","mk":1,"q":"Two resistors of 6 Ω and 3 Ω are connected in parallel. Equivalent resistance is","o":["2 Ω","9 Ω","4.5 Ω","18 Ω"],"a":0,"e":"1/R = 1/6 + 1/3 = 1/2.","ch":"s11","t":3,"id":"n452"},{"ty":"mcq","mk":1,"q":"Household appliances are connected in parallel because","o":["each gets the same voltage and can work independently","they use less current","they are cheaper","resistance is more"],"a":0,"e":"The voltage across each is 220 V.","ch":"s11","t":3,"id":"n453"},{"ty":"mcq","mk":1,"q":"The heating effect of current is given by","o":["H = I²Rt","H = IRt","H = V/It","H = I/Rt"],"a":0,"e":"This is Joule's law.","ch":"s11","t":4,"id":"n454"},{"ty":"mcq","mk":1,"q":"A 100 W bulb is connected to 220 V. Its resistance is","o":["484 Ω","2.2 Ω","22 Ω","2200 Ω"],"a":0,"e":"R = V²/P = 48400/100 = 484 Ω.","ch":"s11","t":4,"id":"n455"},{"ty":"mcq","mk":1,"q":"1 kWh equals","o":["3.6 × 10⁶ J","3.6 × 10³ J","1000 J","3.6 × 10⁹ J"],"a":0,"e":"1000 W × 3600 s = 3.6 × 10⁶ J.","ch":"s11","t":4,"id":"n456"},{"ty":"mcq","mk":1,"q":"The fuse in an electric circuit is made of a material with","o":["low melting point","high melting point","high resistance only","low resistance only"],"a":0,"e":"It melts and breaks the circuit on overload.","ch":"s11","t":4,"id":"n457"},{"ty":"mcq","mk":1,"q":"A potential difference of 12 V is applied across a resistor carrying 0.5 A. The resistance is","o":["24 Ω","6 Ω","12 Ω","2 Ω"],"a":0,"e":"R = V/I = 12/0.5 = 24 Ω.","ch":"s11","t":5,"id":"n458"},{"ty":"mcq","mk":1,"q":"Two resistors of 4 Ω and 12 Ω in parallel are connected to a 6 V battery. The total current is","o":["2 A","1.5 A","0.5 A","4 A"],"a":0,"e":"R = 3 Ω, I = 6/3 = 2 A.","ch":"s11","t":5,"id":"n459"},{"ty":"mcq","mk":1,"q":"An electric iron of 1100 W is used at 220 V. The current drawn is","o":["5 A","0.2 A","10 A","2.5 A"],"a":0,"e":"I = P/V = 1100/220 = 5 A.","ch":"s11","t":5,"id":"n460"},{"ty":"mcq","mk":1,"q":"The energy used by a 1 kW heater in 2 hours is","o":["2 kWh","1 kWh","0.5 kWh","3.6 kWh"],"a":0,"e":"E = P × t = 1 × 2 = 2 kWh.","ch":"s11","t":5,"id":"n461"},{"ty":"ar","mk":1,"q":"Assertion (A): Alloys are commonly used in electrical heating devices like heaters and toasters.\nReason (R): Alloys have higher resistivity and do not oxidise readily at high temperatures.","a":0,"e":"Nichrome gets hot without burning; R explains A.","ar":1,"ch":"s11","t":2,"id":"n462"},{"ty":"short","mk":3,"q":"Derive the expression for the heat produced when a current I flows through a resistance R for time t.","m":"Work done in moving charge Q across potential difference V is W = VQ = V × It. With V = IR, heat produced H = I²Rt.","p":["Work W = VIt","Substitute V = IR","H = I²Rt"],"ch":"s11","t":4,"id":"n463"},{"ty":"short","mk":5,"q":"Three resistors of 4 Ω, 6 Ω and 12 Ω are connected in parallel across a 12 V battery. Find the total resistance, the total current and the current through the 6 Ω resistor.","m":"1/R = 1/4 + 1/6 + 1/12 = (3 + 2 + 1)/12 = 1/2, so R = 2 Ω. Total I = 12/2 = 6 A. Current through 6 Ω = 12/6 = 2 A.","p":["Equivalent resistance 2 Ω","Total current 6 A","Current in 6 Ω is 2 A"],"ch":"s11","t":5,"id":"n464"},{"ty":"short","mk":3,"q":"Draw the circuit with two resistors in series with a battery, ammeter and voltmeter across one resistor. Why is the ammeter connected in series and the voltmeter in parallel?","m":"The ammeter has very low resistance and must carry the same current as the resistor, so it is placed in series. The voltmeter has very high resistance and measures the potential difference between two points so it is placed in parallel without altering the current.","p":["Correct circuit diagram","Ammeter in series","Voltmeter in parallel"],"ch":"s11","t":3,"id":"n465"},{"ty":"mcq","mk":1,"q":"The magnetic field lines outside a bar magnet go from","o":["north pole to south pole","south pole to north pole","east to west","centre to the poles"],"a":0,"e":"They form closed loops, going from S to N inside the magnet.","ch":"s12","t":0,"id":"n466"},{"ty":"mcq","mk":1,"q":"Two magnetic field lines","o":["never intersect each other","always intersect","intersect at poles","are straight lines"],"a":0,"e":"If they intersected, the compass needle would point two ways at a point.","ch":"s12","t":0,"id":"n467"},{"ty":"mcq","mk":1,"q":"The deflection of a compass needle near a current-carrying wire was first observed by","o":["Oersted","Faraday","Fleming","Ampere"],"a":0,"e":"It showed that electricity produces magnetism.","ch":"s12","t":0,"id":"n468"},{"ty":"mcq","mk":1,"q":"The pattern of magnetic field around a straight current-carrying wire is","o":["concentric circles","straight lines","parabolic","radial lines"],"a":0,"e":"The direction follows the right-hand thumb rule.","ch":"s12","t":1,"id":"n469"},{"ty":"mcq","mk":1,"q":"The magnetic field produced by a current in a straight wire at a point","o":["increases with current and decreases with distance","decreases with current","is independent of the current","increases with distance"],"a":0,"e":"B ∝ I/r.","ch":"s12","t":1,"id":"n470"},{"ty":"mcq","mk":1,"q":"The magnetic field inside a solenoid is","o":["uniform","zero","non-uniform","very weak"],"a":0,"e":"The field lines inside are parallel straight lines.","ch":"s12","t":2,"id":"n471"},{"ty":"mcq","mk":1,"q":"A solenoid with a soft iron core is called","o":["an electromagnet","a permanent magnet","a generator","a transformer"],"a":0,"e":"Soft iron becomes magnetised when current flows.","ch":"s12","t":2,"id":"n472"},{"ty":"mcq","mk":1,"q":"The magnetic field at the centre of a circular coil","o":["is perpendicular to the plane of the coil","lies in the plane","is zero","is circular"],"a":0,"e":"Field lines at the centre are straight lines perpendicular to the plane.","ch":"s12","t":2,"id":"n473"},{"ty":"mcq","mk":1,"q":"A current-carrying conductor placed in a magnetic field experiences maximum force when it is","o":["perpendicular to the field","parallel to the field","at 45° to the field","in no field"],"a":0,"e":"F = BIL sin θ.","ch":"s12","t":3,"id":"n474"},{"ty":"mcq","mk":1,"q":"In Fleming's left-hand rule the thumb points in the direction of","o":["force","current","field","motion of a magnet"],"a":0,"e":"The forefinger is the field, middle finger the current.","ch":"s12","t":3,"id":"n475"},{"ty":"mcq","mk":1,"q":"The device that works on the force on a conductor in a magnetic field is","o":["an electric motor","an electric generator","a transformer","a battery"],"a":0,"e":"A motor converts electrical energy to mechanical energy.","ch":"s12","t":3,"id":"n476"},{"ty":"mcq","mk":1,"q":"The frequency of the AC supplied in India is","o":["50 Hz","60 Hz","100 Hz","25 Hz"],"a":0,"e":"The current reverses 100 times each second.","ch":"s12","t":4,"id":"n477"},{"ty":"mcq","mk":1,"q":"The colour of the earth wire insulation in a domestic circuit is","o":["green","red","black","blue"],"a":0,"e":"Red is live, black is neutral, green is earth.","ch":"s12","t":4,"id":"n478"},{"ty":"mcq","mk":1,"q":"The earth wire is used to","o":["prevent electric shocks","increase current","increase voltage","save electricity"],"a":0,"e":"It provides a low-resistance path to the ground.","ch":"s12","t":4,"id":"n479"},{"ty":"mcq","mk":1,"q":"A short circuit occurs when","o":["live and neutral wires touch","the earth wire is cut","the bulb fuses","voltage drops"],"a":0,"e":"Current in the circuit becomes very high.","ch":"s12","t":4,"id":"n480"},{"ty":"ar","mk":1,"q":"Assertion (A): A current-carrying conductor does not experience a force if it is placed parallel to the magnetic field.\nReason (R): The force depends on the sine of the angle between current and field.","a":0,"e":"F = BIL sin θ is zero when θ = 0°.","ar":1,"ch":"s12","t":3,"id":"n481"},{"ty":"short","mk":3,"q":"State the right-hand thumb rule. A wire carries current vertically upwards; what is the direction of the field around it?","m":"If you hold the wire in the right hand with the thumb along the current, the curled fingers show the direction of the magnetic field. For a current going upwards the field is anticlockwise when viewed from above.","p":["Statement","Thumb = current","Direction anticlockwise from above"],"ch":"s12","t":1,"id":"n482"},{"ty":"short","mk":5,"q":"State Fleming's left-hand rule. Describe how a current-carrying conductor experiences a force in a magnetic field. Name one device based on it.","m":"Stretch the thumb, forefinger and middle finger of the left hand mutually perpendicular; if the forefinger points in the direction of the field and the middle finger in the direction of current, the thumb gives the direction of force. A conductor carrying current in a magnetic field experiences a force that is maximum when perpendicular to the field. Electric motor.","p":["Statement of the rule","Three directions","Force depends on the angle","Device"],"ch":"s12","t":3,"id":"n483"},{"ty":"short","mk":3,"q":"What is the function of a fuse? Name two reasons for overloading in domestic circuits.","m":"A fuse protects circuits and appliances by melting and breaking the circuit when too much current flows. Overloading arises from connecting many appliances to a single socket or from a fault such as a short circuit between live and neutral wires.","p":["Fuse function","First reason","Second reason"],"ch":"s12","t":4,"id":"n484"},{"ty":"mcq","mk":1,"q":"In a food chain, the first trophic level is always","o":["a producer","a herbivore","a carnivore","a decomposer"],"a":0,"e":"Green plants are producers.","ch":"s13","t":0,"id":"n485"},{"ty":"mcq","mk":1,"q":"Which of these is a correct food chain?","o":["grass → grasshopper → frog → snake","snake → frog → grass","frog → grasshopper → grass","grasshopper → grass → snake"],"a":0,"e":"Energy flows from producers to consumers.","ch":"s13","t":0,"id":"n486"},{"ty":"mcq","mk":1,"q":"Decomposers in an ecosystem","o":["break down dead organisms","make food","are herbivores","capture sunlight"],"a":0,"e":"Bacteria and fungi recycle nutrients.","ch":"s13","t":0,"id":"n487"},{"ty":"mcq","mk":1,"q":"If the producers in a food chain have 10000 J of energy, the primary carnivores will get","o":["100 J","1000 J","10 J","10000 J"],"a":0,"e":"Each trophic level passes on about 10%: 10000 → 1000 → 100.","ch":"s13","t":1,"id":"n488"},{"ty":"mcq","mk":1,"q":"Energy flow in an ecosystem is","o":["unidirectional","bidirectional","cyclic","random"],"a":0,"e":"Energy flows from the Sun to producers to consumers.","ch":"s13","t":1,"id":"n489"},{"ty":"mcq","mk":1,"q":"A food chain usually has no more than 3 or 4 trophic levels because","o":["energy decreases at each level","plants are fewer","animals are bigger","decomposers eat them"],"a":0,"e":"Only about 10% energy passes on.","ch":"s13","t":1,"id":"n490"},{"ty":"mcq","mk":1,"q":"The ozone layer protects the earth from","o":["ultraviolet rays","infrared rays","visible light","radio waves"],"a":0,"e":"UV radiation damages living tissue.","ch":"s13","t":2,"id":"n491"},{"ty":"mcq","mk":1,"q":"The chemical responsible for the depletion of the ozone layer is","o":["CFC","CO₂","CH₄","SO₂"],"a":0,"e":"Chlorofluorocarbons release chlorine atoms.","ch":"s13","t":2,"id":"n492"},{"ty":"mcq","mk":1,"q":"Ozone is formed from oxygen by the action of","o":["ultraviolet radiation","visible light","infrared","cosmic rays"],"a":0,"e":"O₂ → O + O; O + O₂ → O₃.","ch":"s13","t":2,"id":"n493"},{"ty":"mcq","mk":1,"q":"Which of the following is a non-biodegradable waste?","o":["plastic bag","vegetable peel","paper","cow dung"],"a":0,"e":"Plastics are not broken down by microorganisms.","ch":"s13","t":3,"id":"n494"},{"ty":"mcq","mk":1,"q":"The increase in concentration of harmful chemicals at higher trophic levels is called","o":["biological magnification","biodegradation","photosynthesis","decomposition"],"a":0,"e":"Pesticides accumulate in food chains and are highest in top consumers.","ch":"s13","t":3,"id":"n495"},{"ty":"ar","mk":1,"q":"Assertion (A): Pesticides like DDT accumulate in human bodies in greater amounts than in plants.\nReason (R): Non-biodegradable chemicals get concentrated at each trophic level.","a":0,"e":"Humans are at the top of the food chain; R explains A.","ar":1,"ch":"s13","t":3,"id":"n496"},{"ty":"short","mk":3,"q":"Explain the 10 per cent law with an example. Why are food chains short?","m":"Only about 10% of the energy at one trophic level is passed on to the next. Producers 10000 J → herbivores 1000 J → carnivores 100 J. Since energy decreases at each step, there is too little energy to support more than 3–4 trophic levels.","p":["10% rule stated","Example","Reason for short chains"],"ch":"s13","t":1,"id":"n497"},{"ty":"short","mk":3,"q":"What is the ozone layer? How is it damaged and why is it a concern?","m":"The ozone layer is a layer of O₃ in the stratosphere that absorbs the Sun's harmful ultraviolet radiation. CFCs used in refrigerators and aerosols release chlorine and decompose ozone. Greater UV exposure causes skin cancer, cataract and damage to crops.","p":["What it is","CFCs as the cause","Harm of UV"],"ch":"s13","t":2,"id":"n498"},{"ty":"short","mk":3,"q":"Differentiate between biodegradable and non-biodegradable substances with two examples each.","m":"Biodegradable substances are broken down by microorganisms (e.g. vegetable waste, paper). Non-biodegradable substances are not (e.g. plastic, DDT, glass) and remain in the environment, harming organisms.","p":["Biodegradable defined","Non-biodegradable defined","Two examples each"],"ch":"s13","t":3,"id":"n499"},{"ty":"mcq","mk":1,"q":"Newlands' law of octaves states that every eighth element has properties similar to the first when elements are arranged in order of","o":["increasing atomic mass","atomic number","valency","density"],"a":0,"e":"It worked only up to calcium.","ch":"sb1","t":0,"id":"n500"},{"ty":"mcq","mk":1,"q":"Mendeleev left gaps in his table for elements yet to be discovered, such as","o":["eka-aluminium (gallium)","helium","hydrogen","carbon"],"a":0,"e":"He predicted their properties correctly.","ch":"sb1","t":0,"id":"n501"},{"ty":"mcq","mk":1,"q":"The modern periodic law states that properties of elements are periodic functions of their","o":["atomic number","atomic mass","valency only","neutron number"],"a":0,"e":"Moseley's work led to this change.","ch":"sb1","t":1,"id":"n502"},{"ty":"mcq","mk":1,"q":"Going from left to right across a period, the atomic size","o":["decreases","increases","stays the same","first increases then decreases"],"a":0,"e":"The nuclear charge increases and pulls electrons closer.","ch":"sb1","t":1,"id":"n503"},{"ty":"mcq","mk":1,"q":"The number of elements in the second period is","o":["8","2","18","10"],"a":0,"e":"Li to Ne.","ch":"sb1","t":1,"id":"n504"},{"ty":"mcq","mk":1,"q":"Acquired traits such as a cut tail in mice are","o":["not passed to the next generation","always inherited","stored in DNA","dominant"],"a":0,"e":"Only changes in germ cells are inherited.","ch":"sb2","t":0,"id":"n505"},{"ty":"mcq","mk":1,"q":"The wings of a bat and the wings of a bird are","o":["analogous organs","homologous organs","vestigial organs","same in structure"],"a":0,"e":"They have different structures but the same function.","ch":"sb2","t":0,"id":"n506"},{"ty":"mcq","mk":1,"q":"The forelimbs of humans and bats are","o":["homologous organs","analogous organs","useless","identical"],"a":0,"e":"They have a similar basic structure but different functions.","ch":"sb2","t":1,"id":"n507"},{"ty":"mcq","mk":1,"q":"The age of fossils can be estimated by","o":["carbon dating","litmus test","comparing colour","X-ray"],"a":0,"e":"C-14 decays at a known rate.","ch":"sb2","t":1,"id":"n508"},{"ty":"mcq","mk":1,"q":"An electric motor converts","o":["electrical energy into mechanical energy","mechanical energy into electrical energy","chemical into electrical","light into heat"],"a":0,"e":"It uses the force on a current-carrying coil in a magnetic field.","ch":"sb3","t":0,"id":"n509"},{"ty":"mcq","mk":1,"q":"Electromagnetic induction was discovered by","o":["Michael Faraday","Oersted","Ohm","Fleming"],"a":0,"e":"A changing magnetic field induces a current in a nearby coil.","ch":"sb3","t":1,"id":"n510"},{"ty":"mcq","mk":1,"q":"An electric generator converts","o":["mechanical energy to electrical energy","electrical to mechanical","heat to light","chemical to heat"],"a":0,"e":"A rotating coil in a magnetic field produces induced current.","ch":"sb3","t":1,"id":"n511"},{"ty":"mcq","mk":1,"q":"The device used to detect a current in a circuit is","o":["a galvanometer","a voltmeter","a motor","a fuse"],"a":0,"e":"A galvanometer shows the presence and direction of current.","ch":"sb3","t":1,"id":"n512"},{"ty":"mcq","mk":1,"q":"Newlands' Law of Octaves stated that every eighth element had properties similar to the","o":["first element, like the notes of music","second element","last element","none of these"],"a":0,"e":"Elements arranged by increasing atomic mass repeated properties after every eighth element.","ch":"sb1","t":0,"id":"n513"},{"ty":"mcq","mk":1,"q":"Dobereiner's triads were groups of","o":["three elements with similar properties, the atomic mass of the middle being nearly the mean of the other two","two elements","eight elements","four elements"],"a":0,"e":"For example lithium, sodium and potassium.","ch":"sb1","t":0,"id":"n514"},{"ty":"mcq","mk":1,"q":"On moving from left to right across a period in the modern periodic table, the atomic size generally","o":["decreases","increases","remains same","first increases then decreases"],"a":0,"e":"The nuclear charge increases while the shells remain the same, pulling electrons closer.","ch":"sb1","t":1,"id":"n515"},{"ty":"mcq","mk":1,"q":"On moving down a group in the modern periodic table, the metallic character","o":["increases","decreases","remains same","becomes zero"],"a":0,"e":"Atoms lose electrons more easily as size increases.","ch":"sb1","t":1,"id":"n516"},{"ty":"mcq","mk":1,"q":"Traits that are acquired during the lifetime of an individual are","o":["not passed to the next generation through DNA","always inherited","always dominant","always harmful"],"a":0,"e":"Only changes in the germ cell DNA are inherited.","ch":"sb2","t":0,"id":"n517"},{"ty":"mcq","mk":1,"q":"The formation of new species from an existing one is called","o":["speciation","extinction","mutation","migration"],"a":0,"e":"It occurs through variation, isolation and natural selection.","ch":"sb2","t":0,"id":"n518"},{"ty":"mcq","mk":1,"q":"Fossils help us to understand evolution because they","o":["show forms of ancient organisms and their age","are made of metals","are living","are man made"],"a":0,"e":"Fossil dating shows the sequence of life on earth.","ch":"sb2","t":1,"id":"n519"},{"ty":"mcq","mk":1,"q":"Which of the following pairs shows homologous organs?","o":["forelimb of a human and wing of a bat","wing of a bird and wing of an insect","eye of an octopus and eye of a cat","wing of a bat and wing of a butterfly"],"a":0,"e":"Homologous organs have the same basic structure but different functions.","ch":"sb2","t":1,"id":"n520"},{"ty":"mcq","mk":1,"q":"The energy conversion that takes place in an electric motor is","o":["electrical energy into mechanical energy","mechanical energy into electrical energy","heat into light","light into sound"],"a":0,"e":"A current-carrying coil in a magnetic field rotates.","ch":"sb3","t":0,"id":"n521"},{"ty":"mcq","mk":1,"q":"The direction of force on a current-carrying conductor in a magnetic field is given by","o":["Fleming's left-hand rule","Fleming's right-hand rule","Ohm's law","Lenz's law only"],"a":0,"e":"Thumb shows force, forefinger shows field and middle finger shows current.","ch":"sb3","t":0,"id":"n522"},{"ty":"mcq","mk":1,"q":"An electric generator works on the principle of","o":["electromagnetic induction","heating effect of current","chemical effect","magnetic effect only"],"a":0,"e":"A changing magnetic flux induces a current in the coil.","ch":"sb3","t":1,"id":"n523"},{"ty":"mcq","mk":1,"q":"The device that reverses the direction of current in the coil of a DC motor is the","o":["split ring commutator","slip ring","fuse","brush only"],"a":0,"e":"It makes the coil rotate continuously in one direction.","ch":"sb3","t":1,"id":"n524"},{"ty":"mcq","mk":1,"q":"The French artist who painted the 1848 series of prints visualising a world of democratic and social republics was","o":["Frédéric Sorrieu","Giuseppe Mazzini","Otto von Bismarck","Eugène Delacroix"],"a":0,"e":"Sorrieu's four prints showed people of Europe and America offering homage to the Statue of Liberty.","ch":"hi1","t":0,"id":"n525"},{"ty":"mcq","mk":1,"q":"The French Revolutionaries introduced the idea of a nation by replacing the monarchy with","o":["a body of active citizens and a new tricolour flag","a new king","a church council","a foreign ruler"],"a":0,"e":"The tricolour replaced the royal standard, and the Estates General became the National Assembly.","ch":"hi1","t":0,"id":"n526"},{"ty":"mcq","mk":1,"q":"The Civil Code of 1804, also known as the Napoleonic Code, did away with","o":["all privileges based on birth","equality before the law","the right to property","the idea of a nation"],"a":0,"e":"It established equality before the law and secured the right to property but not liberty for women.","ch":"hi1","t":0,"id":"n527"},{"ty":"mcq","mk":1,"q":"The Congress of Vienna of 1815 was hosted by the Austrian Chancellor","o":["Duke Metternich","Bismarck","Cavour","Napoleon"],"a":0,"e":"The Congress aimed to undo most changes of Napoleonic wars; Bourbon dynasty was restored.","ch":"hi1","t":1,"id":"n528"},{"ty":"mcq","mk":1,"q":"The customs union formed in 1834 at the initiative of Prussia, which abolished tariff barriers, was the","o":["Zollverein","Frankfurt Parliament","Concert of Europe","Young Europe"],"a":0,"e":"It created a network of economic links that bound the German states together.","ch":"hi1","t":1,"id":"n529"},{"ty":"mcq","mk":1,"q":"In the economic sphere, liberalism stood for","o":["freedom of markets and abolition of state-imposed restrictions on movement of goods and capital","state control of trade","feudal duties","forced labour"],"a":0,"e":"The middle classes wanted free markets, hence the Zollverein.","ch":"hi1","t":1,"id":"n530"},{"ty":"mcq","mk":1,"q":"The Prime Minister of Sardinia-Piedmont who led the movement to unify Italian states was","o":["Cavour","Garibaldi","Mazzini","Victor Emmanuel II"],"a":0,"e":"Cavour used diplomacy; he was neither a revolutionary nor a democrat.","ch":"hi1","t":2,"id":"n531"},{"ty":"mcq","mk":1,"q":"Giuseppe Garibaldi's volunteers who marched into South Italy in 1860 were known as","o":["the Red Shirts","the Blue Brigade","the Young Italy","the Jacobins"],"a":0,"e":"They joined the Kingdom of Sardinia-Piedmont with the Kingdom of the Two Sicilies.","ch":"hi1","t":2,"id":"n532"},{"ty":"mcq","mk":1,"q":"Kaiser William I of Prussia was proclaimed German Emperor in January 1871 at","o":["Versailles","Berlin","Frankfurt","Vienna"],"a":0,"e":"It took place after victory in the Franco-Prussian war.","ch":"hi1","t":2,"id":"n533"},{"ty":"mcq","mk":1,"q":"The chief architect of German unification under Prussian leadership was","o":["Otto von Bismarck","Metternich","Garibaldi","Cavour"],"a":0,"e":"Bismarck fought wars with Austria, Denmark and France.","ch":"hi1","t":2,"id":"n534"},{"ty":"mcq","mk":1,"q":"In popular prints, the female allegory that represented the German nation was","o":["Germania","Marianne","Liberty","Britannia"],"a":0,"e":"Germania wore a crown of oak leaves, which stands for heroism.","ch":"hi1","t":3,"id":"n535"},{"ty":"mcq","mk":1,"q":"In the Balkans, the nationalist tensions grew because","o":["the Ottoman Empire was weakening and Slavic nationalities struggled for independence","Britain had occupied it","Napoleon was ruling","railways were built"],"a":0,"e":"The Balkans, a region of geographical and ethnic variation, was a source of conflict and eventually led to World War I.","ch":"hi1","t":3,"id":"n536"},{"ty":"ar","mk":1,"q":"Assertion (A): The Estates General was convened by Louis XVI in 1789 to pass proposals for new taxes.\nReason (R): The Third Estate members felt that each estate should have one vote.","a":1,
