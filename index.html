9"},{"ty":"mcq","mk":1,"q":"'Words and Expressions' practice: the phrasal verb 'give up' means","o":["stop trying","give away","give a gift","raise"],"a":0,"e":"It means to abandon an effort.","ch":"ew4","t":1,"id":"n1110"},{"ty":"mcq","mk":1,"q":"'नेताजी का चश्मा' पाठ के लेखक हैं","o":["स्वयं प्रकाश","प्रेमचंद","यशपाल","मन्नू भंडारी"],"a":0,"e":"यह कहानी स्वयं प्रकाश ने लिखी है।","ch":"hk1","t":0,"id":"n1111"},{"ty":"mcq","mk":1,"q":"हालदार साहब कस्बे से गुज़रते समय किसकी मूर्ति देखते थे","o":["सुभाषचंद्र बोस की","महात्मा गांधी की","जवाहरलाल नेहरू की","भगत सिंह की"],"a":0,"e":"चौराहे पर नेताजी की संगमरमर की मूर्ति थी।","ch":"hk1","t":0,"id":"n1112"},{"ty":"mcq","mk":1,"q":"मूर्ति पर पहले चश्मा क्यों नहीं था","o":["मूर्तिकार चश्मा बनाना भूल गया या बना नहीं सका","चश्मा चोरी हो गया","नेताजी चश्मा नहीं पहनते थे","बच्चों ने उतार लिया"],"a":0,"e":"मूर्ति बिना चश्मे के बनी, इसलिए असली चश्मा लगाया जाता था।","ch":"hk1","t":0,"id":"n1113"},{"ty":"mcq","mk":1,"q":"मूर्ति पर चश्मा बदलने का काम कौन करता था","o":["कैप्टन चश्मेवाला","हालदार साहब","नगरपालिका","मूर्तिकार"],"a":0,"e":"कैप्टन अपने ग्राहकों की माँग के अनुसार मूर्ति पर चश्मे का फ़्रेम बदल देता था।","ch":"hk1","t":1,"id":"n1114"},{"ty":"mcq","mk":1,"q":"कैप्टन की मृत्यु के बाद मूर्ति पर चश्मा लगाया गया","o":["बच्चों द्वारा बनाया गया सरकंडे का","सोने का","पुराना असली","नहीं लगाया गया"],"a":0,"e":"यह देशभक्ति की भावना जीवित रहने का प्रतीक है।","ch":"hk1","t":1,"id":"n1115"},{"ty":"mcq","mk":1,"q":"इस पाठ में 'कैप्टन' के माध्यम से लेखक ने दिखाया है","o":["आम आदमी की देशभक्ति","सैनिकों की वीरता","अमीरों का दिखावा","नेताओं का भ्रष्टाचार"],"a":0,"e":"कैप्टन छोटा-सा दुकानदार होकर भी देश के प्रति सम्मान रखता था।","ch":"hk1","t":1,"id":"n1116"},{"ty":"mcq","mk":1,"q":"मूर्ति बनाने वाला कौन था","o":["स्थानीय स्कूल का ड्रॉइंग मास्टर (मोतीलाल)","प्रसिद्ध मूर्तिकार","कैप्टन","हालदार साहब"],"a":0,"e":"नगरपालिका के पास बजट कम था, इसलिए स्थानीय मास्टर से मूर्ति बनवाई।","ch":"hk1","t":1,"id":"n1117"},{"ty":"ar","mk":1,"q":"Assertion (A) ndex.html is the file or page name.","p":["Meaning of URL","Protocol","Domain name and page"],"ch":"cs1","t":3,"id":"n1445"},{"ty":"mcq","mk":1,"q":"TCP/IP stands for","o":["Transmission Control Protocol/Internet Protocol","Transfer Control Process/Internet Process","Transport Code Protocol/Internet Program","Terminal Control Protocol/Interface"],"a":0,"e":"It is the basic protocol suite of the Internet.","ch":"cs2","t":0,"id":"n1446"},{"ty":"mcq","mk":1,"q":"In TCP/IP, the work of IP is to","o":["address and route packets to their destination","break data into pages","display web pages","encrypt data"],"a":0,"e":"IP provides addresses and routing.","ch":"cs2","t":0,"id":"n1447"},{"ty":"mcq","mk":1,"q":"TCP is responsible for","o":["breaking data into packets and ensuring reliable delivery","designing web pages","sending e-mail only","storing files"],"a":0,"e":"It also reassembles packets at the destination.","ch":"cs2","t":0,"id":"n1448"},{"ty":"mcq","mk":1,"q":"The protocol used for sending e-mail is","o":["SMTP","POP3","FTP","HTTP"],"a":0,"e":"SMTP is the Simple Mail Transfer Protocol.","ch":"cs2","t":1,"id":"n1449"},{"ty":"mcq","mk":1,"q":"The protocol used to retrieve e-mail from a mail server is","o":["POP3","SMTP","HTTP","TELNET"],"a":0,"e":"POP3 is the Post Office Protocol version 3.","ch":"cs2","t":1,"id":"n1450"},{"ty":"mcq","mk":1,"q":"SMTP stands for","o":["Simple Mail Transfer Protocol","Simple Message Transport Process","Standard Mail Transfer Program","Send Mail Through Port"],"a":0,"e":"It is used for outgoing mail.","ch":"cs2","t":1,"id":"n1451"},{"ty":"mcq","mk":1,"q":"HTTP stands for","o":["HyperText Transfer Protocol","HighText Transfer Program","HyperText Transmission Protocol","Hyper Transfer Text Path"],"a":0,"e":"It is used to transfer web pages.","ch":"cs2","t":2,"id":"n1452"},{"ty":"mcq","mk":1,"q":"In HTTPS, the letter 'S' stands for","o":["secure","server","simple","standard"],"a":0,"e":"HTTPS is the secure version of HTTP.","ch":"cs2","t "],"a":0,"e":"It includes online courses and videos.","ch":"cs3","t":3,"id":"n1471"},{"ty":"mcq","mk":1,"q":"E-governance refers to","o":["the use of the Internet to provide government services","a computer game","e-mail only","a website for shopping"],"a":0,"e":"It includes services like online tax filing.","ch":"cs3","t":4,"id":"n1472"},{"ty":"mcq","mk":1,"q":"Which of the following is a social networking site?","o":["Facebook","Google Docs","Microsoft Excel","Notepad"],"a":0,"e":"It allows users to connect and share.","ch":"cs3","t":4,"id":"n1473"},{"ty":"mcq","mk":1,"q":"An e-group is","o":["an online group of people with a common interest","a group of computers","a group of viruses","a type of server"],"a":0,"e":"Members share messages and files.","ch":"cs3","t":4,"id":"n1474"},{"ty":"ar","mk":1,"q":"Assertion (A): E-reservation saves time and effort.\nReason (R): It allows tickets to be booked from anywhere using the Internet.","a":0,"e":"One need not visit the counter; R explains A.","ar":1,"ch":"cs3","t":1,"id":"n1475"},{"ty":"short","mk":3,"q":"List three advantages of e-banking.","m":"E-banking allows 24x7 access to accounts from anywhere and saves time and travel. Fund transfer and bill payment are quick and paperless, and one can check balance and statements instantly.","p":["24x7 access","Quick transactions","Saves time"],"ch":"cs3","t":3,"id":"n1476"},{"ty":"mcq","mk":1,"q":"SMS stands for","o":["Short Message Service","Simple Mail Service","Standard Message System","Small Media Service"],"a":0,"e":"It sends short text messages.","ch":"cs4","t":0,"id":"n1477"},{"ty":"mcq","mk":1,"q":"MMS stands for","o":["Multimedia Messaging Service","Multiple Mail Service","Mobile Media System","Message Management Service"],"a":0,"e":"It sends pictures, audio and video.","ch":"cs4","t":0,"id":"n1478"},{"ty":"mcq","mk":1,"q":"A difference between SMS and MMS is that MMS","o":["can send pictures and videos along with text","can send only text","is slower","is only for {"ty":"mcq","mk":1,"q":"HTML stands for","o":["HyperText Markup Language","HighText Machine Language","HyperText Markup Level","Hyper Transfer Markup Language"],"a":0,"e":"It is the language used to design web pages.","ch":"cs5","t":0,"id":"n1488"},{"ty":"mcq","mk":1,"q":"An HTML file is saved with the extension","o":[".html or .htm",".doc",".exe",".txt only"],"a":0,"e":"A web browser opens files with these extensions.","ch":"cs5","t":0,"id":"n1489"},{"ty":"mcq","mk":1,"q":"An HTML document can be created using","o":["a text editor like Notepad","Photoshop","Excel","a calculator"],"a":0,"e":"HTML is plain text.","ch":"cs5","t":0,"id":"n1490"},{"ty":"mcq","mk":1,"q":"The <html> tag is","o":["the first tag of an HTML document","an optional tag","the last tag","a formatting tag"],"a":0,"e":"It encloses the whole document.","ch":"cs5","t":1,"id":"n1491"},{"ty":"mcq","mk":1,"q":"The text shown on the browser title bar is defined using the","o":["<title> tag","<head> tag","<body> tag","<p> tag"],"a":0,"e":"The title element is inside the head section.","ch":"cs5","t":1,"id":"n1492"},{"ty":"mcq","mk":1,"q":"The content visible on the web page is placed within the","o":["<body> tag","<head> tag","<title> tag","<meta> tag"],"a":0,"e":"The body holds the page's content.","ch":"cs5","t":1,"id":"n1493"},{"ty":"mcq","mk":1,"q":"The closing tag of <body> is","o":["</body>","<body/>","<\\body>","<end body>"],"a":0,"e":"Closing tags start with a slash.","ch":"cs5","t":1,"id":"n1494"},{"ty":"mcq","mk":1,"q":"The attribute used to set the background colour of a page is","o":["bgcolor","color","background","fgcolor"],"a":0,"e":"It is used in the <body> tag in this syllabus.","ch":"cs5","t":2,"id":"n1495"},{"ty":"mcq","mk":1,"q":"The attribute used to set the text colour of a page in the <body> tag is","o":["text","color","font","textcolor"],"a":0,"e":"text=\"red\" sets the colour of text.","ch":"cs5","t":2,"id":"n1496"},{"ty":"mcq","mk":1,"q":"The attribute used to apply an image as the background is","o":["background","bgcolor","src","image"],"a":0,"e":"background=\"pic.jpg\" sets the image.","ch":"cs5","t":2,"id":"n1497"},{"ty":"mcq","mk":1,"q":"The attribute 'link' in the <body> tag sets the colour of","o":["unvisited links","visited links","active links","text"],"a":0,"e":"link is the default colour of unvisited links.","ch":"cs5","t":3,"id":"n1498"},{"ty":"mcq","mk":1,"q":"The attribute 'vlink' stands for","o":["visited link","vertical link","valid link","view link"],"a":0,"e":"It sets the colour of visited links.","ch":"cs5","t":3,"id":"n1499"},{"ty":"mcq","mk":1,"q":"The attribute 'alink' sets the colour of","o":["active link (while being clicked)","visited link","text","page"],"a":0,"e":"alink is the colour of the link when clicked.","ch":"cs5","t":3,"id":"n1500"},{"ty":"ar","mk":1,"q":"Assertion (A): The <title> tag is written inside the <head> section.\nReason (R): The title appears on the browser's title bar.","a":0,"e":"It is not shown on the page body; R explains A.","ar":1,"ch":"cs5","t":1,"id":"n1501"},{"ty":"short","mk":3,"q":"Write the basic structure of an HTML document.","m":"The document starts with the <html> tag, followed by a <head> containing <title>, then the <body> with content, ending with </body> and </html>. Example: <html><head><title>My Page</title></head><body>Hello</body></html>.","p":["html tag","head and title","body"],"ch":"cs5","t":1,"id":"n1502"},{"ty":"mcq","mk":1,"q":"The tag used to insert a line break is","o":["<br>","<hr>","<p>","<b>"],"a":0,"e":"<br> breaks the line and needs no closing tag.","ch":"cs6","t":0,"id":"n1503"},{"ty":"mcq","mk":1,"q":"The tag used to draw a horizontal line is","o":["<hr>","<br>","<line>","<h>"],"a":0,"e":"It draws a horizontal rule.","ch":"cs6","t":0,"id":"n1504"},{"ty":"mcq","mk":1,"q":"A comment in HTML is written as","o":["<!-- comment -->","// comment","/* comment */","# comment"],"a":0,"e":"Comments are not displayed.","ch":"cs6","t":0,"id":"n1505"},{"ty":"mcq","mk":1,"q":"The largest heading tag is","o":["<h1>","<h6>","<head>","<h0>"],"a":0,"e":"<h1> is the largest and <h6> the smallest.","ch":"cs6","t":1,"id":"n1506"},{"ty":"mcq","mk":1,"q":"The tag used to create a paragraph is","o":["<p>","<para>","<pr>","<br>"],"a":0,"e":"It starts a new paragraph with spacing.","ch":"cs6","t":1,"id":"n1507"},{"ty":"mcq","mk":1,"q":"The tag used to display text in bold is","o":["<b>","<i>","<u>","<em>"],"a":0,"e":"b stands for bold.","ch":"cs6","t":2,"id":"n1508"},{"ty":"mcq","mk":1,"q":"The tag used to underline text is","o":["<u>","<b>","<i>","<line>"],"a":0,"e":"u stands for underline.","ch":"cs6","t":2,"id":"n1509"},{"ty":"mcq","mk":1,"q":"The tag <i> is used to","o":["italicise text","bold text","underline text","break lines"],"a":0,"e":"i stands for italics.","ch":"cs6","t":2,"id":"n1510"},{"ty":"mcq","mk":1,"q":"The attribute that sets the colour of text in the font tag is","o":["color","face","size","style"],"a":0,"e":"<font color=\"red\"> sets the colour.","ch":"cs6","t":3,"id":"n1511"},{"ty":"mcq","mk":1,"q":"To change the typeface using the font tag, use the attribute","o":["face","type","size","font"],"a":0,"e":"<font face=\"Arial\">.","ch":"cs6","t":3,"id":"n1512"},{"ty":"mcq","mk":1,"q":"The font size attribute accepts values from","o":["1 to 7","1 to 100","0 to 5","10 to 20"],"a":0,"e":"Default size is 3.","ch":"cs6","t":3,"id":"n1513"},{"ty":"ar","mk":1,"q":"Assertion (A): The <br> tag does not need a closing tag.\nReason (R): It is an empty tag.","a":0,"e":"Empty tags have no content, so no closing tag is needed.","ar":1,"ch":"cs6","t":1,"id":"n1514"},{"ty":"short","mk":3,"q":"Write an HTML code to display your name in a red coloured, bold heading.","m":"<h1><b><font color=\"red\">Vedika</font></b></h1> displays the name as a bold red heading. Here h1 makes the heading, b makes it bold and the font tag with color=\"red\" colours the text.","p":["h1 tag","b tag","font color"],"ch":"cs6","t":1,"id":"n1515"},{"ty":"mcq","mk":1,"q":"The tag for an unordered list is","o":["<ul>","<ol>","<li>","<dl>"],"a":0,"e":"ul stands for unordered list; bullets are shown.","ch":"cs7","t":0,"id":"n1516"},{"ty":"mcq","mk":1,"q":"Each item of a list is written using the tag","o":["<li>","<ul>","<item>","<list>"],"a":0,"e":"li stands for list item.","ch":"cs7","t":0,"id":"n1517"},{"ty":"mcq","mk":1,"q":"The type attribute of <ul> can be","o":["disc, circle or square","1, a, A","decimal","none"],"a":0,"e":"These define the bullet shape.","ch":"cs7","t":0,"id":"n1518"},{"ty":"mcq","mk":1,"q":"The tag for an ordered list is","o":["<ol>","<ul>","<li>","<dd>"],"a":0,"e":"ol stands for ordered list; numbers appear.","ch":"cs7","t":1,"id":"n1519"},{"ty":"mcq","mk":1,"q":"To start an ordered list from number 5, use","o":["<ol start=\"5\">","<ol begin=\"5\">","<ol from=\"5\">","<ol num=\"5\">"],"a":0,"e":"start sets the starting number.","ch":"cs7","t":1,"id":"n1520"},{"ty":"mcq","mk":1,"q":"To show roman numbers in an ordered list, use type equal to","o":["\"i\" or \"I\"","\"1\"","\"a\"","\"r\""],"a":0,"e":"i gives small roman and I gives capital roman numerals.","ch":"cs7","t":1,"id":"n1521"},{"ty":"mcq","mk":1,"q":"The tag pair used to create a description (definition) list is","o":["<dl>","<ol>","<ul>","<li>"],"a":0,"e":"dl is the description list.","ch":"cs7","t":2,"id":"n1522"},{"ty":"mcq","mk":1,"q":"In a description list, the term is given by","o":["<dt>","<dd>","<dl>","<li>"],"a":0,"e":"dt is the definition term.","ch":"cs7","t":2,"id":"n1523"},{"ty":"mcq","mk":1,"q":"In a description list, the description is given by","o":["<dd>","<dt>","<dl>","<li>"],"a":0,"e":"dd stands for definition description.","ch":"cs7","t":2,"id":"n1524"},{"ty":"mcq","mk":1,"q":"A list inside another list is called a","o":["nested list","ordered list","description list","main list"],"a":0,"e":"Nesting places one list in another.","ch":"cs7","t":3,"id":"n1525"},{"ty":"ar","mk":1,"q":"Assertion (A): An ordered list displays items with numbers by default.\nReason (R): The <ol> tag is used for ordered lists.","a":0,"e":"The list is numbered; R explains A.","ar":1,"ch":"cs7","t":1,"id":"n1526"},{"ty":"short","mk":3,"q":"Write the HTML code to create an ordered list of three subjects.","m":"<ol><li>Maths</li><li>Science</li><li>English</li></ol> The ol tag creates the ordered list and each li tag creates an item, shown as 1, 2, 3.","p":["ol tag","li items","closing tags"],"ch":"cs7","t":0,"id":"n1527"},{"ty":"mcq","mk":1,"q":"The tag used to insert an image is","o":["<img>","<image>","<pic>","<src>"],"a":0,"e":"It is an empty tag with the src attribute.","ch":"cs8","t":0,"id":"n1528"},{"ty":"mcq","mk":1,"q":"The attribute that gives the file name of the image is","o":["src","alt","href","link"],"a":0,"e":"src stands for source.","ch":"cs8","t":0,"id":"n1529"},{"ty":"mcq","mk":1,"q":"<img src=\"cat.jpg\"> will display the image if","o":["cat.jpg is in the same folder as the HTML file","the file is anywhere","the file is deleted","the image tag is closed"],"a":0,"e":"Otherwise the path must be given.","ch":"cs8","t":0,"id":"n1530"},{"ty":"mcq","mk":1,"q":"The attribute used to set the width of an image is","o":["width","size","w","length"],"a":0,"e":"width and height can be given in pixels.","ch":"cs8","t":1,"id":"n1531"},{"ty":"mcq","mk":1,"q":"The attribute that shows text when the image cannot be loaded is","o":["alt","title","src","text"],"a":0,"e":"alt gives the alternate text.","ch":"cs8","t":1,"id":"n1532"},{"ty":"mcq","mk":1,"q":"Which of the following is a correct image tag?","o":["<img src=\"a.png\" width=\"100\" height=\"50\">","<img href=\"a.png\">","<image src=\"a.png\">","<pic=\"a.png\">"],"a":0,"e":"It uses src, width and height.","ch":"cs8","t":1,"id":"n1533"},{"ty":"mcq","mk":1,"q":"The tag used to write H2O (2 as subscript) is","o":["<sub>","<sup>","<small>","<b>"],"a":0,"e":"The sub tag lowers text.","ch":"cs8","t":2,"id":"n1534"},{"ty":"mcq","mk":1,"q":"The tag used to write x² (2 as superscript) is","o":["<sup>","<sub>","<small>","<i>"],"a":0,"e":"The sup tag raises text.","ch":"cs8","t":2,"id":"n1535"},{"ty":"ar","mk":1,"q":"Assertion (A): The alt attribute is useful in an image tag.\nReason (R): It displays text when the image does not load.","a":0,"e":"It also helps visually impaired users; R explains A.","ar":1,"ch":"cs8","t":1,"id":"n1536"},{"ty":"short","mk":2,"q":"Write HTML code to display H2O and x2 with proper subscript and superscript.","m":"H<sub>2</sub>O displays 2 as subscript, and x<sup>2</sup> displays 2 as superscript.","p":["sub tag for H2O","sup tag for x square"],"ch":"cs8","t":2,"id":"n1537"},{"ty":"mcq","mk":1,"q":"The tag used to create a form is","o":["<form>","<input>","<table>","<fieldset>"],"a":0,"e":"The form tag encloses form controls.","ch":"cs9","t":0,"id":"n1538"},{"ty":"mcq","mk":1,"q":"The tag used to create form controls such as textbox is","o":["<input>","<form>","<textarea>","<box>"],"a":0,"e":"The type attribute decides the control.","ch":"cs9","t":0,"id":"n1539"},{"ty":"mcq","mk":1,"q":"The attribute that decides the type of input control is","o":["type","name","value","size"],"a":0,"e":"type=\"text\", \"password\", \"radio\", etc.","ch":"cs9","t":0,"id":"n1540"},{"ty":"mcq","mk":1,"q":"To create a single-line text box we use","o":["<input type=\"text\">","<input type=\"box\">","<textarea>","<input type=\"line\">"],"a":0,"e":"It accepts one line of text.","ch":"cs9","t":1,"id":"n1541"},{"ty":"mcq","mk":1,"q":"To hide the characters typed by the user, use the input type","o":["password","text","hidden","secret"],"a":0,"e":"Characters are shown as dots.","ch":"cs9","t":1,"id":"n1542"},{"ty":"mcq","mk":1,"q":"The attribute that sets the width of a text box in characters is","o":["size","width","length","cols"],"a":0,"e":"size=\"20\" gives about 20 characters.","ch":"cs9","t":1,"id":"n1543"},{"ty":"mcq","mk":1,"q":"To let the user select only one option from many, use","o":["radio buttons","check boxes","text boxes","password"],"a":0,"e":"Radio buttons with the same name allow a single selection.","ch":"cs9","t":2,"id":"n1544"},{"ty":"mcq","mk":1,"q":"To let the user select more than one option, use","o":["check boxes","radio buttons","text boxes","buttons"],"a":0,"e":"Checkboxes allow multiple selection.","ch":"cs9","t":2,"id":"n1545"},{"ty":"mcq","mk":1,"q":"For radio buttons to work as a group, they must have the same","o":["name attribute","value attribute","size attribute","id value"],"a":0,"e":"Same name groups them.","ch":"cs9","t":2,"id":"n1546"},{"ty":"mcq","mk":1,"q":"A drop-down list in a form is created with","o":["<select> and <option>","<list> and <item>","<combo> only","<dropdown>"],"a":0,"e":"Each choice is given by an option tag.","ch":"cs9","t":3,"id":"n1547"},{"ty":"mcq","mk":1,"q":"The tag used to give each choice in a drop-down list is","o":["<option>","<select>","<li>","<item>"],"a":0,"e":"The option tag is placed inside select.","ch":"cs9","t":3,"id":"n1548"},{"ty":"ar","mk":1,"q":"Assertion (A): Radio buttons are used when only one choice is allowed.\nReason (R): Radio buttons having the same name allow only one selection.","a":0,"e":"Selecting one deselects the others; R explains A.","ar":1,"ch":"cs9","t":1,"id":"n1549"},{"ty":"short","mk":3,"q":"Differentiate between radio buttons and check boxes.","m":"Radio buttons allow only one option to be selected from a group, for example gender. Check boxes allow more than one option to be selected, for example hobbies. Radio buttons in a group share the same name.","p":["Radio single choice","Checkbox multiple","Example"],"ch":"cs9","t":2,"id":"n1550"},{"ty":"mcq","mk":1,"q":"The tag used to embed audio in a web page is","o":["<audio>","<sound>","<music>","<mp3>"],"a":0,"e":"HTML5 supports the audio tag.","ch":"cs10","t":0,"id":"n1551"},{"ty":"mcq","mk":1,"q":"The attribute that gives the source file of audio is","o":["src","href","link","file"],"a":0,"e":"<audio src=\"song.mp3\">.","ch":"cs10","t":0,"id":"n1552"},{"ty":"mcq","mk":1,"q":"Which of the following is a common audio format used in web pages?","o":["MP3","DOC","XLS","EXE"],"a":0,"e":"MP3 is widely supported.","ch":"cs10","t":0,"id":"n1553"},{"ty":"mcq","mk":1,"q":"The tag used to embed a video is","o":["<video>","<movie>","<film>","<clip>"],"a":0,"e":"It plays video within the page.","ch":"cs10","t":1,"id":"n1554"},{"ty":"mcq","mk":1,"q":"Which attribute sets the dimensions of the video player?","o":["width and height","size","length","area"],"a":0,"e":"<video width=\"320\" height=\"240\">.","ch":"cs10","t":1,"id":"n1555"},{"ty":"mcq","mk":1,"q":"A commonly used video file format on the web is","o":["MP4","PDF","TXT","DOCX"],"a":0,"e":"MP4 is supported by most browsers.","ch":"cs10","t":1,"id":"n1556"},{"ty":"mcq","mk":1,"q":"The attribute that shows play/pause controls is","o":["controls","control","player","buttons"],"a":0,"e":"controls displays the player controls.","ch":"cs10","t":2,"id":"n1557"},{"ty":"mcq","mk":1,"q":"The attribute that starts playing the media automatically is","o":["autoplay","auto","start","play"],"a":0,"e":"autoplay begins as soon as the page loads.","ch":"cs10","t":2,"id":"n1558"},{"ty":"mcq","mk":1,"q":"The attribute that makes the media repeat continuously is","o":["loop","repeat","again","cycle"],"a":0,"e":"loop replays the file.","ch":"cs10","t":2,"id":"n1559"},{"ty":"ar","mk":1,"q":"Assertion (A): Without the controls attribute, the user has no player buttons for audio.\nReason (R): controls displays the play and pause buttons.","a":0,"e":"Hence the audio can't be controlled by the user; R explains A.","ar":1,"ch":"cs10","t":1,"id":"n1560"},{"ty":"short","mk":3,"q":"Write HTML code to embed an audio file with controls and loop.","m":"<audio src=\"song.mp3\" controls loop></audio> The src gives the audio file, controls shows the player controls and loop makes it repeat.","p":["audio tag","controls","loop"],"ch":"cs10","t":2,"id":"n1561"},{"ty":"mcq","mk":1,"q":"The tag used to create a table is","o":["<table>","<tab>","<tr>","<td>"],"a":0,"e":"It starts the table.","ch":"cs11","t":0,"id":"n1562"},{"ty":"mcq","mk":1,"q":"The tag used to create a table row is","o":["<tr>","<td>","<th>","<row>"],"a":0,"e":"tr stands for table row.","ch":"cs11","t":0,"id":"n1563"},{"ty":"mcq","mk":1,"q":"The tag used to create a table cell is","o":["<td>","<tr>","<th>","<cell>"],"a":0,"e":"td stands for table data.","ch":"cs11","t":0,"id":"n1564"},{"ty":"mcq","mk":1,"q":"The tag used to create a heading cell is","o":["<th>","<td>","<tr>","<head>"],"a":0,"e":"th cells appear bold and centred.","ch":"cs11","t":0,"id":"n1565"},{"ty":"mcq","mk":1,"q":"The attribute used to show borders on a table is","o":["border","line","frame","rules"],"a":0,"e":"<table border=\"1\">.","ch":"cs11","t":1,"id":"n1566"},{"ty":"mcq","mk":1,"q":"The tag <caption> is used in a table to","o":["give a title to the table","add border","add a row","colour it"],"a":0,"e":"It appears above the table.","ch":"cs11","t":1,"id":"n1567"},{"ty":"mcq","mk":1,"q":"A table having 3 rows and 4 columns needs","o":["3 <tr> tags and 4 <td> in each","4 <tr> tags","12 <tr> tags","3 <table> tags"],"a":0,"e":"Each row contains the cells for its columns.","ch":"cs11","t":1,"id":"n1568"},{"ty":"mcq","mk":1,"q":"The rowspan attribute","o":["merges cells vertically","merges cells horizontally","adds borders","adds colours"],"a":0,"e":"rowspan=\"2\" makes a cell occupy 2 rows.","ch":"cs11","t":2,"id":"n1569"},{"ty":"mcq","mk":1,"q":"rowspan is placed in the","o":["<td> or <th> tag","<table> tag","<tr> tag only","<body> tag"],"a":0,"e":"It is a cell attribute.","ch":"cs11","t":2,"id":"n1570"},{"ty":"mcq","mk":1,"q":"The colspan attribute","o":["merges cells horizontally across columns","merges rows","sets border","sets width"],"a":0,"e":"colspan=\"3\" occupies 3 columns.","ch":"cs11","t":3,"id":"n1571"},{"ty":"mcq","mk":1,"q":"To make a heading cell span 2 columns, write","o":["<th colspan=\"2\">","<th rowspan=\"2\">","<td border=\"2\">","<tr colspan=\"2\">"],"a":0,"e":"colspan is for columns.","ch":"cs11","t":3,"id":"n1572"},{"ty":"ar","mk":1,"q":"Assertion (A): The <th> tag displays text in bold and centred by default.\nReason (R): It is used for table headings.","a":0,"e":"The browser formats heading cells so; R explains A.","ar":1,"ch":"cs11","t":1,"id":"n1573"},{"ty":"short","mk":3,"q":"Differentiate between rowspan and colspan.","m":"rowspan merges two or more cells vertically down rows, while colspan merges two or more cells horizontally across columns. Both are attributes of td or th.","p":["rowspan vertical","colspan horizontal","Used in td or th"],"ch":"cs11","t":2,"id":"n1574"},{"ty":"mcq","mk":1,"q":"The tag used to create a link is","o":["<a>","<link>","<href>","<l>"],"a":0,"e":"a stands for anchor.","ch":"cs12","t":0,"id":"n1575"},{"ty":"mcq","mk":1,"q":"The attribute that gives the destination of a link is","o":["href","src","link","url"],"a":0,"e":"href stands for hypertext reference.","ch":"cs12","t":0,"id":"n1576"},{"ty":"mcq","mk":1,"q":"A link that connects to another section of the same page is","o":["an internal link","an external link","an e-mail link","a broken link"],"a":0,"e":"It uses an id or name.","ch":"cs12","t":0,"id":"n1577"},{"ty":"mcq","mk":1,"q":"A link to a page on another website is","o":["an external link","an internal link","a mail link","a local link"],"a":0,"e":"It uses the full URL.","ch":"cs12","t":1,"id":"n1578"},{"ty":"mcq","mk":1,"q":"To create a link that opens the default mail program, use href equal to","o":["mailto:name@example.com","email:name@example.com","mail:name@example.com","send:name@example.com"],"a":0,"e":"mailto is the proper protocol.","ch":"cs12","t":1,"id":"n1579"},{"ty":"mcq","mk":1,"q":"The text between <a> and </a> is called","o":["the link text","the tag","the target","the source"],"a":0,"e":"Users click on it.","ch":"cs12","t":1,"id":"n1580"},{"ty":"mcq","mk":1,"q":"The attribute that decides where the linked page opens is","o":["target","href","src","open"],"a":0,"e":"target=\"_blank\" opens in a new tab.","ch":"cs12","t":2,"id":"n1581"},{"ty":"mcq","mk":1,"q":"To open the link in a new browser tab, use target equal to","o":["_blank","_self","_top","_new"],"a":0,"e":"_blank opens a new tab or window.","ch":"cs12","t":2,"id":"n1582"},{"ty":"mcq","mk":1,"q":"The default value of target is","o":["_self","_blank","_top","_parent"],"a":0,"e":"The page opens in the same window.","ch":"cs12","t":2,"id":"n1583"},{"ty":"ar","mk":1,"q":"Assertion (A): The anchor tag is used to create a hyperlink.\nReason (R): The href attribute holds the address.","a":0,"e":"It tells the browser where to go; R explains A.","ar":1,"ch":"cs12","t":1,"id":"n1584"},{"ty":"short","mk":3,"q":"Write HTML code to link the text 'Google' to https://www.google.com so that it opens in a new tab.","m":"<a href=\"https://www.google.com\" target=\"_blank\">Google</a> The href attribute holds the address and target=\"_blank\" opens it in a new tab.","p":["anchor tag","href","target blank"],"ch":"cs12","t":1,"id":"n1585"},{"ty":"mcq","mk":1,"q":"CSS stands for","o":["Cascading Style Sheets","Creative Style Sheets","Computer Style Sheets","Colourful Style Sheets"],"a":0,"e":"It is used to style HTML pages.","ch":"cs13","t":0,"id":"n1586"},{"ty":"mcq","mk":1,"q":"In CSS, a rule has a selector and","o":["declarations inside curly braces","brackets","tags","comments"],"a":0,"e":"e.g. p { color: red; }","ch":"cs13","t":0,"id":"n1587"},{"ty":"mcq","mk":1,"q":"CSS applied directly in an HTML tag using the style attribute is","o":["inline CSS","internal CSS","external CSS","linked CSS"],"a":0,"e":"It affects only that element.","ch":"cs13","t":0,"id":"n1588"},{"ty":"mcq","mk":1,"q":"CSS written inside the <style> tag in the head is","o":["internal CSS","inline CSS","external CSS","none"],"a":0,"e":"It applies to the whole page.","ch":"cs13","t":0,"id":"n1589"},{"ty":"mcq","mk":1,"q":"An external style sheet is linked using","o":["the <link> tag","the <a> tag","the <img> tag","the <style> tag"],"a":0,"e":"It links a .css file.","ch":"cs13","t":0,"id":"n1590"},{"ty":"mcq","mk":1,"q":"The CSS property for text colour is","o":["color","text-color","font-color","fgcolor"],"a":0,"e":"It sets the colour of text.","ch":"cs13","t":1,"id":"n1591"},{"ty":"mcq","mk":1,"q":"The CSS property for background colour is","o":["background-color","bgcolor","back-color","color-bg"],"a":0,"e":"e.g. background-color: yellow;","ch":"cs13","t":1,"id":"n1592"},{"ty":"mcq","mk":1,"q":"The CSS property for border style is","o":["border-style","border-type","line-style","frame"],"a":0,"e":"e.g. solid, dashed, dotted.","ch":"cs13","t":1,"id":"n1593"},{"ty":"mcq","mk":1,"q":"The space outside the border of an element is its","o":["margin","padding","outline","float"],"a":0,"e":"Margin creates space around elements.","ch":"cs13","t":2,"id":"n1594"},{"ty":"mcq","mk":1,"q":"The CSS property to set the height of an element is","o":["height","length","size","tall"],"a":0,"e":"height: 100px;","ch":"cs13","t":2,"id":"n1595"},{"ty":"mcq","mk":1,"q":"An outline is drawn","o":["outside the border of an element","inside the content","only on tables","behind the text"],"a":0,"e":"It does not take up space.","ch":"cs13","t":2,"id":"n1596"},{"ty":"mcq","mk":1,"q":"The CSS property to change the typeface is","o":["font-family","font-type","font-name","typeface"],"a":0,"e":"font-family: Arial;","ch":"cs13","t":3,"id":"n1597"},{"ty":"mcq","mk":1,"q":"The CSS property to make text italic is","o":["font-style","font-size","text-style","font-weight"],"a":0,"e":"font-style: italic;","ch":"cs13","t":3,"id":"n1598"},{"ty":"mcq","mk":1,"q":"The CSS property used to align text to the centre is","o":["text-align","align","text-position","float"],"a":0,"e":"text-align: center;","ch":"cs13","t":3,"id":"n1599"},{"ty":"mcq","mk":1,"q":"The property used to place an image on the left with text wrapping around it is","o":["float","align","margin","position"],"a":0,"e":"float: left;","ch":"cs13","t":3,"id":"n1600"},{"ty":"ar","mk":1,"q":"Assertion (A): External CSS is preferred for large websites.\nReason (R): One style sheet can control the look of many pages.","a":0,"e":"It saves effort and keeps a consistent design; R explains A.","ar":1,"ch":"cs13","t":1,"id":"n1601"},{"ty":"short","mk":3,"q":"Write the three types of CSS with one-line explanation each.","m":"Inline CSS is written inside an element's style attribute and applies to that element only. Internal CSS is written in the style tag in the head and applies to the entire page. External CSS is written in a separate .css file linked to pages with the link tag.","p":["Inline","Internal","External"],"ch":"cs13","t":0,"id":"n1602"},{"ty":"mcq","mk":1,"q":"Netiquette means","o":["net etiquette or good behaviour online","a type of net","a computer game","a virus"],"a":0,"e":"It is a set of rules for polite online behaviour.","ch":"cs14","t":0,"id":"n1603"},{"ty":"mcq","mk":1,"q":"Which of the following is a good netiquette?","o":["Respecting others' privacy and opinions","Using ALL CAPS to shout","Spreading rumours","Sending spam"],"a":0,"e":"Courtesy should be followed online.","ch":"cs14","t":0,"id":"n1604"},{"ty":"mcq","mk":1,"q":"Netiquette is important because","o":["it helps maintain respect and safety online","it makes the Internet faster","it saves electricity","it is a law"],"a":0,"e":"It keeps the online community pleasant.","ch":"cs14","t":0,"id":"n1605"},{"ty":"mcq","mk":1,"q":"Writing a message in all capital letters is considered","o":["shouting","polite","formal","clear"],"a":0,"e":"It is poor netiquette.","ch":"cs14","t":1,"id":"n1606"},{"ty":"mcq","mk":1,"q":"While sending e-mail, one should","o":["use a meaningful subject line","leave subject blank","share others' e-mails freely","use abusive language"],"a":0,"e":"A subject line helps the receiver.","ch":"cs14","t":1,"id":"n1607"},{"ty":"mcq","mk":1,"q":"Which of the following is a bad practice on social media?","o":["Posting private photos of others without permission","Respecting copyrights","Thinking before posting","Reporting abuse"],"a":0,"e":"It violates privacy.","ch":"cs14","t":1,"id":"n1608"},{"ty":"mcq","mk":1,"q":"Harassing or threatening someone using the Internet or mobile is called","o":["cyber bullying","chatting","e-learning","browsing"],"a":0,"e":"It is a punishable offence.","ch":"cs14","t":2,"id":"n1609"},{"ty":"mcq","mk":1,"q":"If you are a victim of cyber bullying, you should","o":["tell a trusted adult and report it","reply with abuse","delete your account at once","keep it secret"],"a":0,"e":"Reporting helps stop it.","ch":"cs14","t":2,"id":"n1610"},{"ty":"mcq","mk":1,"q":"Respecting privacy online includes","o":["not sharing others' personal information","reading others' e-mails","spying","hacking"],"a":0,"e":"It is part of good digital behaviour.","ch":"cs14","t":2,"id":"n1611"},{"ty":"ar","mk":1,"q":"Assertion (A): One should not share another person's photos without their permission.\nReason (R): It violates their privacy.","a":0,"e":"Sharing without consent is unethical; R explains A.","ar":1,"ch":"cs14","t":1,"id":"n1612"},{"ty":"short","mk":3,"q":"What is cyber bullying? How can it be prevented?","m":"Cyber bullying is the use of the Internet or mobile phones to harass, threaten or embarrass someone. It can be prevented by not responding to bullies, blocking and reporting them, not sharing personal details and telling a parent or teacher.","p":["Definition","Block and report","Tell an adult"],"ch":"cs14","t":2,"id":"n1613"},{"ty":"mcq","mk":1,"q":"A software licence is","o":["a legal agreement describing how software can be used","a piece of hardware","a type of virus","an operating system"],"a":0,"e":"It lays down rules for use and distribution.","ch":"cs15","t":0,"id":"n1614"},{"ty":"mcq","mk":1,"q":"Software that is available free of cost but whose source code is not shared is","o":["freeware","open-source software","shareware","proprietary"],"a":0,"e":"Freeware can be used free but not modified.","ch":"cs15","t":0,"id":"n1615"},{"ty":"mcq","mk":1,"q":"Software which is given on a trial basis and needs payment later is","o":["shareware","freeware","open source","public domain"],"a":0,"e":"Users can try it for a limited period.","ch":"cs15","t":0,"id":"n1616"},{"ty":"mcq","mk":1,"q":"The Open Source Movement promotes","o":["software with freely available source code","expensive software","hardware","viruses"],"a":0,"e":"Anyone can use, study and modify it.","ch":"cs15","t":1,"id":"n1617"},{"ty":"mcq","mk":1,"q":"Which of the following is an open-source software?","o":["Linux","Windows","MS Office","Photoshop"],"a":0,"e":"Linux's source code is freely available.","ch":"cs15","t":1,"id":"n1618"},{"ty":"mcq","mk":1,"q":"Open source software can be","o":["modified and shared by users","modified only by the company","sold only","used by one person"],"a":0,"e":"Its source code is open.","ch":"cs15","t":1,"id":"n1619"},{"ty":"mcq","mk":1,"q":"Which of the following is a proprietary software?","o":["MS Word","LibreOffice","Linux","Firefox"],"a":0,"e":"The source code is owned by a company.","ch":"cs15","t":2,"id":"n1620"},{"ty":"mcq","mk":1,"q":"An example of an open-source office suite is","o":["LibreOffice","MS Office","Tally","Photoshop"],"a":0,"e":"It is free to use and modify.","ch":"cs15","t":2,"id":"n1621"},{"ty":"mcq","mk":1,"q":"Proprietary software is","o":["owned by a company and the code is closed","free and modifiable","available to all","always free"],"a":0,"e":"Users must purchase licence.","ch":"cs15","t":2,"id":"n1622"},{"ty":"ar","mk":1,"q":"Assertion (A): Open source software is useful for students.\nReason (R): They can use, study and modify it without paying.","a":0,"e":"Free access to the source code helps in learning; R explains A.","ar":1,"ch":"cs15","t":1,"id":"n1623"},{"ty":"short","mk":3,"q":"Differentiate between open source and proprietary software.","m":"Open source software has freely available source code that anyone can use, modify and share, for example Linux. Proprietary software is owned by an individual or company, its code is secret, and users need a licence, for example MS Office.","p":["Open source","Proprietary","Examples"],"ch":"cs15","t":2,"id":"n1624"},{"ty":"mcq","mk":1,"q":"Intellectual Property Rights (IPR) protect","o":["creations of the mind","computers","networks","software only"],"a":0,"e":"Examples include inventions and literary works.","ch":"cs16","t":0,"id":"n1625"},{"ty":"mcq","mk":1,"q":"Copyright protects","o":["original literary, artistic and software works","inventions","brand names","logos only"],"a":0,"e":"It prevents unauthorised copying.","ch":"cs16","t":0,"id":"n1626"},{"ty":"mcq","mk":1,"q":"A patent is granted for","o":["an invention","a book","a logo","a song"],"a":0,"e":"It gives the inventor exclusive rights.","ch":"cs16","t":0,"id":"n1627"},{"ty":"mcq","mk":1,"q":"A trademark is a","o":["symbol, name or logo that identifies a brand","a type of book","a licence","an invention"],"a":0,"e":"e.g. a company logo.","ch":"cs16","t":0,"id":"n1628"},{"ty":"mcq","mk":1,"q":"Using someone else's work as your own without giving credit is","o":["plagiarism","copyright","netiquette","licensing"],"a":0,"e":"It is dishonest.","ch":"cs16","t":1,"id":"n1629"},{"ty":"mcq","mk":1,"q":"One way to avoid plagiarism is to","o":["acknowledge the source of information","copy and paste","change one word","remove names"],"a":0,"e":"Citing the sources gives credit.","ch":"cs16","t":1,"id":"n1630"},{"ty":"mcq","mk":1,"q":"Paraphrasing and mentioning the source helps in","o":["avoiding plagiarism","increasing speed","installing","hacking"],"a":0,"e":"It shows honesty.","ch":"cs16","t":1,"id":"n1631"},{"ty":"mcq","mk":1,"q":"Illegal copying and distribution of software is called","o":["software piracy","downloading","sharing","licensing"],"a":0,"e":"It is a crime.","ch":"cs16","t":2,"id":"n1632"},{"ty":"mcq","mk":1,"q":"Digital property rights are rights","o":["over digital content like music, videos and software","over physical property","over land","over buildings"],"a":0,"e":"They protect the owner's digital works.","ch":"cs16","t":2,"id":"n1633"},{"ty":"mcq","mk":1,"q":"Which of the following is an act of piracy?","o":["Downloading a pirated movie","Buying a movie on a licensed platform","Watching a movie in a cinema","Writing a review"],"a":0,"e":"It violates copyright.","ch":"cs16","t":2,"id":"n1634"},{"ty":"ar","mk":1,"q":"Assertion (A): Plagiarism is an unethical act.\nReason (R): It is the use of another's work without credit.","a":0,"e":"It is a form of intellectual theft; R explains A.","ar":1,"ch":"cs16","t":1,"id":"n1635"},{"ty":"short","mk":3,"q":"What is plagiarism? Give two ways to avoid it.","m":"Plagiarism is copying someone's ideas, words or work and presenting them as your own. It can be avoided by quoting or paraphrasing the content and acknowledging the source, and by using your own words.","p":["Definition","Acknowledge source","Use own words"],"ch":"cs16","t":1,"id":"n1636"},{"ty":"mcq","mk":1,"q":"Freedom of information means","o":["the right of people to access information held by public bodies","freedom from work","free software","free Internet only"],"a":0,"e":"It supports transparency in government.","ch":"cs17","t":0,"id":"n1637"},{"ty":"mcq","mk":1,"q":"The Right to Information Act in India was passed in","o":["2005","1995","2015","1985"],"a":0,"e":"It gives citizens the right to ask for government information.","ch":"cs17","t":0,"id":"n1638"},{"ty":"mcq","mk":1,"q":"Freedom of information must be balanced with","o":["privacy and security","speed","colours","games"],"a":0,"e":"Some information cannot be shared openly.","ch":"cs17","t":0,"id":"n1639"},{"ty":"mcq","mk":1,"q":"The digital divide is the gap between","o":["people who have access to technology and those who do not","computers and phones","two networks","two programs"],"a":0,"e":"It separates the connected and the unconnected.","ch":"cs17","t":1,"id":"n1640"},{"ty":"mcq","mk":1,"q":"One cause of the digital divide is","o":["lack of money and infrastructure","too many computers","too many teachers","free Internet"],"a":0,"e":"Poverty and poor networks are causes.","ch":"cs17","t":1,"id":"n1641"},{"ty":"mcq","mk":1,"q":"The digital divide can be reduced by","o":["providing low-cost Internet and training","closing schools","banning computers","raising prices"],"a":0,"e":"It improves access and skills.","ch":"cs17","t":1,"id":"n1642"},{"ty":"ar","mk":1,"q":"Assertion (A): The digital divide leads to unequal opportunities.\nReason (R): People without access to technology get fewer opportunities in education and jobs.","a":0,"e":"Hence the divide widens inequality; R explains A.","ar":1,"ch":"cs17","t":1,"id":"n1643"},{"ty":"short","mk":2,"q":"What is the digital divide? Mention one cause.","m":"The digital divide is the gap between people who have access to modern information technology and those who do not. One cause is poverty or the lack of Internet infrastructure in rural areas.","p":["Meaning","One cause"],"ch":"cs17","t":1,"id":"n1644"},{"ty":"mcq","mk":1,"q":"Electronic commerce (e-commerce) means","o":["buying and selling goods or services over the Internet","reading e-mail","making websites","playing games"],"a":0,"e":"Examples are Amazon and Flipkart.","ch":"cs18","t":0,"id":"n1645"},{"ty":"mcq","mk":1,"q":"A good practice while shopping online is to","o":["check that the website is secure","share your password","use public Wi-Fi","ignore reviews"],"a":0,"e":"Look for https and a padlock.","ch":"cs18","t":0,"id":"n1646"},{"ty":"mcq","mk":1,"q":"Which of these information should NOT be shared with strangers online?","o":["OTP and passwords","a favourite colour","a hobby","a school subject"],"a":0,"e":"OTPs and passwords are confidential.","ch":"cs18","t":0,"id":"n1647"},{"ty":"mcq","mk":1,"q":"Phishing is","o":["an attempt to steal personal information by fake e-mails or websites","a type of fishing","a game","a browser"],"a":0,"e":"It tricks users into sharing passwords or card numbers.","ch":"cs18","t":1,"id":"n1648"},{"ty":"mcq","mk":1,"q":"Identity theft is","o":["stealing someone's personal information to impersonate them","stealing a computer","losing a phone","buying a phone"],"a":0,"e":"It is used for fraud.","ch":"cs18","t":1,"id":"n1649"},{"ty":"mcq","mk":1,"q":"If you receive an e-mail claiming you won a prize and asking for your bank details, you should","o":["ignore and report it","reply with details","forward it","click the link"],"a":0,"e":"It is likely a phishing attempt.","ch":"cs18","t":1,"id":"n1650"},{"ty":"mcq","mk":1,"q":"Data is encrypted during transmission to","o":["keep it secure from unauthorised people","speed it up","compress it","make it larger"],"a":0,"e":"Encryption scrambles data.","ch":"cs18","t":2,"id":"n1651"},{"ty":"mcq","mk":1,"q":"SSL stands for","o":["Secure Sockets Layer","Simple Socket Link","Secure System Layer","Safe Sockets Link"],"a":0,"e":"It provides secure communication.","ch":"cs18","t":2,"id":"n1652"},{"ty":"mcq","mk":1,"q":"The padlock symbol in the address bar of a browser shows that","o":["the connection is encrypted","the site is free","the site is fast","the site is old"],"a":0,"e":"It indicates HTTPS.","ch":"cs18","t":2,"id":"n1653"},{"ty":"ar","mk":1,"q":"Assertion (A): Phishing is a cyber crime.\nReason (R): It involves cheating people into revealing confidential information.","a":0,"e":"It is a type of online fraud; R explains A.","ar":1,"ch":"cs18","t":1,"id":"n1654"},{"ty":"short","mk":3,"q":"What is phishing? List two precautions against it.","m":"Phishing is a fraud in which attackers send fake e-mails or websites that look genuine to steal personal information such as passwords and card details. Precautions: do not click on suspicious links, never share OTP or passwords, and check the URL for https.","p":["Meaning","Do not click suspicious links","Never share OTP"],"ch":"cs18","t":1,"id":"n1655"},{"ty":"mcq","mk":1,"q":"In the HTML lab test, a web page has to be created from","o":["a given diagram","a book","a game","a video"],"a":0,"e":"The practical exam asks students to create a page from a given layout.","ch":"csb","t":0,"id":"n1656"},{"ty":"mcq","mk":1,"q":"In the practical exam for Computer Applications, the report file should contain","o":["at least 10 HTML pages (as per syllabus)","2 pages","only theory","poems"],"a":0,"e":"Check the latest syllabus for the exact count.","ch":"csb","t":0,"id":"n1657"},{"ty":"mcq","mk":1,"q":"A good report file for the practical includes","o":["well-organised printouts of HTML code and outputs","only the cover","random pages","games"],"a":0,"e":"It shows your practice.","ch":"csb","t":1,"id":"n1658"},{"ty":"mcq","mk":1,"q":"A project in Computer Applications is generally made","o":["using HTML and CSS to build a small website","using only paper","with hardware","using games"],"a":0,"e":"The project demonstrates the unit's skills.","ch":"csb","t":2,"id":"n1659"},{"ty":"mcq","mk":1,"q":"In the viva voce, you may be asked","o":["questions about HTML tags and your project","nothing","about cooking","about sports"],"a":0,"e":"Prepare tags and attributes.","ch":"csb","t":3,"id":"n1660"}];

var QZ=null,OVN=null;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function dueQs(){var t=today(),o=[];Object.keys(S.srs).forEach(function(u){if(S.srs[u].due<=t&&QBY[u]&&qActive(QBY[u]))o.push(QBY[u])});return o}
function matchQ(q,f){if(!qActive(q))return false;if(f.pre&&!isPre(q.ch))return false;if(f.sub&&CH[q.ch].s.id!==f.sub)return false;if(f.ch&&q.ch!==f.ch)return false;if(f.src==='sqp'&&q.src!=='sqp2526')return false;if(f.src==='own'&&q.src!=='own')return false;
 if(f.ty&&q.ty!==f.ty)return false;if(f.mk&&q.mk!==+f.mk)return false;if(f.flag&&!(q.t!=null&&tflag(q.ch,q.t)))return false;return true}
function pickQs(f,n){var pool=QB.filter(function(q){return matchQ(q,f)});var sc=function(q){var s=S.qs[q.uid];return (!s?0:(s.w?1:2))+Math.random()*0.9};
 pool.sort(function(a,b){return sc(a)-sc(b)});return pool.slice(0,n)}
function ovOpen(h){var o=document.getElementById('ov');o.hidden=false;o.innerHTML='<div class="in">'+h+'</div>';o.scrollTop=0}
function ovClose(){var o=document.getElementById('ov');o.hidden=true;o.innerHTML='';QZ=null;render()}
function startQuiz(o){if(!o.qs.length){toast('No questions for that choice yet');return}QZ={qs:o.qs,i:0,res:[],title:o.title||'Quiz',done:o.done||null,kind:o.kind||'quiz',locked:false,ses:(o.done===sesNext),targets:o.targets||null};if(!SES)TM.s=0;showQ()}
function showQ(){var q=QZ.qs[QZ.i],n=QZ.qs.length;var tyN={mcq:'MCQ',ar:'Assertion–Reason',case:'Case-based',short:'Short answer'}[q.ty];
 var h='<div class="row"><b class="grow">'+esc(QZ.title)+' · '+(QZ.i+1)+'/'+n+'</b>'+brkBtn()+'<button data-a="qstop">Stop</button></div><div class="bar thin"><i class="b" style="width:'+Math.round(QZ.i*100/n)+'%"></i></div>';
 h+='<div class="mochi" id="qm">'+mochiSvg('')+'<div class="bubble small">'+esc(q.ty==='short'?'Say your answer out loud or jot it down first — then check!':'Take your time. One try per question — that is how it sticks.')+'</div></div>';
 h+='<div class="card"><span class="chip">'+tyN+'</span><span class="chip">'+q.mk+' mark'+(q.mk>1?'s':'')+'</span>'+(q.src==='sqp2526'?'<span class="chip ok">🏛️ Official CBSE sample paper</span>':'<span class="chip off">✏️ Practice</span>')+'<span class="chip">'+esc(CH[q.ch].c.n)+'</span>';
 if(q.cs)h+='<div class="case">'+esc(q.cs)+'</div>';h+='<div class="q">'+esc(q.q)+'</div>';
 if(q.ty==='short'){h+='<button class="pri full" data-a="qshow">Show model answer</button><div id="qfb"></div>'}
 else{var ord=(q.src==='own'&&q.ty!=='ar')?shuffle([0,1,2,3].slice(0,q.o.length)):q.o.map(function(x,i){return i});QZ.ord=ord;
  ord.forEach(function(oi,k){h+='<button class="opt" data-a="qopt" data-k="'+k+'"><span class="l">'+'ABCD'[k]+'</span><span>'+esc(q.o[oi])+'</span></button>'});h+='<div id="qfb"></div>';}
 h+='</div>';QZ.locked=false;ovOpen(h)}
function srcLine(q){return q.src==='sqp2526'?'<div class="src">Source: CBSE Sample Question Paper 2025-26 ('+esc(q.id)+'), cbseacademic.nic.in — official question and marking scheme'+(q.id.indexOf('SQP-M-')===0&&/1[6-9]/.test(q.id)?'':'')+'.</div>':'<div class="src">Source: self-written practice question in CBSE board style (not from a past paper).</div>'}
function recordAnswer(q,c){var t=today(),st=S.qs[q.uid]||(S.qs[q.uid]={n:0,w:0}),r=D(t);st.n++;r.qa=(r.qa||0)+1;if(c===1)r.qc=(r.qc||0)+1;
 var xpq=r.xq||0,gain=0;
 if(c===1){if(!st.x||diff(st.x,t)>=3){gain=2;st.x=t}}else if((r.xe||0)<15){gain=1;r.xe=(r.xe||0)+1}
 if(xpq+gain>60)gain=Math.max(0,60-xpq);r.xq=xpq+gain;addXP(gain);if(QZ)QZ.xa=(QZ.xa||0)+gain;
 var sr=S.srs[q.uid];
 if(c<1){S.srs[q.uid]={b:0,due:addD(t,INT[0])};st.w++;if(c===0&&q.t!=null&&!(QZ&&QZ.kind==='topic'))flagTopic(q.ch,q.t);}
 else if(sr&&sr.due<=t&&sr.l!==t){var b=sr.b+1;if(b>=INT.length)delete S.srs[q.uid];else S.srs[q.uid]={b:b,due:addD(t,INT[b]),l:t};}
 if(c===1&&q.t!=null&&!(QZ&&QZ.kind==='topic')){var tp=TP(q.ch,q.t);if(tp.s>=1){if(tp.cd.indexOf(t)<0)tp.cd.push(t);if(tp.cd.length>=2){tp.s=2;tp.f=false;}}}
 save();return gain}
function answered(c,q,extra){QZ.res.push({q:q,c:c});var g=recordAnswer(q,c);var fb=document.getElementById('qfb');var last=QZ.i>=QZ.qs.length-1;
 var msg=c===1?pickMsg('right',QZ.i):pickMsg('wrong',QZ.i);
 fb.innerHTML='<div class="fb '+(c===1?'ok':'bad')+'"><b>'+(c===1?'✅ Correct!':(c===0.5?'🟡 Partly there':'❌ Not quite'))+(g?' +'+g+' XP':'')+'</b><div>'+(extra||'')+'</div><div class="mute small" style="margin-top:6px">'+esc(msg)+'</div>'+srcLine(q)+(c<1?'<div class="small" style="margin-top:6px">📌 Added to your revision queue — it will come back in 1 day.'+(c===0&&q.t!=null?' Topic flagged ⭐ Needs work.':'')+'</div>':'')+'</div><button class="pri full" data-a="qnext">'+(last?'See my score':'Next question →')+'</button>';
 mochiReact(document.getElementById('qm'),c===1?'right':(c===0.5?'right':'wrong'));fb.scrollIntoView({behavior:'smooth',block:'nearest'})}
function qOpt(k){if(QZ.locked)return;QZ.locked=true;var q=QZ.qs[QZ.i],oi=QZ.ord[k],ok=oi===q.a;var btns=document.querySelectorAll('.opt');
 QZ.ord.forEach(function(o,kk){if(o===q.a)btns[kk].classList.add('ok');});if(!ok)btns[k].classList.add('bad');btns.forEach(function(b){b.disabled=true});
 answered(ok?1:0,q,'<b>Answer: '+esc(q.o[q.a])+'</b><br>'+esc(q.e))}
function qShow(){if(QZ.locked)return;var q=QZ.qs[QZ.i];QZ.locked=true;document.querySelector('[data-a=qshow]').remove();
 var fb=document.getElementById('qfb');fb.innerHTML='<div class="fb ok"><b>Model answer</b><div style="white-space:pre-wrap">'+esc(q.m)+'</div><b class="small">CBSE marking points ('+q.mk+' mark'+(q.mk>1?'s':'')+'):</b><ul class="pts">'+q.p.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div><div class="center"><b>How did you do?</b></div><div class="row"><button class="ok grow" data-a="qself" data-c="1">Got it ✅</button><button class="grow" data-a="qself" data-c="0.5">Partly 🟡</button><button class="grow" data-a="qself" data-c="0">Not yet ❌</button></div><div id="qfb2"></div>'}
function qSelf(c){if(QZ.selfDone)return;QZ.selfDone=true;var q=QZ.qs[QZ.i];QZ.res.push({q:q,c:c});var g=recordAnswer(q,c);
 document.querySelectorAll('[data-a=qself]').forEach(function(b){b.disabled=true});var last=QZ.i>=QZ.qs.length-1;
 document.getElementById('qfb2').innerHTML='<div class="fb '+(c===1?'ok':'bad')+'">'+(g?'+'+g+' XP · ':'')+esc(c===1?pickMsg('right',QZ.i):pickMsg('wrong',QZ.i))+srcLine(q)+(c<1?'<div class="small">📌 Added to your revision queue (back in 1 day).</div>':'')+'</div><button class="pri full" data-a="qnext">'+(last?'See my score':'Next question →')+'</button>';
 mochiReact(document.getElementById('qm'),c>0?'right':'wrong')}
function qNext(){QZ.selfDone=false;if(QZ.i<QZ.qs.length-1){QZ.i++;showQ()}else quizEnd()}
function quizEnd(){var res=QZ.res,tot=res.length,sc=0;res.forEach(function(r){sc+=r.c});var t=today(),by={},zid='z'+Date.now()+Math.floor(Math.random()*1000);
 res.forEach(function(r){var b=by[r.q.ch]||(by[r.q.ch]={s:0,t:0});b.s+=r.c;b.t++});
 Object.keys(by).forEach(function(ch){var cs=CS(ch);cs.qs.push({d:t,s:by[ch].s,t:by[ch].t,z:zid});if(cs.qs.length>20)cs.qs.shift()});
 var r=D(t);r.zq=r.zq||[];var sn=SUBJECTS.filter(function(s){return res.every(function(x){return CH[x.q.ch].s.id===s.id})})[0];
 var name=sn?sn.name.split(' (')[0]:'Mixed';var z={id:zid,s:Math.round(sc*10)/10,t:tot,n:name,qa:tot,qc:res.filter(function(x){return x.c===1}).length};r.zq.push(z);
 var p=sc/tot,kind=p>=0.8?'quiz_good':(p>=0.5?'quiz_ok':'quiz_low');var bonus=p>=0.8?5:0;addXP(bonus);z.xa=QZ.xa||0;z.x=z.xa+bonus;var tq=topicQuizRecord(res,t,zid,z);save();
 var flagged={};res.forEach(function(x){if(x.c===0&&x.q.t!=null)flagged[x.q.ch+':'+x.q.t]=1});
 var h='<div class="center"><h1>'+z.s+' / '+tot+'</h1><div class="mute">'+(p>=0.8?'Excellent! 🌟':p>=0.5?'Good effort! 🌱':'Brave try! 💛')+(bonus?' · +5 XP bonus':'')+'</div></div>'+mochiBox(p>=0.5?'cheer':'enc',pickMsg(kind,tot));
 var fl=Object.keys(flagged);if(fl.length)h+='<div class="card"><b>⭐ Flagged as “Needs work”:</b><ul class="pts">'+fl.map(function(k){var a=k.split(':');return '<li>'+esc(tname(a[0],+a[1]))+' <span class="mute">('+esc(CH[a[0]].c.n)+')</span></li>'}).join('')+'</ul><div class="mute small">They will return in your revision queue and in extra “weak spot” slots.</div></div>';
 h+=tq+'<button class="pri big" data-a="qdone">Done</button><div style="height:10px"></div><button class="full" data-a="winq">Share my win 🎉</button>';
 var cb=QZ.done;QZ.res=res;QZ.fin=true;QZ.cb=cb;ovOpen(h);setTimeout(function(){mochiReact(document.getElementById('ov'),p>=0.5?'right':'wrong')},200);window._lastQ=z;
 var st=stats();if(p>=0.8&&false){}}
/* ---- completing tasks / session ---- */
function logDone(key,title,sub,min){var t=today(),r=D(t);if(r.d.some(function(x){return x.k===key}))return null;var first=r.d.length===0,ev={first:first};
 if(first){var pre=stats();var st0=pre;var yb=st0.lastBreak&&!Object.keys(st0.st).some(function(d){return d>st0.lastBreak&&st0.st[d]==='studied'});if(yb&&st0.cur===0){ev.comeback=true;addXP(20);}}
 var ent={k:key,t:title,s:sub,m:min,x:(ev.comeback?20:0)};r.d.push(ent);ev.e=ent;r.min=(r.min||0)+min;
 if(first){var s2=stats();ev.streak=s2.cur;if([3,5,7,10,14,21,30,50,75,100].indexOf(s2.cur)>=0)ev.milestone=s2.cur;}
 return ev}
function completeTask(k){var m=k.m;var ev=logDone(k.k,k.title,k.sub,m);var xp=0;
 if(k.kind==='learn'){k.ts.forEach(function(i){setCovered(k.ch,i,true)});xp=15}
 else if(k.kind==='rev'){var cs=CS(k.ch);if(k.r===1)cs.r1=1;else cs.r2=1;xp=10}
 else if(k.kind==='cyc'){var c2=CS(k.ch);if(!c2.r1)c2.r1=1;else c2.r2=1;xp=10}
 else if(k.kind==='weak'){if(k.ts){TP(k.ch,k.ts[0]).fx=today()}xp=10}
 else xp=10;
 if(ev){addXP(xp);if(ev.e)ev.e.x=(ev.e.x||0)+xp}save();checkGoals();return ev}
function checkGoals(){var w=wkStart(today());(S.goals[w]||[]).forEach(function(g){if(!g.x&&goalProg(g).done){g.x=1;addXP(25);toast('🏆 Goal reached: '+goalLabel(g)+' (+25 XP)')}});save()}
function goalProg(g){var w=wkStart(today()),v=0,k;for(k=0;k<7;k++){var r=S.days[addD(w,k)];if(!r)continue;if(g.type==='topics')v+=r.tp||0;else if(g.type==='quiz')v+=r.qa||0;else if(g.type==='days'&&dayStatus(addD(w,k))==='studied')v++}
 if(g.type==='custom')return {v:g.dn?1:0,n:1,done:!!g.dn};return {v:v,n:g.n,done:v>=g.n}}
function goalLabel(g){return g.type==='topics'?'Cover '+g.n+' topics':g.type==='quiz'?'Answer '+g.n+' quiz questions':g.type==='days'?'Study on '+g.n+' days':g.txt}
var SES=null;
function startSession(mini){var tasks=todayTasks().filter(function(k){return !isDone(k)});var steps=[];var due=dueQs();
 if(mini){var qs=due.length?shuffle(due).slice(0,5):pickQs({flag:true},5);if(qs.length<5)qs=qs.concat(pickQs({},5-qs.length));steps.push({t:'quiz',qs:qs.slice(0,5),title:'10-minute mini session'});steps.push({t:'minlog'});}
 else{if(due.length)steps.push({t:'quiz',qs:shuffle(due).slice(0,modeToday()===1?4:6),title:'Revision warm-up'});
  tasks.forEach(function(k){steps.push({t:'task',k:k})});
  steps.push({t:'recap'});}
 steps.push({t:'wrap'});SES={steps:steps,i:-1,ev:null,learned:[],mini:!!mini,doneN:0};sesNext()}
function sesNext(){SES.i++;var s=SES.steps[SES.i];if(!s){ovClose();return}
 if(s.t==='quiz'){startQuiz({qs:s.qs,title:s.title,done:sesNext,kind:'ses'})}
 else if(s.t==='task')showTaskStep(s.k);
 else if(s.t==='tqoffer')showTqOffer(s);
 else if(s.t==='minlog'){var ev=logDone('MIN','10-minute mini session','maths',10);if(ev){addXP(10);if(ev.e)ev.e.x=(ev.e.x||0)+10;SES.ev=ev}save();checkGoals();sesNext()}
 else if(s.t==='recap'){var chs={};SES.learned.forEach(function(k){chs[k.ch]=1});var ids=Object.keys(chs);var qs=[];ids.forEach(function(c){qs=qs.concat(pickQs({ch:c},3))});qs=shuffle(qs).slice(0,5);
  if(qs.length)startQuiz({qs:qs,title:'Recap quiz',done:sesNext,kind:'ses'});else sesNext()}
 else wrapSession()}
function showTaskStep(k){var s=SUB[k.sub];var h='<div class="row"><b class="grow">Step: '+esc(s.emoji+' '+s.name.split(' (')[0])+'</b>'+brkBtn()+'<button data-a="qstop">Stop</button></div>'+mochiBox('','Do just this one thing. I will wait here 🍡');
 h+='<div class="card" style="border-left:8px solid '+s.color+'"><h2>'+esc(k.title)+'</h2><div class="mute">≈ '+k.m+' min</div><p>'+esc(k.desc)+'</p>';
 if(k.ts)h+='<ul class="pts">'+k.ts.map(function(i){return '<li>'+esc(tname(k.ch,i))+'</li>'}).join('')+'</ul>';h+='</div>';

 ovOpen('<div class="row"><b class="grow">Topic done 🎉</b></div>'+mochiBox('cheer','Well done, Vedika! Quick quiz on '+nm+'? '+s.qs.length+' questions — your score is saved.')+'<button class="pri big" data-a="tqGo">Quick quiz ▶</button><div style="height:10px"></div><button class="full" data-a="tqSkip">Skip for now</button>');setTimeout(function(){mochiReact(document.getElementById('ov'),'right')},150)}
function topicQuizRecord(res,t,zid,z){var tg=QZ.targets;if(QZ.kind!=='topic'||!tg)return '';z.n=z.n+' topic quiz';
 var by={};res.forEach(function(r){var k=r.q.ch+':'+r.q.t;if(tg.indexOf(k)<0)return;var b=by[k]||(by[k]={s:0,t:0});b.s+=r.c;b.t++});
 var out='';Object.keys(by).forEach(function(k){var a=k.split(':'),c=a[0],i=+a[1],b=by[k],p=b.s/b.t,tp=TP(c,i),msg='';(tp.qz=tp.qz||[]).push({d:t,s:Math.round(b.s*10)/10,t:b.t,z:zid});if(tp.qz.length>12)tp.qz.shift();
  if(tp.s>=1){
   if(b.t>=3&&p>=0.8){if(tp.cd.indexOf(t)<0)tp.cd.push(t);if(tp.cd.length>=2){tp.s=2;tp.f=false;msg='💪 Strong'}else msg='✅ Covered · one more good quiz on another day makes it Strong 💪'}
   else if(p<0.6){flagTopic(c,i);msg='⭐ Needs work — it will come back in your revision'}
   else msg='✅ Covered · aim for 80% to move towards Strong'}
  out+='<li>'+esc(tname(c,i))+': <b>'+(Math.round(b.s*10)/10)+'/'+b.t+'</b> — '+msg+'</li>'});
 return out?'<div class="card"><b>Topic status (saved '+fmt(t)+')</b><ul class="pts">'+out+'</ul><div class="mute small">Wrong answers are added to your 1-3-7-21 day revision queue.</div></div>':''}
/* ---- breaks ---- */
var TM={s:0,last:0,n:0},BRK=null;
function fmtClock(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+pad(sec%60)}
function brkBtn(){return '<span class="chip" id="clk">⏱ '+fmtClock(TM.s)+'</span><button data-a="brk" aria-label="Take a break">☕ Take a break</button>'}
function brkTxt(r){var o='';if(r&&r.act)o+=' · ⏱ '+Math.round(r.act/60)+' min active';if(r&&r.brk)o+=' · ☕ '+Math.max(1,Math.round(r.brk/60))+' min break';return o}
function brkStat(){var w=wkStart(today()),n=0;for(var k=0;k<7;k++){var r=S.days[addD(w,k)];if(r&&r.brk)n+=r.brk}return '<div class="stat">☕ Breaks this week<b>'+Math.round(n/60)+' min</b><span class="mute small">logged separately · never counts as missed</span></div>'}
setInterval(function(){var ov=document.getElementById('ov');if(!ov||ov.hidden||!S||S.pause||document.hidden||!((QZ&&!QZ.fin)||SES)){TM.last=0;return}var n=Date.now();if(TM.last&&n-TM.last<4000){var dt=(n-TM.last)/1000;TM.s+=dt;var r=D(today());r.act=(r.act||0)+dt;TM.n++;var c=document.getElementById('clk');if(c)c.textContent='⏱ '+fmtClock(TM.s);if(TM.n%20===0)save()}TM.last=n},1000);
function packSteps(steps){return steps.map(function(st){if(st.qs){var o={};for(var k in st)o[k]=st[k];o.qs=st.qs.map(function(q){return q.uid});return o}return st})}
function pausePack(){var p={at:Date.now(),day:today(),tm:TM.s,what:'',ses:null,qz:null};
 var inQ=QZ&&!QZ.fin,inS=SES&&(!inQ||QZ.ses||QZ.kind==='mock');
 if(inS)p.ses={i:SES.i,ev:SES.ev||null,learned:SES.learned||[],mini:SES.mini,doneN:SES.doneN||0,cur:SES.cur||null,steps:packSteps(SES.steps)};
 if(inQ){var done=QZ.res.length>QZ.i;p.qz={qs:QZ.qs.map(function(q){return q.uid}),i:QZ.i+(done?1:0),res:QZ.res.map(function(r){return [r.q.uid,r.c]}),title:QZ.title,kind:QZ.kind,ses:!!QZ.ses,xa:QZ.xa||0,targets:QZ.targets||null};p.what=QZ.title+' — question '+Math.min(p.qz.i+1,QZ.qs.length)+' of '+QZ.qs.length}
 else if(inS&&SES.cur)p.what=SES.cur.title;
 return p}
function takeBreak(){if(S.pause)return;if(!((QZ&&!QZ.fin)||SES)){toast('Nothing to pause right now');return}S.pause=pausePack();save();showBreak()}
function showBreak(){var p=S.pause;if(!p)return;
 var h='<div class="center" style="padding-top:14px"><div class="brkwrap">'+mochiSvg('rest')+'<span class="zz z1">z</span><span class="zz z2">Z</span><span class="zz z3">z</span><span class="cup">☕</span></div><h1>Break time 🌙</h1><div class="mute">Mochi is having tea. Your place is saved — even if you close the app.</div></div>';
 h+='<div class="card center"><div class="mute small">Break so far</div><div class="bigclk" id="bclk">'+fmtClock((Date.now()-p.at)/1000)+'</div><div class="small" style="margin-top:6px">Paused: <b>'+esc(p.what||'your session')+'</b></div><div class="mute small" style="margin-top:6px">Break time is logged separately from study time and never counts as a missed day. ('+fmt(p.day)+', started '+new Date(p.at).toTimeString().slice(0,5)+')</div></div>';
 h+='<button class="pri big" data-a="resume">▶ Resume where I left off</button><div style="height:10px"></div><button class="full" data-a="brkHome">Back to home — I’ll resume later</button>';
 ovOpen(h);clearInterval(BRK);BRK=setInterval(function(){var e=document.getElementById('bclk');if(!e||!S.pause){clearInterval(BRK);return}e.textContent=fmtClock((Date.now()-S.pause.at)/1000)},1000)}
function resumeNow(){var p=S.pause;if(!p)return;clearInterval(BRK);var secs=Math.min(3600,Math.max(0,Math.round((Date.now()-p.at)/1000)));
 var r=D(p.day);r.brk=(r.brk||0)+secs;r.bn=(r.bn||0)+1;(r.bl=r.bl||[]).push({s:secs,a:new Date(p.at).toTimeString().slice(0,5)});
 S.pause=null;TM.s=p.tm||0;TM.last=0;
 if(p.ses){SES={steps:p.ses.steps.map(function(st){if(st.qs){var o={};for(var k in st)o[k]=st[k];o.qs=st.qs.map(function(u){return QBY[u]}).filter(Boolean);return o}return st}),i:p.ses.i,ev:p.ses.ev,learned:p.ses.learned||[],mini:p.ses.mini,doneN:p.ses.doneN,cur:p.ses.cur}}
 save();
 if(p.qz){var z=p.qz;QZ={qs:z.qs.map(function(u){return QBY[u]}).filter(Boolean),i:z.i,res:z.res.map(function(a){return {q:QBY[a[0]],c:a[1]}}).filter(function(x){return x.q}),title:z.title,kind:z.kind||'quiz',ses:!!z.ses,locked:false,xa:z.xa||0,targets:z.targets||null,done:null};
  if(QZ.ses)QZ.done=sesNext;else if(QZ.kind==='mock')QZ.done=function(){showTaskStep(SES.cur)};
  if(!QZ.qs.length)ovClose();else if(QZ.i>=QZ.qs.length)quizEnd();else showQ()}
 else if(SES){var st=SES.steps[SES.i];if(st&&st.t==='task')showTaskStep(SES.cur||st.k);else sesNext()}
 else{ovClose()}
 toast('Welcome back! Break logged ☕')}
function resumeCard(){var p=S.pause;if(!p)return '';return '<div class="card" style="border-left:8px solid var(--pri)"><div class="mochi">'+mochiSvg('rest')+'<div class="bubble"><b>You’re on a break ☕</b><br>Paused: '+esc(p.what||'your session')+'<br><span class="mute small">'+fmt(p.day)+' · saved, nothing is lost</span></div></div><button class="pri big" data-a="resume">▶ Resume</button></div>'}
function hindiSwitch(){var b=S.hindi==='B'?'B':'A';return '<div class="card" style="margin-left:10px"><b>Hindi course</b><div class="seg"><button data-a="hindi" data-v="A" class="'+(b==='A'?'on':'')+'">Course A</button><button data-a="hindi" data-v="B" class="'+(b==='B'?'on':'')+'">Course B</button></div><div class="mute small">Course A (code 002): Kshitij, Kritika + grammar. Course B (code 085): Sparsh &amp; Sanchayan + grammar. Check which one your school uses — your progress is kept for each course.</div></div>'}
Object.assign(ACT,{
 opre:function(d){UI.preSub=UI.preSub===d.id?null:d.id;render()},
 ptick:function(d){S.preSel[d.c]=!isPre(d.c);S.preMod[CH[d.c].s.id]=true;S.snap=null;save();render()},
 pall:function(d){var s=SUB[d.id];s.chapters.forEach(function(c){if(c.bonus)return;if(d.v==='d')delete S.preSel[c.id];else S.preSel[c.id]=d.v==='1'});if(d.v==='d')delete S.preMod[d.id];else S.preMod[d.id]=true;S.snap=null;save();render()},
 preQuiz:function(d){var qs=pickPreQs(d.sub||'',d.sub?10:15);if(!qs.length){toast('No pre-board chapters ticked yet');return}startQuiz({qs:qs,title:'Pre-board quiz'+(d.sub?' · '+SUB[d.sub].name.split(' (')[0]:''),kind:'quiz'})},
 tquiz:function(d){var i=+d.i,qs=topicQs(d.c,[i]);if(!qs.length){toast('No questions yet');return}startQuiz({qs:qs,title:'Quick quiz: '+tname(d.c,i).slice(0,40),kind:'topic',targets:tqTargets(d.c,[i])})},
 tqGo:function(){var s=SES.steps[SES.i];startQuiz({qs:s.qs,title:'Quick quiz: '+tname(s.tq.ch,s.tq.ts[0]).slice(0,40),done:sesNext,kind:'topic',targets:tqTargets(s.tq.ch,s.tq.ts)})},
 tqSkip:function(){sesNext()},
 brk:takeBreak,resume:resumeNow,brkHome:function(){clearInterval(BRK);ovClose()},
 hindi:function(d){var v=d.v;if(v===S.hindi)return;confirmM('Switch Hindi to <b>Course '+v+'</b>? '+(v==='B'?'Course B uses Sparsh and Sanchayan.':'Course A uses Kshitij and Kritika.')+' Progress for each course is kept. The plan will be rebuilt.',function(){S.hindi=v;applyHindi();S.snap=null;save();render();toast('Hindi is now Course '+v)},'Switch')}
});

load();recalcAll();save();render();if(S.pause)showBreak();
</script></body></html>
