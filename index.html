"e":"A is true. R is also true, but the Third Estate's demand was for one vote per member; the reason for convening it was financial. R does not explain A.","ar":1,"ch":"hi1","t":0,"id":"n537"},{"ty":"case","mk":1,"cs":"Bismarck's 'blood and iron' policy led to the Prussian army, with the help of the bureaucracy, fighting three wars over seven years with Austria, Denmark and France.","q":"These wars ended in Prussian victory and the completion of the process of","o":["German unification","Italian unification","the Greek revolt","the French Revolution"],"a":0,"e":"The German Empire was proclaimed in 1871 after victory over France.","ch":"hi1","t":2,"id":"n538"},{"ty":"short","mk":3,"q":"Explain any three steps taken by the French revolutionaries to create a sense of collective identity among the French people.","m":"The ideas of la patrie (the fatherland) and le citoyen (the citizen) emphasised a united community with equal rights. A new French flag, the tricolour, replaced the royal standard. The Estates General was renamed the National Assembly, new hymns were composed, oaths taken and martyrs commemorated, a central administrative system made laws for all citizens, internal customs duties were abolished, and a uniform system of weights and measures was adopted. French became the common language of the nation.","p":["La patrie and le citoyen","Tricolour and National Assembly","Uniform laws, weights and measures; French language"],"ch":"hi1","t":2,"id":"n539"},{"ty":"short","mk":3,"q":"What were the main provisions of the Treaty of Vienna (1815)?","m":"The Bourbon dynasty was restored to power in France. A series of states was set up on the boundaries of France to prevent French expansion: the Netherlands in the north, Genoa added to Piedmont in the south. Prussia was given important new territories on its western frontiers and Austria was given control of northern Italy. Russia was given part of Poland and Prussia a part of Saxony. The German confederation of 39 states set up by Napoleon was left untouched.","p":["Bourbons restored","Buffer states around France","Territorial gains of Prussia, Austria, Russia"],"ch":"hi1","t":1,"id":"n540"},{"ty":"short","mk":5,"q":"Describe the process of the unification of Italy.","m":"Italy was divided into seven states in the mid-nineteenth century, with only Sardinia-Piedmont ruled by an Italian princely house. Mazzini formed the secret society Young Italy in 1831 but failed in the revolutionary uprisings of 1831 and 1848. The responsibility for unification then fell on Sardinia-Piedmont, whose chief minister Cavour led the movement, forming a diplomatic alliance with France and defeating the Austrian forces in 1859. Garibaldi's armed volunteers (the Red Shirts) marched into South Italy and the Kingdom of the Two Sicilies in 1860 and drove out the Spanish rulers. In 1861 Victor Emmanuel II was proclaimed king of united Italy.","p":["Seven states and Young Italy","Role of Cavour and France","Garibaldi in 1860","1861 Victor Emmanuel II"],"ch":"hi1","t":2,"id":"n541"},{"ty":"mcq","mk":1,"q":"The Non-Cooperation Movement was launched in India in","o":["January 1921","1914","1930","1942"],"a":0,"e":"It started in the context of the Khilafat issue and the Jallianwala Bagh massacre.","ch":"hi2","t":0,"id":"n542"},{"ty":"mcq","mk":1,"q":"The Khilafat Movement was led by","o":["Muhammad Ali and Shaukat Ali","Subhas Chandra Bose","Bhagat Singh","Ambedkar"],"a":0,"e":"It aimed at defending the Caliph's temporal powers after the First World War.","ch":"hi2","t":0,"id":"n543"},{"ty":"mcq","mk":1,"q":"Gandhiji's first Satyagraha in India in 1917 was in","o":["Champaran","Kheda","Ahmedabad","Bardoli"],"a":0,"e":"It was against the oppressive plantation system in Bihar.","ch":"hi2","t":0,"id":"n544"},{"ty":"mcq","mk":1,"q":"The Rowlatt Act (1919) gave the government power to","o":["detain political prisoners without trial for two years","stop foreign trade","ban cloth imports","raise taxes"],"a":0,"e":"It was passed hurriedly through the Imperial Legislative Council despite the united opposition of Indian members.","ch":"hi2","t":1,"id":"n545"},{"ty":"mcq","mk":1,"q":"The Jallianwala Bagh massacre took place on","o":["13 April 1919","6 April 1919","12 March 1930","15 August 1947"],"a":0,"e":"General Dyer's troops opened fire on a peaceful crowd.","ch":"hi2","t":1,"id":"n546"},{"ty":"mcq","mk":1,"q":"Gandhiji's call for a nationwide hartal against the Rowlatt Act was on","o":["6 April 1919","13 April 1919","1 January 1921","26 January 1930"],"a":0,"e":"Satyagraha began with a hartal and rallies across cities.","ch":"hi2","t":1,"id":"n547"},{"ty":"mcq","mk":1,"q":"The Salt March of Gandhiji began from","o":["Sabarmati Ashram","Dandi","Wardha","Bardoli"],"a":0,"e":"The march of 240 miles from Sabarmati to Dandi began on 12 March 1930.","ch":"hi2","t":2,"id":"n548"},{"ty":"mcq","mk":1,"q":"At which Congress session was the demand for 'Purna Swaraj' formalised?","o":["Lahore session, 1929","Calcutta session, 1920","Nagpur session, 1920","Karachi session, 1931"],"a":0,"e":"Jawaharlal Nehru presided; 26 January 1930 was to be celebrated as Independence Day.","ch":"hi2","t":2,"id":"n549"},{"ty":"mcq","mk":1,"q":"The Gandhi–Irwin Pact was signed in","o":["March 1931","1919","1922","1942"],"a":0,"e":"Gandhiji agreed to attend the Round Table Conference in London.","ch":"hi2","t":2,"id":"n550"},{"ty":"mcq","mk":1,"q":"The Poona Pact of 1932 gave the Depressed Classes","o":["reserved seats in provincial and central legislative councils","separate electorates","free land","no benefits"],"a":0,"e":"Gandhiji ended his fast; Ambedkar had demanded separate electorates.","ch":"hi2","t":2,"id":"n551"},{"ty":"mcq","mk":1,"q":"The industrialists' organisation formed in 1927 that supported the Civil Disobedience Movement was","o":["FICCI","INTUC","AITUC","the Muslim League"],"a":0,"e":"Federation of the Indian Chamber of Commerce and Industries.","ch":"hi2","t":3,"id":"n552"},{"ty":"mcq","mk":1,"q":"The rich peasant community of Gujarat that took an active part in the Civil Disobedience Movement was","o":["Patidars","Jats","Santhals","Gonds"],"a":0,"e":"They were hit hard by the trade depression and the fall in prices.","ch":"hi2","t":3,"id":"n553"},{"ty":"mcq","mk":1,"q":"The organisation formed by Dr B. R. Ambedkar in 1930 was","o":["Depressed Classes Association","Muslim League","Swaraj Party","Young India"],"a":0,"e":"It demanded separate electorates for Dalits.","ch":"hi2","t":3,"id":"n554"},{"ty":"mcq","mk":1,"q":"Who painted the image of Bharat Mata in 1905 as a calm, composed, divine and spiritual figure?","o":["Abanindranath Tagore","Raja Ravi Varma","Rabindranath Tagore","Nandalal Bose"],"a":0,"e":"Abanindranath Tagore's Bharat Mata held rosary, book, cloth and paddy.","ch":"hi2","t":4,"id":"n555"},{"ty":"mcq","mk":1,"q":"The hymn Vande Mataram was written by","o":["Bankim Chandra Chattopadhyay","Rabindranath Tagore","Muhammad Iqbal","Subramania Bharati"],"a":0,"e":"It was included in his novel Anandamath.","ch":"hi2","t":4,"id":"n556"},{"ty":"mcq","mk":1,"q":"The incident of Chauri Chaura (1922) took place in","o":["Uttar Pradesh","Bihar","Gujarat","Punjab"],"a":0,"e":"A violent clash led Gandhiji to call off the Non-Cooperation Movement.","ch":"hi2","t":5,"id":"n557"},{"ty":"mcq","mk":1,"q":"The city of Amritsar, the site of the Jallianwala Bagh, is in","o":["Punjab","Haryana","Gujarat","Delhi"],"a":0,"e":"Amritsar is in Punjab.","ch":"hi2","t":5,"id":"n558"},{"ty":"ar","mk":1,"q":"Assertion (A): Gandhiji decided to call off the Non-Cooperation Movement in February 1922.\nReason (R): He felt the movement was turning violent in many places and satyagrahis needed to be properly trained.","a":0,"e":"The Chauri Chaura incident convinced him; R correctly explains A.","ar":1,"ch":"hi2","t":1,"id":"n559"},{"ty":"ar","mk":1,"q":"Assertion (A): Gandhiji started the Salt March as a symbol of protest against the British government.\nReason (R): Salt was a common item of consumption and the salt tax affected every Indian, rich or poor.","a":0,"e":"The salt monopoly was seen as an oppressive act, so R explains A.","ar":1,"ch":"hi2","t":2,"id":"n560"},{"ty":"short","mk":3,"q":"Why did Gandhiji decide to launch a nationwide Satyagraha against the proposed Rowlatt Act?","m":"The Act gave the government enormous powers to repress political activities and allowed detention of political prisoners without trial for two years. Gandhiji felt it was unjust and wanted non-violent civil disobedience against such unfair laws. It would involve refusing to obey such laws, peaceful protest and hartal on 6 April 1919.","p":["Features of the Act","Unjust, so non-violent civil disobedience","Hartal of 6 April"],"ch":"hi2","t":0,"id":"n561"},{"ty":"short","mk":3,"q":"Explain the Dandi March and its significance.","m":"On 12 March 1930 Gandhiji walked with 78 volunteers from Sabarmati to Dandi, about 240 miles, and on 6 April he made salt by boiling sea water, breaking the Salt Law. It marked the beginning of the Civil Disobedience Movement. People refused to cooperate, boycotted foreign cloth and broke forest laws; it united people across classes against British rule.","p":["Journey from Sabarmati to Dandi","Breaking the salt law","Beginning of civil disobedience"],"ch":"hi2","t":2,"id":"n562"},{"ty":"short","mk":5,"q":"Explain the participation of different social groups in the Civil Disobedience Movement.","m":"Rich peasants such as Patidars and Jats supported it because they were hit by the fall in prices and the revenue demand; they were disappointed when the movement was called off without revising revenue rates. Poor peasants wanted unpaid rent to be cancelled. Business classes like FICCI wanted protection against imports and supported it. Workers participated in Nagpur but Congress was reluctant to include their demands. Dalits' leaders like Ambedkar demanded separate electorates, which led to the Poona Pact; Muslim political organisations were lukewarm.","p":["Rich and poor peasants","Business classes and workers","Dalits' demands and Poona Pact","Muslims' reaction"],"ch":"hi2","t":3,"id":"n563"},{"ty":"mcq","mk":1,"q":"The Silk Routes linked","o":["Asia with Europe and northern Africa","America with Europe","Africa with Australia","India with Japan only"],"a":0,"e":"Chinese silk, pottery and textiles were carried along them.","ch":"hi3","t":0,"id":"n564"},{"ty":"mcq","mk":1,"q":"Along the Silk Routes, which religion spread from India to the east?","o":["Buddhism","Islam","Zoroastrianism","Judaism"],"a":0,"e":"Buddhist missionaries and traders carried the faith to Central Asia, China and beyond.","ch":"hi3","t":0,"id":"n565"},{"ty":"mcq","mk":1,"q":"Which of these foods was introduced to Europe from America and helped to improve diets?","o":["potato","rice","noodles","wheat"],"a":0,"e":"Potatoes were introduced to Europe from America after Columbus.","ch":"hi3","t":1,"id":"n566"},{"ty":"mcq","mk":1,"q":"The Irish potato famine took place in","o":["1845 to 1849","1700s","1920s","1990s"],"a":0,"e":"Potato blight destroyed the crop; many people died or migrated.","ch":"hi3","t":1,"id":"n567"},{"ty":"mcq","mk":1,"q":"The most powerful weapon in the conquest of America by the Spanish was","o":["germs such as smallpox","horses","ships","guns"],"a":0,"e":"Native Americans had no immunity to European diseases.","ch":"hi3","t":1,"id":"n568"},{"ty":"mcq","mk":1,"q":"The Corn Laws were laws that allowed the British government to","o":["restrict the import of corn","buy more corn","export corn","reduce corn prices"],"a":0,"e":"After they were scrapped, food could be imported more cheaply.","ch":"hi3","t":2,"id":"n569"},{"ty":"mcq","mk":1,"q":"Rinderpest, which spread in Africa in the 1890s, was a","o":["fast-spreading cattle disease","disease of humans","plant disease","type of ship"],"a":0,"e":"It destroyed the livelihood of Africans and helped the colonisers.","ch":"hi3","t":2,"id":"n570"},{"ty":"mcq","mk":1,"q":"Indentured labour was a bonded labourer under contract to work for an employer for","o":["a fixed period to repay the passage","life","a day","a month"],"a":0,"e":"Many indentured labourers from India were taken to the Caribbean, Fiji and Mauritius.","ch":"hi3","t":2,"id":"n571"},{"ty":"mcq","mk":1,"q":"The Bretton Woods Conference held in July 1944 established","o":["the IMF and World Bank","the League of Nations","the WTO","the UN"],"a":0,"e":"These institutions were set up to deal with external surpluses and deficits and finance post-war reconstruction.","ch":"hi3","t":3,"id":"n572"},{"ty":"mcq","mk":1,"q":"The Great Depression began in","o":["1929","1914","1945","1857"],"a":0,"e":"The slump in demand and falling prices began in 1929 and continued through the 1930s.","ch":"hi3","t":3,"id":"n573"},{"ty":"mcq","mk":1,"q":"Mass production of cars through the assembly line was pioneered by","o":["Henry Ford","Edison","Marconi","Watt"],"a":0,"e":"Cheap goods increased consumer demand in the 1920s.","ch":"hi3","t":3,"id":"n574"},{"ty":"ar","mk":1,"q":"Assertion (A): The Silk Route is a good example of vibrant pre-modern trade and cultural links between distant parts of the world.\nReason (R): Chinese pottery and Indian textiles were traded and religion and ideas also travelled.","a":0,"e":"R gives instances showing the links; so R explains A.","ar":1,"ch":"hi3","t":0,"id":"n575"},{"ty":"short","mk":3,"q":"How did the discovery of new food items like potato change the lives of ordinary people in Europe?","m":"Introduction of the potato helped the poor eat better and live longer as it was cheaper and more nutritious than other crops. Rural people had a better diet and lived longer. However, in Ireland dependence on the potato led to a catastrophic famine in 1845 when blight destroyed the crop.","p":["Potato improved diet","Poor lived longer","Irish famine"],"ch":"hi3","t":1,"id":"n576"},{"ty":"short","mk":5,"q":"Describe the effects of the Great Depression on India.","m":"India's exports and imports nearly halved between 1928 and 1934. Prices of agricultural goods fell sharply, and the colonial government did not reduce revenue demands, so peasants were in deep debt. Jute growers were badly hit. The depression ruined peasants and farmers, while urban India was less affected because of fixed incomes and falling prices. India became an exporter of gold, which benefited the British.","p":["Trade nearly halved","Falling farm prices and debts","Jute and peasants hit","Gold exports"],"ch":"hi3","t":3,"id":"n577"},{"ty":"mcq","mk":1,"q":"Before the age of the factory, cloth production in rural areas by merchants who gave raw materials to cottagers was called","o":["proto-industrialisation","mass production","colonial industrialisation","mercantilism"],"a":0,"e":"Merchants of towns put out raw materials to peasants and artisans for production.","ch":"hi4","t":0,"id":"n578"},{"ty":"mcq","mk":1,"q":"The spinning jenny was invented by","o":["James Hargreaves","Richard Arkwright","James Watt","Matthew Boulton"],"a":0,"e":"It sped up spinning, and so thread production, in 1764.","ch":"hi4","t":0,"id":"n579"},{"ty":"mcq","mk":1,"q":"The steam engine was improved by","o":["James Watt","Edison","Newcomen","Hargreaves"],"a":0,"e":"Watt's improvements made it useful for factories.","ch":"hi4","t":0,"id":"n580"},{"ty":"mcq","mk":1,"q":"The first cotton mill in England was set up by","o":["Richard Arkwright","Boulton","James Watt","Robert Clive"],"a":0,"e":"Arkwright's mill brought production under one roof.","ch":"hi4","t":1,"id":"n581"},{"ty":"mcq","mk":1,"q":"Jobbers in Indian cotton mills were","o":["persons who recruited workers","owners of mills","foreign traders","government officials"],"a":0,"e":"They got people jobs, charged for it, and acted as supervisors.","ch":"hi4","t":1,"id":"n582"},{"ty":"mcq","mk":1,"q":"The first Indian cotton mill was set up in Bombay in","o":["1854","1757","1800","1900"],"a":0,"e":"It was set up by Parsi entrepreneurs.","ch":"hi4","t":1,"id":"n583"},{"ty":"ar","mk":1,"q":"Assertion (A): Indian weavers faced a crisis of raw cotton supply during the American civil war.\nReason (R): Raw cotton exports from India to Britain increased and prices of raw cotton rose.","a":0,"e":"American cotton supplies fell so Britain bought more from India; R explains.","ar":1,"ch":"hi4","t":1,"id":"n584"},{"ty":"short","mk":3,"q":"What was the importance of the putting-out system in proto-industrialisation?","m":"Merchants could not expand production in towns because of guild restrictions, so they went to the countryside. Peasants and artisans produced goods in their homes for merchants, which gave extra income to the poor peasants. The merchants supplied raw materials and collected the finished goods. It helped the poor peasants earn without leaving farms.","p":["Merchants moved to villages","Peasants worked from home","Extra income"],"ch":"hi4","t":0,"id":"n585"},{"ty":"mcq","mk":1,"q":"The earliest kind of print technology developed in","o":["China, Japan and Korea","Italy","England","America"],"a":0,"e":"It was a system of hand printing woodblocks.","ch":"hi5","t":0,"id":"n586"},{"ty":"mcq","mk":1,"q":"Marco Polo brought the knowledge of woodblock printing from China to","o":["Italy","England","Germany","America"],"a":0,"e":"He returned in 1295.","ch":"hi5","t":0,"id":"n587"},{"ty":"mcq","mk":1,"q":"Johann Gutenberg developed the first known printing press in the 1430s in","o":["Strasbourg, Germany","Rome","London","Paris"],"a":0,"e":"The first book he printed was the Bible.","ch":"hi5","t":1,"id":"n588"},{"ty":"mcq","mk":1,"q":"Martin Luther's Ninety-Five Theses criticised","o":["practices and rituals of the Roman Catholic Church","the king","the printing press","schools"],"a":0,"e":"Printed copies spread quickly and led to a division of the Church.","ch":"hi5","t":1,"id":"n589"},{"ty":"mcq","mk":1,"q":"The Index of Prohibited Books was maintained by","o":["the Roman Catholic Church","the British","Luther","Gutenberg"],"a":0,"e":"Since 1558 the Church kept a list of banned titles.","ch":"hi5","t":1,"id":"n590"},{"ty":"mcq","mk":1,"q":"Menocchio, a miller in Italy, was executed for","o":["his unconventional ideas about God and creation after reading printed books","stealing","printing books","opposing the king"],"a":0,"e":"His interpretation of the Bible irritated the Roman Catholic Church.","ch":"hi5","t":1,"id":"n591"},{"ty":"mcq","mk":1,"q":"The first weekly Indian newspaper, the Bengal Gazette, was started by","o":["James Augustus Hickey","Raja Ram Mohan Roy","Gangadhar Bhattacharya","Dwarkanath Tagore"],"a":0,"e":"It appeared from 1780.","ch":"hi5","t":2,"id":"n592"},{"ty":"mcq","mk":1,"q":"The Vernacular Press Act of 1878 was modelled on the","o":["Irish Press Laws","French Press Laws","American Press Laws","German Press Laws"],"a":0,"e":"It gave the government extensive rights to censor reports in the vernacular press.","ch":"hi5","t":2,"id":"n593"},{"ty":"mcq","mk":1,"q":"Raja Ram Mohan Roy started the Bengali weekly","o":["Sambad Kaumudi","Bengal Gazette","Kesari","Mooknayak"],"a":0,"e":"He used print to spread reformist ideas in 1821.","ch":"hi5","t":2,"id":"n594"},{"ty":"mcq","mk":1,"q":"The first autobiography written by an Indian woman in Bengali was by","o":["Rashsundari Debi","Kailashbashini Debi","Tarabai Shinde","Pandita Ramabai"],"a":0,"e":"Her book was Amar Jiban (1876).","ch":"hi5","t":3,"id":"n595"},{"ty":"mcq","mk":1,"q":"The author of 'Stripurushtulna' (1882), a Marathi book criticising the social differences between women and men, was","o":["Tarabai Shinde","Ramabai","Kashibaba","Jyotiba Phule"],"a":0,"e":"It highlighted the position of women in society.","ch":"hi5","t":3,"id":"n596"},{"ty":"short","mk":3,"q":"How did the printing press help in the spread of new ideas in Europe? Give three points.","m":"Printing reduced the cost of books and made them widely available. New ways of life led to discussions on faith, society and politics, and reading became a public activity. People could challenge the authority of the Church and the state with printed pamphlets and books, which also spread scientific ideas.","p":["Cheaper and widely available","Discussions on faith and politics","Challenge to authority"],"ch":"hi5","t":1,"id":"n597"},{"ty":"short","mk":3,"q":"Why did Indian reformers and nationalists use print in the nineteenth century?","m":"Reformers used print to debate social and religious reforms such as widow remarriage, sati and idol worship. Newspapers spread nationalist ideas and criticised colonial rule. Printed periodicals and Vernacular newspapers reached a wide audience in regional languages, and caricatures and cheap prints popularised ideas.","p":["Debate on social reform","Spread nationalist ideas","Wider audience in vernacular languages"],"ch":"hi5","t":2,"id":"n598"},{"ty":"mcq","mk":1,"q":"Resources which are found in a region but have not been utilised are called","o":["potential resources","stock","reserves","developed resources"],"a":0,"e":"Potential resources like solar and wind energy in Rajasthan and Gujarat are not yet fully developed.","ch":"ge1","t":0,"id":"n599"},{"ty":"mcq","mk":1,"q":"Agenda 21 was adopted at the Earth Summit held in","o":["Rio de Janeiro, 1992","Paris, 1992","Stockholm, 1972","Kyoto, 1997"],"a":0,"e":"It aims at achieving global sustainable development.","ch":"ge1","t":0,"id":"n600"},{"ty":"mcq","mk":1,"q":"Resources which can be renewed or reproduced by physical, chemical or mechanical processes are called","o":["renewable resources","non-renewable resources","stock resources","abiotic resources"],"a":0,"e":"Examples: solar energy, wind, water.","ch":"ge1","t":0,"id":"n601"},{"ty":"mcq","mk":1,"q":"Coal, petroleum and minerals are examples of","o":["non-renewable resources","renewable resources","inexhaustible resources","biotic only"],"a":0,"e":"They take millions of years to form.","ch":"ge1","t":0,"id":"n602"},{"ty":"mcq","mk":1,"q":"Sustainable development means development that","o":["meets present needs without compromising the needs of future generations","takes place in one country","increases income","reduces land"],"a":0,"e":"This is the Brundtland Commission's idea.","ch":"ge1","t":1,"id":"n603"},{"ty":"mcq","mk":1,"q":"Resource planning in India involves which of these stages?","o":["identification, resource-development plans, matching with national plans","exporting resources","mining","banning resources"],"a":0,"e":"Resource planning is a widely accepted strategy.","ch":"ge1","t":1,"id":"n604"},{"ty":"mcq","mk":1,"q":"The net sown area is the","o":["physical area sown with crops in a year","land lying fallow","forest area","waste land"],"a":0,"e":"Net sown area is the area actually sown; gross cropped area counts areas sown more than once.","ch":"ge1","t":2,"id":"n605"},{"ty":"mcq","mk":1,"q":"According to the National Forest Policy (1952), the desired forest area in India is","o":["33 per cent","22 per cent","10 per cent","50 per cent"],"a":0,"e":"India's actual forest cover has been lower than this.","ch":"ge1","t":2,"id":"n606"},{"ty":"mcq","mk":1,"q":"Land that is left uncultivated for one or two agricultural seasons is called","o":["fallow land","barren land","net sown area","forest land"],"a":0,"e":"Fallow lands are given a rest to regain fertility.","ch":"ge1","t":2,"id":"n607"},{"ty":"mcq","mk":1,"q":"Black soil is ideal for growing","o":["cotton","wheat","tea","rice"],"a":0,"e":"It is also called regur soil, rich in lime, iron and magnesia.","ch":"ge1","t":3,"id":"n608"},{"ty":"mcq","mk":1,"q":"The soil found in the Indo-Gangetic plain is","o":["alluvial","black","laterite","desert"],"a":0,"e":"It is formed by deposits of Indus, Ganga and Brahmaputra.","ch":"ge1","t":3,"id":"n609"},{"ty":"mcq","mk":1,"q":"Soil erosion can be controlled by","o":["contour ploughing","overgrazing","deforestation","mining"],"a":0,"e":"Ploughing along contour lines slows water flow down slopes.","ch":"ge1","t":3,"id":"n610"},{"ty":"mcq","mk":1,"q":"The soil which develops in areas of high temperature and heavy rainfall with intense leaching is","o":["laterite","alluvial","black","arid"],"a":0,"e":"Laterite soil is suitable for cashew nuts.","ch":"ge1","t":3,"id":"n611"},{"ty":"ar","mk":1,"q":"Assertion (A): Black soil is made up of extremely fine clayey material and is capable of holding moisture.\nReason (R): It becomes sticky when wet and cracks during dry seasons.","a":1,"e":"Both true, but stickiness and cracks do not explain moisture holding.","ar":1,"ch":"ge1","t":3,"id":"n612"},{"ty":"short","mk":3,"q":"What are the major factors responsible for the need for resource planning in India?","m":"Resources are distributed unevenly: some states are rich in minerals but poor in other resources, for example Jharkhand and Odisha have minerals, Rajasthan has solar and wind but little water. Many resources are limited, so planning is needed to ensure their judicious use and to meet growing demand while keeping the needs of future generations in mind.","p":["Uneven distribution","Limited resources","Judicious use"],"ch":"ge1","t":1,"id":"n613"},{"ty":"short","mk":5,"q":"Describe the main types of soil found in India along with their characteristics.","m":"Alluvial soil is the most widespread, fertile, suited to wheat and rice. Black soil is made of volcanic rock, retains moisture, ideal for cotton. Red and yellow soils develop on crystalline igneous rocks, low in humus. Laterite soil forms with heavy rainfall and leaching, suited for tea, coffee, cashew. Arid soil is sandy and saline in dry climates. Forest soils are found in hilly areas.","p":["Alluvial","Black","Red/yellow and laterite","Arid and forest"],"ch":"ge1","t":3,"id":"n614"},{"ty":"mcq","mk":1,"q":"Most of the biodiversity of India is facing the threat of","o":["habitat destruction and overexploitation","too much rain","volcanoes","earthquakes"],"a":0,"e":"Deforestation, hunting and pollution are major causes.","ch":"ge2","t":0,"id":"n615"},{"ty":"mcq","mk":1,"q":"Species whose populations have declined to levels from where they are likely to move into the endangered category are called","o":["vulnerable species","endemic species","extinct species","rare species"],"a":0,"e":"IUCN lists them as vulnerable.","ch":"ge2","t":0,"id":"n616"},{"ty":"mcq","mk":1,"q":"The Himalayan Yew is a","o":["medicinal plant that is under threat","tree used for timber only","ornamental plant","food crop"],"a":0,"e":"It yields taxol, used to treat cancer.","ch":"ge2","t":0,"id":"n617"},{"ty":"mcq","mk":1,"q":"Project Tiger was launched in","o":["1973","1950","1990","2005"],"a":0,"e":"It aimed at protecting tigers from poaching and habitat loss.","ch":"ge2","t":1,"id":"n618"},{"ty":"mcq","mk":1,"q":"The Indian Wildlife (Protection) Act was implemented in","o":["1972","1952","1986","2002"],"a":0,"e":"It banned hunting and protected habitats.","ch":"ge2","t":1,"id":"n619"},{"ty":"mcq","mk":1,"q":"More than half of the total forest area in India has been declared","o":["reserved forest","protected forest","unclassed forest","national park"],"a":0,"e":"Reserved forests are the most valuable as far as conservation is concerned.","ch":"ge2","t":1,"id":"n620"},{"ty":"mcq","mk":1,"q":"Forests which are owned by both government and private individuals and communities are called","o":["unclassed forests","reserved forests","protected forests","sanctuaries"],"a":0,"e":"They are not strictly protected.","ch":"ge2","t":1,"id":"n621"},{"ty":"mcq","mk":1,"q":"The Chipko Movement is associated with","o":["saving trees in the Himalayas","saving the tiger","water harvesting","soil conservation"],"a":0,"e":"Villagers hugged trees to stop felling.","ch":"ge2","t":2,"id":"n622"},{"ty":"mcq","mk":1,"q":"Sacred groves are examples of","o":["community conservation","government protection","plantation","commercial forestry"],"a":0,"e":"Communities preserve patches of forest for religious reasons.","ch":"ge2","t":2,"id":"n623"},{"ty":"mcq","mk":1,"q":"Joint Forest Management started in 1988 in the state of","o":["Odisha","Kerala","Bihar","Punjab"],"a":0,"e":"Villagers help to protect degraded forests and share benefits.","ch":"ge2","t":2,"id":"n624"},{"ty":"mcq","mk":1,"q":"The Beej Bachao Andolan is a movement for","o":["conserving traditional seeds","water","mines","tigers"],"a":0,"e":"It is in Tehri, Uttarakhand.","ch":"ge2","t":2,"id":"n625"},{"ty":"ar","mk":1,"q":"Assertion (A): Project Tiger aims to ensure a viable population of tigers in their natural habitats.\nReason (R): Tiger conservation also protects the whole ecosystem.","a":1,"e":"Both are true but R is an additional benefit, not the direct explanation of the project's aim.","ar":1,"ch":"ge2","t":1,"id":"n626"},{"ty":"short","mk":3,"q":"Why is biodiversity important? List any three reasons for its decline in India.","m":"Biodiversity maintains ecological balance and provides food, medicines and raw material. The decline is due to habitat destruction through the expansion of agriculture and mining, hunting and poaching for trade, and overgrazing and forest fires.","p":["Importance","Any three reasons"],"ch":"ge2","t":0,"id":"n627"},{"ty":"short","mk":3,"q":"Explain how local communities have helped in the conservation of forests.","m":"Communities of Sariska in Rajasthan fought mining; villagers in Alwar protected the wildlife area. The Chipko movement saved trees in the Himalayas. Sacred groves protect forest patches, and under Joint Forest Management villagers in Odisha protect degraded forests and gain benefits. Beej Bachao Andolan conserves indigenous seeds.","p":["Chipko movement","Sacred groves","Joint Forest Management"],"ch":"ge2","t":2,"id":"n628"},{"ty":"mcq","mk":1,"q":"Water scarcity in India is mainly due to","o":["over-exploitation, excessive use and unequal access","too many rivers","low population","few dams"],"a":0,"e":"Rapid growth in population, irrigation and industry have increased demand.","ch":"ge3","t":0,"id":"n629"},{"ty":"mcq","mk":1,"q":"The percentage of water on earth that is freshwater is about","o":["2.5 per cent","10 per cent","50 per cent","97 per cent"],"a":0,"e":"Most water is in the oceans (saline).","ch":"ge3","t":0,"id":"n630"},{"ty":"mcq","mk":1,"q":"India's total water resources get replenished mainly through","o":["rainfall (monsoon)","glaciers only","rivers only","wells"],"a":0,"e":"The hydrological cycle recharges water.","ch":"ge3","t":0,"id":"n631"},{"ty":"mcq","mk":1,"q":"A dam constructed for irrigation, power generation, water supply and flood control is a","o":["multipurpose river project","simple dam","weir","canal"],"a":0,"e":"It combines several uses.","ch":"ge3","t":1,"id":"n632"},{"ty":"mcq","mk":1,"q":"Jawaharlal Nehru described dams as","o":["the temples of modern India","the lifeline","a curse","forests"],"a":0,"e":"He saw them as symbols of development.","ch":"ge3","t":1,"id":"n633"},{"ty":"mcq","mk":1,"q":"The Bhakra Nangal Project is on the river","o":["Sutlej","Narmada","Krishna","Godavari"],"a":0,"e":"The Bhakra dam is in Himachal Pradesh.","ch":"ge3","t":1,"id":"n634"},{"ty":"mcq","mk":1,"q":"Which movement has opposed the construction of the Sardar Sarovar Dam?","o":["Narmada Bachao Andolan","Chipko","Beej Bachao","Silent Valley"],"a":0,"e":"It protests against the displacement of people.","ch":"ge3","t":1,"id":"n635"},{"ty":"mcq","mk":1,"q":"Bamboo drip irrigation system is found in","o":["Meghalaya","Rajasthan","Gujarat","Kerala"],"a":0,"e":"Bamboo pipes carry water to plants.","ch":"ge3","t":2,"id":"n636"},{"ty":"mcq","mk":1,"q":"In the semi-arid regions of Rajasthan, rainwater was traditionally stored in underground tanks called","o":["tankas","guls","bundhis","ahars"],"a":0,"e":"Tankas are built inside the main house or in courtyards.","ch":"ge3","t":2,"id":"n637"},{"ty":"mcq","mk":1,"q":"Rooftop rainwater harvesting recharges","o":["groundwater","only rivers","sea","glaciers"],"a":0,"e":"Water collected from roofs is led to underground tanks.","ch":"ge3","t":2,"id":"n638"},{"ty":"mcq","mk":1,"q":"The Tehri Dam is located in","o":["Uttarakhand","Himachal Pradesh","Gujarat","Odisha"],"a":0,"e":"It is on the Bhagirathi river.","ch":"ge3","t":3,"id":"n639"},{"ty":"mcq","mk":1,"q":"Hirakud Dam is built on the river","o":["Mahanadi","Ganga","Krishna","Kaveri"],"a":0,"e":"It is in Odisha.","ch":"ge3","t":3,"id":"n640"},{"ty":"ar","mk":1,"q":"Assertion (A): Multipurpose projects have been criticised for displacement of local people.\nReason (R): Dams built across rivers submerge large areas and affect the lives of those living there.","a":0,"e":"R is the reason for A.","ar":1,"ch":"ge3","t":1,"id":"n641"},{"ty":"short","mk":3,"q":"What is the main cause of water scarcity in India?","m":"Increasing population and rising demand, over-use of groundwater for irrigation, industry and urban supply, uneven distribution of rainfall and pollution of water bodies reduce the availability of clean water.","p":["Population and demand","Over-use of groundwater","Pollution and uneven rainfall"],"ch":"ge3","t":0,"id":"n642"},{"ty":"short","mk":3,"q":"What is rainwater harvesting? Why is it needed?","m":"It is the collection and storage of rainwater for use, such as in tankas, rooftop tanks or recharge pits. It conserves water, recharges groundwater, reduces dependence on rivers and tubewells and helps in regions with scarce rainfall.","p":["Definition","Methods","Benefits"],"ch":"ge3","t":2,"id":"n643"},{"ty":"mcq","mk":1,"q":"The type of farming where land is cleared by burning trees is called","o":["slash and burn agriculture","plantation","intensive subsistence","commercial farming"],"a":0,"e":"It is called 'jhumming' in north-east India.","ch":"ge4","t":0,"id":"n644"},{"ty":"mcq","mk":1,"q":"Plantation farming is a type of","o":["commercial farming","subsistence farming","shifting cultivation","dry farming"],"a":0,"e":"Large estates grow tea, coffee, rubber, banana.","ch":"ge4","t":0,"id":"n645"},{"ty":"mcq","mk":1,"q":"Intensive subsistence farming is practised in areas of","o":["high population pressure on land","low population","deserts","snow"],"a":0,"e":"Farmers use high doses of inputs on small land.","ch":"ge4","t":0,"id":"n646"},{"ty":"mcq","mk":1,"q":"Rabi crops are sown in","o":["winter (October–December)","summer","June–July","spring"],"a":0,"e":"They are harvested in summer from April to June.","ch":"ge4","t":1,"id":"n647"},{"ty":"mcq","mk":1,"q":"Which one of the following is a rabi crop?","o":["wheat","rice","jute","cotton"],"a":0,"e":"Wheat, barley, peas, gram and mustard are rabi crops.","ch":"ge4","t":1,"id":"n648"},{"ty":"mcq","mk":1,"q":"Kharif crops are sown with the onset of","o":["monsoon","winter","summer only","spring"],"a":0,"e":"Paddy, maize, jowar, bajra are kharif crops.","ch":"ge4","t":1,"id":"n649"},{"ty":"mcq","mk":1,"q":"Zaid crops are grown between","o":["rabi and kharif seasons","June and July","October and December","monsoon only"],"a":0,"e":"Watermelon, cucumber and vegetables are zaid crops.","ch":"ge4","t":1,"id":"n650"},{"ty":"mcq","mk":1,"q":"The crop that requires high temperature and more than 100 cm rainfall is","o":["rice","wheat","gram","mustard"],"a":0,"e":"It is mostly grown in plains and humid areas.","ch":"ge4","t":1,"id":"n651"},{"ty":"mcq","mk":1,"q":"The Land reforms in India were aimed at","o":["abolition of zamindari and consolidation of holdings","banning crops","raising taxes","more dams"],"a":0,"e":"Land reforms were a major institutional reform.","ch":"ge4","t":2,"id":"n652"},{"ty":"mcq","mk":1,"q":"Bhoodan–Gramdan Movement was started by","o":["Vinoba Bhave","Gandhiji","Nehru","Patel"],"a":0,"e":"He persuaded landowners to donate land.","ch":"ge4","t":2,"id":"n653"},{"ty":"mcq","mk":1,"q":"The Green Revolution in India introduced","o":["high-yielding varieties of seeds and fertilisers","machines only","tea","crop insurance"],"a":0,"e":"It increased wheat and rice production.","ch":"ge4","t":2,"id":"n654"},{"ty":"mcq","mk":1,"q":"The leading wheat-producing states are","o":["Punjab and Haryana","West Bengal and Odisha","Kerala and Karnataka","Assam and Meghalaya"],"a":0,"e":"Along with Uttar Pradesh.","ch":"ge4","t":3,"id":"n655"},{"ty":"mcq","mk":1,"q":"India's leading jute-producing state is","o":["West Bengal","Punjab","Kerala","Rajasthan"],"a":0,"e":"It is known as the golden fibre.","ch":"ge4","t":3,"id":"n656"},{"ty":"mcq","mk":1,"q":"The leading tea-producing state is","o":["Assam","Karnataka","Kerala","Gujarat"],"a":0,"e":"Also Darjeeling in West Bengal.","ch":"ge4","t":3,"id":"n657"},{"ty":"mcq","mk":1,"q":"Rubber is mainly grown in","o":["Kerala","Punjab","Rajasthan","Bihar"],"a":0,"e":"It needs moist, humid climate.","ch":"ge4","t":3,"id":"n658"},{"ty":"short","mk":3,"q":"Distinguish between rabi and kharif crops with two examples each.","m":"Rabi crops are sown in winter (October–December) and harvested in summer (April–June): wheat, gram. Kharif crops are sown with the monsoon in June–July and harvested in September–October: rice, maize.","p":["Rabi sowing and harvesting","Kharif sowing and harvesting","Two examples each"],"ch":"ge4","t":1,"id":"n659"},{"ty":"short","mk":3,"q":"What measures were taken by the government for the development of agriculture after independence?","m":"Land reforms such as abolition of zamindari, consolidation of holdings and land ceilings; Green Revolution and White Revolution; Kisan Credit Card, crop insurance and minimum support price; weather bulletins and radio and TV programmes for farmers; improved irrigation and research.","p":["Land reforms","Green revolution","Credit, insurance, support prices"],"ch":"ge4","t":2,"id":"n660"},{"ty":"mcq","mk":1,"q":"The finest quality of iron ore, with about 70 per cent iron content, is","o":["magnetite","haematite","siderite","limonite"],"a":0,"e":"Magnetite has excellent magnetic qualities.","ch":"ge5","t":0,"id":"n661"},{"ty":"mcq","mk":1,"q":"Bauxite is the ore of","o":["aluminium","iron","copper","manganese"],"a":0,"e":"Odisha is the largest producer.","ch":"ge5","t":0,"id":"n662"},{"ty":"mcq","mk":1,"q":"Which mineral is mainly used in making steel and ferro-alloys?","o":["manganese","mica","limestone","gypsum"],"a":0,"e":"Manganese is essential for steel.","ch":"ge5","t":0,"id":"n663"},{"ty":"mcq","mk":1,"q":"Mica is mined mainly in","o":["Jharkhand","Rajasthan","Gujarat","Kerala"],"a":0,"e":"It is a good insulator.","ch":"ge5","t":0,"id":"n664"},{"ty":"mcq","mk":1,"q":"Coal in India is mainly found in","o":["Gondwana rocks","alluvium","coastal plains","Himalayas"],"a":0,"e":"Jharkhand, Odisha and Chhattisgarh are rich.","ch":"ge5","t":1,"id":"n665"},{"ty":"mcq","mk":1,"q":"The oldest oil-producing state of India is","o":["Assam","Gujarat","Maharashtra","Punjab"],"a":0,"e":"Digboi is the oldest.","ch":"ge5","t":1,"id":"n666"},{"ty":"mcq","mk":1,"q":"The largest oil-producing area of India is","o":["Mumbai High","Digboi","Ankleshwar","Cambay"],"a":0,"e":"It is offshore.","ch":"ge5","t":1,"id":"n667"},{"ty":"mcq","mk":1,"q":"The coal which has the highest carbon content is","o":["anthracite","lignite","bituminous","peat"],"a":0,"e":"It is the best-quality coal.","ch":"ge5","t":1,"id":"n668"},{"ty":"mcq","mk":1,"q":"The largest wind farm cluster in India is located in","o":["Tamil Nadu (Nagercoil)","Punjab","Assam","Bihar"],"a":0,"e":"Nagercoil to Madurai.","ch":"ge5","t":2,"id":"n669"},{"ty":"mcq","mk":1,"q":"Which one of the following is a non-conventional source of energy?","o":["solar energy","coal","petroleum","natural gas"],"a":0,"e":"It is renewable.","ch":"ge5","t":2,"id":"n670"},{"ty":"mcq","mk":1,"q":"The Puga Valley in Ladakh is known for","o":["geothermal energy","tidal energy","nuclear energy","hydel energy"],"a":0,"e":"India has geothermal projects there.","ch":"ge5","t":2,"id":"n671"},{"ty":"mcq","mk":1,"q":"Energy can be saved by","o":["using public transport","using more fuel","switching on more lights","wasting water"],"a":0,"e":"Conservation of energy resources is crucial.","ch":"ge5","t":2,"id":"n672"},{"ty":"ar","mk":1,"q":"Assertion (A): Solar energy is expected to have great potential in India.\nReason (R): India is a tropical country with abundant sunshine.","a":0,"e":"Plentiful sunshine explains the potential.","ar":1,"ch":"ge5","t":2,"id":"n673"},{"ty":"short","mk":3,"q":"What is a mineral? How are minerals classified?","m":"A mineral is a homogeneous, naturally occurring substance with a definable internal structure. They are classified as metallic (ferrous like iron and non-ferrous like copper, bauxite), non-metallic (mica, limestone) and energy minerals (coal, petroleum).","p":["Definition","Metallic","Non-metallic and energy"],"ch":"ge5","t":0,"id":"n674"},{"ty":"short","mk":5,"q":"Why is there a need to conserve energy resources? Suggest any four ways.","m":"Energy is required for all sectors, India's growing economy needs more energy and fossil fuels are exhaustible. Ways: use public transport, switch off lights when not in use, use energy-efficient appliances, use non-conventional sources like solar and wind, and check power machinery.","p":["Need for conservation","Public transport","Energy-saving appliances","Non-conventional sources"],"ch":"ge5","t":2,"id":"n675"},{"ty":"mcq","mk":1,"q":"Industries which use raw materials from agriculture are called","o":["agro-based industries","mineral-based industries","basic industries","cottage industries"],"a":0,"e":"Cotton textile, sugar, jute and edible oil are examples.","ch":"ge6","t":0,"id":"n676"},{"ty":"mcq","mk":1,"q":"Industries owned by the government are in the","o":["public sector","private sector","joint sector","cooperative sector"],"a":0,"e":"SAIL and BHEL are examples.","ch":"ge6","t":0,"id":"n677"},{"ty":"mcq","mk":1,"q":"Manufacturing contributes to the economy by","o":["providing employment and boosting GDP","reducing exports","lowering income","increasing pollution"],"a":0,"e":"It reduces dependence on agriculture.","ch":"ge6","t":0,"id":"n678"},{"ty":"mcq","mk":1,"q":"Which one is a mineral-based industry?","o":["iron and steel","cotton textile","sugar","jute"],"a":0,"e":"Iron ore, coal and limestone are raw materials.","ch":"ge6","t":1,"id":"n679"},{"ty":"mcq","mk":1,"q":"The first successful cotton mill in India was set up at","o":["Mumbai","Ahmedabad","Chennai","Kolkata"],"a":0,"e":"It was set up in 1854.","ch":"ge6","t":1,"id":"n680"},{"ty":"mcq","mk":1,"q":"The iron and steel plant located in Chhattisgarh is","o":["Bhilai","Bokaro","Rourkela","Durgapur"],"a":0,"e":"It is a public-sector SAIL plant.","ch":"ge6","t":1,"id":"n681"},{"ty":"mcq","mk":1,"q":"TISCO is located at","o":["Jamshedpur","Bhilai","Salem","Visakhapatnam"],"a":0,"e":"It is a private-sector steel plant in Jharkhand.","ch":"ge6","t":1,"id":"n682"},{"ty":"mcq","mk":1,"q":"India's leading sugar-producing state is","o":["Maharashtra","Punjab","West Bengal","Kerala"],"a":0,"e":"Sugar mills are mostly in the cooperative sector there.","ch":"ge6","t":1,"id":"n683"},{"ty":"mcq","mk":1,"q":"Which one of the following is a source of thermal pollution?","o":["hot water from factories and power plants","noise","smoke","plastic"],"a":0,"e":"The discharge of hot water into rivers reduces oxygen.","ch":"ge6","t":2,"id":"n684"},{"ty":"mcq","mk":1,"q":"Noise pollution can be controlled by","o":["silencers on machines and trees","plastic","smoke","tall chimneys"],"a":0,"e":"Planting trees also reduces noise.","ch":"ge6","t":2,"id":"n685"},{"ty":"mcq","mk":1,"q":"Which gas released from industries causes acid rain?","o":["sulphur dioxide","oxygen","nitrogen","helium"],"a":0,"e":"SO₂ and NO₂ are the major gases.","ch":"ge6","t":2,"id":"n686"},{"ty":"ar","mk":1,"q":"Assertion (A): Industrial pollution of water bodies can be reduced by treating effluents.\nReason (R): Treated water is safe to release into rivers.","a":0,"e":"Treatment removes toxic chemicals and explains the reduction.","ar":1,"ch":"ge6","t":2,"id":"n687"},{"ty":"short","mk":3,"q":"Why is manufacturing called the backbone of economic development?","m":"Manufacturing helps modernise agriculture, creates jobs and reduces unemployment and poverty, brings in foreign exchange through exports, and helps remove regional disparities by establishing industries in tribal and backward areas.","p":["Employment","Exports and foreign exchange","Regional balance"],"ch":"ge6","t":0,"id":"n688"},{"ty":"short","mk":5,"q":"Explain any three types of environmental degradation caused by industries. How can they be controlled?","m":"Air pollution from smoke and chemicals, water pollution from effluents, thermal pollution from hot water, and noise pollution from machinery. Control: install smoke stacks, use scrubbers, treat water before releasing, use sound-proof equipment and plant trees.","p":["Air pollution","Water pollution","Noise or thermal pollution","Control measures"],"ch":"ge6","t":2,"id":"n689"},{"ty":"mcq","mk":1,"q":"The port which is the largest container port on the west coast is","o":["Nhava Sheva (JNPT)","Kandla","Kochi","Kolkata"],"a":0,"e":"Jawaharlal Nehru Port at Navi Mumbai is the largest container port.","ch":"ge7","t":0,"id":"n690"},{"ty":"mcq","mk":1,"q":"The port located on the Kutch coast of Gujarat is","o":["Kandla","Marmagao","Kochi","Paradip"],"a":0,"e":"It is a tidal port.","ch":"ge7","t":0,"id":"n691"},{"ty":"mcq","mk":1,"q":"Which port is on the east coast?","o":["Paradip","Kandla","Marmagao","New Mangalore"],"a":0,"e":"Paradip is in Odisha.","ch":"ge7","t":0,"id":"n692"},{"ty":"mcq","mk":1,"q":"Chennai and Tuticorin ports are located on the","o":["east coast","west coast","northern coast","eastern ghats"],"a":0,"e":"They are in Tamil Nadu.","ch":"ge7","t":0,"id":"n693"},{"ty":"mcq","mk":1,"q":"India's longest national highway, NH-44, connects","o":["Srinagar and Kanyakumari","Delhi and Mumbai","Kolkata and Chennai","Amritsar and Jaipur"],"a":0,"e":"It is the longest.","ch":"ge7","t":1,"id":"n694"},{"ty":"mcq","mk":1,"q":"The Golden Quadrilateral Super Highways connect","o":["Delhi, Mumbai, Chennai and Kolkata","Delhi, Jaipur, Agra and Bhopal","Shimla, Leh, Jammu and Srinagar","Kanyakumari, Pune, Ranchi and Patna"],"a":0,"e":"It reduces distances and time between the four metro cities.","ch":"ge7","t":1,"id":"n695"},{"ty":"mcq","mk":1,"q":"The airport named after Netaji Subhas Chandra Bose is in","o":["Kolkata","Mumbai","Delhi","Chennai"],"a":0,"e":"It is an international airport.","ch":"ge7","t":1,"id":"n696"},{"ty":"mcq","mk":1,"q":"The major means of transport which links raw material and finished goods is","o":["railways","pipelines","airways","rivers"],"a":0,"e":"Railways are the principal mode of transport in India.","ch":"ge7","t":1,"id":"n697"},{"ty":"short","mk":3,"q":"Name any three ports of the west coast and any three ports of the east coast of India.","m":"West coast: Kandla, Mumbai, Marmagao, New Mangalore, Kochi. East coast: Chennai, Tuticorin, Visakhapatnam, Paradip, Kolkata.","p":["Three west coast ports","Three east coast ports"],"ch":"ge7","t":0,"id":"n698"},{"ty":"mcq","mk":1,"q":"In Belgium, the community that forms the majority of the population is","o":["Dutch-speaking","French-speaking","German-speaking","Italian-speaking"],"a":0,"e":"About 59 per cent are Dutch-speaking, 40 per cent French-speaking and 1 per cent German-speaking.","ch":"po1","t":0,"id":"n699"},{"ty":"mcq","mk":1,"q":"The capital of Belgium, where the Dutch and French communities have equal representation in the central government, is","o":["Brussels","Amsterdam","Paris","Berlin"],"a":0,"e":"Brussels has an equal number of ministers from both communities.","ch":"po1","t":0,"id":"n700"},{"ty":"mcq","mk":1,"q":"In Sri Lanka, the 1956 Act that recognised Sinhala as the only official language was a step that","o":["alienated the Tamil community","helped Tamils","ended the civil war","introduced federalism"],"a":0,"e":"Tamil speakers felt discriminated against.","ch":"po1","t":0,"id":"n701"},{"ty":"mcq","mk":1,"q":"The majority community in Sri Lanka is","o":["Sinhala (about 74 per cent)","Tamil","Muslim","Christian"],"a":0,"e":"Sinhala speakers are about 74 per cent.","ch":"po1","t":0,"id":"n702"},{"ty":"mcq","mk":1,"q":"Power sharing is desirable because it","o":["reduces the possibility of conflict between social groups","ends elections","makes the government weak","increases the power of one group"],"a":0,"e":"It helps ensure the stability of political order.","ch":"po1","t":1,"id":"n703"},{"ty":"mcq","mk":1,"q":"Prudential reasons for power sharing are","o":["based on careful calculation of gains and losses (it helps reduce conflict)","based on moral values","based on religion","based on income"],"a":0,"e":"Moral reasons say power sharing is valuable in itself.","ch":"po1","t":1,"id":"n704"},{"ty":"mcq","mk":1,"q":"The 'moral' reason for power sharing is that","o":["it is the very spirit of democracy","it gives profit","it avoids tax","it reduces police"],"a":0,"e":"Sharing power with those affected by decisions is the basis of democracy.","ch":"po1","t":1,"id":"n705"},{"ty":"mcq","mk":1,"q":"Sharing of power among different organs of government, such as legislature, executive and judiciary, is called","o":["horizontal distribution of power","vertical distribution","community government","coalition"],"a":0,"e":"Each organ checks the others.","ch":"po1","t":2,"id":"n706"},{"ty":"mcq","mk":1,"q":"Power sharing between governments at the union, state and local levels is called","o":["vertical distribution of power","horizontal distribution","coalition","checks and balances"],"a":0,"e":"It is also called federal division of power.","ch":"po1","t":2,"id":"n707"},{"ty":"mcq","mk":1,"q":"Community government in Belgium is elected by","o":["the people belonging to one language community","all citizens","the king","the army"],"a":0,"e":"It has the power regarding cultural, educational and language-related issues.","ch":"po1","t":2,"id":"n708"},{"ty":"mcq","mk":1,"q":"In a coalition government, power is shared among","o":["different political parties","different levels","different organs","different communities in a territory"],"a":0,"e":"Power sharing also takes place between political parties and pressure groups.","ch":"po1","t":2,"id":"n709"},{"ty":"ar","mk":1,"q":"Assertion (A): Power sharing is good for democracy.\nReason (R): It helps to accommodate social diversity and reduce chances of conflict.","a":0,"e":"R explains why power sharing is good.","ar":1,"ch":"po1","t":1,"id":"n710"},{"ty":"short","mk":3,"q":"Describe the main elements of the Belgium model of power sharing.","m":"The Constitution prescribes that the number of Dutch and French-speaking ministers in the central government shall be equal. Many powers of the central government have been given to state governments of the two regions. Brussels has a separate government in which both communities have equal representation. A third level of government, the community government, is elected by people of one language community irrespective of where they live.","p":["Equal ministers at the centre","State governments","Brussels and community government"],"ch":"po1","t":0,"id":"n711"},{"ty":"short","mk":3,"q":"Give any three reasons why power sharing is desirable.","m":"It reduces the possibility of conflict between social groups and so ensures stability. It helps to avoid the tyranny of the majority and imposing the will of one group on others. It is the very spirit of democracy because people have a right to be consulted on how they are governed.","p":["Reduces conflict","Avoids tyranny of majority","Spirit of democracy"],"ch":"po1","t":1,"id":"n712"},{"ty":"mcq","mk":1,"q":"India is a federation of states because","o":["power is divided between the central government and the state governments","the president rules","there is one government","states are independent"],"a":0,"e":"A federation has two or more tiers of government.","ch":"po2","t":0,"id":"n713"},{"ty":"mcq","mk":1,"q":"Which of the following is a feature of federalism?","o":["each level of government has its own jurisdiction","only one level of government","states have no power","only the Centre can make laws"],"a":0,"e":"Jurisdictions are specified in the Constitution.","ch":"po2","t":0,"id":"n714"},{"ty":"mcq","mk":1,"q":"The subjects like defence, foreign affairs and currency are in the","o":["Union List","State List","Concurrent List","Residuary List"],"a":0,"e":"The Union government makes laws on these.","ch":"po2","t":0,"id":"n715"},{"ty":"mcq","mk":1,"q":"Subjects like police, trade, agriculture and irrigation fall in the","o":["State List","Union List","Concurrent List","Residuary"],"a":0,"e":"State governments have the power to make laws.","ch":"po2","t":0,"id":"n716"},{"ty":"mcq","mk":1,"q":"Education, forests and marriage are in the","o":["Concurrent List","Union List","State List","Residuary"],"a":0,"e":"Both the Union and state governments can make laws on them.","ch":"po2","t":1,"id":"n717"},{"ty":"mcq","mk":1,"q":"Subjects not included in any of the three lists are called","o":["residuary subjects","union subjects","central subjects","concurrent subjects"],"a":0,"e":"They fall in the Union government's jurisdiction.","ch":"po2","t":1,"id":"n718"},{"ty":"mcq","mk":1,"q":"The states in India were reorganised in 1950s on the basis of","o":["language","religion","caste","income"],"a":0,"e":"Linguistic states were formed to promote unity.","ch":"po2","t":1,"id":"n719"},{"ty":"mcq","mk":1,"q":"According to the Indian Constitution, the status of national language is given to","o":["no single language; Hindi is the official language","Hindi only","English only","Sanskrit"],"a":0,"e":"NCERT: the Constitution did not give the status of national language to any one language. Hindi was identified as the official language, and there are 22 scheduled languages.","ch":"po2","t":1,"id":"n720"},{"ty":"mcq","mk":1,"q":"The third tier of government in India is","o":["local government (Panchayati raj)","Parliament","Supreme Court","Cabinet"],"a":0,"e":"The 73rd and 74th amendments in 1992 strengthened it.","ch":"po2","t":2,"id":"n721"},{"ty":"mcq","mk":1,"q":"The Constitutional amendment in 1992 made it mandatory to hold regular elections to","o":["local government bodies","Parliament","state assemblies","Rajya Sabha"],"a":0,"e":"It also provided for one-third reservation of seats for women.","ch":"po2","t":2,"id":"n722"},{"ty":"mcq","mk":1,"q":"The head of the Gram Panchayat is the","o":["Sarpanch","Mayor","Collector","Chairman"],"a":0,"e":"The Gram Panchayat is an elected body of the ward members.","ch":"po2","t":2,"id":"n723"},{"ty":"mcq","mk":1,"q":"A group of several village panchayats forms the","o":["Panchayat Samiti","Zila Parishad","Gram Sabha","Municipality"],"a":0,"e":"The Zila Parishad is at the district level.","ch":"po2","t":2,"id":"n724"},{"ty":"short","mk":3,"q":"Explain any three features of federalism.","m":"Two or more levels of government. Each level has its own jurisdiction in matters of legislation, taxation and administration. Jurisdictions of the respective levels are specified in the Constitution, which cannot be unilaterally changed by one level. Courts act as umpires.","p":["Two or more levels","Separate jurisdiction","Constitution and courts"],"ch":"po2","t":1,"id":"n725"},{"ty":"short","mk":3,"q":"How is the system of Panchayati Raj organised in India?","m":"At the village level the Gram Sabha (all adult voters) elects the Gram Panchayat. A group of panchayats forms the Panchayat Samiti (block), and all the Samitis in a district form the Zila Parishad. They are elected every five years and one-third of the seats are reserved for women.","p":["Gram Sabha and Panchayat","Samiti and Zila Parishad","Elections and reservation"],"ch":"po2","t":2,"id":"n726"},{"ty":"mcq","mk":1,"q":"The sexual division of labour means","o":["women do household work while men do outside work","equal work for all","only men work","women do not work"],"a":0,"e":"Women's work at home is unpaid and not valued.","ch":"po3","t":0,"id":"n727"},{"ty":"mcq","mk":1,"q":"In India, the proportion of women in the Lok Sabha is","o":["less than 15 per cent","about 50 per cent","more than 33 per cent","about 25 per cent"],"a":0,"e":"It remains very low.","ch":"po3","t":0,"id":"n728"},{"ty":"mcq","mk":1,"q":"Women's movements demanded","o":["equal rights and equal wages","special languages","more taxes","high prices"],"a":0,"e":"They demand political representation and an end to discrimination.","ch":"po3","t":0,"id":"n729"},{"ty":"mcq","mk":1,"q":"A communal political thought believes that","o":["religion is the principal basis of the social community","all religions are equal","politics must be separated from religion","religion must not be followed"],"a":0,"e":"Communalism leads to religious conflict.","ch":"po3","t":1,"id":"n730"},{"ty":"mcq","mk":1,"q":"India is a secular state because","o":["it has no official religion","it follows one religion","it bans religions","it has many castes"],"a":0,"e":"The Constitution treats all religions equally.","ch":"po3","t":1,"id":"n731"},{"ty":"mcq","mk":1,"q":"Family laws in India that deal with marriage, divorce and adoption","o":["differ for different religions","are the same for everyone","are decided by Parliament only","are abolished"],"a":0,"e":"Women's groups want these to be equal.","ch":"po3","t":1,"id":"n732"},{"ty":"mcq","mk":1,"q":"Caste in politics means that","o":["political parties choose candidates keeping caste in mind","caste has no role","caste decides laws","elections are banned"],"a":0,"e":"Parties try to win support from different castes.","ch":"po3","t":2,"id":"n733"},{"ty":"mcq","mk":1,"q":"Which statement about caste and politics is correct?","o":["caste is one factor among many in elections","caste decides every election","caste has disappeared","caste has no effect"],"a":0,"e":"Elections are also determined by performance and other factors.","ch":"po3","t":2,"id":"n734"},{"ty":"mcq","mk":1,"q":"Urbanisation, growth of literacy and occupational mobility have","o":["weakened caste hierarchy","increased untouchability","increased caste hatred","abolished caste"],"a":0,"e":"Old notions of caste are breaking down.","ch":"po3","t":2,"id":"n735"},{"ty":"ar","mk":1,"q":"Assertion (A): Communalism is a threat to democracy.\nReason (R): It uses religion for political mobilisation and leads to violence.","a":0,"e":"R explains A.","ar":1,"ch":"po3","t":1,"id":"n736"},{"ty":"case","mk":1,"cs":"In a village, women do most of the household work, while men do work outside the house and get paid.","q":"This situation shows","o":["sexual division of labour","equal division of labour","caste discrimination","communalism"],"a":0,"e":"Women's unpaid work at home is often not recognised as work.","ch":"po3","t":0,"id":"n737"},{"ty":"short","mk":3,"q":"Explain how women are discriminated against in India. Give any three reasons.","m":"Female literacy is lower than male literacy; wages are lower for equal work; sex ratio is declining due to sex-selective abortion; women are under-represented in politics and face domestic violence.","p":["Education","Wage inequality","Sex ratio or representation"],"ch":"po3","t":0,"id":"n738"},{"ty":"short","mk":3,"q":"What is communalism? Give any three forms of communalism.","m":"Communalism is the belief that religion is the main basis of social community and politics. Forms: everyday beliefs such as stereotypes of other religions; politicians seek majority dominance; the formation of a political party on religion; and the worst form, violence, riots and massacres.","p":["Definition","Everyday beliefs and politics","Violence"],"ch":"po3","t":1,"id":"n739"},{"ty":"mcq","mk":1,"q":"A political party is a group of people who come together to","o":["contest elections and hold power in government","do business","make a school","plan festivals"],"a":0,"e":"They agree on policies to promote the collective good.","ch":"po4","t":0,"id":"n740"},{"ty":"mcq","mk":1,"q":"Which of the following is a function of political parties?","o":["forming and running the government","printing currency","imposing taxes alone","conducting exams"],"a":0,"e":"Parties contest elections, form governments, and play the role of opposition.","ch":"po4","t":0,"id":"n741"},{"ty":"mcq","mk":1,"q":"Parties are accused of dividing society because","o":["they emphasise differences","they are strong","they vote","they unite"],"a":0,"e":"Rivalry among parties leads to tension.","ch":"po4","t":0,"id":"n742"},{"ty":"mcq","mk":1,"q":"The party system in the USA and UK is mainly","o":["two-party","multi-party","one-party","no-party"],"a":0,"e":"Power usually changes between two parties.","ch":"po4","t":1,"id":"n743"},{"ty":"mcq","mk":1,"q":"India has a","o":["multi-party system","one-party system","two-party system","no-party system"],"a":0,"e":"Many parties compete and a coalition government is formed.","ch":"po4","t":1,"id":"n744"},{"ty":"mcq","mk":1,"q":"The party in China is","o":["the Communist Party","Congress","BJP","Labour"],"a":0,"e":"China has a one-party system.","ch":"po4","t":1,"id":"n745"},{"ty":"mcq","mk":1,"q":"One of the Election Commission's criteria for recognising a national party is to","o":["secure at least six per cent of the votes in four states and win four seats in the Lok Sabha","win all the seats in one state","form the government at the Centre","have at least one MLA in each state"],"a":0,"e":"This is one of the criteria set by the Election Commission of India.","ch":"po4","t":1,"id":"n746"},{"ty":"mcq","mk":1,"q":"Alliance of different parties formed for contesting elections or forming government is called","o":["a coalition","a union","a federation","a lobby"],"a":0,"e":"An example is the National Democratic Alliance.","ch":"po4","t":2,"id":"n747"},{"ty":"mcq","mk":1,"q":"Challenges faced by political parties include","o":["lack of internal democracy","too many elections","too many people","too few parties"],"a":0,"e":"Parties do not hold organisational elections or keep membership registers.","ch":"po4","t":2,"id":"n748"},{"ty":"mcq","mk":1,"q":"Dynastic succession in parties means that","o":["top positions go to family members","leaders are elected","parties are banned","there is no party"],"a":0,"e":"It is a challenge to democracy.","ch":"po4","t":2,"id":"n749"},{"ty":"mcq","mk":1,"q":"Which one is a reform to reduce defection?","o":["Anti-defection law","Voting law","Property law","Tax law"],"a":0,"e":"It was added through the 52nd Amendment.","ch":"po4","t":2,"id":"n750"},{"ty":"mcq","mk":1,"q":"The Election Commission's orders have made it compulsory for candidates to","o":["file an affidavit giving details of property and criminal cases","have college degree","file a petition","pay no tax"],"a":0,"e":"This provides information to voters.","ch":"po4","t":2,"id":"n751"},{"ty":"ar","mk":1,"q":"Assertion (A): Political parties are necessary in a democracy.\nReason (R): Without parties, every candidate would be independent and no one would be responsible for governing.","a":0,"e":"Parties provide stable governance.","ar":1,"ch":"po4","t":1,"id":"n752"},{"ty":"short","mk":3,"q":"Why do we need political parties? Explain.","m":"Parties contest elections and form the government. They put forward policies and programmes, shape public opinion, make laws, and act as opposition. Without them every candidate would be independent and no one could promise a policy to the voters.","p":["Contest elections","Policies and laws","Opposition role"],"ch":"po4","t":0,"id":"n753"},{"ty":"short","mk":5,"q":"List any four challenges to political parties and suggest reforms.","m":"Challenges: lack of internal democracy, dynastic succession, role of money and muscle power, and lack of meaningful choice. Reforms: anti-defection law, affidavits of property and criminal records, mandatory organisational elections and filing of income tax returns, and state funding of elections.","p":["Four challenges","Anti-defection law","Affidavits","Other reforms"],"ch":"po4","t":2,"id":"n754"},{"ty":"mcq","mk":1,"q":"Democracy is better than other forms of government because","o":["it is accountable and responsive to the needs of citizens","it makes decisions faster","it is cheaper","it has no opposition"],"a":0,"e":"Citizens can examine decisions.","ch":"po5","t":0,"id":"n755"},{"ty":"mcq","mk":1,"q":"The Right to Information Act was passed in","o":["2005","1950","1975","2019"],"a":0,"e":"It enables citizens to ask for government information.","ch":"po5","t":0,"id":"n756"},{"ty":"mcq","mk":1,"q":"Transparency in democracy means","o":["citizens have the right to examine the process of decision-making","decisions are secret","laws are not shared","the army decides"],"a":0,"e":"Secrecy is the opposite.","ch":"po5","t":0,"id":"n757"},{"ty":"mcq","mk":1,"q":"Democracies in poor countries have a record of","o":["similar economic growth as dictatorship in the long run (but with greater inequality in some)","zero growth","no inequality","more poverty always"],"a":0,"e":"The difference in growth rates is small.","ch":"po5","t":1,"id":"n758"},{"ty":"mcq","mk":1,"q":"The country with high economic inequality is exemplified by","o":["South Africa and Brazil","Norway","Denmark","Japan"],"a":0,"e":"The top 20 per cent hold a large share of national income.","ch":"po5","t":1,"id":"n759"},{"ty":"mcq","mk":1,"q":"One of the outcomes of democracy is","o":["reduction of inequality is not guaranteed","elimination of poverty always","end of corruption","no conflicts"],"a":0,"e":"Democracies have not eliminated inequality.","ch":"po5","t":1,"id":"n760"},{"ty":"mcq","mk":1,"q":"Democracy accommodates social diversity by","o":["negotiating social differences peacefully","banning groups","forcing one language","ignoring conflict"],"a":0,"e":"The Belgium example shows this.","ch":"po5","t":2,"id":"n761"},{"ty":"mcq","mk":1,"q":"Democracy promotes dignity and freedom of the citizens by","o":["giving equal status and rights to all","giving rights only to rich","banning protest","nothing"],"a":0,"e":"Dignity of women and disadvantaged groups has been strengthened.","ch":"po5","t":2,"id":"n762"},{"ty":"mcq","mk":1,"q":"Democracy is considered legitimate because","o":["it is people's own government","it is old","it is imposed","it is simple"],"a":0,"e":"Citizens support it.","ch":"po5","t":2,"id":"n763"},{"ty":"ar","mk":1,"q":"Assertion (A): Democracy provides a method to deal with differences and conflict.\nReason (R): It gives a chance to express different opinions.","a":0,"e":"R explains A.","ar":1,"ch":"po5","t":1,"id":"n764"},{"ty":"short","mk":3,"q":"Why is democracy considered better than other forms of government? Give any three points.","m":"It promotes equality among citizens, enhances dignity of individuals, improves the quality of decision-making, provides a method to resolve conflicts, and allows room to correct mistakes. It is accountable and legitimate.","p":["Equality and dignity","Quality of decisions","Correct mistakes"],"ch":"po5","t":1,"id":"n765"},{"ty":"short","mk":3,"q":"Democracy does not guarantee economic growth. Do you agree? Support your answer.","m":"Yes. The evidence shows that dictatorships have had slightly higher rates of economic growth in some countries (the difference in growth rates over the long run is small). Growth depends on population, global situation, cooperation from other countries and priorities. Democracy has other benefits: freedom, dignity and accountability.","p":["Agreement stated","Evidence of the difference","Other factors"],"ch":"po5","t":2,"id":"n766"},{"ty":"mcq","mk":1,"q":"Different persons can have different developmental goals because","o":["their life situations are different","they have the same goals","they follow the same rules","they are poor"],"a":0,"e":"What one person considers development may not be so for others.","ch":"ec1","t":0,"id":"n767"},{"ty":"mcq","mk":1,"q":"The development goals of a landless rural labourer may be","o":["more days of work and better wages","high profits","more machines","a big house"],"a":0,"e":"Development goals depend on the person's situation.","ch":"ec1","t":0,"id":"n768"},{"ty":"mcq","mk":1,"q":"National development means","o":["the development of the country as a whole, considered through income, health and education","only rich development","only roads","only profit"],"a":0,"e":"Different people also have conflicting goals.","ch":"ec1","t":0,"id":"n769"},{"ty":"mcq","mk":1,"q":"Per capita income is","o":["total income of a country divided by its population","income of one person","income of the richest","total income of the world"],"a":0,"e":"It is also called average income.","ch":"ec1","t":1,"id":"n770"},{"ty":"mcq","mk":1,"q":"The criterion used by the World Bank to classify countries is","o":["per capita income","literacy","health","forests"],"a":0,"e":"Countries with higher per capita income are called rich.","ch":"ec1","t":1,"id":"n771"},{"ty":"mcq","mk":1,"q":"The Human Development Report is published by","o":["UNDP","World Bank","IMF","WTO"],"a":0,"e":"UNDP stands for the United Nations Development Programme.","ch":"ec1","t":1,"id":"n772"},{"ty":"mcq","mk":1,"q":"The Human Development Index (HDI) compares countries based on","o":["health, education and per capita income","only income","only literacy","only health"],"a":0,"e":"It is a more comprehensive measure of development.","ch":"ec1","t":1,"id":"n773"},{"ty":"mcq","mk":1,"q":"Which of the following states of India has the highest literacy and the lowest infant mortality rate?","o":["Kerala","Bihar","Haryana","Punjab"],"a":0,"e":"Kerala has better health and education.","ch":"ec1","t":1,"id":"n774"},{"ty":"mcq","mk":1,"q":"Which of these is a public facility that increases people's well-being?","o":["schools and hospitals","private cars","luxury homes","mobile games"],"a":0,"e":"Public facilities benefit all.","ch":"ec1","t":2,"id":"n775"},{"ty":"mcq","mk":1,"q":"Sustainability of development means","o":["development that can continue for a long time without harming resources","short-term gains","quick profits","exports"],"a":0,"e":"It means keeping resources for future generations.","ch":"ec1","t":2,"id":"n776"},{"ty":"mcq","mk":1,"q":"Non-renewable resources are those which","o":["get exhausted after use","can be replenished","are everlasting","are plants"],"a":0,"e":"Examples are crude oil and coal.","ch":"ec1","t":2,"id":"n777"},{"ty":"ar","mk":1,"q":"Assertion (A): Per capita income does not tell us how income is distributed among people.\nReason (R): It is just an average and can hide inequality.","a":0,"e":"R explains A.","ar":1,"ch":"ec1","t":1,"id":"n778"},{"ty":"short","mk":3,"q":"Why do different persons have different development goals? Explain with one example.","m":"People's aspirations depend on their life situation. A landless labourer wants more days of work and better wages, while a rich farmer's daughter may want more freedom and a good education. Thus goals may conflict.","p":["Reason","One example","Conflicting goals"],"ch":"ec1","t":0,"id":"n779"},{"ty":"short","mk":3,"q":"What is meant by Per capita income? Why is it not enough to measure development?","m":"Per capita income is the average income per person: total income divided by population. It does not show how income is distributed, nor does it consider health, education, environment, dignity or freedom, and so we use HDI as well.","p":["Definition","Hides inequality","Other indicators"],"ch":"ec1","t":1,"id":"n780"},{"ty":"short","mk":3,"q":"What is sustainable development? Why is it important?","m":"Development that meets the needs of the present generation without compromising the ability of future generations to meet theirs. It is important because resources like groundwater and crude oil are limited, and over-use damages the environment.","p":["Definition","Limited resources","Environment"],"ch":"ec1","t":2,"id":"n781"},{"ty":"mcq","mk":1,"q":"Which of the following is a primary sector activity?","o":["agriculture","banking","manufacturing","teaching"],"a":0,"e":"Primary sector uses natural resources.","ch":"ec2","t":0,"id":"n782"},{"ty":"mcq","mk":1,"q":"Cotton cloth is made from cotton, which means cloth-making belongs to the","o":["secondary sector","primary sector","tertiary sector","quaternary sector"],"a":0,"e":"It involves manufacturing.","ch":"ec2","t":0,"id":"n783"},{"ty":"mcq","mk":1,"q":"Which of the following is a tertiary sector activity?","o":["banking","farming","mining","fishing"],"a":0,"e":"Services such as banking, transport, communication belong to it.","ch":"ec2","t":0,"id":"n784"},{"ty":"mcq","mk":1,"q":"GDP is the","o":["value of all final goods and services produced within a country in a particular year","total exports","total imports","total income of the rich"],"a":0,"e":"It is the measure of the total production.","ch":"ec2","t":1,"id":"n785"},{"ty":"mcq","mk":1,"q":"Which sector produces the largest share of GDP in India?","o":["tertiary sector","primary sector","secondary sector","agriculture"],"a":0,"e":"The services sector has overtaken others.","ch":"ec2","t":1,"id":"n786"},{"ty":"mcq","mk":1,"q":"Which sector employs the largest number of people in India?","o":["primary sector (agriculture)","secondary sector","tertiary sector","none"],"a":0,"e":"More people are in agriculture.","ch":"ec2","t":1,"id":"n787"},{"ty":"mcq","mk":1,"q":"When more people are engaged in a work than needed, it is called","o":["underemployment (disguised unemployment)","unemployment","full employment","self employment"],"a":0,"e":"Reducing some of them will not reduce production.","ch":"ec2","t":1,"id":"n788"},{"ty":"mcq","mk":1,"q":"The organised sector is characterised by","o":["fixed hours of work and job security","no registration","low wages","no rules"],"a":0,"e":"Employees get paid leave and pension.","ch":"ec2","t":2,"id":"n789"},{"ty":"mcq","mk":1,"q":"In the unorganised sector","o":["jobs are not secure and there are no fixed rules","there are many benefits","government protects","all pay tax"],"a":0,"e":"Examples are casual workers and small shops.","ch":"ec2","t":2,"id":"n790"},{"ty":"mcq","mk":1,"q":"Which of the following is an example of unorganised sector activity?","o":["a daily wage labourer","a bank employee","a government teacher","an IT firm"],"a":0,"e":"There are no fixed rules.","ch":"ec2","t":2,"id":"n791"},{"ty":"mcq","mk":1,"q":"MGNREGA 2005 guarantees","o":["100 days of employment in a year in rural areas","loans","free rice","jobs in cities"],"a":0,"e":"It is the Right to Work.","ch":"ec2","t":3,"id":"n792"},{"ty":"mcq","mk":1,"q":"Which of the following is a public sector enterprise?","o":["Indian Railways","Tata Steel","Reliance","Infosys"],"a":0,"e":"It is owned by the government.","ch":"ec2","t":3,"id":"n793"},{"ty":"mcq","mk":1,"q":"The sector owned by individuals or companies is the","o":["private sector","public sector","joint sector","cooperative"],"a":0,"e":"Its aim is profit.","ch":"ec2","t":3,"id":"n794"},{"ty":"ar","mk":1,"q":"Assertion (A): The government has to bear the cost of providing basic services such as water, roads and electricity.\nReason (R): The private sector is not interested in services which do not give profit.","a":0,"e":"R explains A.","ar":1,"ch":"ec2","t":3,"id":"n795"},{"ty":"short","mk":3,"q":"Distinguish between primary, secondary and tertiary sectors with examples.","m":"Primary sector produces natural products, e.g. farming, dairy. Secondary sector converts natural products into other forms through manufacturing, e.g. sugar, steel. Tertiary sector provides services, e.g. banking, transport, teaching.","p":["Primary","Secondary","Tertiary"],"ch":"ec2","t":0,"id":"n796"},{"ty":"short","mk":3,"q":"Differentiate between organised and unorganised sectors. State one problem faced by workers in the unorganised sector.","m":"Organised: registered with the government; follows rules; workers have fixed hours, job security and benefits. Unorganised: small units outside government control, no fixed rules, low wages, no job security. Workers are often exploited, e.g. long hours and low pay.","p":["Organised features","Unorganised features","One problem"],"ch":"ec2","t":2,"id":"n797"},{"ty":"short","mk":5,"q":"What is MGNREGA? Why was it introduced and what are its benefits?","m":"MGNREGA 2005 gives a legal right to work to every rural household that asks for it: 100 days' employment in a year. It was introduced to tackle unemployment and underemployment in rural areas and reduce distress migration. If the government fails, it must give an unemployment allowance. Work includes building roads, ponds and water conservation.","p":["Act and 100 days","Reason for it","Unemployment allowance","Types of work"],"ch":"ec2","t":3,"id":"n798"},{"ty":"mcq","mk":1,"q":"Barter system requires","o":["double coincidence of wants","currency","banks","credit cards"],"a":0,"e":"Each party must have what the other wants.","ch":"ec3","t":0,"id":"n799"},{"ty":"mcq","mk":1,"q":"Modern forms of money include","o":["currency and deposits in banks","gold only","shells","cattle"],"a":0,"e":"Currency notes are issued by the RBI.","ch":"ec3","t":0,"id":"n800"},{"ty":"mcq","mk":1,"q":"Currency notes in India are issued by the","o":["Reserve Bank of India","State Bank of India","Finance Ministry","Parliament"],"a":0,"e":"RBI issues on behalf of the central government.","ch":"ec3","t":0,"id":"n801"},{"ty":"mcq","mk":1,"q":"Deposits that can be withdrawn on demand are called","o":["demand deposits","fixed deposits","loan deposits","term deposits"],"a":0,"e":"They are payable on demand by cheques.","ch":"ec3","t":1,"id":"n802"},{"ty":"mcq","mk":1,"q":"Banks keep only a small proportion of deposits as cash because","o":["few depositors withdraw money on any day","banks are poor","the law says so","money is not needed"],"a":0,"e":"The rest is used to give loans.","ch":"ec3","t":1,"id":"n803"},{"ty":"mcq","mk":1,"q":"The RBI supervises the functioning of banks to ensure","o":["that banks maintain cash balances and lend to small borrowers","they lend only to the rich","they never fail","they advertise"],"a":0,"e":"It checks banks' activities.","ch":"ec3","t":1,"id":"n804"},{"ty":"mcq","mk":1,"q":"Collateral is","o":["an asset that the borrower offers as a guarantee for a loan","an interest","a type of bank","a new coin"],"a":0,"e":"It is forfeited if the loan is not repaid.","ch":"ec3","t":2,"id":"n805"},{"ty":"mcq","mk":1,"q":"Which of the following is a source of formal credit?","o":["a bank","a moneylender","a trader","a relative"],"a":0,"e":"Formal sources are supervised by the RBI.","ch":"ec3","t":2,"id":"n806"},{"ty":"mcq","mk":1,"q":"The terms of credit include","o":["interest rate, collateral, documentation requirement and mode of repayment","only the amount","only the date","only the colour"],"a":0,"e":"They vary from lender to lender.","ch":"ec3","t":2,"id":"n807"},{"ty":"mcq","mk":1,"q":"Self-Help Groups usually consist of","o":["15 to 20 members from a neighbourhood","100 members","2 members","only women of one family"],"a":0,"e":"They pool savings and give loans.","ch":"ec3","t":2,"id":"n808"},{"ty":"mcq","mk":1,"q":"The Grameen Bank of Bangladesh was founded by","o":["Muhammad Yunus","Amartya Sen","Gandhiji","Nehru"],"a":0,"e":"It gives loans to poor, especially women.","ch":"ec3","t":2,"id":"n809"},{"ty":"ar","mk":1,"q":"Assertion (A): Informal lenders such as moneylenders often charge very high interest rates.\nReason (R): There is no organisation supervising their lending activities.","a":0,"e":"R explains A.","ar":1,"ch":"ec3","t":2,"id":"n810"},{"ty":"case","mk":1,"cs":"Salim needs a loan of ₹5 lakh to start a small shop. He has a choice between a bank loan at 10% interest per year and a moneylender at 36% per year.","q":"The b
