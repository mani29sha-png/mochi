<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#0b080a"><title>Mochi 🍡 – Class 10 Planner</title><style>
:root{--bg:#0b080a;--card:#1a1217;--ink:#fff1f6;--mute:#d3b3c3;--line:#3d2632;--pri:#ff4fa3;--pri2:#ff9acb;--onpri:#1c0612;--ok:#6ee7b0;--okbg:#10291e;--bad:#ff7a90;--badbg:#3b1520;--warn:#ffc857;--soft:#2b1824;--chip:#261a21;--sh:0 2px 10px rgba(0,0,0,.55)}


*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:var(--sh)}
.mute{color:var(--mute);font-size:.9rem}.small{font-size:.85rem}.center{text-align:center}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
button,.btn{font:inherit;min-height:48px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:600}
button:active{transform:scale(.98)}button:disabled{opacity:.45}
.btn.pri,button.pri{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.btn.ok,button.ok{background:var(--ok);border-color:var(--ok);color:#06210f}
.btn.ghost{background:transparent}
.big{width:100%;min-height:68px;font-size:1.25rem;border-radius:20px}
.full{width:100%}
input,select,textarea{font:inherit;min-height:48px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
label{display:block;margin:8px 0 4px;font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:none;border-radius:0;min-height:62px;background:transparent;font-size:.95rem;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute)}
.nav button .ic{font-size:1.5rem;line-height:1}.nav button.on{color:var(--pri)}
.seg{display:flex;gap:6px;background:var(--chip);padding:5px;border-radius:16px;margin:8px 0}
.seg button{flex:1;border:none;background:transparent;min-height:46px;border-radius:12px;padding:6px}
.seg button.on{background:var(--pri);box-shadow:var(--sh);color:var(--onpri)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--chip);border-radius:16px;padding:10px 12px}.stat b{font-size:1.35rem;display:block}
.bar{height:12px;background:var(--chip);border-radius:8px;overflow:hidden;position:relative;border:1px solid var(--line)}
.bar i{display:block;position:absolute;left:0;top:0;bottom:0;border-radius:8px}
.bar i.a{background:var(--pri2)}.bar i.b{background:var(--ok)}
.bar.thin{height:8px}
.mochi{display:flex;gap:10px;align-items:flex-end;margin:8px 0}
.mochi svg{flex:0 0 74px;width:74px;height:74px;filter:drop-shadow(0 0 8px rgba(255,79,163,.5))}
.bubble{position:relative;background:var(--card);border:2px solid var(--pri2);border-radius:18px;padding:10px 14px;flex:1;font-weight:500}
.bubble:before{content:"";position:absolute;left:-10px;bottom:16px;border:8px solid transparent;border-right-color:var(--pri2);border-left:0}
.task{display:flex;gap:10px;align-items:center;border-left:8px solid var(--c,#999);padding:10px 10px 10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c,#999);margin:8px 0}
.task.done{opacity:.6}.task .t{flex:1;min-width:0}.task .t b{display:block}
.task button{min-width:84px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--chip);font-size:.8rem;font-weight:600;margin:2px 4px 2px 0;border:1px solid var(--line)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.off{background:var(--soft)}
.topic{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:60px;padding:10px 12px;border-radius:16px;border:2px solid var(--line);background:var(--card);margin:6px 0}
.topic .bx{flex:0 0 36px;height:36px;border-radius:10px;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.topic.s1{background:var(--okbg);border-color:var(--ok)}.topic.s1 .bx{background:var(--ok);border-color:var(--ok);color:#06210f}
.topic.s2{background:var(--okbg);border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}.topic.s2 .bx{background:var(--ok);border-color:var(--ok);color:#06210f}
.topic.f{border-color:var(--warn);background:var(--soft)}
.topic .tn{flex:1;font-weight:600}
.star{flex:0 0 52px;min-width:52px;height:52px;padding:0;font-size:1.5rem;border-radius:14px}
.star.on{background:var(--warn);border-color:var(--warn)}.star,.pen{flex:0 0 48px;min-width:48px}
.tick{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);margin:4px 4px 4px 0}
.vid{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);margin:0 0 6px 46px;font-size:.9rem}
.vid.on{background:#3a1430;border-color:var(--pri);color:#ffc2e0}
.tick.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.acc{width:100%;text-align:left;display:block;min-height:64px;padding:12px;border-radius:16px;margin:8px 0;background:var(--card)}
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.ov .in{max-width:720px;margin:0 auto;padding-bottom:40px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{background:var(--card);border:2px solid var(--pri);border-radius:20px;padding:18px;max-width:420px;width:100%}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;min-height:56px;align-items:flex-start;border-radius:14px;padding:12px}
.opt .l{flex:0 0 28px;height:28px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{border-radius:14px;padding:10px 12px;margin:10px 0}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.case{background:var(--chip);border-radius:12px;padding:10px;margin:8px 0;font-size:.95rem}
.q{white-space:pre-wrap;font-size:1.08rem;font-weight:600;margin:8px 0}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#2b1824;border:2px solid var(--pri);color:var(--ink);padding:12px 18px;border-radius:14px;z-index:99;max-width:90%;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:.75rem;color:var(--mute)}
.cal button{min-height:44px;padding:0;border-radius:10px;font-size:.9rem;border:2px solid transparent;position:relative}
.cal .studied{background:var(--ok);color:#06210f}.cal .missed{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.cal .rest{background:var(--chip);color:var(--mute)}.cal .frozen{background:#15293d;color:#9fd0ff}.cal .today{border-color:var(--pri);font-weight:800}.cal .fut{opacity:.4}.cal .pre{opacity:.25}
.legend span{margin-right:10px;font-size:.8rem;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding:8px 4px;overflow-x:auto;border-bottom:2px solid var(--line)}
.chart .c{flex:0 0 38px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .c i{display:block;width:30px;border-radius:6px 6px 0 0;min-height:3px}
.chart .c span{font-size:.7rem;font-weight:700}
.warn{background:var(--soft);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0}

.src{font-size:.78rem;color:var(--mute);margin-top:6px}

/* Mochi animation */
.mo{overflow:visible}.mo *{transform-box:fill-box}
.mo-all{transform-origin:50% 100%}
.mo-body{animation:moBob 3.4s ease-in-out infinite;transform-origin:50% 100%}
.mo-eye{animation:moBlink 5s infinite;transform-origin:50% 50%}
.mo-ear{transform-origin:50% 95%}.mo-ear.l{animation:moEarL 6s ease-in-out infinite}.mo-ear.r{animation:moEarR 6s ease-in-out 1.2s infinite}
.mo-arm{transform-origin:20% 25%}
.mo-sp{opacity:0}.mo-sp path{transform-origin:50% 50%}
.m-s{display:none}
@keyframes moBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.015,.985)}}
@keyframes moBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes moEarL{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-9deg)}90%{transform:rotate(5deg)}95%{transform:rotate(-4deg)}}
@keyframes moEarR{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(9deg)}90%{transform:rotate(-5deg)}95%{transform:rotate(4deg)}}
@keyframes moJump{0%{transform:translateY(0) scale(1.08,.9)}25%{transform:translateY(-22px) scale(.95,1.08)}50%{transform:translateY(0) scale(1.08,.92)}70%{transform:translateY(-10px)}100%{transform:translateY(0) scale(1,1)}}
@keyframes moWave{0%,100%{transform:rotate(0)}20%{transform:rotate(-35deg)}40%{transform:rotate(15deg)}60%{transform:rotate(-35deg)}80%{transform:rotate(10deg)}}
@keyframes moSp{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
@keyframes moSpin{0%{transform:scale(.2) rotate(0)}50%{transform:scale(1.25) rotate(60deg)}100%{transform:scale(.6) rotate(120deg)}}
@keyframes moSad{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-6deg) translateY(2px)}40%{transform:rotate(5deg) translateY(2px)}60%{transform:rotate(-4deg) translateY(2px)}80%{transform:rotate(2deg)}}
@keyframes moDrop{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(18deg)}}
@keyframes moEnc{0%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
.mo.cheer .mo-all{animation:moJump 1.1s ease-in-out 1}.mo.cheer .mo-body{animation:none}.mo.cheer .mo-arm{animation:moWave 1.1s ease-in-out .3s 1}
.mo.cheer .mo-sp{animation:moSp 1.6s ease-out 1}.mo.cheer .mo-sp path{animation:moSpin 1.6s ease-out 1}
.mo.sad .mo-all{animation:moSad 1.3s ease-in-out 1}.mo.sad .mo-body{animation:none}.mo.sad .m-h{display:none}.mo.sad .m-s{display:inline}.mo.sad .mo-ear{animation:moDrop 1.3s ease-in-out 1}
.mo.enc .mo-all{animation:moEnc .9s ease-in-out 2}.mo.enc .mo-arm{animation:moWave 1s ease-in-out 1}.mo.enc .mo-body{animation:none}
@media (prefers-reduced-motion:reduce){.mo *,.mo{animation:none!important}.mo.cheer .mo-sp{opacity:1}.mo.sad .m-h{display:none}.mo.sad .m-s{display:inline}}
.pen{height:48px;padding:0;font-size:1.25rem;border-radius:14px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:70;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}.sheet .in{max-width:720px;margin:0 auto;padding-bottom:60px}
.erow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.erow .grow{min-width:0;overflow-wrap:anywhere}
.chip.ed{background:#3a1430;color:#ffc2e0;border-color:var(--pri)}
.dayrow{width:100%;text-align:left;display:block;min-height:56px;border-radius:16px;margin:8px 0;padding:10px 12px;background:var(--card)}

.mo.rest .mo-eye{animation:none;transform:scaleY(.12)}.mo.rest .mo-body{animation:moBob 5s ease-in-out infinite}
.brkwrap{position:relative;width:150px;margin:0 auto}.brkwrap svg{width:150px;height:150px}
.zz{position:absolute;font-weight:800;color:#ff8fc0;animation:zz 2.6s ease-in-out infinite;opacity:0}
.z1{right:6px;top:34px;font-size:1.1rem}.z2{right:-8px;top:12px;font-size:1.5rem;animation-delay:.8s}.z3{right:12px;top:-8px;font-size:1.9rem;animation-delay:1.6s}
.cup{position:absolute;left:-10px;bottom:4px;font-size:2rem}
@keyframes zz{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.bigclk{font-size:2.4rem;font-weight:800;color:var(--pri)}
@media (prefers-reduced-motion:reduce){.zz{animation:none;opacity:1}}

/* ===== MATHS (own practice questions) ===== */
M('m1',1,'The HCF of 96 and 404 is',['2','4','8','12'],1,'96 = 2⁵×3 and 404 = 2²×101, so HCF = 2² = 4.');
M('m1',1,'If HCF(26, 91) = 13, then LCM(26, 91) is',['182','91','26','1183'],0,'HCF × LCM = product of numbers, so LCM = 26×91/13 = 182.');
M('m1',0,'Which of these numbers can never end with the digit 0 (n a natural number)?',['6ⁿ','10ⁿ','20ⁿ','50ⁿ'],0,'To end in 0 a number needs both 2 and 5 as prime factors. 6ⁿ = 2ⁿ·3ⁿ has no factor 5.');
AR('m1',3,'3 + 2√5 is an irrational number.','The sum of a rational number and an irrational number is irrational.',0,'3 is rational and 2√5 is irrational, so their sum is irrational. R is exactly the reason.');
S('m1',2,3,'Prove that √3 is an irrational number.','Assume √3 is rational: √3 = p/q with p, q co-prime, q ≠ 0. Squaring, 3q² = p², so 3 divides p² and hence p. Let p = 3k, then 3q² = 9k², so q² = 3k², hence 3 divides q. Then p and q have a common factor 3, which contradicts co-primality. So √3 is irrational.',['Assume √3 = p/q with p, q co-prime','Get p² = 3q², so 3 | p','Put p = 3k, get 3 | q','Contradiction with co-prime → √3 irrational']);
M('m2',0,'The zeroes of the polynomial x² − 5x + 6 are',['2 and 3','−2 and −3','1 and 6','−1 and 6'],0,'x² − 5x + 6 = (x−2)(x−3), so the zeroes are 2 and 3.');
M('m2',2,'The sum and product of the zeroes of 2x² − 8x + 6 are',['4 and 3','−4 and 3','8 and 6','4 and −3'],0,'Sum = −b/a = 8/2 = 4; product = c/a = 6/2 = 3.');
M('m2',3,'A quadratic polynomial whose zeroes are 3 and −2 is',['x² − x − 6','x² + x − 6','x² − x + 6','x² − 5x − 6'],0,'Sum = 1, product = −6, so the polynomial is x² − (sum)x + product = x² − x − 6.');
M('m2',1,'The graph of a quadratic polynomial can NOT cut the x-axis at',['0 points','1 point','2 points','3 points'],3,'A quadratic has at most 2 zeroes, so its parabola cuts the x-axis at most twice.');
AR('m2',1,'x² + 1 has no real zeroes.','The graph of y = x² + 1 does not meet the x-axis.',0,'x² + 1 ≥ 1 for all x, so the parabola stays above the x-axis; no intersection means no real zeroes.');
S('m2',4,3,'If α and β are the zeroes of 2x² − 7x + 3, find α² + β².','α + β = 7/2 and αβ = 3/2. α² + β² = (α+β)² − 2αβ = 49/4 − 3 = 37/4.',['Sum = 7/2, product = 3/2','Use (α+β)² − 2αβ','Answer 37/4']);
M('m3',1,'The pair x + 2y = 3 and 2x + 4y = 7 has',['a unique solution','no solution','infinitely many solutions','exactly two solutions'],1,'a₁/a₂ = b₁/b₂ = 1/2 but c₁/c₂ = 3/7, so the lines are parallel: no solution.');
M('m3',3,'Solution of x + y = 5 and x − y = 1 is',['(3, 2)','(2, 3)','(4, 1)','(5, 0)'],0,'Adding: 2x = 6, x = 3, so y = 2.');
M('m3',1,'For what value of k does 2x + 3y = 7 and (k−1)x + (k+2)y = 3k have infinitely many solutions?',['5','6','7','8'],2,'Need (k−1)/2 = (k+2)/3 = 3k/7. From the first two, 3k − 3 = 2k + 4, so k = 7; and 3k/7 = 3 matches.');
AR('m3',1,'The system 2x + 3y = 5 and 4x + 6y = 10 has infinitely many solutions.','For a₁x+b₁y+c₁=0 and a₂x+b₂y+c₂=0, a₁/a₂ = b₁/b₂ = c₁/c₂ gives infinitely many solutions.',0,'Here 2/4 = 3/6 = 5/10, so the lines coincide.');
S('m3',4,3,'The sum of the digits of a two-digit number is 9. The number obtained by reversing the digits is 27 more than the original number. Find the number.','Let the digits be x (tens) and y (units). x + y = 9 and (10y + x) − (10x + y) = 27 ⇒ y − x = 3. Solving: y = 6, x = 3. The number is 36.',['Form x + y = 9','Form y − x = 3','Solve: x = 3, y = 6','Number = 36']);
M('m4',1,'The roots of x² − 3x − 10 = 0 are',['5 and −2','−5 and 2','5 and 2','−5 and −2'],0,'x² − 3x − 10 = (x − 5)(x + 2).');

S('m7',1,5,'State and prove the Basic Proportionality Theorem (Thales).','If a line is drawn parallel to one side of a triangle to intersect the other two sides in distinct points, the other two sides are divided in the same ratio. Proof: in △ABC, DE ∥ BC. Join BE and CD, draw EN ⊥ AB and DM ⊥ AC. ar(ADE)/ar(BDE) = AD/DB, and ar(ADE)/ar(CED) = AE/EC. △BDE and △CED are on the same base DE and between the same parallels DE and BC, so they have equal area. Hence AD/DB = AE/EC.',['Statement of BPT','Figure and construction (join BE, CD; draw perpendiculars)','Area ratios with ½ × base × height','ar(BDE) = ar(CED) (same base, same parallels)','Conclude AD/DB = AE/EC']);

S('s13',1,3,'What is biological magnification? Why is it highest in top-level carnivores?','Biological magnification is the increase in concentration of harmful non-biodegradable chemicals (like pesticides) at each successive trophic level. Because these chemicals are not broken down or excreted, they accumulate, so top carnivores (e.g., birds of prey) carry the highest concentration.',['Definition: concentration increases along food chain','Non-biodegradable chemicals accumulate','Highest at top trophic level']);

S('hq6',1,3,'‘संगतकार’ कविता में मुख्य गायक की सफलता में संगतकार की क्या भूमिका बताई गई है?','संगतकार मुख्य गायक के स्वर को सहारा देता है। जब गायक का स्वर बिखरने लगता है तो वह उसे संभाल लेता है और अपनी आवाज़ मिलाकर उसे ऊँचाई देता है। फिर भी वह अपनी आवाज़ को दबाकर रखता है, यही उसकी विनम्रता और मानवीयता है।',['स्वर को सहारा देना','स्वर बिखरने पर संभालना','अपनी आवाज़ दबाकर रखना (विनम्रता)']);

var NQD=[{"ty":"mcq","mk":1,"q":"Every composite number can be expressed as a product of primes, and this factorisation is unique apart from the order of factors. This is the","o":["Fundamental Theorem of Arithmetic","Euclid's Division Lemma","Remainder Theorem","Factor Theorem"],"a":0,"e":"The statement is the Fundamental Theorem of Arithmetic.","ch":"m1","t":0,"id":"n1"},{"ty":"mcq","mk":1,"q":"The prime factorisation of 3825 is","o":["3² × 5² × 17","3 × 5³ × 17","3² × 5 × 17²","3³ × 5² × 7"],"a":0,"e":"3825 = 3 × 1275 = 3 × 3 × 425 = 3² × 5² × 17.","ch":"m1","t":0,"id":"n2"},{"ty":"mcq","mk":1,"q":"If n = 2³ × 3 × 5², the total number of prime factors counted with repetition is","o":["6","3","8","5"],"a":0,"e":"Exponents add up: 3 + 1 + 2 = 6.","ch":"m1","t":0,"id":"n3"},{"ty":"ar","mk":1,"q":"Assertion (A): The number 6ⁿ ends in the digit 0 for some natural number n.\nReason (R): 6ⁿ = 2ⁿ × 3ⁿ has no factor 5.","a":3,"e":"A is false. To end in 0, a number needs both 2 and 5 among its prime factors; 6ⁿ has no 5. R is true.","ar":1,"ch":"m1","t":0,"id":"n4"},{"ty":"mcq","mk":1,"q":"The LCM of 12, 15 and 21 is","o":["420","210","105","1260"],"a":0,"e":"12 = 2²·3, 15 = 3·5, 21 = 3·7. LCM = 2²·3·5·7 = 420.","ch":"m1","t":1,"id":"n5"},{"ty":"mcq","mk":1,"q":"If HCF(a, b) = 12 and a × b = 1800, then LCM(a, b) is","o":["150","120","216","1800"],"a":0,"e":"HCF × LCM = a × b, so LCM = 1800/12 = 150.","ch":"m1","t":1,"id":"n6"},{"ty":"mcq","mk":1,"q":"The HCF of 135 and 225 is","o":["45","15","75","25"],"a":0,"e":"135 = 3³·5 and 225 = 3²·5². HCF = 3²·5 = 45.","ch":"m1","t":1,"id":"n7"},{"ty":"mcq","mk":1,"q":"Two numbers are in the ratio 3 : 4 and their LCM is 180. Their HCF is","o":["15","12","20","30"],"a":0,"e":"Numbers are 3k and 4k, LCM = 12k = 180, so k = 15 = HCF.","ch":"m1","t":1,"id":"n8"},{"ty":"mcq","mk":1,"q":"Which of the following is a rational number?","o":["√9","√2","π","√7"],"a":0,"e":"√9 = 3, which is rational. The others are irrational.","ch":"m1","t":2,"id":"n9"},{"ty":"mcq","mk":1,"q":"If √2 is assumed to be rational, we write it as p/q where p and q are","o":["co-prime integers, q ≠ 0","both even","both odd","any integers with q = 0"],"a":0,"e":"The proof by contradiction begins by taking p/q in lowest terms (co-prime).","ch":"m1","t":2,"id":"n10"},{"ty":"ar","mk":1,"q":"Assertion (A): √2 is irrational.\nReason (R): The product of a non-zero rational number and an irrational number is irrational.","a":1,"e":"Both are true, but R is a general fact used for numbers like 3√2, it is not the reason √2 itself is irrational (that needs the proof by contradiction).","ar":1,"ch":"m1","t":2,"id":"n11"},{"ty":"short","mk":3,"q":"Prove that √5 is an irrational number.","m":"Assume √5 = p/q with p, q co-prime and q ≠ 0. Squaring gives 5q² = p², so 5 divides p² and hence 5 divides p. Write p = 5k; then 5q² = 25k² so q² = 5k², and 5 divides q. So p and q have the common factor 5, contradicting co-primality. Hence √5 is irrational.","p":["Assume √5 = p/q, co-prime","Get p² = 5q², so 5 divides p","Put p = 5k and show 5 divides q","State the contradiction and conclude"],"ch":"m1","t":2,"id":"n12"},{"ty":"mcq","mk":1,"q":"Which of these is irrational?","o":["7 − 2√3","√49","0.25","22/7"],"a":0,"e":"A rational number minus an irrational number (2√3) is irrational.","ch":"m1","t":3,"id":"n13"},{"ty":"mcq","mk":1,"q":"(√3 + √5)² is","o":["irrational","rational","an integer","a natural number"],"a":0,"e":"(√3+√5)² = 8 + 2√15, and 2√15 is irrational, so the sum is irrational.","ch":"m1","t":3,"id":"n14"},{"ty":"mcq","mk":1,"q":"Between 2 and 3, which of these is an irrational number?","o":["√6","2.5","√9","2.75"],"a":0,"e":"√6 ≈ 2.449 lies between 2 and 3 and is irrational; 2.5 and 2.75 are rational, √9 = 3.","ch":"m1","t":3,"id":"n15"},{"ty":"short","mk":2,"q":"Show that 5 − 2√3 is irrational, given that √3 is irrational.","m":"Suppose 5 − 2√3 = r is rational. Then 2√3 = 5 − r is rational, so √3 = (5 − r)/2 is rational. This contradicts the given fact that √3 is irrational. So 5 − 2√3 is irrational.","p":["Assume 5 − 2√3 is rational","Deduce √3 is rational","Contradiction with the given fact"],"ch":"m1","t":3,"id":"n16"},{"ty":"mcq","mk":1,"q":"Three bells ring every 6, 8 and 12 minutes. If they ring together at 9:00 am, they next ring together at","o":["9:24 am","9:12 am","9:48 am","10:00 am"],"a":0,"e":"LCM(6, 8, 12) = 24 minutes.","ch":"m1","t":4,"id":"n17"},{"ty":"mcq","mk":1,"q":"The greatest number that divides 70 and 125 leaving remainders 5 and 8 respectively is","o":["13","15","11","17"],"a":0,"e":"Need HCF(70−5, 125−8) = HCF(65, 117) = 13.","ch":"m1","t":4,"id":"n18"},{"ty":"short","mk":3,"q":"Find the smallest number which when divided by 25, 40 and 60 leaves remainder 7 in each case.","m":"LCM(25, 40, 60) = 600 (25 = 5², 40 = 2³·5, 60 = 2²·3·5, so LCM = 2³·3·5² = 600). The required number is 600 + 7 = 607.","p":["Find the LCM of 25, 40, 60 = 600","Add the common remainder 7","Answer 607"],"ch":"m1","t":4,"id":"n19"},{"ty":"mcq","mk":1,"q":"The zeroes of the polynomial p(x) = x² − 7x + 12 are","o":["3 and 4","−3 and −4","2 and 6","1 and 12"],"a":0,"e":"x² − 7x + 12 = (x − 3)(x − 4).","ch":"m2","t":0,"id":"n20"},{"ty":"mcq","mk":1,"q":"If x = 2 is a zero of x³ − 3x² + kx − 6, then k equals","o":["7","5","−7","3"],"a":0,"e":"p(2) = 8 − 12 + 2k − 6 = 2k − 10 = 0, so k = 5.","ch":"m2","t":0,"id":"n21"},{"ty":"mcq","mk":1,"q":"The number of zeroes of a linear polynomial ax + b (a ≠ 0) is","o":["1","0","2","3"],"a":0,"e":"A linear polynomial has exactly one zero, x = −b/a.","ch":"m2","t":0,"id":"n22"},{"ty":"mcq","mk":1,"q":"The degree of a polynomial is","o":["the highest power of the variable","the sum of all powers","the number of terms","the lowest power"],"a":0,"e":"Degree = greatest exponent of the variable.","ch":"m2","t":0,"id":"n23"},{"ty":"mcq","mk":1,"q":"The graph of y = p(x) cuts the x-axis at 3 points. The degree of p(x) is at least","o":["3","2","1","4"],"a":0,"e":"The number of zeroes cannot exceed the degree, so degree ≥ 3.","ch":"m2","t":1,"id":"n24"},{"ty":"mcq","mk":1,"q":"The graph of a quadratic polynomial that opens downwards has","o":["a < 0","a > 0","a = 0","b = 0"],"a":0,"e":"A parabola opens downwards when the coefficient of x² is negative.","ch":"m2","t":1,"id":"n25"},{"ty":"mcq","mk":1,"q":"If the graph of y = p(x) touches the x-axis at exactly one point, the quadratic p(x) has","o":["two equal zeroes","no zeroes","two distinct zeroes","three zeroes"],"a":0,"e":"Touching at one point means a repeated zero (discriminant zero).","ch":"m2","t":1,"id":"n26"},{"ty":"case","mk":1,"cs":"The graph of a polynomial y = p(x) is a parabola opening upwards that cuts the x-axis at x = −1 and x = 3.","q":"The zeroes of p(x) are","o":["−1 and 3","1 and −3","0 and 3","−1 and 0"],"a":0,"e":"Zeroes are the x-coordinates of the points where the graph meets the x-axis.","ch":"m2","t":1,"id":"n27"},{"ty":"mcq","mk":1,"q":"If α, β are the zeroes of x² − 5x + 6, then α + β is","o":["5","6","−5","−6"],"a":0,"e":"Sum of zeroes = −b/a = 5.","ch":"m2","t":2,"id":"n28"},{"ty":"mcq","mk":1,"q":"For the quadratic 3x² − x − 4, the product of zeroes is","o":["−4/3","4/3","1/3","−1/3"],"a":0,"e":"Product = c/a = −4/3.","ch":"m2","t":2,"id":"n29"},{"ty":"mcq","mk":1,"q":"If the sum and product of zeroes of a quadratic are both 0, the polynomial is","o":["x² (times a constant)","x² + 1","x² − 1","x"],"a":0,"e":"Sum = 0 and product = 0 gives k(x² − 0·x + 0) = kx².","ch":"m2","t":2,"id":"n30"},{"ty":"ar","mk":1,"q":"Assertion (A): If one zero of 4x² − 8kx − 9 is the negative of the other, then k = 0.\nReason (R): Sum of zeroes = −b/a.","a":0,"e":"If zeroes are α and −α, their sum is 0 = 8k/4 = 2k so k = 0. R is the correct rule used to show this.","ar":1,"ch":"m2","t":2,"id":"n31"},{"ty":"short","mk":3,"q":"Find the zeroes of 6x² − 3 − 7x and verify the relation between zeroes and coefficients.","m":"6x² − 7x − 3 = (3x + 1)(2x − 3), zeroes −1/3 and 3/2. Sum = 7/6 = −(−7)/6 ✔. Product = −1/2 = −3/6 ✔.","p":["Factorise as (3x+1)(2x−3)","Zeroes −1/3 and 3/2","Verify sum = 7/6","Verify product = −1/2"],"ch":"m2","t":2,"id":"n32"},{"ty":"mcq","mk":1,"q":"A quadratic polynomial having zeroes 4 and −1 is","o":["x² − 3x − 4","x² + 3x − 4","x² − 3x + 4","x² − 5x − 4"],"a":0,"e":"Sum = 3, product = −4, so x² − 3x − 4.","ch":"m2","t":3,"id":"n33"},{"ty":"mcq","mk":1,"q":"A quadratic polynomial with sum of zeroes −3 and product 2 is","o":["x² + 3x + 2","x² − 3x + 2","x² + 3x − 2","x² − 2x − 3"],"a":0,"e":"x² − (sum)x + product = x² + 3x + 2.","ch":"m2","t":3,"id":"n34"},{"ty":"mcq","mk":1,"q":"If the sum of the zeroes of kx² + 2x + 3k is equal to their product, then k is","o":["2/3","−2/3","3/2","−3/2"],"a":0,"e":"Sum = −2/k, product = 3. Equal: −2/k = 3, so k = −2/3.","ch":"m2","t":3,"id":"n35"},{"ty":"mcq","mk":1,"q":"If α and β are zeroes of x² − 6x + 8, then α² + β² equals","o":["20","36","28","16"],"a":0,"e":"α+β = 6, αβ = 8, so α²+β² = 36 − 16 = 20.","ch":"m2","t":4,"id":"n36"},{"ty":"short","mk":4,"q":"If α and β are the zeroes of 2x² − 5x + 3, find the value of (α + β)² − αβ.","m":"α + β = 5/2 and αβ = 3/2. (α + β)² − αβ = 25/4 − 3/2 = 25/4 − 6/4 = 19/4.","p":["Sum of zeroes 5/2","Product of zeroes 3/2","Substitute in (α+β)² − αβ","Result 19/4"],"ch":"m2","t":4,"id":"n37"},{"ty":"mcq","mk":1,"q":"The graphs of two equations x + y = 4 and 2x + 2y = 8 are","o":["coincident lines","parallel lines","intersecting lines at one point","perpendicular lines"],"a":0,"e":"The second equation is twice the first, so both represent the same line.","ch":"m3","t":0,"id":"n38"},{"ty":"mcq","mk":1,"q":"Graphically, the solution of a pair of linear equations is the","o":["point of intersection of the two lines","point where a line cuts the y-axis","midpoint of the lines","origin always"],"a":0,"e":"The common point of both lines satisfies both equations.","ch":"m3","t":0,"id":"n39"},{"ty":"mcq","mk":1,"q":"The lines x = 2 and y = 3 intersect at the point","o":["(2, 3)","(3, 2)","(0, 0)","(2, 0)"],"a":0,"e":"x = 2 is vertical, y = 3 is horizontal; they meet at (2, 3).","ch":"m3","t":0,"id":"n40"},{"ty":"mcq","mk":1,"q":"The pair x + 2y = 3 and 2x + 4y = 7 has","o":["no solution","a unique solution","infinitely many solutions","exactly two solutions"],"a":0,"e":"a₁/a₂ = b₁/b₂ = 1/2 ≠ c₁/c₂ = 3/7, so parallel lines and no solution.","ch":"m3","t":1,"id":"n41"},{"ty":"mcq","mk":1,"q":"The value of k for which kx + 2y = 5 and 3x + y = 1 have a unique solution is","o":["k ≠ 6","k = 6","k ≠ 3","k = 3"],"a":0,"e":"Unique solution needs k/3 ≠ 2/1, so k ≠ 6.","ch":"m3","t":1,"id":"n42"},{"ty":"mcq","mk":1,"q":"For what value of k will 2x + 3y = 7 and (k − 1)x + (k + 2)y = 3k have infinitely many solutions?","o":["k = 7","k = 5","k = 3","k = 2"],"a":0,"e":"Setting 2/(k−1) = 3/(k+2) = 7/(3k): from first two, 2k + 4 = 3k − 3 so k = 7; check 7/21 = 1/3 and 2/6 = 1/3 ✔.","ch":"m3","t":1,"id":"n43"},{"ty":"ar","mk":1,"q":"Assertion (A): The pair of equations 5x − 15y = 8 and 3x − 9y = 24/5 has infinitely many solutions.\nReason (R): a₁/a₂ = b₁/b₂ = c₁/c₂.","a":0,"e":"5/3 = 15/9 = 8/(24/5) = 5/3, so all ratios are equal: coincident lines. R is the condition used.","ar":1,"ch":"m3","t":1,"id":"n44"},{"ty":"mcq","mk":1,"q":"On solving x + y = 5 and x − y = 1 by substitution, x equals","o":["3","2","4","1"],"a":0,"e":"From x = y + 1: 2y + 1 = 5 so y = 2, x = 3.","ch":"m3","t":2,"id":"n45"},{"ty":"mcq","mk":1,"q":"If 2x + 3y = 12 and y = 2x − 1, then x equals","o":["15/8","2","3","1"],"a":0,"e":"2x + 6x − 3 = 12 gives 8x = 15, x = 15/8. (y = 11/4.)","ch":"m3","t":2,"id":"n46"},{"ty":"short","mk":3,"q":"Solve by substitution: 2x + 3y = 11 and 2x − 4y = −24, and hence find m if y = mx + 3.","m":"Subtract: 7y = 35, so y = 5. Then 2x = 11 − 15 = −4, x = −2. Using y = mx + 3: 5 = −2m + 3, so m = −1.","p":["Eliminate or substitute to get y = 5","Find x = −2","Substitute in y = mx + 3","m = −1"],"ch":"m3","t":2,"id":"n47"},{"ty":"mcq","mk":1,"q":"On solving 3x + 2y = 12 and 3x − 2y = 0 by elimination, y equals","o":["3","2","4","6"],"a":0,"e":"Adding gives 6x = 12, x = 2; then 6 + 2y = 12 so y = 3.","ch":"m3","t":3,"id":"n48"},{"ty":"mcq","mk":1,"q":"The solution of 2x + y = 7 and x + y = 4 is","o":["x = 3, y = 1","x = 2, y = 3","x = 4, y = 0","x = 1, y = 5"],"a":0,"e":"Subtract: x = 3, then y = 1.","ch":"m3","t":3,"id":"n49"},{"ty":"mcq","mk":1,"q":"Solving 99x + 101y = 499 and 101x + 99y = 501 gives","o":["x = 3, y = 2","x = 2, y = 3","x = 5, y = 0","x = 1, y = 4"],"a":0,"e":"Adding: 200(x + y) = 1000 so x + y = 5. Subtracting: 2(x − y) = 2 so x − y = 1. Hence x = 3, y = 2.","ch":"m3","t":3,"id":"n50"},{"ty":"mcq","mk":1,"q":"The sum of two numbers is 25 and their difference is 7. The larger number is","o":["16","9","18","14"],"a":0,"e":"(25 + 7)/2 = 16.","ch":"m3","t":4,"id":"n51"},{"ty":"mcq","mk":1,"q":"Five years ago, A was thrice as old as B. Ten years later A will be twice as old as B. Present age of B is","o":["20 years","15 years","25 years","10 years"],"a":0,"e":"Let A = a, B = b: a − 5 = 3(b − 5), a + 10 = 2(b + 10). So a = 3b − 10 and 3b = 2b + 20, giving b = 20 and a = 50.","ch":"m3","t":4,"id":"n52"},{"ty":"case","mk":1,"cs":"Anita bought 2 notebooks and 3 pens for ₹48. Rohan bought 3 notebooks and 2 pens for ₹52. Let notebook cost x and pen cost y.","q":"The cost of one notebook is","o":["₹12","₹10","₹8","₹16"],"a":0,"e":"2x + 3y = 48 and 3x + 2y = 52. Adding: 5(x + y) = 100, x + y = 20. Subtract: x − y = 4. So x = 12, y = 8.","ch":"m3","t":4,"id":"n53"},{"ty":"short","mk":3,"q":"A fraction becomes 9/11 if 2 is added to both numerator and denominator, and becomes 5/6 if 3 is added to both. Find the fraction.","m":"Let the fraction be x/y. (x + 2)/(y + 2) = 9/11 gives 11x − 9y = −4. (x + 3)/(y + 3) = 5/6 gives 6x − 5y = −3. Solving: x = 7, y = 9 (check 11·7 − 9·9 = −4 ✔; 6·7 − 5·9 = −3 ✔). The fraction is 7/9.","p":["Form equation 11x − 9y = −4","Form equation 6x − 5y = −3","Solve to get x = 7, y = 9","State the fraction 7/9"],"ch":"m3","t":4,"id":"n54"},{"ty":"short","mk":5,"q":"The sum of the digits of a two-digit number is 9. When the digits are reversed, the number increases by 27. Find the number.","m":"Let the number be 10x + y. x + y = 9. Reversed number 10y + x = 10x + y + 27 gives 9(y − x) = 27, y − x = 3. Solving: y = 6, x = 3. The number is 36.","p":["Write x + y = 9","Write y − x = 3 from the reversed condition","Solve x = 3, y = 6","Number is 36"],"ch":"m3","t":4,"id":"n55"},{"ty":"mcq","mk":1,"q":"Which of the following is a quadratic equation?","o":["(x − 2)² + 1 = 2x − 3","x(x + 1) + 8 = (x + 2)(x − 2)","x(x + 2) = x² + 5","(x + 1)(x − 3) = (x − 3)(x + 4)"],"a":0,"e":"(x − 2)² + 1 = 2x − 3 gives x² − 6x + 8 = 0, a quadratic. In the other equations the x² terms cancel, leaving a linear equation.","ch":"m4","t":0,"id":"n56"},{"ty":"mcq","mk":1,"q":"Is x = 2 a root of x² − 3x + 2 = 0?","o":["Yes, because 4 − 6 + 2 = 0","No, because 4 − 6 + 2 = −2","Yes, because 4 + 6 + 2 = 12","No, because 2² = 4 ≠ 0"],"a":0,"e":"Substituting x = 2 gives 4 − 6 + 2 = 0, so x = 2 satisfies the equation.","ch":"m4","t":0,"id":"n57"},{"ty":"mcq","mk":1,"q":"The roots of x² − 5x + 6 = 0 are","o":["2 and 3","−2 and −3","1 and 6","−1 and −6"],"a":0,"e":"x² − 5x + 6 = (x − 2)(x − 3).","ch":"m4","t":1,"id":"n58"},{"ty":"mcq","mk":1,"q":"The roots of 2x² − x − 6 = 0 are","o":["2 and −3/2","−2 and 3/2","3 and −1","6 and −1/2"],"a":0,"e":"2x² − 4x + 3x − 6 = (x − 2)(2x + 3), roots 2 and −3/2.","ch":"m4","t":1,"id":"n59"},{"ty":"mcq","mk":1,"q":"If one root of x² − 7x + k = 0 is 3, the other root and k are","o":["4 and 12","4 and 10","3 and 9","5 and 15"],"a":0,"e":"Sum of roots 7 gives the other root 4; product k = 12.","ch":"m4","t":1,"id":"n60"},{"ty":"mcq","mk":1,"q":"The roots of x² + 4x + 1 = 0 are","o":["−2 ± √3","2 ± √3","−4 ± √3","−2 ± √5"],"a":0,"e":"x = (−4 ± √(16 − 4))/2 = (−4 ± 2√3)/2 = −2 ± √3.","ch":"m4","t":2,"id":"n61"},{"ty":"mcq","mk":1,"q":"The quadratic formula for ax² + bx + c = 0 is","o":["x = (−b ± √(b² − 4ac)) / 2a","x = (b ± √(b² − 4ac)) / 2a","x = (−b ± √(b² + 4ac)) / 2a","x = (−b ± √(b² − 4ac)) / a"],"a":0,"e":"The standard formula is x = (−b ± √(b² − 4ac)) / 2a.","ch":"m4","t":2,"id":"n62"},{"ty":"short","mk":3,"q":"Solve 2x² − 7x + 3 = 0 using the quadratic formula.","m":"Here a = 2, b = −7, c = 3. D = 49 − 24 = 25. x = (7 ± 5)/4, so x = 3 or x = 1/2.","p":["Identify a, b, c","Compute D = 25","Substitute in the formula","Roots 3 and 1/2"],"ch":"m4","t":2,"id":"n63"},{"ty":"mcq","mk":1,"q":"The discriminant of 3x² − 2x + 1 = 0 is","o":["−8","8","4","−4"],"a":0,"e":"D = b² − 4ac = 4 − 12 = −8.","ch":"m4","t":3,"id":"n64"},{"ty":"mcq","mk":1,"q":"The equation 2x² − 4x + 3 = 0 has","o":["no real roots","two equal real roots","two distinct real roots","exactly one root and one imaginary root"],"a":0,"e":"D = 16 − 24 = −8 < 0, so no real roots.","ch":"m4","t":3,"id":"n65"},{"ty":"mcq","mk":1,"q":"For what value of k does x² − 2kx + 9 = 0 have equal roots? (k > 0)","o":["3","9","√3","1"],"a":0,"e":"D = 4k² − 36 = 0 so k² = 9, k = 3.","ch":"m4","t":3,"id":"n66"},{"ty":"ar","mk":1,"q":"Assertion (A): If the roots of ax² + bx + c = 0 are real and distinct, then b² − 4ac > 0.\nReason (R): The discriminant determines the nature of roots.","a":0,"e":"Distinct real roots need D > 0, and the discriminant decides the nature of roots, so R explains A.","ar":1,"ch":"m4","t":3,"id":"n67"},{"ty":"mcq","mk":1,"q":"The sum of a number and its reciprocal is 10/3. The number is","o":["3 or 1/3","2 or 1/2","5 or 1/5","4 or 1/4"],"a":0,"e":"x + 1/x = 10/3 gives 3x² − 10x + 3 = 0, so x = 3 or 1/3.","ch":"m4","t":4,"id":"n68"},{"ty":"mcq","mk":1,"q":"The product of two consecutive positive integers is 306. The integers are","o":["17 and 18","16 and 17","18 and 19","15 and 16"],"a":0,"e":"x(x + 1) = 306 gives x² + x − 306 = 0, so x = 17.","ch":"m4","t":4,"id":"n69"},{"ty":"case","mk":1,"cs":"A rectangular park has length 3 m more than twice its breadth. Its area is 35 m². Let the breadth be x metres.","q":"The equation formed is","o":["2x² + 3x − 35 = 0","2x² − 3x − 35 = 0","x² + 3x − 35 = 0","3x² + 2x − 35 = 0"],"a":0,"e":"Length = 2x + 3, so x(2x + 3) = 35 gives 2x² + 3x − 35 = 0. Solving, the positive root is x = 7/2, so the breadth is 3.5 m.","ch":"m4","t":4,"id":"n70"},{"ty":"short","mk":3,"q":"A train travels 360 km at a uniform speed. If the speed had been 5 km/h more, it would have taken 1 hour less. Find the speed of the train.","m":"Let speed be x km/h. 360/x − 360/(x + 5) = 1, so 360 × 5 = x(x + 5), i.e. x² + 5x − 1800 = 0. (x + 45)(x − 40) = 0, x = 40. The speed is 40 km/h.","p":["Form 360/x − 360/(x+5) = 1","Simplify to x² + 5x − 1800 = 0","Factorise and reject the negative root","Speed 40 km/h"],"ch":"m4","t":4,"id":"n71"},{"ty":"mcq","mk":1,"q":"Which of the following is an AP?","o":["2, 5, 8, 11, ...","1, 2, 4, 8, ...","1, 4, 9, 16, ...","1, 1/2, 1/3, 1/4, ..."],"a":0,"e":"Successive differences are all 3 only in 2, 5, 8, 11.","ch":"m5","t":0,"id":"n72"},{"ty":"mcq","mk":1,"q":"The common difference of the AP 7, 3, −1, −5, ... is","o":["−4","4","3","−3"],"a":0,"e":"d = 3 − 7 = −4.","ch":"m5","t":0,"id":"n73"},{"ty":"mcq","mk":1,"q":"If k, 2k − 1 and 2k + 1 are three consecutive terms of an AP, then k equals","o":["3","2","−3","1"],"a":0,"e":"2(2k − 1) = k + 2k + 1 gives 4k − 2 = 3k + 1, so k = 3.","ch":"m5","t":0,"id":"n74"},{"ty":"mcq","mk":1,"q":"The 10th term of the AP 2, 7, 12, ... is","o":["47","52","42","45"],"a":0,"e":"a₁₀ = 2 + 9 × 5 = 47.","ch":"m5","t":1,"id":"n75"},{"ty":"mcq","mk":1,"q":"Which term of the AP 3, 8, 13, 18, ... is 78?","o":["16th","15th","17th","14th"],"a":0,"e":"3 + (n − 1)5 = 78 gives n − 1 = 15, n = 16.","ch":"m5","t":1,"id":"n76"},{"ty":"mcq","mk":1,"q":"The 11th term from the end of the AP 10, 7, 4, ..., −62 is","o":["−32","−35","−29","−38"],"a":0,"e":"Reverse AP: −62, −59, ... with d = 3; 11th term = −62 + 10 × 3 = −32.","ch":"m5","t":1,"id":"n77"},{"ty":"mcq","mk":1,"q":"If the 3rd term of an AP is 12 and the 7th term is 24, the common difference is","o":["3","2","4","6"],"a":0,"e":"4d = 12, so d = 3.","ch":"m5","t":1,"id":"n78"},{"ty":"mcq","mk":1,"q":"The sum of the first 20 terms of the AP 1, 3, 5, ... is","o":["400","420","380","200"],"a":0,"e":"S = 20/2 [2 + 19 × 2] = 10 × 40 = 400.","ch":"m5","t":2,"id":"n79"},{"ty":"mcq","mk":1,"q":"The sum of the first n natural numbers is","o":["n(n + 1)/2","n(n − 1)/2","n²","n(n + 1)"],"a":0,"e":"Standard result.","ch":"m5","t":2,"id":"n80"},{"ty":"mcq","mk":1,"q":"The sum of the first 15 multiples of 8 is","o":["960","900","1000","120"],"a":0,"e":"Terms 8, 16, ..., 120. S = 15/2 × (8 + 120) = 960.","ch":"m5","t":2,"id":"n81"},{"ty":"mcq","mk":1,"q":"How many terms of the AP 9, 17, 25, ... must be taken to give a sum of 636?","o":["12","10","14","11"],"a":0,"e":"n/2 [18 + 8(n − 1)] = 636 gives n(4n + 5) = 636, so 4n² + 5n − 636 = 0 and n = 12.","ch":"m5","t":2,"id":"n82"},{"ty":"short","mk":3,"q":"Find the sum of all two-digit multiples of 7.","m":"The AP is 14, 21, ..., 98 with a = 14, d = 7. Number of terms n: 14 + (n − 1)7 = 98 gives n = 13. Sum = 13/2 × (14 + 98) = 13 × 56 = 728.","p":["Identify a = 14, d = 7","Find n = 13","Apply S = n/2 (a + l)","Sum = 728"],"ch":"m5","t":2,"id":"n83"},{"ty":"mcq","mk":1,"q":"Savings of ₹5 in week 1, ₹7 in week 2, ₹9 in week 3 and so on follow this pattern. The savings in the 10th week are","o":["₹23","₹25","₹21","₹19"],"a":0,"e":"a = 5, d = 2: a₁₀ = 5 + 9 × 2 = 23.","ch":"m5","t":3,"id":"n84"},{"ty":"case","mk":1,"cs":"A theatre has 20 rows. The first row has 18 seats and each next row has 2 seats more than the row before it.","q":"The number of seats in the last (20th) row is","o":["56","58","38","54"],"a":0,"e":"a₂₀ = 18 + 19 × 2 = 56.","ch":"m5","t":3,"id":"n85"},{"ty":"case","mk":1,"cs":"A theatre has 20 rows. The first row has 18 seats and each next row has 2 seats more than the row before it.","q":"The total number of seats in the theatre is","o":["740","760","720","1120"],"a":0,"e":"S₂₀ = 20/2 × (18 + 56) = 740.","ch":"m5","t":3,"id":"n86"},{"ty":"short","mk":3,"q":"₹700 is to be used to give seven cash prizes to students of a school for good performance. Each prize is ₹20 less than the preceding prize. Find the value of each prize.","m":"Let the first prize be a. The prizes form an AP with d = −20 and n = 7. S₇ = 7/2 [2a + 6(−20)] = 700, so 2a − 120 = 200 and a = 160. The prizes are ₹160, ₹140, ₹120, ₹100, ₹80, ₹60 and ₹40.","p":["Recognise AP with d = −20, n = 7","Use S₇ = 700 to find a = 160","List all the prizes"],"ch":"m5","t":3,"id":"n87"},{"ty":"mcq","mk":1,"q":"The point (−3, 4) lies in the","o":["second quadrant","first quadrant","third quadrant","fourth quadrant"],"a":0,"e":"x is negative and y is positive in the second quadrant.","ch":"m6","t":0,"id":"n88"},{"ty":"mcq","mk":1,"q":"The coordinates of a point on the x-axis are of the form","o":["(a, 0)","(0, b)","(a, a)","(0, 0) only"],"a":0,"e":"Every point on the x-axis has y-coordinate 0.","ch":"m6","t":0,"id":"n89"},{"ty":"mcq","mk":1,"q":"The distance of the point (−4, 3) from the y-axis is","o":["4","3","5","−4"],"a":0,"e":"Distance from the y-axis is the absolute value of the abscissa: 4.","ch":"m6","t":0,"id":"n90"},{"ty":"mcq","mk":1,"q":"The distance between the points (2, 3) and (4, 1) is","o":["2√2","2","√10","4"],"a":0,"e":"d = √(4 + 4) = √8 = 2√2.","ch":"m6","t":1,"id":"n91"},{"ty":"mcq","mk":1,"q":"The distance of the point (−5, 12) from the origin is","o":["13","17","7","12"],"a":0,"e":"√(25 + 144) = 13.","ch":"m6","t":1,"id":"n92"},{"ty":"mcq","mk":1,"q":"The point on the x-axis which is equidistant from (2, −5) and (−2, 9) is","o":["(−7, 0)","(7, 0)","(0, −7)","(−2, 0)"],"a":0,"e":"For (x, 0): (x − 2)² + 25 = (x + 2)² + 81 gives −8x = 56, x = −7.","ch":"m6","t":1,"id":"n93"},{"ty":"ar","mk":1,"q":"Assertion (A): The points (1, 5), (2, 3) and (−2, −11) are not collinear.\nReason (R): Three points are collinear if the sum of two of the distances between them equals the third distance.","a":0,"e":"The distances are √5, √212 and √265; no two add up to the third, so the points are not collinear. R is the test that explains it.","ar":1,"ch":"m6","t":1,"id":"n94"},{"ty":"short","mk":2,"q":"Find the distance between the points A(−5, 7) and B(−1, 3).","m":"AB = √[(−1 + 5)² + (3 − 7)²] = √(16 + 16) = √32 = 4√2 units.","p":["Substitute in the distance formula","AB = 4√2"],"ch":"m6","t":1,"id":"n95"},{"ty":"mcq","mk":1,"q":"The midpoint of the segment joining (2, 3) and (4, 7) is","o":["(3, 5)","(6, 10)","(1, 2)","(3, 4)"],"a":0,"e":"((2 + 4)/2, (3 + 7)/2) = (3, 5).","ch":"m6","t":2,"id":"n96"},{"ty":"mcq","mk":1,"q":"The point dividing the join of (1, 2) and (4, 5) internally in the ratio 1 : 2 is","o":["(2, 3)","(3, 4)","(2.5, 3.5)","(1.5, 2.5)"],"a":0,"e":"((1·4 + 2·1)/3, (1·5 + 2·2)/3) = (2, 3).","ch":"m6","t":2,"id":"n97"},{"ty":"mcq","mk":1,"q":"The ratio in which the x-axis divides the segment joining (2, −3) and (5, 6) is","o":["1 : 2","2 : 1","1 : 1","1 : 3"],"a":0,"e":"Let the ratio be k : 1. y-coordinate 0: (6k − 3)/(k + 1) = 0, so k = 1/2, i.e. 1 : 2.","ch":"m6","t":2,"id":"n98"},{"ty":"mcq","mk":1,"q":"The point which divides the join of (−1, 7) and (4, −3) in the ratio 2 : 3 is","o":["(1, 3)","(2, 3)","(1, 2)","(3, 1)"],"a":0,"e":"((2·4 + 3·(−1))/5, (2·(−3) + 3·7)/5) = (1, 3).","ch":"m6","t":2,"id":"n99"},{"ty":"short","mk":3,"q":"Find the ratio in which the x-axis divides the line segment joining A(1, −5) and B(−4, 5). Also find the point of division.","m":"Let the ratio be k : 1. y-coordinate = (5k − 5)/(k + 1) = 0, so k = 1. Ratio is 1 : 1. The point is ((−4 + 1)/2, 0) = (−3/2, 0).","p":["Take ratio k : 1 and set y = 0","k = 1, ratio 1 : 1","Point (−3/2, 0)"],"ch":"m6","t":2,"id":"n100"},{"ty":"mcq","mk":1,"q":"If the distance between the points P(2, −3) and Q(10, y) is 10 units, then y is","o":["3 or −9","9 or −3","6 or −12","0 or −6"],"a":0,"e":"64 + (y + 3)² = 100 gives (y + 3)² = 36, so y = 3 or y = −9.","ch":"m6","t":3,"id":"n101"},{"ty":"mcq","mk":1,"q":"The midpoint of AB is (2, −3). If A is (−2, −5), then B is","o":["(6, −1)","(−6, 1)","(0, −4)","(4, −6)"],"a":0,"e":"B = (2·2 + 2, 2·(−3) + 5) = (6, −1).","ch":"m6","t":3,"id":"n102"},{"ty":"mcq","mk":1,"q":"The triangle with vertices (0, 0), (6, 0) and (3, 3√3) is","o":["equilateral","isosceles but not equilateral","right-angled","scalene"],"a":0,"e":"All three sides are 6 units: the third side √(9 + 27) = 6.","ch":"m6","t":3,"id":"n103"},{"ty":"short","mk":4,"q":"Show that the points A(1, 7), B(4, 2), C(−1, −1) and D(−4, 4) are the vertices of a square.","m":"AB = √(9 + 25) = √34, BC = √(25 + 9) = √34, CD = √(9 + 25) = √34, DA = √(25 + 9) = √34. All four sides are equal. Diagonal AC = √(4 + 64) = √68 and BD = √(64 + 4) = √68. Equal diagonals with equal sides make ABCD a square.","p":["Find all four sides = √34","Find both diagonals = √68","Equal sides and equal diagonals so square"],"ch":"m6","t":3,"id":"n104"},{"ty":"mcq","mk":1,"q":"All circles are","o":["similar","congruent","never similar","equal in radius"],"a":0,"e":"Any two circles have the same shape, so all circles are similar.","ch":"m7","t":0,"id":"n105"},{"ty":"mcq","mk":1,"q":"Two polygons of the same number of sides are similar if","o":["their corresponding angles are equal and corresponding sides are in the same ratio","only their angles are equal","only their sides are proportional","they have the same area"],"a":0,"e":"Both conditions are needed for polygons in general.","ch":"m7","t":0,"id":"n106"},{"ty":"ar","mk":1,"q":"Assertion (A): All equilateral triangles are similar.\nReason (R): Their corresponding angles are all 60° and their sides are in the same ratio.","a":0,"e":"Equal angles (60° each) and proportional sides make any two equilateral triangles similar.","ar":1,"ch":"m7","t":0,"id":"n107"},{"ty":"mcq","mk":1,"q":"In ΔABC, DE ∥ BC with D on AB and E on AC. If AD = 2 cm, DB = 3 cm and AE = 4 cm, then EC is","o":["6 cm","5 cm","8 cm","2.67 cm"],"a":0,"e":"By BPT, AD/DB = AE/EC gives 2/3 = 4/EC, so EC = 6 cm.","ch":"m7","t":1,"id":"n108"},{"ty":"mcq","mk":1,"q":"The Basic Proportionality Theorem states that a line drawn parallel to one side of a triangle intersecting the other two sides","o":["divides them in the same ratio","divides them into equal parts","is always equal to half the third side","bisects the angles"],"a":0,"e":"This is Thales' theorem (BPT).","ch":"m7","t":1,"id":"n109"},{"ty":"short","mk":4,"q":"State and prove the Basic Proportionality Theorem.","m":"Statement: if a line is drawn parallel to one side of a triangle to intersect the other two sides at distinct points, then it divides the two sides in the same ratio. Proof: In ΔABC, DE ∥ BC. Join BE and CD and draw EM ⊥ AB and DN ⊥ AC. Area(ΔADE)/Area(ΔBDE) = AD/DB. Area(ΔADE)/Area(ΔCED) = AE/EC. ΔBDE and ΔCED are on the same base DE between the same parallels DE and BC, so their areas are equal. Hence AD/DB = AE/EC.","p":["Statement of BPT with figure","Join BE and CD, use area ratios","Triangles on the same base and between the same parallels have equal area","Conclude AD/DB = AE/EC"],"ch":"m7","t":1,"id":"n110"},{"ty":"mcq","mk":1,"q":"In ΔABC, D is on AB and E is on AC with AD = 3, DB = 4, AE = 6 and EC = 8. Then","o":["DE ∥ BC","DE is not parallel to BC","DE bisects BC","∠ADE = 90°"],"a":0,"e":"AD/DB = 3/4 = AE/EC = 6/8, so by the converse of BPT, DE ∥ BC.","ch":"m7","t":2,"id":"n111"},{"ty":"mcq","mk":1,"q":"The converse of the Basic Proportionality Theorem says that if a line divides two sides of a triangle in the same ratio, then","o":["it is parallel to the third side","it is perpendicular to the third side","it bisects the third side","it is equal to the third side"],"a":0,"e":"This is the converse statement.","ch":"m7","t":2,"id":"n112"},{"ty":"mcq","mk":1,"q":"If ΔABC ~ ΔDEF and AB : DE = 2 : 3, the ratio of their perimeters is","o":["2 : 3","4 : 9","3 : 2","2 : 9"],"a":0,"e":"The perimeters of similar triangles are in the ratio of corresponding sides.","ch":"m7","t":3,"id":"n113"},{"ty":"mcq","mk":1,"q":"The AA similarity criterion states that two triangles are similar if","o":["two angles of one triangle equal two angles of the other","two sides are equal","one angle and one side are equal","their areas are equal"],"a":0,"e":"Equal pairs of two angles imply that the third angles are also equal, so the triangles are similar.","ch":"m7","t":3,"id":"n114"},{"ty":"mcq","mk":1,"q":"In ΔABC and ΔPQR, ∠A = ∠P and AB/PQ = AC/PR. The triangles are similar by the","o":["SAS criterion","SSS criterion","AA criterion","RHS criterion"],"a":0,"e":"One equal angle with the including sides in proportion is the SAS similarity criterion.","ch":"m7","t":3,"id":"n115"},{"ty":"mcq","mk":1,"q":"A 6 m tall pole casts a shadow of 4 m. At the same time a tower casts a shadow of 28 m. The height of the tower is","o":["42 m","36 m","48 m","30 m"],"a":0,"e":"6/4 = h/28 gives h = 42 m.","ch":"m7","t":4,"id":"n116"},{"ty":"mcq","mk":1,"q":"If the areas of two similar triangles are 64 cm² and 121 cm² and the shorter side of the first triangle is 8 cm, the corresponding side of the second is","o":["11 cm","8 cm","12.1 cm","10 cm"],"a":0,"e":"Side ratio = √(64/121) = 8/11, so the side is 11 cm.","ch":"m7","t":4,"id":"n117"},{"ty":"case","mk":1,"cs":"A vertical stick 1.8 m long casts a shadow of 1.2 m on the ground. At the same moment a tower casts a shadow of 24 m.","q":"The height of the tower is","o":["36 m","32 m","28.8 m","16 m"],"a":0,"e":"The triangles formed are similar, so h/24 = 1.8/1.2, h = 36 m.","ch":"m7","t":4,"id":"n118"},{"ty":"short","mk":3,"q":"In ΔABC, DE ∥ BC with AD = x, DB = x − 2, AE = x + 2 and EC = x − 1. Find the value of x.","m":"By BPT, x/(x − 2) = (x + 2)/(x − 1). Cross-multiplying: x(x − 1) = (x + 2)(x − 2), so x² − x = x² − 4 and x = 4.","p":["Apply BPT","Cross-multiply and simplify","x = 4"],"ch":"m7","t":4,"id":"n119"},{"ty":"mcq","mk":1,"q":"A tangent to a circle touches the circle at","o":["exactly one point","two points","no point","infinitely many points"],"a":0,"e":"By definition a tangent meets the circle at exactly one point, the point of contact.","ch":"m8","t":0,"id":"n120"},{"ty":"mcq","mk":1,"q":"The maximum number of parallel tangents a circle can have is","o":["2","1","4","infinitely many"],"a":0,"e":"Tangents at the two ends of a diameter are parallel; there cannot be more than two parallel tangents.","ch":"m8","t":0,"id":"n121"},{"ty":"mcq","mk":1,"q":"A line that meets a circle at two distinct points is called a","o":["secant","tangent","chord of contact","diameter"],"a":0,"e":"A secant intersects the circle at two points.","ch":"m8","t":0,"id":"n122"},{"ty":"mcq","mk":1,"q":"A tangent to a circle at a point is perpendicular to the","o":["radius through the point of contact","chord through the point of contact","diameter parallel to it","any chord"],"a":0,"e":"This is the tangent–radius theorem.","ch":"m8","t":1,"id":"n123"},{"ty":"mcq","mk":1,"q":"From a point P at a distance 25 cm from the centre of a circle of radius 7 cm, the length of the tangent is","o":["24 cm","18 cm","32 cm","25 cm"],"a":0,"e":"Tangent length = √(25² − 7²) = √(625 − 49) = 24 cm.","ch":"m8","t":1,"id":"n124"},{"ty":"mcq","mk":1,"q":"Two tangents PA and PB are drawn from an external point P to a circle with centre O. If ∠APB = 80°, then ∠POA is","o":["50°","40°","100°","80°"],"a":0,"e":"∠AOB = 180° − 80° = 100°, and OP bisects it so ∠POA = 50°.","ch":"m8","t":2,"id":"n125"},{"ty":"ar","mk":1,"q":"Assertion (A): The tangents drawn at the ends of a diameter of a circle are parallel.\nReason (R): The tangent at any point of a circle is perpendicular to the radius through the point of contact.","a":0,"e":"Both tangents are perpendicular to the same line (the diameter), so they are parallel.","ar":1,"ch":"m8","t":2,"id":"n126"},{"ty":"short","mk":3,"q":"Prove that the lengths of tangents drawn from an external point to a circle are equal.","m":"Let PA and PB be tangents from P to the circle with centre O. Join OA, OB and OP. OA ⊥ PA and OB ⊥ PB (tangent ⟂ radius). In right triangles OAP and OBP: OA = OB (radii), OP is common, and ∠OAP = ∠OBP = 90°. So ΔOAP ≅ ΔOBP (RHS), hence PA = PB.","p":["Join OA, OB, OP and use tangent ⟂ radius","Show ΔOAP ≅ ΔOBP by RHS","Conclude PA = PB"],"ch":"m8","t":2,"id":"n127"},{"ty":"mcq","mk":1,"q":"A quadrilateral ABCD is drawn to circumscribe a circle. If AB = 6 cm, BC = 7 cm and CD = 4 cm, then AD is","o":["3 cm","4 cm","2 cm","5 cm"],"a":0,"e":"AB + CD = BC + AD gives 10 = 7 + AD, so AD = 3 cm.","ch":"m8","t":3,"id":"n128"},{"ty":"mcq","mk":1,"q":"The incircle of ΔABC touches the sides AB, BC, CA at D, E, F. If AD = 4 cm, BE = 3 cm and CF = 2 cm, the perimeter of the triangle is","o":["18 cm","9 cm","15 cm","12 cm"],"a":0,"e":"Tangent lengths from a vertex are equal, so perimeter = 2(4 + 3 + 2) = 18 cm.","ch":"m8","t":3,"id":"n129"},{"ty":"mcq","mk":1,"q":"Two concentric circles have radii 5 cm and 3 cm. A chord of the larger circle touches the smaller circle. The length of the chord is","o":["8 cm","4 cm","6 cm","10 cm"],"a":0,"e":"Half chord = √(25 − 9) = 4 cm, so the chord = 8 cm.","ch":"m8","t":3,"id":"n130"},{"ty":"short","mk":4,"q":"A circle touches the sides of a quadrilateral ABCD at P, Q, R and S. Prove that AB + CD = BC + DA.","m":"Tangent lengths from an external point are equal: AP = AS, BP = BQ, CR = CQ, DR = DS. Adding: AP + BP + CR + DR = AS + BQ + CQ + DS, so AB + CD = (AS + DS) + (BQ + CQ) = AD + BC.","p":["State equal tangent lengths from each vertex","Add the four equalities","Group to get AB + CD = BC + DA"],"ch":"m8","t":3,"id":"n131"},{"ty":"mcq","mk":1,"q":"In a right triangle ABC, right-angled at B, AB = 3 cm and BC = 4 cm. Then sin A is","o":["4/5","3/5","3/4","5/4"],"a":0,"e":"AC = 5. sin A = opposite/hypotenuse = BC/AC = 4/5.","ch":"m9","t":0,"id":"n132"},{"ty":"mcq","mk":1,"q":"In ΔABC right-angled at B, tan A equals","o":["BC/AB","AB/BC","BC/AC","AB/AC"],"a":0,"e":"tan A = opposite/adjacent = BC/AB.","ch":"m9","t":0,"id":"n133"},{"ty":"mcq","mk":1,"q":"The value of sin 30° + cos 60° is","o":["1","1/2","√3","0"],"a":0,"e":"1/2 + 1/2 = 1.","ch":"m9","t":1,"id":"n134"},{"ty":"mcq","mk":1,"q":"The value of sin 60° cos 30° + sin 30° cos 60° is","o":["1","0","√3/2","1/2"],"a":0,"e":"3/4 + 1/4 = 1.","ch":"m9","t":1,"id":"n135"},{"ty":"mcq","mk":1,"q":"The value of 2 tan²45° + cos²30° − sin²60° is","o":["2","3","1","0"],"a":0,"e":"2(1) + 3/4 − 3/4 = 2.","ch":"m9","t":1,"id":"n136"},{"ty":"mcq","mk":1,"q":"Which of the following is not defined?","o":["tan 90°","sin 90°","cos 0°","cot 90°"],"a":0,"e":"tan 90° = sin 90°/cos 90° = 1/0, which is undefined.","ch":"m9","t":1,"id":"n137"},{"ty":"mcq","mk":1,"q":"If tan A = 3/4, then sin A is","o":["3/5","4/5","3/4","5/3"],"a":0,"e":"Hypotenuse = 5, so sin A = 3/5.","ch":"m9","t":2,"id":"n138"},{"ty":"mcq","mk":1,"q":"If sin θ = 12/13 for an acute angle θ, then sec θ is","o":["13/5","5/13","12/5","13/12"],"a":0,"e":"cos θ = 5/13, so sec θ = 13/5.","ch":"m9","t":2,"id":"n139"},{"ty":"mcq","mk":1,"q":"If cot θ = 7/8, then (1 + sin θ)(1 − sin θ) / ((1 + cos θ)(1 − cos θ)) equals","o":["49/64","8/7","7/8","64/49"],"a":0,"e":"The expression is cos²θ / sin²θ = cot²θ = 49/64.","ch":"m9","t":2,"id":"n140"},{"ty":"mcq","mk":1,"q":"sin²A + cos²A equals","o":["1","0","2","sec²A"],"a":0,"e":"This is the fundamental identity.","ch":"m9","t":3,"id":"n141"},{"ty":"mcq","mk":1,"q":"1 + tan²A equals","o":["sec²A","cosec²A","cot²A","sin²A"],"a":0,"e":"Dividing sin²A + cos²A = 1 by cos²A gives 1 + tan²A = sec²A.","ch":"m9","t":3,"id":"n142"},{"ty":"ar","mk":1,"q":"Assertion (A): sin²θ + cos²θ = 1 holds for every angle θ.\nReason (R): In a right triangle, (opposite)² + (adjacent)² = (hypotenuse)².","a":0,"e":"The identity comes from the Pythagoras theorem on a right triangle and holds for all angles. R is the reason.","ar":1,"ch":"m9","t":3,"id":"n143"},{"ty":"short","mk":3,"q":"Prove that sin²A + cos²A = 1 using a right triangle.","m":"In right ΔABC, right-angled at B, AB² + BC² = AC². Dividing by AC²: (AB/AC)² + (BC/AC)² = 1, that is cos²A + sin²A = 1.","p":["Draw right triangle and use Pythagoras theorem","Divide through by AC²","Replace by cos A and sin A"],"ch":"m9","t":3,"id":"n144"},{"ty":"mcq","mk":1,"q":"(1 − cos²θ) cosec²θ equals","o":["1","0","sin²θ","cos²θ"],"a":0,"e":"(1 − cos²θ) = sin²θ, and sin²θ cosec²θ = 1.","ch":"m9","t":4,"id":"n145"},{"ty":"mcq","mk":1,"q":"(sec θ + tan θ)(1 − sin θ) equals","o":["cos θ","sin θ","tan θ","sec θ"],"a":0,"e":"(1 + sin θ)/cos θ × (1 − sin θ) = (1 − sin²θ)/cos θ = cos θ.","ch":"m9","t":4,"id":"n146"},{"ty":"mcq","mk":1,"q":"1/(1 + tan²A) + 1/(1 + cot²A) equals","o":["1","2","0","sec²A"],"a":0,"e":"It equals cos²A + sin²A = 1.","ch":"m9","t":4,"id":"n147"},{"ty":"short","mk":3,"q":"Prove that (1 + tan²A)(1 − sin A)(1 + sin A) = 1.","m":"LHS = sec²A (1 − sin²A) = sec²A cos²A = (1/cos²A) cos²A = 1 = RHS.","p":["Use 1 + tan²A = sec²A","Use (1 − sin A)(1 + sin A) = cos²A","Simplify to 1"],"ch":"m9","t":4,"id":"n148"},{"ty":"short","mk":4,"q":"Prove that (sin θ − 2 sin³θ)/(2 cos³θ − cos θ) = tan θ.","m":"LHS = sin θ (1 − 2 sin²θ)/(cos θ (2 cos²θ − 1)). Since 1 − 2 sin²θ = 1 − 2(1 − cos²θ) = 2 cos²θ − 1, the bracketed factors cancel. LHS = sin θ/cos θ = tan θ.","p":["Take sin θ and cos θ common","Show 1 − 2sin²θ = 2cos²θ − 1","Cancel and get tan θ"],"ch":"m9","t":4,"id":"n149"},{"ty":"mcq","mk":1,"q":"If sin θ = cos θ for an acute angle θ, then tan θ equals","o":["1","0","√3","1/√3"],"a":0,"e":"sin θ = cos θ gives tan θ = 1 (θ = 45°).","ch":"m9","t":5,"id":"n150"},{"ty":"mcq","mk":1,"q":"If sin θ = 1/2 and θ is acute, then 3 cos θ − 4 cos³θ equals","o":["0","1","√3/2","1/2"],"a":0,"e":"cos θ = √3/2; 3(√3/2) − 4(3√3/8) = 0.","ch":"m9","t":5,"id":"n151"},{"ty":"mcq","mk":1,"q":"If 7 sin²θ + 3 cos²θ = 4, then tan θ equals","o":["1/√3","√3","1","0"],"a":0,"e":"3 + 4 sin²θ = 4 so sin²θ = 1/4, θ = 30°, tan 30° = 1/√3.","ch":"m9","t":5,"id":"n152"},{"ty":"mcq","mk":1,"q":"The angle of elevation of an object seen from a point is the angle between the horizontal line and the","o":["line of sight, when the object is above the horizontal","line of sight, when the object is below the horizontal","vertical line","surface of the object"],"a":0,"e":"Angle of elevation is measured upwards from the horizontal to the line of sight.","ch":"m10","t":0,"id":"n153"},{"ty":"mcq","mk":1,"q":"When the angle of elevation of the sun is 45°, the length of the shadow of a vertical pole of height 10 m is","o":["10 m","5 m","10√3 m","20 m"],"a":0,"e":"tan 45° = 1 = height/shadow, so shadow = 10 m.","ch":"m10","t":0,"id":"n154"},{"ty":"ar","mk":1,"q":"Assertion (A): From the top of a tower, the angle of depression of a car on the ground equals the angle of elevation of the top of the tower seen from the car.\nReason (R): Alternate angles formed by a transversal with two parallel lines are equal.","a":0,"e":"The horizontal at the top and the ground are parallel, so alternate angles are equal. R explains A.","ar":1,"ch":"m10","t":0,"id":"n155"},{"ty":"mcq","mk":1,"q":"A tree casts a shadow of 10√3 m when the sun's elevation is 30°. The height of the tree is","o":["10 m","10√3 m","20 m","30 m"],"a":0,"e":"h = 10√3 × tan 30° = 10√3 × (1/√3) = 10 m.","ch":"m10","t":1,"id":"n156"},{"ty":"mcq","mk":1,"q":"A ladder 10 m long makes an angle of 60° with the ground. It reaches a wall at height","o":["5√3 m","5 m","10√3 m","10 m"],"a":0,"e":"Height = 10 sin 60° = 5√3 m.","ch":"m10","t":1,"id":"n157"},{"ty":"mcq","mk":1,"q":"From the top of a 100 m high cliff, the angle of depression of a boat is 45°. The distance of the boat from the foot of the cliff is","o":["100 m","50 m","100√3 m","200 m"],"a":0,"e":"tan 45° = 100/d, so d = 100 m.","ch":"m10","t":1,"id":"n158"},{"ty":"mcq","mk":1,"q":"A kite is flying at a height of 60 m and its string (taken straight) makes an angle of 60° with the ground. The length of the string is","o":["40√3 m","60 m","60√3 m","30√3 m"],"a":0,"e":"sin 60° = 60/l, so l = 60 × 2/√3 = 40√3 m.","ch":"m10","t":1,"id":"n159"},{"ty":"case","mk":1,"cs":"Riya stands 20 m away from the foot of a building and sees its top at an angle of elevation of 60° (ignore her height).","q":"The height of the building is","o":["20√3 m","20 m","10√3 m","40 m"],"a":0,"e":"h = 20 tan 60° = 20√3 m.","ch":"m10","t":1,"id":"n160"},{"ty":"case","mk":1,"cs":"Riya stands 20 m away from the foot of a building and sees its top at an angle of elevation of 60° (ignore her height).","q":"She walks directly away until the angle of elevation becomes 30°. The distance she walks is","o":["40 m","20 m","60 m","20√3 m"],"a":0,"e":"New distance d = 20√3/tan 30° = 60 m, so she walks 60 − 20 = 40 m.","ch":"m10","t":1,"id":"n161"},{"ty":"mcq","mk":1,"q":"From the top of a 60 m high building, the angles of depression of the top and bottom of a tower are 30° and 60°. The height of the tower is","o":["40 m","20 m","30 m","60 m"],"a":0,"e":"Distance = 60/tan 60° = 20√3. Tower height = 60 − 20√3 × tan 30° = 60 − 20 = 40 m.","ch":"m10","t":2,"id":"n162"},{"ty":"mcq","mk":1,"q":"The angles of elevation of the top of a tower from two points at distances a and b (a > b) from its base on the same line are complementary. The height of the tower is","o":["√(ab)","ab","a + b","√(a + b)"],"a":0,"e":"h/a = tan θ and h/b = cot θ, so h² = ab.","ch":"m10","t":2,"id":"n163"},{"ty":"short","mk":4,"q":"Two poles of equal height stand on either side of a road 80 m wide. At a point between them on the road, the angles of elevation of the tops are 60° and 30°. Find the height of the poles and the distances of the point from the poles.","m":"Let the point be x m from the first pole and (80 − x) m from the second. h = x tan 60° = x√3 and h = (80 − x) tan 30° = (80 − x)/√3. So 3x = 80 − x, x = 20. The distances are 20 m and 60 m, and h = 20√3 m ≈ 34.6 m.","p":["Draw figure with two right triangles","Write h = x√3 and h = (80 − x)/√3","Solve x = 20 m","State height 20√3 m and distances 20 m and 60 m"],"ch":"m10","t":2,"id":"n164"},{"ty":"mcq","mk":1,"q":"The circumference of a circle of radius 7 cm is (use π = 22/7)","o":["44 cm","22 cm","154 cm","49 cm"],"a":0,"e":"C = 2πr = 2 × 22/7 × 7 = 44 cm.","ch":"m11","t":0,"id":"n165"},{"ty":"mcq","mk":1,"q":"The area of a circle of diameter 14 cm is","o":["154 cm²","616 cm²","44 cm²","49 cm²"],"a":0,"e":"r = 7, area = 22/7 × 49 = 154 cm².","ch":"m11","t":0,"id":"n166"},{"ty":"mcq","mk":1,"q":"The distance covered by a wheel of radius 21 cm in 10 revolutions is","o":["1320 cm","132 cm","660 cm","2640 cm"],"a":0,"e":"Circumference = 2 × 22/7 × 21 = 132 cm; in 10 revolutions 1320 cm.","ch":"m11","t":0,"id":"n167"},{"ty":"mcq","mk":1,"q":"If the circumference and area of a circle are numerically equal, then its radius is","o":["2 units","1 unit","4 units","π units"],"a":0,"e":"2πr = πr² gives r = 2.","ch":"m11","t":0,"id":"n168"},{"ty":"mcq","mk":1,"q":"The area of a sector of angle 60° of a circle of radius 6 cm is","o":["6π cm²","36π cm²","12π cm²","3π cm²"],"a":0,"e":"(60/360) × π × 36 = 6π cm².","ch":"m11","t":1,"id":"n169"},{"ty":"mcq","mk":1,"q":"The length of the arc of a sector of angle 60° in a circle of radius 21 cm is","o":["22 cm","44 cm","11 cm","66 cm"],"a":0,"e":"(60/360) × 2 × 22/7 × 21 = 22 cm.","ch":"m11","t":1,"id":"n170"},{"ty":"mcq","mk":1,"q":"The minute hand of a clock is 14 cm long. The area swept by it in 5 minutes is","o":["154/3 cm²","154 cm²","77 cm²","616/3 cm²"],"a":0,"e":"5 minutes = 30°. Area = (30/360) × 22/7 × 196 = 154/3 cm².","ch":"m11","t":1,"id":"n171"},{"ty":"mcq","mk":1,"q":"The area of the minor segment of a circle of radius 10 cm formed by a chord subtending 90° at the centre (π = 3.14) is","o":["28.5 cm²","78.5 cm²","50 cm²","21.5 cm²"],"a":0,"e":"Sector = 78.5; triangle = 50; segment = 28.5 cm².","ch":"m11","t":2,"id":"n172"},{"ty":"mcq","mk":1,"q":"The area of the minor segment of a circle of radius 6 cm with angle 60° at the centre is","o":["6π − 9√3 cm²","6π − 18 cm²","36π − 9√3 cm²","6π + 9√3 cm²"],"a":0,"e":"Sector = 6π; triangle = (√3/4) × 36 = 9√3. Segment = 6π − 9√3.","ch":"m11","t":2,"id":"n173"},{"ty":"ar","mk":1,"q":"Assertion (A): Area of a segment = area of the sector − area of the corresponding triangle (for a minor segment).\nReason (R): The minor segment is the part of the sector that lies outside the triangle formed by the radii and the chord.","a":0,"e":"The sector contains the triangle and the segment, so removing the triangle leaves the segment.","ar":1,"ch":"m11","t":2,"id":"n174"},{"ty":"mcq","mk":1,"q":"A square of side 14 cm has a circle of the largest possible size inside it. The area of the shaded region (square minus circle) is","o":["42 cm²","154 cm²","196 cm²","98 cm²"],"a":0,"e":"Radius = 7: circle area 154; 196 − 154 = 42 cm².","ch":"m11","t":3,"id":"n175"},{"ty":"mcq","mk":1,"q":"The area of a ring between two concentric circles of radii 7 cm and 5 cm is","o":["528/7 cm²","154 cm²","22 cm²","24 cm²"],"a":0,"e":"(22/7)(49 − 25) = 528/7 cm².","ch":"m11","t":3,"id":"n176"},{"ty":"mcq","mk":1,"q":"The perimeter of a semicircle of radius 7 cm is","o":["36 cm","22 cm","44 cm","28 cm"],"a":0,"e":"Perimeter = πr + 2r = 22 + 14 = 36 cm.","ch":"m11","t":3,"id":"n177"},{"ty":"short","mk":3,"q":"A horse is tied to a peg at one corner of a square field of side 15 m by a rope 5 m long. Find the area of the field the horse can graze. (π = 3.14)","m":"The horse grazes a quarter circle of radius 5 m. Area = (1/4) × 3.14 × 25 = 19.625 m².","p":["Identify a quarter of a circle","Use area = (1/4)πr²","Area = 19.625 m²"],"ch":"m11","t":3,"id":"n178"},{"ty":"mcq","mk":1,"q":"The total surface area of a cube of edge 5 cm is","o":["150 cm²","125 cm²","100 cm²","75 cm²"],"a":0,"e":"TSA = 6a² = 150 cm².","ch":"m12","t":0,"id":"n179"},{"ty":"mcq","mk":1,"q":"The volume of a cylinder of radius 7 cm and height 10 cm is","o":["1540 cm³","440 cm³","154 cm³","3080 cm³"],"a":0,"e":"V = πr²h = 22/7 × 49 × 10 = 1540 cm³.","ch":"m12","t":0,"id":"n180"},{"ty":"mcq","mk":1,"q":"The curved surface area of a cylinder of radius 7 cm and height 10 cm is","o":["440 cm²","1540 cm²","220 cm²","154 cm²"],"a":0,"e":"CSA = 2πrh = 2 × 22/7 × 7 × 10 = 440 cm².","ch":"m12","t":0,"id":"n181"},{"ty":"mcq","mk":1,"q":"The volume of a cone of radius 3 cm and height 4 cm is","o":["12π cm³","36π cm³","9π cm³","24π cm³"],"a":0,"e":"V = (1/3)π × 9 × 4 = 12π cm³.","ch":"m12","t":1,"id":"n182"},{"ty":"mcq","mk":1,"q":"The surface area of a sphere of radius 7 cm is","o":["616 cm²","154 cm²","1232 cm²","308 cm²"],"a":0,"e":"4πr² = 4 × 22/7 × 49 = 616 cm².","ch":"m12","t":1,"id":"n183"},{"ty":"mcq","mk":1,"q":"The curved surface area of a cone of base radius 3 cm and slant height 5 cm is","o":["15π cm²","12π cm²","30π cm²","9π cm²"],"a":0,"e":"CSA = πrl = 15π cm².","ch":"m12","t":1,"id":"n184"},{"ty":"mcq","mk":1,"q":"The volumes of two spheres are in the ratio of the cubes of their radii. If their radii are in ratio 1 : 2, their volumes are in the ratio","o":["1 : 8","1 : 4","1 : 2","1 : 6"],"a":0,"e":"(1)³ : (2)³ = 1 : 8.","ch":"m12","t":1,"id":"n185"},{"ty":"mcq","mk":1,"q":"A toy is a cone mounted on a hemisphere of the same radius 3.5 cm. The cone height is 12 cm (slant height 12.5 cm). The total surface area is (π = 22/7)","o":["214.5 cm²","308 cm²","154 cm²","143 cm²"],"a":0,"e":"TSA = CSA of cone + CSA of hemisphere = πr(l + 2r) = 22/7 × 3.5 × (12.5 + 7) = 11 × 19.5 = 214.5 cm².","ch":"m12","t":2,"id":"n186"},{"ty":"mcq","mk":1,"q":"A solid is a cylinder with hemispherical ends. Total length 20 cm and diameter 7 cm. Its total surface area is (π = 22/7)","o":["440 cm²","286 cm²","154 cm²","594 cm²"],"a":0,"e":"Cylinder height = 13 cm; CSA = 2 × 22/7 × 3.5 × 13 = 286; two hemispheres = 4πr² = 154. Total 440 cm².","ch":"m12","t":2,"id":"n187"},{"ty":"mcq","mk":1,"q":"The total surface area of a solid hemisphere of radius r is","o":["3πr²","2πr²","4πr²","πr²"],"a":0,"e":"TSA = 2πr² (curved) + πr² (flat base) = 3πr².","ch":"m12","t":2,"id":"n188"},{"ty":"mcq","mk":1,"q":"A cone of height 24 cm and base radius 6 cm is melted and recast into a sphere. The radius of the sphere is","o":["6 cm","12 cm","3 cm","24 cm"],"a":0,"e":"(1/3)π × 36 × 24 = 288π = (4/3)πR³, so R³ = 216, R = 6 cm.","ch":"m12","t":3,"id":"n189"},{"ty":"mcq","mk":1,"q":"A solid cylinder of radius 3 cm and height 8 cm is melted into spheres of radius 1 cm. The number of spheres is","o":["54","72","36","24"],"a":0,"e":"72π ÷ (4π/3) = 54.","ch":"m12","t":3,"id":"n190"},{"ty":"case","mk":1,"cs":"A well of diameter 3 m is dug 14 m deep. The earth taken out is spread evenly around it to form a circular embankment 4 m wide.","q":"The volume of earth dug out is (π = 22/7)","o":["99 m³","198 m³","66 m³","49.5 m³"],"a":0,"e":"V = 22/7 × 1.5² × 14 = 99 m³.","ch":"m12","t":3,"id":"n191"},{"ty":"short","mk":3,"q":"A well of diameter 3 m is dug 14 m deep. The earth taken out is spread evenly all around it to form an embankment 4 m wide. Find the height of the embankment.","m":"Volume of earth = π × 1.5² × 14 = 99 m³. Embankment is a ring with inner radius 1.5 m and outer radius 5.5 m, area = π(5.5² − 1.5²) = 28π = 88 m². Height = 99/88 = 1.125 m.","p":["Volume of well = 99 m³","Area of the ring = 88 m²","Height = volume/area = 1.125 m"],"ch":"m12","t":3,"id":"n192"},{"ty":"mcq","mk":1,"q":"The mean of 2, 4, 6, 8 and 10 is","o":["6","5","8","30"],"a":0,"e":"Sum 30 divided by 5 = 6.","ch":"m13","t":0,"id":"n193"},{"ty":"mcq","mk":1,"q":"For a grouped distribution, Σfᵢ = 50 and Σfᵢxᵢ = 1250. The mean is","o":["25","20","50","62.5"],"a":0,"e":"Mean = Σfx/Σf = 1250/50 = 25.","ch":"m13","t":0,"id":"n194"},{"ty":"mcq","mk":1,"q":"The class marks of the class interval 20 – 30 is","o":["25","20","30","10"],"a":0,"e":"Class mark = (20 + 30)/2 = 25.","ch":"m13","t":0,"id":"n195"},{"ty":"mcq","mk":1,"q":"In the assumed mean method, mean = a + Σfᵢdᵢ/Σfᵢ where dᵢ equals","o":["xᵢ − a","xᵢ + a","a − xᵢ","xᵢ/a"],"a":0,"e":"dᵢ is the deviation of the class mark from the assumed mean.","ch":"m13","t":1,"id":"n196"},{"ty":"mcq","mk":1,"q":"If a = 25, Σfᵢdᵢ = −20 and Σfᵢ = 40, the mean is","o":["24.5","25.5","20","24"],"a":0,"e":"Mean = 25 + (−20/40) = 24.5.","ch":"m13","t":1,"id":"n197"},{"ty":"mcq","mk":1,"q":"In the step-deviation method, uᵢ equals","o":["(xᵢ − a)/h","(xᵢ + a)/h","h(xᵢ − a)","xᵢ/h"],"a":0,"e":"uᵢ = (xᵢ − a)/h, where h is the class size.","ch":"m13","t":1,"id":"n198"},{"ty":"mcq","mk":1,"q":"The median class is the class whose","o":["cumulative frequency is just greater than n/2","frequency is the highest","class mark is the largest","cumulative frequency equals n"],"a":0,"e":"Locate n/2 among the cumulative frequencies.","ch":"m13","t":2,"id":"n199"},{"ty":"mcq","mk":1,"q":"For a distribution with n = 50, the median class is 20 – 30 with cumulative frequency of the preceding class 15 and frequency 20. The median is","o":["25","23","27","30"],"a":0,"e":"Median = 20 + ((25 − 15)/20) × 10 = 25.","ch":"m13","t":2,"id":"n200"},{"ty":"mcq","mk":1,"q":"The median formula for grouped data is","o":["l + ((n/2 − cf)/f) × h","l + ((n − cf)/f) × h","l + (cf/f) × h","l − ((n/2 − cf)/f) × h"],"a":0,"e":"Standard formula with l = lower limit of median class.","ch":"m13","t":2,"id":"n201"},{"ty":"mcq","mk":1,"q":"The modal class of a frequency distribution is the class with the","o":["highest frequency","highest class mark","lowest frequency","longest class width"],"a":0,"e":"By definition.","ch":"m13","t":3,"id":"n202"},{"ty":"mcq","mk":1,"q":"In a distribution the modal class is 30 – 40 with f₁ = 20, f₀ = 12, f₂ = 8. The mode is","o":["34","36","32","38"],"a":0,"e":"Mode = 30 + (8/(40 − 20)) × 10 = 34.","ch":"m13","t":3,"id":"n203"},{"ty":"mcq","mk":1,"q":"If the median is 20 and the mean is 18, the mode (empirical relation) is","o":["24","22","26","16"],"a":0,"e":"Mode = 3 Median − 2 Mean = 60 − 36 = 24.","ch":"m13","t":3,"id":"n204"},{"ty":"ar","mk":1,"q":"Assertion (A): The mean, median and mode of a distribution can be different.\nReason (R): Mean uses all values while median and mode depend on position and frequency.","a":0,"e":"Different definitions give different values in general. R explains why.","ar":1,"ch":"m13","t":3,"id":"n205"},{"ty":"short","mk":3,"q":"Find the mode of the data: class 0–10 (f = 5), 10–20 (8), 20–30 (15), 30–40 (7), 40–50 (5).","m":"Modal class is 20–30 with f₁ = 15, f₀ = 8, f₂ = 7, l = 20, h = 10. Mode = 20 + (15 − 8)/(2×15 − 8 − 7) × 10 = 20 + 70/15 ≈ 24.67.","p":["Identify modal class 20–30","Substitute f₁, f₀, f₂, l, h in the formula","Mode ≈ 24.67"],"ch":"m13","t":3,"id":"n206"},{"ty":"short","mk":4,"q":"Find the median of the data: class 0–10 (f = 5), 10–20 (8), 20–30 (15), 30–40 (7), 40–50 (5).","m":"n = 40, n/2 = 20. Cumulative frequencies: 5, 13, 28, 35, 40. Median class is 20–30 (cf of preceding class = 13, f = 15). Median = 20 + ((20 − 13)/15) × 10 ≈ 24.67.","p":["Make the cumulative frequency table","Find median class 20–30","Use the formula","Median ≈ 24.67"],"ch":"m13","t":3,"id":"n207"},{"ty":"mcq","mk":1,"q":"The probability of an event E satisfies","o":["0 ≤ P(E) ≤ 1","P(E) > 1","−1 ≤ P(E) ≤ 1","P(E) < 0"],"a":0,"e":"Probability always lies between 0 and 1.","ch":"m14","t":0,"id":"n208"},{"ty":"mcq","mk":1,"q":"The probability of a sure event is","o":["1","0","1/2","undefined"],"a":0,"e":"A sure event always happens, so its probability is 1.","ch":"m14","t":0,"id":"n209"},{"ty":"mcq","mk":1,"q":"Which of the following cannot be the probability of an event?","o":["1.5","0.7","2/3","15%"],"a":0,"e":"A probability cannot exceed 1.","ch":"m14","t":0,"id":"n210"},{"ty":"mcq","mk":1,"q":"Two coins are tossed together. The probability of getting at least one head is","o":["3/4","1/2","1/4","1"],"a":0,"e":"Outcomes HH, HT, TH, TT. Favourable: 3 out of 4.","ch":"m14","t":1,"id":"n211"},{"ty":"mcq","mk":1,"q":"A die is thrown once. The probability of getting a prime number is","o":["1/2","1/3","2/3","5/6"],"a":0,"e":"Primes: 2, 3, 5, so 3/6 = 1/2.","ch":"m14","t":1,"id":"n212"},{"ty":"mcq","mk":1,"q":"Two dice are thrown together. The probability that the sum of the numbers is 8 is","o":["5/36","1/6","1/9","1/12"],"a":0,"e":"Favourable: (2,6), (3,5), (4,4), (5,3), (6,2) = 5 out of 36.","ch":"m14","t":1,"id":"n213"},{"ty":"mcq","mk":1,"q":"Two dice are thrown together. The probability that the product of the numbers is 12 is","o":["1/9","1/6","1/12","1/18"],"a":0,"e":"Favourable: (2,6), (6,2), (3,4), (4,3) = 4 out of 36 = 1/9.","ch":"m14","t":1,"id":"n214"},{"ty":"mcq","mk":1,"q":"One card is drawn at random from a pack of 52 cards. The probability that it is a red face card is","o":["3/26","3/13","1/13","1/26"],"a":0,"e":"Red face cards: 6 out of 52 = 3/26.","ch":"m14","t":2,"id":"n215"},{"ty":"mcq","mk":1,"q":"A bag has 5 red, 8 white and 4 green balls. One ball is drawn at random. The probability that it is not red is","o":["12/17","5/17","8/17","1/2"],"a":0,"e":"Not red = 8 + 4 = 12 out of 17.","ch":"m14","t":2,"id":"n216"},{"ty":"mcq","mk":1,"q":"One card is drawn from a well-shuffled deck of 52 cards. The probability of getting the king of red colour is","o":["1/26","1/13","1/4","2/13"],"a":0,"e":"There are 2 red kings out of 52.","ch":"m14","t":2,"id":"n217"},{"ty":"case","mk":1,"cs":"A bag contains 3 red, 5 blue and 2 green balls. A ball is drawn at random.","q":"The probability of drawing a blue ball is","o":["1/2","1/5","3/10","1/10"],"a":0,"e":"5 blue balls out of 10.","ch":"m14","t":2,"id":"n218"},{"ty":"mcq","mk":1,"q":"If P(E) = 0.05, the probability of 'not E' is","o":["0.95","0.5","0.05","1.05"],"a":0,"e":"P(not E) = 1 − 0.05 = 0.95.","ch":"m14","t":3,"id":"n219"},{"ty":"ar","mk":1,"q":"Assertion (A): If the probability of winning a game is 0.4, then the probability of losing it is 0.6.\nReason (R): The sum of the probabilities of an event and its complement is 1.","a":0,"e":"P(lose) = 1 − P(win) = 0.6. R is the explanation.","ar":1,"ch":"m14","t":3,"id":"n220"},{"ty":"short","mk":3,"q":"A box contains 90 discs numbered 1 to 90. One disc is drawn at random. Find the probability that it bears (i) a two-digit number, (ii) a perfect square, (iii) a number divisible by 5.","m":"Total outcomes = 90. (i) Two-digit numbers 10 to 90 are 81, so P = 81/90 = 9/10. (ii) Perfect squares 1, 4, 9, 16, 25, 36, 49, 64, 81 are 9, so P = 9/90 = 1/10. (iii) Multiples of 5 are 5, 10, ..., 90, which is 18 numbers, so P = 18/90 = 1/5.","p":["Total outcomes 90","(i) 9/10","(ii) 1/10","(iii) 1/5"],"ch":"m14","t":3,"id":"n221"},{"ty":"mcq","mk":1,"q":"In the balanced equation Zn + 2HCl → ZnCl₂ + H₂, the coefficient of HCl is 2 because","o":["the number of chlorine atoms must be equal on both sides","zinc is more reactive","hydrogen is a gas","HCl is an acid"],"a":0,"e":"Two chlorine atoms appear in ZnCl₂, so 2 HCl are needed. Balancing follows the law of conservation of mass.","ch":"s1","t":0,"id":"n222"},{"ty":"mcq","mk":1,"q":"The balanced equation Fe + H₂O → Fe₃O₄ + H₂ has the coefficient of H₂O equal to","o":["4","3","1","2"],"a":0,"e":"3Fe + 4H₂O → Fe₃O₄ + 4H₂.","ch":"s1","t":0,"id":"n223"},{"ty":"mcq","mk":1,"q":"A chemical equation is balanced to satisfy","o":["the law of conservation of mass","Newton's law","Ohm's law","the law of definite colour"],"a":0,"e":"The number of atoms of each element must be the same on both sides.","ch":"s1","t":0,"id":"n224"},{"ty":"mcq","mk":1,"q":"Quicklime reacts with water to give slaked lime. This is an example of","o":["a combination reaction","a decomposition reaction","a displacement reaction","a double displacement reaction"],"a":0,"e":"CaO + H₂O → Ca(OH)₂ + heat, two reactants forming one product.","ch":"s1","t":1,"id":"n225"},{"ty":"mcq","mk":1,"q":"When lead nitrate is heated strongly, the brown fumes seen are of","o":["nitrogen dioxide","oxygen","nitric oxide","lead oxide"],"a":0,"e":"2Pb(NO₃)₂ → 2PbO + 4NO₂ + O₂; NO₂ is brown.","ch":"s1","t":1,"id":"n226"},{"ty":"mcq","mk":1,"q":"In the electrolysis of water, the volumes of hydrogen and oxygen collected are in the ratio","o":["2 : 1","1 : 2","1 : 1","3 : 1"],"a":0,"e":"2H₂O → 2H₂ + O₂, so hydrogen is twice the volume of oxygen.","ch":"s1","t":1,"id":"n227"},{"ty":"mcq","mk":1,"q":"When an iron nail is dipped in copper sulphate solution, the colour of the solution changes from","o":["blue to light green","green to blue","colourless to blue","blue to colourless"],"a":0,"e":"Fe + CuSO₄ → FeSO₄ + Cu, so the blue solution turns pale green.","ch":"s1","t":2,"id":"n228"},{"ty":"mcq","mk":1,"q":"Which of the following is a displacement reaction?","o":["Zn + CuSO₄ → ZnSO₄ + Cu","CaO + H₂O → Ca(OH)₂","CaCO₃ → CaO + CO₂","NaOH + HCl → NaCl + H₂O"],"a":0,"e":"A more reactive metal displaces a less reactive one from its salt solution.","ch":"s1","t":2,"id":"n229"},{"ty":"mcq","mk":1,"q":"The white precipitate formed on mixing sodium sulphate and barium chloride solutions is","o":["BaSO₄","BaCl₂","NaCl","Na₂SO₄"],"a":0,"e":"Na₂SO₄ + BaCl₂ → BaSO₄↓ + 2NaCl.","ch":"s1","t":3,"id":"n230"},{"ty":"mcq","mk":1,"q":"Lead nitrate solution reacts with potassium iodide solution to give a precipitate which is","o":["yellow","white","blue","black"],"a":0,"e":"PbI₂ is bright yellow.","ch":"s1","t":3,"id":"n231"},{"ty":"ar","mk":1,"q":"Assertion (A): Mixing barium chloride and sodium sulphate solutions is a double displacement reaction.\nReason (R): Ions are exchanged between the reactants and an insoluble product forms.","a":0,"e":"BaSO₄ is the insoluble precipitate formed by exchange of ions, so R explains A.","ar":1,"ch":"s1","t":3,"id":"n232"},{"ty":"mcq","mk":1,"q":"Which of the following is an endothermic process?","o":["decomposition of calcium carbonate on heating","burning of methane","respiration","dissolving quicklime in water"],"a":0,"e":"Heat has to be supplied for CaCO₃ → CaO + CO₂.","ch":"s1","t":4,"id":
